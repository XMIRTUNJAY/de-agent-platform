version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    # Group minor and patch updates
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"
    # Allow Dependabot to update lock file
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Ignore major versions of key packages that may have breaking changes
    ignore:
      - dependency-name: "astro"
        update-type: "version-update:semver-major"
      - dependency-name: "tailwindcss"
        update-type: "version-update:semver-major"
      - dependency-name: "@astrojs/mdx"
        update-type: "version-update:semver-major"
      - dependency-name: "@astrojs/sitemap"
        update-type: "version-update:semver-major"
      - dependency-name: "@astrojs/rss"
        update-type: "version-update:semver-major"
      - dependency-name: "@astrojs/check"
        update-type: "version-update:semver-major"
      - dependency-name: "typescript"
        update-type: "version-update:semver-major"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"