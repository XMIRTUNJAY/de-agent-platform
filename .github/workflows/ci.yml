name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, Test, Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run pipeline (check mode)
        run: node pipelines/run.mjs --check
      - name: Run tests
        run: npm test
      - name: Build site
        # src/pages/api/* are server endpoints (better-sqlite3): they cannot
        # prerender, and loading them segfaults the static build. Vercel builds
        # them live via the adapter; CI verifies the static export instead.
        run: |
          rm -rf src/pages/api
          npm run build
      # astro check is run separately in typecheck job

  typecheck:
    name: TypeScript / Astro Check
    runs-on: ubuntu-latest
    continue-on-error: true  # Known ~80 type errors tracked as tech debt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run astro check
        run: npm run check
        continue-on-error: true

  link-audit:
    name: Link Audit
    runs-on: ubuntu-latest
    env:
      # Authenticated GitHub API calls (5k/hr vs 60/hr anonymous) for the
      # enrichment step inside the pipeline. Actions provides this free.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run pipeline to generate registry
        run: node pipelines/run.mjs
      - name: "Build static site - API routes excluded, no server in CI"
        # src/pages/api/* are server endpoints (better-sqlite3). They cannot
        # prerender, so the static audit build drops them — same recipe as
        # the emanisha.in/de-agent/ embed (see tools/de-agent-rewrite.mjs there).
        run: |
          rm -rf src/pages/api
          npx astro build
      - name: Audit internal links
        run: node pipelines/audit-links.mjs
      - name: Audit pages
        run: node pipelines/audit-pages.mjs

  security-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run npm audit (production only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true  # Report but don't fail on existing known issues