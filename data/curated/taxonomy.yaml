# =============================================================================
# TAXONOMY — the canonical Data Engineering map.
# Every category belongs to one roadmap stage, so the roadmap and the registry
# share a single spine. `tools` are first-class technology links (not vendors).
# =============================================================================

stages:
  - id: foundations
    slug: foundations
    order: 1
    title: Foundations
    summary: How data systems actually work — storage, compute, encoding, and the vocabulary you'll use for the next decade.
    outcomes: [explain the data lifecycle, read an architecture diagram, reason about storage vs compute]
  - id: python-sql
    slug: python-sql
    order: 2
    title: Python + SQL
    summary: The two languages everything else is built from. Fluency here is the single highest-leverage investment.
    outcomes: [write set-based SQL, write testable Python, move data between the two]
  - id: data-processing
    slug: data-processing
    order: 3
    title: Data Processing
    summary: Batch engines, file formats, and the mechanics of turning raw bytes into queryable tables.
    outcomes: [build a batch pipeline, choose a file format, control partitioning]
  - id: warehousing
    slug: warehousing
    order: 4
    title: Warehousing
    summary: Modelling, transformation and serving — dimensional design, dbt, and warehouse-native patterns.
    outcomes: [model a star schema, write dbt tests, serve a metric reliably]
  - id: lakehouse
    slug: lakehouse
    order: 5
    title: Lakehouse
    summary: Open table formats that give object storage ACID, time travel and schema evolution.
    outcomes: [choose Delta vs Iceberg vs Hudi, run maintenance, reason about metadata]
  - id: orchestration
    slug: orchestration
    order: 6
    title: Orchestration
    summary: Scheduling, dependencies, retries, backfills and idempotency across many moving parts.
    outcomes: [build an idempotent DAG, plan a safe backfill, handle late data]
  - id: streaming
    slug: streaming
    order: 7
    title: Streaming
    summary: Event-driven ingestion, log-based CDC, windowing, and exactly-once semantics under load.
    outcomes: [design an event schema, consume at scale, recover consumer lag]
  - id: cloud
    slug: cloud
    order: 8
    title: Cloud
    summary: Provider primitives — object storage, managed compute, IAM, and the platform-specific data stack.
    outcomes: [provision least-privilege access, pick managed vs self-hosted, control spend]
  - id: data-quality
    slug: data-quality
    order: 9
    title: Data Quality
    summary: Contracts, expectations, quarantine and the tests that keep a table trustworthy on Monday morning.
    outcomes: [express a quality contract, quarantine bad rows, gate a deploy on tests]
  - id: observability
    slug: observability
    order: 10
    title: Observability
    summary: Knowing what a pipeline did without reading its code — metrics, freshness, lineage and cataloguing.
    outcomes: [detect drift automatically, trace a column to source, catalogue an asset]
  - id: reliability
    slug: reliability
    order: 11
    title: Reliability
    summary: Operating data systems for years — SLOs, incident response, cost control and safe change.
    outcomes: [write a runbook, respond to an incident, prevent a repeat failure]
  - id: system-design
    slug: system-design
    order: 12
    title: System Design
    summary: Choosing architectures under real constraints and defending the tradeoffs in an interview.
    outcomes: [size a design, articulate tradeoffs, whiteboard a pipeline]
  - id: agentic
    slug: agentic
    order: 13
    title: Agentic Data Engineering
    summary: Using coding agents as first-class data engineers — skills, MCP servers, hooks and guardrails.
    outcomes: [install a skill, wire an MCP server, build a review agent]

categories:
  - { id: cat-engineering-foundations, slug: engineering-foundations, title: Engineering Foundations, stage: foundations, group: Core, order: 1, summary: "Filesystems, encoding, memory vs disk, networks and the operating vocabulary behind every pipeline.", keywords: [storage, compute, encoding, immutability, latency], tools: [docker, linux] }
  - { id: cat-python, slug: python, title: Python, stage: python-sql, group: Language, order: 2, summary: "Typing, packaging, virtualenvs and the data libraries (pandas, polars, pyarrow) you'll actually reach for.", keywords: [python, pandas, polars, pyarrow, typing, packaging], tools: [pydantic, polars, pandas, pyarrow, uv] }
  - { id: cat-sql, slug: sql, title: SQL, stage: python-sql, group: Language, order: 3, summary: "Set-based thinking, window functions, CTEs and query plans. The highest-ROI skill in the field.", keywords: [sql, window functions, cte, joins, query plan], tools: [postgres, duckdb, snowflake, bigquery] }
