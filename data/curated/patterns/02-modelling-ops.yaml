- id: pattern-agent-in-the-loop-review
  slug: agent-in-the-loop-review
  type: architecture
  title: Agent-in-the-Loop Review
  category: cat-agentic
  difficulty: intermediate
  tags: [architecture, agentic, review, guardrails]
  problem: Coding agents can do real data-engineering work, but can also ship a schema change or drop a table.
  context: Using coding agents against real data repositories and warehouses.
  forces: ["Agents accelerate review and drafting", "Blast radius can be production", "Trust must be earned per action"]
  solution: |
    Separate read/recommend from write/execute.
      read ─▶ recommend ─▶ human approves ─▶ execute (scoped, logged)
    Constrain the agent with read-only credentials plus MCP servers limited to the
    needed tools. Encode the safety policy as hooks (destructive SQL guard, prod
    write confirmation), and keep a human in the loop for anything irreversible.
  diagram: |
    agent ─(read tools)─▶ analysis ─▶ proposal ─▶ ⛔ human gate ─▶ scoped write
                                          └─ hooks enforce policy ─┘
  tradeoffs:
    - "pro: agent velocity with bounded, auditable blast radius"
    - "con: the human gate adds friction; requires a real permission model"
  when_to_use: ["Any agent touching production data", "Regulated environments"]
  when_not: ["A purely local sandbox with no real data"]
  implementations: [doc-security, hook-destructive-sql-guard, hook-prod-write-confirm, agent-sql-reviewer]
  related: [pattern-contracts-quality-gate]
