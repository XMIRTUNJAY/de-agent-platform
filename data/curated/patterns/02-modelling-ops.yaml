- id: pattern-small-files-compaction
  slug: small-files-compaction
  type: architecture
  title: Compaction & File-Size Management
  category: cat-lakehouse
  difficulty: intermediate
  tags: [architecture, compaction, small-files, lakehouse]
  problem: High-frequency writes shatter a table into thousands of tiny files and queries crawl.
  context: A lakehouse table written by micro-batches or streaming.
  forces: ["Write latency matters", "Read performance matters", "Metadata scanning is expensive too"]
  solution: |
    Separate the write path from the layout path.
      writes ─▶ many small files ─▶ [scheduled compaction] ─▶ 128-256 MB files
    Compact on a schedule (or auto-compact), targeting a file size that matches your
    read pattern. Rewrite manifests when metadata grows. Do it outside the ingestion
    window so compaction and writers don't contend.
  diagram: |
    micro-batches ─▶ ⬚⬚⬚⬚⬚⬚⬚⬚ ─▶ [compaction] ─▶ ▭▭▭ (128-256 MB)
  tradeoffs:
    - "pro: fast reads without slowing writes"
    - "con: compaction costs compute and can conflict with concurrent writers"
  when_to_use: ["Streaming/micro-batch writes to a table", "Many small appends per hour"]
  when_not: ["Low-frequency bulk writes that already produce large files"]
  implementations: [runbook-small-files-explosion, skill-iceberg-maintenance, skill-delta-optimizer]
  related: [pattern-medallion-zones]
  version: 1.1.0
  license: CC-BY-4.0
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/patterns/small-files-compaction
