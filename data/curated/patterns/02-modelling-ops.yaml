# Architecture patterns — modelling, processing, ops
- id: pattern-dimensional-model
  slug: dimensional-model
  type: architecture
  title: Dimensional Model (star schema)
  category: cat-warehouses
  difficulty: intermediate
  tags: [architecture, modelling, star-schema, dimensional]
  problem: Analysts re-derive the same joins and disagree on metric definitions.
  context: A warehouse serving BI and analytics with recurring query patterns.
  forces: ["Analysts need simple, fast queries", "Definitions must be consistent", "History matters for some attributes"]
  solution: |
    Facts (events/measures) surrounded by conformed dimensions (context).
      fct_orders (grain: one row per order line)
        ├─ dim_customer (SCD2 for history)
        ├─ dim_product
        └─ dim_date
    Declare the fact grain explicitly. Conform dimensions across facts so they can
    be combined. Use slowly-changing-dimension type 2 when an attribute's history
    must be preserved at the point of the fact.
  diagram: |
        dim_customer ─┐
        dim_product  ─┼─▶ fct_orders ─▶ marts
        dim_date     ─┘
  tradeoffs:
    - "pro: fast, intuitive, consistent; BI-friendly"
    - "con: less flexible for rare queries; ETL to maintain SCDs"
  when_to_use: ["BI-heavy consumption", "Stable, known query patterns"]
  when_not: ["Rapidly changing source schemas (consider Data Vault)", "Pure event/append analytics"]
  implementations: [project-dbt-warehouse-tests, skill-dbt-model-review]
  related: [pattern-data-vault, pattern-medallion-zones]
  version: 1.0.0
  license: CC-BY-4.0
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/patterns/dimensional-model
  verification: community
  last_verified: 2026-09-20
