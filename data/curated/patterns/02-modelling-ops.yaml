- id: pattern-cost-guardrails
  slug: cost-guardrails
  type: architecture
  title: Cost Guardrails
  category: cat-cost-engineering
  difficulty: intermediate
  tags: [architecture, cost, finops, guardrails]
  problem: A working pipeline silently becomes expensive and nobody notices until the invoice.
  context: Any cloud data platform with variable compute.
  forces: ["Spend varies with data growth", "Regressions hide in growth", "Engineers need fast feedback"]
  solution: |
    Instrument, attribute, then guard.
      1. unit metric per pipeline ($ per run, per 1M rows)
      2. baseline the last N runs
      3. fail CI on regression > threshold
      4. hard caps (warehouse resource monitors, quota limits)
    Alert on the *unit* metric, never on total spend, so healthy growth doesn't page
    anyone and a regression does.
  diagram: |
    run ─▶ metrics ─▶ unit metric ─┬─ within baseline ─▶ pass
                                    └─ regressed ─▶ fail CI / alert
  tradeoffs:
    - "pro: cheap early detection, no invoice surprises"
    - "con: needs metrics plumbing and a baseline to be maintained"
  when_to_use: ["Any pipeline with variable compute cost", "Multi-team platforms"]
  when_not: ["Negligible fixed-cost workloads"]
  implementations: [hook-spark-cost-check, skill-cost-unit-economics, runbook-spark-job-suddenly-costs-4x]
  related: [pattern-backfill-safety]
