- id: pattern-backfill-safety
  slug: backfill-safety
  type: architecture
  title: Safe Backfill
  category: cat-airflow
  difficulty: advanced
  tags: [architecture, backfill, safety, operations]
  problem: Backfills corrupt production or take down the daily run.
  context: A pipeline whose historical output must be recomputed.
  forces: ["Correctness must be verifiable", "Production must stay available", "Rollback must be possible"]
  solution: |
    Treat a backfill as a controlled migration.
      1. shadow target (or snapshot)
      2. batched date ranges, smallest first
      3. validate a sample after each batch
      4. swap atomically
      5. keep the old data until validated
    Never overlap the production window; never backfill without a rollback path.
  diagram: |
    [range] ─▶ shadow ─▶ validate ─▶ swap ─▶ keep old until verified
  tradeoffs:
    - "pro: reversible, observable, low-blast-radius"
    - "con: extra storage and orchestration for the shadow"
  when_to_use: ["Any historical recompute of a production table"]
  when_not: ["A tiny table you can recompute in one safe step"]
  implementations: [runbook-backfill-required, skill-backfill-planner, hook-backfill-safety-check]
  related: [pattern-idempotent-partition-overwrite]
  version: 1.1.0
  license: CC-BY-4.0
  author: de-agent
