- id: pattern-lambda-vs-kappa
  slug: lambda-vs-kappa
  type: architecture
  title: Lambda vs Kappa (batch + stream)
  category: cat-streaming
  difficulty: advanced
  tags: [architecture, lambda, kappa, streaming, batch]
  problem: Streaming is fast but hard; batch is simple but slow; you need both speed and correctness.
  context: An analytics need with both a latency requirement and a need to reprocess history.
  forces: ["Freshness needs", "Reprocessing needs", "Operational complexity budget", "Consistency between batch and stream logic"]
  solution: |
    Lambda: run a batch layer (authoritative, reprocessable) and a speed layer
    (approximate, low-latency), merge at query time. Two code paths, two bugs.
    Kappa: one streaming path; reprocessing = replay the log. Simpler, but the log
    must retain enough history and the stream must be replay-safe.
    Modern default: a single lakehouse path with replayable streams (a pragmatic
    kappa), keeping raw immutable so history is always reprocessable.
  diagram: |
    Lambda:  source ─┬─ batch (authoritative) ─┐
                     └─ speed (approx)       ─┴─▶ serve
    Kappa:   source ─▶ stream ─▶ table ─▶ serve   (reprocess = replay)
  tradeoffs:
    - "lambda pro: batch correctness; con: two implementations to keep consistent"
    - "kappa pro: one code path; con: requires long log retention + replay safety"
  when_to_use: ["Lambda when reprocessing is cheap and latency needs are moderate", "Kappa when streams are replayable and ops budget is limited"]
  when_not: ["Neither, if a nightly batch genuinely meets the SLA — keep it simple"]
  implementations: [pattern-medallion-zones, pattern-streaming-dedup-upsert]
  related: [pattern-batch-incremental-watermark]
  version: 1.0.0
  license: CC-BY-4.0
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/patterns/lambda-vs-kappa
  verification: community
  last_verified: 2026-09-17
