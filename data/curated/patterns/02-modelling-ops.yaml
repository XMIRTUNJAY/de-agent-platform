- id: pattern-data-vault
  slug: data-vault
  type: architecture
  title: Data Vault (hubs, links, satellites)
  category: cat-warehouses
  difficulty: advanced
  tags: [architecture, modelling, data-vault, integration]
  problem: Integrating many changing sources into a warehouse without constant rework.
  context: Many source systems, frequent schema changes, auditability requirements.
  forces: ["Sources change constantly", "History and auditability are mandatory", "Loads must be parallel and restartable"]
  solution: |
    Model the raw integration layer as insert-only:
      hubs       — business keys
      links      — relationships between hubs
      satellites — descriptive attributes over time
    Loads are insert-only and parallel, so a source change adds a satellite rather
    than forcing a rewrite. Build star schemas as a downstream, disposable layer.
  diagram: |
    source ─▶ hub_customer ─┐
             hub_order    ─┼─ link_order_customer ─▶ sat_* ─▶ star marts
    source ─▶ hub_product ──┘
  tradeoffs:
    - "pro: resilient to change, auditable, parallel loads"
    - "con: more objects, harder to query directly; needs a downstream marts layer"
  when_to_use: ["Enterprise integration of many sources", "Strong audit/lineage requirements"]
  when_not: ["A single source feeding a known set of reports"]
  implementations: [skill-dbt-model-review]
  related: [pattern-dimensional-model, pattern-medallion-zones]
  version: 0.9.0
  license: CC-BY-4.0
