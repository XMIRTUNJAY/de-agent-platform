- id: pattern-dbt-tests-docs
  slug: dbt-tests-docs
  type: architecture
  title: dbt as Models + Tests + Docs
  category: cat-dbt
  difficulty: beginner
  tags: [architecture, dbt, testing, documentation]
  problem: Transformation logic lives in untested, undocumented SQL scattered across scripts.
  context: Warehouse transformation with recurring models and consumers.
  forces: ["Logic must be reviewable", "Changes must be testable", "New joiners need to understand the lineage"]
  solution: |
    Every model is code with three faces:
      model (SQL) + tests (schema.yml) + docs (descriptions)
    `ref()` builds the DAG; tests encode the invariants; descriptions are the docs
    site consumers actually read. Materialisation is a deliberate choice per model.
  diagram: |
    source ─▶ stg_* ─▶ int_* ─▶ fct_*/dim_* ─▶ marts
              (tests + docs on every node)
  tradeoffs:
    - "pro: testable, reviewable, self-documenting transformations"
    - "con: dbt adds a layer to learn; over-testing becomes slow CI"
  when_to_use: ["Warehouse SQL with multiple consumers", "A team larger than one"]
  when_not: ["A single ad-hoc query", "Non-SQL-heavy processing"]
  implementations: [project-dbt-warehouse-tests, skill-dbt-model-review, skill-dbt-test-writer]
  related: [pattern-dimensional-model, pattern-contracts-quality-gate]
