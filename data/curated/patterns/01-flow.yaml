# Architecture patterns — data flow & storage
- id: pattern-medallion-zones
  slug: medallion-zones
  type: architecture
  title: Medallion Zones (raw / curated / serving)
  category: cat-lakes
  difficulty: beginner
  tags: [architecture, lakehouse, layers, medallion]
  problem: Object storage gives you a place to put files but no structure for trust or ownership.
  context: A lake or lakehouse where many teams write and read, and consumers need to know how far to trust a table.
  forces: ["Reprocessing needs the original bytes", "Consumers want clean, typed, tested tables", "Cost grows with redundant copies", "Ownership must be legible"]
  solution: |
    Three zones with explicit contracts between them.
      raw/       — immutable, exactly as received; never edited; schema-on-read.
      curated/   — cleaned, typed, deduplicated; partitioned; quality-gated.
      serving/   — modelled marts optimised for consumption; SLA-bearing.
    Each zone has a different retention, quality bar and owner. Promotion between
    zones is a pipeline step with a gate, not a copy.
  diagram: |
    source ─▶ raw (immutable) ─▶ [validate] ─▶ curated ─▶ [model+test] ─▶ serving
                  ▲                                              │
                  └──────────────── reprocess ◀──────────────────┘
  tradeoffs:
    - "pro: clear trust boundary, cheap reprocessing from raw"
    - "con: multiple copies, more storage and more pipelines to run"
    - "watch: don't let curated become a dumping ground; enforce the gate"
  when_to_use: ["Multiple consumers with different quality needs", "You need to reprocess history", "You need an audit trail to the source"]
  when_not: ["A single small pipeline with one consumer", "When storage cost dominates and copies are wasteful"]
  implementations: [project-api-s3-spark-parquet, project-s3-glue-athena]
  related: [pattern-batch-incremental-watermark, pattern-quarantine-publish]
  version: 1.1.0
  license: CC-BY-4.0
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/patterns/medallion-zones
