- id: pattern-streaming-dedup-upsert
  slug: streaming-dedup-upsert
  type: architecture
  title: Streaming Dedup and Upsert
  category: cat-streaming
  difficulty: advanced
  tags: [architecture, streaming, dedup, upsert, exactly-once]
  problem: Streaming sinks either duplicate on replay or lose rows on failure.
  context: A streaming job writing a change/event stream into a mutable table.
  forces: ["At-least-once delivery is the norm", "Replays happen after failure", "Consumers must not see duplicates"]
  solution: |
    Make the sink idempotent rather than trying to make the source exactly-once.
    Deduplicate by a business key + event time within the watermark, then MERGE
    (upsert) on the key. A replay recomputes the same rows and merges to the same
    state — idempotent by construction. Order by event time, not arrival time.
  diagram: |
    stream ─▶ [windowed dedupe by key] ─▶ MERGE (upsert on key) ─▶ table
  tradeoffs:
    - "pro: correct under replay; no reliance on perfect exactly-once"
    - "con: requires a stable business key and event time; state cost"
  when_to_use: ["Kafka → Delta/Iceberg/warehouse", "Any replay-prone stream"]
  when_not: ["Pure append-only event log with no dedup need"]
  implementations: [project-kafka-spark-delta, skill-cdc-merge-designer]
  related: [pattern-postgres-cdc-lakehouse, pattern-idempotent-partition-overwrite]
  version: 1.1.0
  license: CC-BY-4.0
