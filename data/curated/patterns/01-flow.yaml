- id: pattern-quarantine-publish
  slug: quarantine-publish
  type: architecture
  title: Quarantine then Publish
  category: cat-data-quality
  difficulty: intermediate
  tags: [architecture, data-quality, quarantine, dq]
  problem: One bad batch of rows can poison a whole table and every downstream metric.
  context: A pipeline where a known fraction of incoming rows may be malformed.
  forces: ["Consumers need clean data", "Bad rows must not be silently dropped", "Reprocessing bad rows must be possible"]
  solution: |
    Split every batch into publish and quarantine on a quality contract.
      pass ─▶ published table (SLA-bearing)
      fail ─▶ quarantine table (retained, alertable, reprocessable)
    A row never disappears: it is either published or quarantined with a reason.
    Alert on quarantine *rate*, not just on a hard failure — a rising rate is the
    early signal of an upstream problem.
  diagram: |
    batch ─▶ [contract check] ─┬─ pass ─▶ published ─▶ consumers
                               └─ fail ─▶ quarantine (+reason) ─▶ alert/reprocess
  tradeoffs:
    - "pro: consumers always read clean data; failures are visible and recoverable"
    - "con: extra storage and a reprocessing path to maintain"
    - "watch: a quarantine nobody reviews is just a slower data loss"
  when_to_use: ["External/partner data", "Any table with an SLA", "High-value downstream metrics"]
  when_not: ["Throwaway exploratory pipelines"]
  implementations: [project-pipeline-dq-quarantine, runbook-data-quality-failure]
  related: [pattern-contracts-quality-gate, skill-spark-data-quality-review]
  version: 1.1.0
  license: CC-BY-4.0
