- id: pattern-postgres-cdc-lakehouse
  slug: postgres-cdc-lakehouse
  type: architecture
  title: Postgres CDC to Lakehouse
  category: cat-cdc
  difficulty: advanced
  tags: [architecture, cdc, debezium, kafka, lakehouse]
  problem: Batch extraction from an OLTP database loads it and still misses deletes and mid-day changes.
  context: A Postgres/MySQL source whose changes must reach a lakehouse with low latency.
  forces: ["OLTP must not be slowed", "Deletes and updates must be captured", "Ordering matters", "Exactly-once is hard"]
  solution: |
    Read the write-ahead log, not the tables.
      WAL ─▶ Debezium ─▶ Kafka ─▶ [dedupe by LSN] ─▶ MERGE into lakehouse
    Rank events by (lsn, ts_ms) so out-of-order delivery resolves deterministically.
    Debounce/compact in a streaming job before the merge. Handle tombstones
    explicitly (hard or soft delete). Never read the source tables on a schedule.
  diagram: |
    Postgres WAL ─▶ Debezium ─▶ Kafka topic ─▶ stream dedupe ─▶ MERGE ─▶ Delta/Iceberg
  tradeoffs:
    - "pro: low latency, captures updates and deletes, no query load on OLTP"
    - "con: operational complexity (slots, connectors, ordering)"
    - "watch: a dropped replication slot forces a full re-snapshot"
  when_to_use: ["OLTP → lakehouse with freshness < 15 min", "You need deletes/updates"]
  when_not: ["A nightly batch is sufficient and the source is small"]
  implementations: [project-postgres-cdc-kafka-lakehouse, skill-cdc-merge-designer]
  related: [pattern-streaming-dedup-upsert, runbook-cdc-stopped]
  version: 1.2.0
  license: CC-BY-4.0
  author: de-agent
