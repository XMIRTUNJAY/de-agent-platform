- id: pattern-contracts-quality-gate
  slug: contracts-quality-gate
  type: architecture
  title: Contracts as a Quality Gate
  category: cat-data-contracts
  difficulty: intermediate
  tags: [architecture, contracts, ci, quality-gate]
  problem: Producers change schemas and semantics with no notice; consumers break in production.
  context: Multiple teams, a shared data platform, and a catalogue or registry of assets.
  forces: ["Producers move fast", "Consumers need stability", "Nobody reads a wiki on time"]
  solution: |
    A contract is code that runs in the producer's CI.
      contract ─▶ compatibility check (CI) ─▶ build ─▶ publish ─▶ consumers
    Additive changes pass. Breaking changes require a dated deprecation plan.
    The gate lives where the change is made (producer CI), not in the consumer's
    runtime — the cheapest place to catch it is before merge.
  diagram: |
    producer change ─▶ [contract CI] ─┬─ compatible ─▶ deploy
                                      └─ breaking ─▶ blocked + plan required
  tradeoffs:
    - "pro: failures caught pre-merge, at the producer"
    - "con: producers carry process overhead; needs buy-in"
  when_to_use: ["Shared assets across teams", "Regulated or SLA-bearing data"]
  when_not: ["A single team owning the whole chain"]
  implementations: [hook-schema-change-check, hook-pre-deployment-dq-check, skill-data-contract-author]
  related: [pattern-quarantine-publish, runbook-data-contract-broken]
  version: 1.0.0
