- id: pattern-batch-incremental-watermark
  slug: batch-incremental-watermark
  type: architecture
  title: Incremental Batch with a Watermark
  category: cat-batch-processing
  difficulty: intermediate
  tags: [architecture, incremental, watermark, batch]
  problem: Full reloads are too slow and too expensive once a table grows past millions of rows.
  context: A batch pipeline reading an append-mostly source that has an updated_at/event time.
  forces: ["Cost grows with history size", "Late-arriving rows must not be lost", "Re-runs must be safe", "Deletes may never be seen"]
  solution: |
    Process a window that ends at a watermark and starts a lookback before it.
      scan from (max(watermark) - lookback) to now
    The lookback absorbs late arrivals; the watermark bounds the work. Write
    idempotently (partition overwrite or MERGE) so a re-run is safe. Handle deletes
    explicitly (soft-delete or periodic full refresh) — they don't arrive in an
    append-only stream.
  diagram: |
    [max(updated_at) - N days] ─────▶ [now]
              lookback              watermark
  tradeoffs:
    - "pro: cost scales with new data, not history"
    - "con: lookback trades correctness for cost; too short loses late rows"
    - "watch: a naive is_incremental() without a lookback silently drops late data"
  when_to_use: ["Append-mostly sources", "Cost-sensitive pipelines", "Deterministic event/updated timestamps"]
  when_not: ["Little history", "Frequently mutating data without a reliable change marker (use CDC)"]
  implementations: [project-api-s3-spark-parquet, skill-dbt-model-review]
  related: [pattern-idempotent-partition-overwrite, pattern-postgres-cdc-lakehouse]
  version: 1.2.0
  license: CC-BY-4.0
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/patterns/batch-incremental-watermark
  github_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/patterns
