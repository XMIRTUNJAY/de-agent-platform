- id: pattern-idempotent-partition-overwrite
  slug: idempotent-partition-overwrite
  type: architecture
  title: Idempotent Partition Overwrite
  category: cat-batch-processing
  difficulty: beginner
  tags: [architecture, idempotency, partitions, batch]
  problem: Retries and backfills duplicate or corrupt data because writes are appends.
  context: Any batch pipeline that may be re-run for the same logical date.
  forces: ["Retries are inevitable", "Backfills are routine", "Consumers must see stable values"]
  solution: |
    Make each run write the complete result for its logical partition and replace
    that partition atomically. Never append to a partition you can recompute.
    `INSERT OVERWRITE partition(dt=...)` or Delta/Iceberg replace-where do this.
    The invariant: running the same date twice yields identical output.
  diagram: |
    run(dt=2026-09-01) ─▶ [compute] ─▶ OVERWRITE dt=2026-09-01
    run(dt=2026-09-01) ─▶ [compute] ─▶ OVERWRITE dt=2026-09-01  (same result)
  tradeoffs:
    - "pro: retries and backfills are safe by construction"
    - "con: requires a well-defined logical partition; hard for cross-partition state"
  when_to_use: ["Any re-runnable batch job", "Backfill-heavy pipelines"]
  when_not: ["Streaming writes with no partition boundary (use MERGE/upsert instead)"]
  implementations: [project-api-s3-spark-parquet, skill-airflow-dag-reviewer]
  related: [pattern-batch-incremental-watermark, pattern-streaming-dedup-upsert]
  version: 1.1.0
  license: CC-BY-4.0
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/patterns/idempotent-partition-overwrite
