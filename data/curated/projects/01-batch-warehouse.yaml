- id: project-dbt-warehouse-tests
  slug: dbt-warehouse-tests
  type: starter
  title: "dbt → warehouse → tests → docs"
  description: >-
    Transform raw landed data into a tested, documented star schema with dbt, and
    gate every change on data-aware CI.
  category: cat-dbt
  difficulty: beginner
  technologies: [tech-dbt, tech-postgres, tech-duckdb]
  stack: [dbt, Postgres, DuckDB (for CI)]
  learning_objectives:
    - Layer staging/intermediate/marts
    - Write tests that protect the grain
    - Run data-aware CI against a staging schema
  architecture: |
    raw.orders ─▶ stg_orders ─▶ int_orders_enriched ─┐
    raw.customers ─▶ stg_customers ──────────────────┼─▶ fct_orders ─▶ marts
    seeds/ ─▶ dim_date ──────────────────────────────┘
                (tests + docs on every node; CI on staging schema)
  repo_structure: |
    dbt-warehouse-tests/
      models/staging/
      models/intermediate/
      models/marts/
      models/schema.yml     # tests + descriptions
      tests/                # singular tests
      .github/workflows/ci.yml
  sample_data: dbt seeds — customers.csv, orders.csv (small, deterministic)
  setup:
    - "dbt deps && dbt seed"
    - "dbt build --target dev"
    - "dbt docs generate && dbt docs serve"
  implementation:
    - Staging: rename, cast, one row per source row.
    - Intermediate: business logic, no direct consumer reads.
    - Marts: fct vs dim, grain declared in schema.yml.
    - Incremental on fct_orders with a 3-day lookback.
  tests:
    - "unique + not_null on the fct grain key"
    - "relationships from fct to dims"
    - "accepted_values on status"
  failure_scenarios:
    - "Late-arriving order missed → lookback window too short"
    - "Grain key not unique → a join fanned out upstream"
    - "CI green but prod differs → CI ran on a different target/schema"
  production_hardening:
    - "CI builds to a per-PR staging schema and runs full tests"
    - "Source freshness checks on raw"
    - "Exposures declared for dashboards"
  agent_skills: [skill-dbt-model-review, skill-dbt-test-writer, skill-sql-review]
  version: 1.3.0
  license: MIT
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/projects/dbt-warehouse-tests
