- id: runbook-duplicate-records
  slug: duplicate-records
  type: runbook
  title: "Duplicate records"
  description: Row counts are inflated and metrics double-counted after a retry, a fan-out join or a backfill.
  severity: high
  category: cat-data-quality
  difficulty: intermediate
  tags: [duplicates, idempotency, data-quality]
  symptoms:
    - Row counts inflated relative to source
    - Revenue/metrics double-counted
    - A unique-key test starts failing
  possible_causes:
    - A retried task appended instead of overwriting the partition
    - A join fanned out (non-unique key on the "one" side)
    - A backfill re-inserted rows that already existed
    - Exactly-once not achieved in a streaming write
  diagnosis:
    - Identify the duplicate key and count duplicates per key.
    - Determine the earliest date duplicates appeared → correlate with a deploy.
    - Check whether the write is append vs merge/overwrite.
  commands:
    - "SELECT k, count(*) c FROM t GROUP BY k HAVING count(*) > 1 ORDER BY c DESC LIMIT 20;"
    - "SELECT min(dt), max(dt) FROM (SELECT dt, k, count(*) FROM t GROUP BY dt, k HAVING count(*)>1);"
  fix:
    - Deduplicate on the business key, keeping the latest by event time.
    - Rewrite the affected partitions (overwrite), not the whole table.
  prevention:
    - Idempotent writes (partition overwrite or MERGE on the key).
    - A `unique` test on the grain key in CI and in production.
  monitoring:
    - duplicate-rate per key, row count vs source count
  agent_skills: [skill-spark-data-quality-review, skill-cdc-merge-designer]
  agents: [agent-data-quality-reviewer]
