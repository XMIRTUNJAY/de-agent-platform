- id: runbook-cdc-stopped
  slug: cdc-stopped
  type: runbook
  title: "CDC stopped"
  description: Change events stopped flowing from a source and the target table is silently diverging.
  severity: critical
  category: cat-cdc
  difficulty: advanced
  tags: [cdc, debezium, kafka, incident]
  symptoms:
    - Change events stop arriving for a source table
    - Target table silently diverges from source
    - Often no error surfaced to consumers
  possible_causes:
    - Connector task failed (slot invalidated, WAL purged)
    - Replication slot dropped or lagging beyond retention
    - Network/credentials rotated and the connector cannot reconnect
    - Schema change broke the connector's mapping
  diagnosis:
    - Check connector and task status for the source.
    - Check the replication slot's retained WAL / active state on the DB.
    - Confirm the topic still has recent timestamps.
  commands:
    - "curl -s $CONNECT/connectors/$NAME/status | jq .tasks"
    - "SELECT slot_name, active, restart_lsn, confirmed_flush_lsn FROM pg_replication_slots;"
    - "kafka-run-class kafka.tools.GetOffsetShell --topic $T --time -1"
  fix:
    - Task failed → restart the task; if the slot was dropped, re-snapshot.
    - WAL purged → the only correct fix is a fresh snapshot + restart.
    - Never hand-edit offsets; replay from the snapshot point.
  prevention:
    - Alert on replication-slot retained WAL and on connector task failures.
    - Monitor the source→target row-count delta continuously.
  monitoring:
    - connector task state, slot retained WAL, event lag vs source
  when_to_use:
    - "Change events stopped arriving from a source table"
    - "The target is silently diverging and consumers see no error"
  why: CDC failures are silent by construction — the target keeps serving yesterday's truth, and divergence compounds until a reconciliation catches it.
  impact: The target silently diverges from the source — every consumer reads stale data with no error anywhere; reports are wrong by omission.
  escalation: Declare an incident immediately; page the platform on-call and the source-database owner (slot and WAL changes need DBA rights).
  evidence_to_collect:
    - "Connector and task status for the affected source"
    - "pg_replication_slots: active, restart_lsn, confirmed_flush_lsn, retained WAL"
    - "Topic offsets: last event timestamp vs the source's max LSN/SCN"
    - "Source-to-target row-count delta for the affected tables"
  rollback: "Not applicable — recovery is forward-only: restart the task, or re-snapshot if the slot/WAL was lost. Never hand-edit offsets."
  follow_up:
    - "Add the retained-WAL and task-state alerts that were missing"
    - "Run a full reconciliation over the divergence window"
    - "Postmortem: why monitoring missed the silence"
  gotchas:
    - "Never hand-edit offsets; replay from the snapshot point."
    - "WAL purged beyond the slot's retention is unrecoverable in place — the only correct fix is a fresh snapshot."
    - "Credential rotation can stall a connector with no error on the consumer side."
  production_notes:
    - "Alert on replication-slot retained WAL and on connector task state."
    - "Reconcile source-to-target row counts continuously."
  diagram: |
    cdc stopped
       |
       |- task failed --> restart --> slot intact? --> resume
       |                                 |- slot dropped --> re-snapshot
       |
       |- WAL purged --> fresh snapshot --> restart from snapshot point
  tradeoffs:
    - "pro: a fresh snapshot is always correct"
    - "con: full re-snapshotting is the most expensive recovery path"
  agent_skills: [skill-cdc-merge-designer]
  agents: [agent-incident-assistant]
