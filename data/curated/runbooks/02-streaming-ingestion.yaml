- id: runbook-duplicate-records
  slug: duplicate-records
  type: runbook
  title: "Duplicate records"
  description: Row counts are inflated and metrics double-counted after a retry, a fan-out join or a backfill.
  severity: high
  category: cat-data-quality
  difficulty: intermediate
  tags: [duplicates, idempotency, data-quality]
  symptoms:
    - Row counts inflated relative to source
    - Revenue/metrics double-counted
    - A unique-key test starts failing
  possible_causes:
    - A retried task appended instead of overwriting the partition
    - A join fanned out (non-unique key on the "one" side)
    - A backfill re-inserted rows that already existed
    - Exactly-once not achieved in a streaming write
  diagnosis:
    - Identify the duplicate key and count duplicates per key.
    - Determine the earliest date duplicates appeared → correlate with a deploy.
    - Check whether the write is append vs merge/overwrite.
  commands:
    - "SELECT k, count(*) c FROM t GROUP BY k HAVING count(*) > 1 ORDER BY c DESC LIMIT 20;"
    - "SELECT min(dt), max(dt) FROM (SELECT dt, k, count(*) FROM t GROUP BY dt, k HAVING count(*)>1);"
  fix:
    - Deduplicate on the business key, keeping the latest by event time.
    - Rewrite the affected partitions (overwrite), not the whole table.
  prevention:
    - Idempotent writes (partition overwrite or MERGE on the key).
    - A `unique` test on the grain key in CI and in production.
  monitoring:
    - duplicate-rate per key, row count vs source count
  when_to_use:
    - "Row counts are inflated and metrics double-counted"
    - "A unique-key test starts failing after a retry, join change or backfill"
  why: Duplicates corrupt every metric quietly; finding the first duplicate date and the deploy that introduced it is the whole diagnosis.
  impact: Revenue and usage metrics double-count; finance and product dashboards disagree with each other and with the source.
  escalation: Notify metric consumers immediately that published numbers are wrong; bring in the owning team for the write-mode fix.
  evidence_to_collect:
    - "Duplicate counts per key, and the earliest duplicate date"
    - "The deploy or change correlated with that date"
    - "The write mode (append vs overwrite/MERGE) of the affected job"
  rollback: Roll back the write-mode change; then rewrite only the affected partitions, deduplicating by latest event time.
  follow_up:
    - "Add the unique-grain test in CI and in production"
    - "Convert the job to idempotent writes (partition overwrite or MERGE)"
  gotchas:
    - "Fix the destination partitions, not the whole table — a full rewrite is both slow and a new risk."
    - "An append instead of overwrite on retry is the classic maker of duplicates."
    - "A non-unique 'one' side in a join fans out silently; test the grain, not the totals."
  production_notes:
    - "Idempotent writes: partition overwrite or MERGE on the business key."
    - "Run a unique test on the grain key in CI and in production."
  diagram: |
    duplicates
       |
       |- min duplicate date --> correlate with deploy --> fix write mode --> overwrite partitions
       |
       |- fan-out join --> dedupe or fix the grain --> re-run affected range
  tradeoffs:
    - "pro: MERGE on the key makes retries harmless"
    - "con: MERGE needs a solid key; a weak key hides duplicates instead of fixing them"
  agent_skills: [skill-spark-data-quality-review, skill-cdc-merge-designer]
  agents: [agent-data-quality-reviewer]
  version: 1.1.0
