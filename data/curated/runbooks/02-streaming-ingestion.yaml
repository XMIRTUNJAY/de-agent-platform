- id: runbook-late-files
  slug: late-files
  type: runbook
  title: "Late files"
  description: Partner files arrive after the job has already run, so historical numbers keep changing.
  severity: medium
  category: cat-file-ingestion
  difficulty: intermediate
  tags: [late-data, ingestion, sftp, batch]
  symptoms:
    - Files arrive after the daily job already ran
    - Yesterday's numbers change the next morning
    - Downstream reconciliations disagree
  possible_causes:
    - Partner sends late; no watermark policy defined
    - Timezone mismatch between partner and pipeline
    - Job scheduled before the partner's SLA window closes
  diagnosis:
    - Measure arrival-time distribution of files over the last 30 days.
    - Compare the job schedule against the partner's contractual delivery time.
  commands:
    - "aws s3api list-objects-v2 --bucket b --prefix in/ --query 'Contents[].LastModified'"
  fix:
    - Re-process the late window idempotently (partition overwrite or MERGE).
    - Widen the reprocessing window to cover observed lateness.
  prevention:
    - A watermark policy: reprocess the last N days every run.
    - Idempotent writes keyed by business date so a re-run is safe.
  monitoring:
    - max file lateness, count of late arrivals per run
  when_to_use:
    - "Files landed after the daily job already ran"
    - "Yesterday's numbers changed this morning and reconciliations disagree"
  why: Late arrivals rewrite history silently; without a watermark policy every run is a fresh bet on the partner's clock.
  impact: Historical numbers keep changing; reconciliations disagree and consumers lose trust in yesterday's numbers.
  escalation: Escalate to the partner manager when lateness repeatedly breaches the contractual delivery window.
  evidence_to_collect:
    - "30-day arrival-time distribution for the partner's files (in UTC)"
    - "The job schedule vs the contractual delivery time"
    - "Which partitions were reprocessed, and when"
  rollback: None — reprocess idempotently; if a reprocess corrupted a window, restore it from the pre-write snapshot and re-run.
  follow_up:
    - "Set the watermark window from measured lateness, not guesswork"
    - "Document the partner SLA next to the job schedule"
  gotchas:
    - "Re-running the whole partition for one late file is wasteful — overwrite windows, not history."
    - "Timezone mismatch between partner and pipeline shifts lateness by hours — measure arrival times in UTC."
    - "Scheduling the job before the partner's SLA window closes guarantees an incident every day."
  production_notes:
    - "Reprocess the last N days every run (watermark policy)."
    - "Make writes idempotent keyed by business date so a re-run is safe."
  diagram: |
    late files
       |
       |- measure 30-day arrival lateness --> set watermark window --> reprocess N days each run
       |
       |- job runs before SLA close --> move schedule, or accept + reprocess
  tradeoffs:
    - "pro: a wide watermark window makes lateness invisible to consumers"
    - "con: each widened window re-reads N days of data every run"
  agent_skills: [skill-airflow-dag-reviewer, skill-backfill-planner]
  agents: [agent-pipeline-reviewer]
