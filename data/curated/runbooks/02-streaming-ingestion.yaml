# Runbooks — streaming & ingestion
- id: runbook-kafka-consumer-lagging
  slug: kafka-consumer-lagging
  type: runbook
  title: "Kafka consumer lagging"
  description: A consumer group is falling behind the topic and downstream tables are going stale.
  severity: high
  category: cat-kafka
  difficulty: advanced
  tags: [kafka, lag, streaming, incident]
  symptoms:
    - Consumer group lag rising and not recovering
    - Downstream tables increasingly stale
    - Processor CPU may be low (waiting on downstream) or saturated
  possible_causes:
    - Downstream sink (DB/warehouse) is the bottleneck
    - A hot key routes to a single partition
    - Rebalance loop stealing consumption time
    - A poison message retried forever
    - Too few consumers for the partition count
  diagnosis:
    - Get per-partition lag: uniform vs skewed tells you capacity vs key skew.
    - Check the consumer-group state history for `PreparingRebalance`.
    - Look for one partition whose committed offset is stuck.
  commands:
    - "kafka-consumer-groups --bootstrap-server $B --describe --group $G"
    - "kafka-consumer-groups --bootstrap-server $B --describe --group $G --state"
  fix:
    - Sink-bound → batch/upsert in bulk, or scale the sink.
    - Key skew → re-key the topic or increase partitions (breaks ordering per key).
    - Rebalance → raise session.timeout.ms / max.poll.interval.ms.
    - Poison message → route to a DLQ and commit past it.
    - Never reset offsets to reduce lag; that is silent data loss.
  prevention:
    - Alert on lag slope, not on an absolute lag number.
    - A DLQ for messages failing N times.
  monitoring:
    - consumer lag per partition, rebalance count, DLQ depth
  when_to_use:
    - "Consumer-group lag keeps rising and won't recover on its own"
    - "Downstream tables are going fresh-to-stale"
  why: Lag compounds — every minute behind is a minute of stale truth downstream, and the sink silently becomes the bottleneck nobody owns.
  impact: Downstream tables go stale minute by minute; freshness SLAs breach and consumers act on old data without knowing it.
  escalation: Page the streaming on-call when the lag slope stays positive for 3 consecutive alert intervals; loop in the sink's owner early — the bottleneck is usually downstream.
  evidence_to_collect:
    - "Per-partition lag (uniform vs skewed)"
    - "Consumer-group state history (rebalance frequency)"
    - "Sink write latency and throughput for the same window"
    - "DLQ depth and any stuck committed offsets"
  rollback: If a consumer or sink deploy preceded the lag, roll it back; scaling consumers is a mitigation, not a rollback.
  follow_up:
    - "Switch the alert to lag slope, not absolute lag"
    - "Verify the DLQ path actually catches poison messages"
  gotchas:
    - "Never reset offsets to clear lag; that is silent data loss."
    - "Uniform lag means capacity; one stuck partition means key skew or a poison message — read per-partition lag before scaling."
    - "A rebalance loop can look like slowness: check the group state history for PreparingRebalance."
    - "Adding consumers past the partition count buys nothing."
  production_notes:
    - "Alert on lag slope, not on an absolute lag number."
    - "Give messages that fail N times a DLQ instead of an endless retry."
  diagram: |
    consumer lagging
       |
       |- lag uniform --> capacity bound --> scale consumers / sink throughput
       |
       |- one partition stuck --> hot key or poison --> re-key, or DLQ + commit past
       |
       |- PreparingRebalance looping --> rebalance storm --> raise session.timeout.ms
  tradeoffs:
    - "pro: re-keying the topic fixes hot partitions permanently"
    - "con: raising partition count breaks per-key ordering while it rebalances"
  agent_skills: [skill-kafka-lag-triage]
  agents: [agent-kafka-troubleshooter]
  version: 1.3.0
  license: CC-BY-4.0
