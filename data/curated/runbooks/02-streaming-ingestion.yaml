# Runbooks — streaming & ingestion
- id: runbook-kafka-consumer-lagging
  slug: kafka-consumer-lagging
  type: runbook
  title: "Kafka consumer lagging"
  description: A consumer group is falling behind the topic and downstream tables are going stale.
  severity: high
  category: cat-kafka
  difficulty: advanced
  tags: [kafka, lag, streaming, incident]
  symptoms:
    - Consumer group lag rising and not recovering
    - Downstream tables increasingly stale
    - Processor CPU may be low (waiting on downstream) or saturated
  possible_causes:
    - Downstream sink (DB/warehouse) is the bottleneck
    - A hot key routes to a single partition
    - Rebalance loop stealing consumption time
    - A poison message retried forever
    - Too few consumers for the partition count
  diagnosis:
    - Get per-partition lag: uniform vs skewed tells you capacity vs key skew.
    - Check the consumer-group state history for `PreparingRebalance`.
    - Look for one partition whose committed offset is stuck.
  commands:
    - "kafka-consumer-groups --bootstrap-server $B --describe --group $G"
    - "kafka-consumer-groups --bootstrap-server $B --describe --group $G --state"
  fix:
    - Sink-bound → batch/upsert in bulk, or scale the sink.
    - Key skew → re-key the topic or increase partitions (breaks ordering per key).
    - Rebalance → raise session.timeout.ms / max.poll.interval.ms.
    - Poison message → route to a DLQ and commit past it.
    - Never reset offsets to reduce lag; that is silent data loss.
  prevention:
    - Alert on lag slope, not on an absolute lag number.
    - A DLQ for messages failing N times.
  monitoring:
    - consumer lag per partition, rebalance count, DLQ depth
  agent_skills: [skill-kafka-lag-triage]
  agents: [agent-kafka-troubleshooter]
  version: 1.3.0
  license: CC-BY-4.0
  author: de-agent
  source_url: https://github.com/de-agent/runbooks/tree/main/kafka-consumer-lagging
  github_url: https://github.com/de-agent/runbooks
  verification: community
  last_verified: 2026-09-27
  security: { runs_code: true, network_access: true, credentials: true, filesystem_access: false, external_apis: false }
  relationships: { related_to: [cat-kafka, skill-kafka-lag-triage] }
- id: runbook-cdc-stopped
  slug: cdc-stopped
  type: runbook
  title: "CDC stopped"
  description: Change events stopped flowing from a source and the target table is silently diverging.
  severity: critical
  category: cat-cdc
  difficulty: advanced
  tags: [cdc, debezium, kafka, incident]
  symptoms:
    - Change events stop arriving for a source table
    - Target table silently diverges from source
    - Often no error surfaced to consumers
  possible_causes:
    - Connector task failed (slot invalidated, WAL purged)
    - Replication slot dropped or lagging beyond retention
    - Network/credentials rotated and the connector cannot reconnect
    - Schema change broke the connector's mapping
  diagnosis:
    - Check connector and task status for the source.
    - Check the replication slot's retained WAL / active state on the DB.
    - Confirm the topic still has recent timestamps.
  commands:
    - "curl -s $CONNECT/connectors/$NAME/status | jq .tasks"
    - "SELECT slot_name, active, restart_lsn, confirmed_flush_lsn FROM pg_replication_slots;"
    - "kafka-run-class kafka.tools.GetOffsetShell --topic $T --time -1"
  fix:
    - Task failed → restart the task; if the slot was dropped, re-snapshot.
    - WAL purged → the only correct fix is a fresh snapshot + restart.
    - Never hand-edit offsets; replay from the snapshot point.
  prevention:
    - Alert on replication-slot retained WAL and on connector task failures.
    - Monitor the source→target row-count delta continuously.
  monitoring:
    - connector task state, slot retained WAL, event lag vs source
  agent_skills: [skill-cdc-merge-designer]
  agents: [agent-incident-assistant]
  version: 1.1.0
