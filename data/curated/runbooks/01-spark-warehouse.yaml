- id: runbook-spark-job-suddenly-costs-4x
  slug: spark-job-suddenly-costs-4x
  type: runbook
  title: "Spark job suddenly costs 4x"
  description: One job's compute cost quadrupled without an obvious functional change — attribute it and reverse the regression.
  severity: high
  category: cat-cost-engineering
  difficulty: advanced
  tags: [spark, cost, incident, regression]
  symptoms:
    - Cluster/DBU spend for one job quadrupled overnight
    - Invoice alert, or a cost-per-run dashboard spike
    - Often no functional change was noticed
  possible_causes:
    - A join started fanning out, exploding row counts mid-stage
    - A partition filter was dropped (full history re-read)
    - Small-file explosion after a partitioning change
    - Autoscaling widened because a stage became slow (compounding loop)
  diagnosis:
    - Diff shuffle write bytes and input bytes for the job run-over-run.
    - Compare output row counts before/after the join, per stage.
    - Check whether the partition predicate still prunes (bytes scanned).
  commands:
    - "# from the event log"
    - "grep -E 'Shuffle Write|Input Size' spark.log | tail -40"
    - "SELECT count(*) FROM stage_output_pre JOIN ... -- compare to source count"
  fix:
    - Fan-out → dedupe the many-side on the join key before joining.
    - Lost filter → restore the partition predicate and re-run.
    - Small files → OPTIMIZE/compact, then re-run.
  prevention:
    - Cost-per-run unit metric with a 25% regression alarm.
    - CI guard on shuffle/scan metrics (hook-spark-cost-check).
  monitoring:
    - $ per run, shuffle write bytes, input bytes, output rows
  when_to_use:
    - "Compute spend for one job multiplied without a functional change"
    - "A cost-per-run alarm fired right after a deploy"
  why: Silent cost regressions compound — a 4x job running hourly is a new invoice line within a day; run-over-run byte diffs find the guilty stage fast.
  impact: Direct compute spend 4x per run; at hourly cadence that is a new invoice line every day until reverted.
  escalation: Notify the cost owner and the job's owning team the same day; involve finance only if the regression survives into a billing cycle.
  evidence_to_collect:
    - "Run-over-run diff of shuffle write bytes and input bytes"
    - "Output row counts per stage before/after the suspect change"
    - "The deploy diff or config change that landed between the two runs"
    - "Autoscaling logs showing any widened limits"
  rollback: Revert the suspect deploy first (join change, dropped filter, partitioning change) — the cost regression is the incident; diagnosis continues on the reverted baseline.
  follow_up:
    - "Wire the 25% cost-per-run regression alarm if it was missing"
    - "Gate the next deploy on shuffle/scan metrics (hook-spark-cost-check)"
  gotchas:
    - "Autoscaling masks the cause: a slow stage widens the cluster and buys speed while the fan-out stays."
    - "Compare run-over-run, not day-over-day — traffic deltas will fool the diff."
    - "A dropped partition filter reads full history: the join looks right, the input bytes don't."
  production_notes:
    - "Track cost per run as a unit metric with a 25% regression alarm."
    - "Gate deploys on shuffle/scan metrics (hook-spark-cost-check)."
  diagram: |
    cost 4x
       |
       |- output rows >> source rows --> join fan-out --> dedupe the many-side --> re-run
       |
       |- input bytes >> usual --> lost partition filter --> restore predicate
       |
       |- tiny files everywhere --> small-file explosion --> OPTIMIZE / compact
  tradeoffs:
    - "pro: run-over-run byte diffs pin the regression to one stage"
    - "con: needs event-log retention; rotated logs close the window"
  agent_skills: [skill-spark-cost-regression-guard, skill-cost-unit-economics]
  agents: [agent-cost-optimizer, agent-spark-optimizer]
