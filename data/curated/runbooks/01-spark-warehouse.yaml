# Runbooks — Spark & warehouse performance
- id: runbook-spark-job-slow
  slug: spark-job-slow
  type: runbook
  title: "Spark job is slow"
  description: A batch Spark job's runtime has jumped — find whether it is skew, partition count, spill or over-scan.
  editorial:
    limitations:
      - The diagnosis steps assume Spark UI or event-log access; wall-clock time alone is not enough.
  severity: high
  category: cat-spark
  difficulty: advanced
  tags: [spark, performance, incident]
  symptoms:
    - Job duration rose sharply with no code change
    - One or a few tasks dominate the stage
    - Executors idle while a handful run long
  possible_causes:
    - Key skew on a join or group-by key
    - Too few partitions after a filter, or too many after a shuffle
    - Spill to disk from an oversized partition
    - Reading far more data than needed (missing partition filter)
  diagnosis:
    - Open the Spark UI stage view; compare p50 vs p99 task duration.
    - Skew if p99 >> p50 (10x+). Uniform slowness if p50 is high.
    - Check shuffle read/write bytes and spill (disk) bytes per task.
    - Check input bytes scanned vs table size.
  commands:
    - "spark-submit --conf spark.sql.adaptive.enabled=true ..."
    - "# inspect the event log: grep 'TaskSetManager' spark.log | tail"
    - "df.explain('formatted')  # confirm broadcast vs sort-merge join"
  fix:
    - Skew → enable AQE skew join; else salt the hot key and aggregate twice.
    - Spill → increase partition count or raise executor memory.
    - Over-scan → add the partition predicate; confirm with bytes scanned.
    - Never repartition(1); it serialises the stage.
  prevention:
    - Baseline shuffle/spill/scan metrics and fail CI on regression.
    - Add a partition filter lint on source reads.
  monitoring:
    - task duration p99/p50 ratio
    - shuffle read/write bytes per run
    - spill bytes per stage
  agent_skills: [skill-spark-skew-diagnosis, skill-spark-cost-regression-guard]
  agents: [agent-spark-optimizer]
  version: 1.2.0
  license: CC-BY-4.0
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/runbooks/spark-job-slow
  github_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/runbooks
