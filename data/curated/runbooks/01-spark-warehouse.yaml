- id: runbook-missing-partition
  slug: missing-partition
  type: runbook
  title: "Missing partition"
  description: An expected date partition is absent, so a downstream report silently excludes a day.
  severity: high
  category: cat-batch-processing
  difficulty: intermediate
  tags: [partition, batch, data-completeness]
  symptoms:
    - A date partition is absent from the table
    - A downstream report silently excludes a day
    - Freshness check passes but completeness fails
  possible_causes:
    - Upstream produced no file for that date (source gap)
    - The job wrote to the wrong date due to timezone handling
    - A partially failed run left an empty or absent partition
  diagnosis:
    - List partitions for the range and diff against the calendar.
    - Check the job's logical date vs UTC vs local conversion.
    - Confirm whether the source actually had data.
  commands:
    - "aws s3 ls s3://bucket/table/ --recursive | grep 'dt=2026-09'"
    - "SELECT dt, count(*) FROM tbl GROUP BY dt ORDER BY dt DESC LIMIT 30;"
  fix:
    - Re-run the specific logical date once the source is confirmed.
    - Backfill the gap partition with the corrected timezone mapping.
  prevention:
    - A completeness check that asserts every expected partition exists.
    - Store the logical date explicitly as a partition column, not derived at read time.
  monitoring:
    - partition count per day, completeness assertions
