- id: runbook-warehouse-query-slow
  slug: warehouse-query-slow
  type: runbook
  title: "Warehouse query is slow"
  description: A query that used to be fast became slow — separate scan inefficiency from compute contention.
  severity: medium
  category: cat-warehouses
  difficulty: intermediate
  tags: [warehouse, query, performance]
  symptoms:
    - A dashboard or model query that used to take seconds now takes minutes
    - Queue times rising on a shared warehouse
  possible_causes:
    - Full table scan from a lost filter or a broken cluster key
    - Clustering key no longer matches query predicates
    - Warehouse undersized, or too many concurrent queries
    - Data volume growth crossing a micro-partition threshold
  diagnosis:
    - Separate scan cost from compute time (bytes/partitions scanned vs queue time).
    - Compare the plan against the clustering/partition key.
  commands:
    - "-- Snowflake"
    - "SELECT query_id, partitions_scanned, partitions_total, bytes_scanned FROM table(information_schema.query_history_by_session()) ORDER BY start_time DESC LIMIT 10;"
  fix:
    - Over-scan → fix the predicate or add/adjust the clustering key.
    - Compute-bound with high queue time → add clusters, not size.
    - Rebuild clustering on a low-selectivity key.
  prevention:
    - Alert on partitions_scanned/partitions_total ratio.
    - Review query history weekly for the top cost queries.
  monitoring:
    - bytes scanned, partitions scanned ratio, queue time
  when_to_use:
    - "A query that used to take seconds now takes minutes"
    - "Queue times are rising on a shared warehouse"
  why: A regressed dashboard erodes trust quietly, and a scan-bound query melts everyone else's queue too.
  impact: Dashboards and models on the shared warehouse run late; queue growth degrades every other team's queries too.
  escalation: Escalate to the warehouse admin when queue time breaches the shared-warehouse SLA; otherwise the query owner fixes the predicate.
  evidence_to_collect:
    - "query_id with partitions_scanned/partitions_total and bytes_scanned"
    - "The query plan compared against the clustering/partition key"
    - "Queue time vs execution time split"
  rollback: None — revert the query or DDL change if one shipped; adding clusters is mitigation, not a rollback.
  follow_up:
    - "Add the scan-ratio alert for the affected table"
    - "Put the query on the weekly top-cost review list"
  gotchas:
    - "Bytes scanned and queue time are different diseases — fix the predicate vs add clusters; sizing up a scan-bound query buys nothing."
    - "Clustering on a low-selectivity key stops pruning entirely."
    - "Data volume growth silently crosses micro-partition thresholds — a query can go slow with no change at all."
  production_notes:
    - "Alert on the partitions_scanned/partitions_total ratio."
    - "Review weekly query history for the top-cost queries."
  diagram: |
    query slow
       |
       |- partitions scanned ~= total --> over-scan --> fix predicate / recluster
       |
       |- queue time high --> contention --> add clusters, not size
  tradeoffs:
    - "pro: clustering makes the common path the fast path"
    - "con: reclustering rewrites storage and burns credits"
  agent_skills: [skill-warehouse-clustering-advisor, skill-sql-query-plan]
