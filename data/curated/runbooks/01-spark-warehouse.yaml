- id: runbook-small-files-explosion
  slug: small-files-explosion
  type: runbook
  title: "Small files explosion"
  description: A table has fragmented into thousands of tiny files and query planning now dominates runtime.
  severity: medium
  category: cat-lakehouse
  difficulty: intermediate
  tags: [small-files, lakehouse, performance, compaction]
  symptoms:
    - Table has tens of thousands of tiny files
    - Query planning and listing dominate query time
    - Metadata operations (OPTIMIZE/REPAIR) become very slow
  possible_causes:
    - Streaming or high-frequency writes without compaction
    - Over-partitioning (partition per hour, per user)
    - Many small appends from a micro-batch job
  diagnosis:
    - List file sizes; avg < 32 MB and a growing count is the signature.
    - For Iceberg/Delta, query the metadata tables (`files`, `history`).
  commands:
    - "SELECT count(*), avg(file_size_in_bytes)/1e6 FROM db.tbl.files;"
    - "OPTIMIZE db.tbl ZORDER BY (user_id);  -- Delta"
    - "CALL catalog.system.rewrite_data_files('db.tbl');  -- Iceberg"
  fix:
    - Compact to a 128-256 MB target; rewrite manifests if huge.
    - Reduce partition granularity if the layout over-partitions.
    - Schedule compaction after the ingestion window, never during it.
  prevention:
    - Auto-compaction on the table (Delta) or a scheduled maintenance job.
    - Partition by date, not by hour/user, unless access patterns demand it.
  monitoring:
    - file count, avg file size, planning time
  when_to_use:
    - "Planning or listing time dominates query time on one table"
    - "Metadata operations (OPTIMIZE/REPAIR) have become very slow"
  why: Fragmentation turns every read into a metadata crawl; compaction restores predictable latency without touching consumers.
  impact: Every query on the table pays a growing planning tax; metadata operations stretch into hours and block maintenance windows.
  escalation: No page — schedule compaction; escalate only if planning time threatens a critical dashboard's freshness SLA.
  evidence_to_collect:
    - "File count and average file size from the table's metadata (files/history)"
    - "Query plans splitting time spent in planning/listing vs scan"
    - "The write jobs feeding the table (stream cadence, micro-batch size)"
  rollback: Not applicable — compaction is additive. Halt any concurrent OPTIMIZE that contends with the ingestion window.
  follow_up:
    - "Enable auto-compaction or schedule the maintenance job after ingestion"
    - "Reassess partition granularity (date vs hour/user)"
  gotchas:
    - "Compact after the ingestion window, never during it."
    - "ZORDER rewrites the whole table — only worth it on a real query predicate."
    - "Over-partitioning is often the root cause; coarsening the layout beats compacting harder."
  production_notes:
    - "Enable Delta auto-compaction or schedule Iceberg rewrite_data_files."
    - "Target 128-256 MB files and alert on file-count growth."
  diagram: |
    planning slow
       |
       |- avg file < 32 MB --> fragmentation --> compact to 128-256 MB
       |
       |- partition per hour/app --> over-partitioning --> coarsen the layout
  tradeoffs:
    - "pro: compaction fixes latency without consumer changes"
    - "con: compaction costs compute and needs a maintenance window"
  agent_skills: [skill-iceberg-maintenance, skill-delta-optimizer]
  agents: [agent-databricks-reviewer]
  version: 1.0.0
