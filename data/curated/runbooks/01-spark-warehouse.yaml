- id: runbook-missing-partition
  slug: missing-partition
  type: runbook
  title: "Missing partition"
  description: An expected date partition is absent, so a downstream report silently excludes a day.
  severity: high
  category: cat-batch-processing
  difficulty: intermediate
  tags: [partition, batch, data-completeness]
  symptoms:
    - A date partition is absent from the table
    - A downstream report silently excludes a day
    - Freshness check passes but completeness fails
  possible_causes:
    - Upstream produced no file for that date (source gap)
    - The job wrote to the wrong date due to timezone handling
    - A partially failed run left an empty or absent partition
  diagnosis:
    - List partitions for the range and diff against the calendar.
    - Check the job's logical date vs UTC vs local conversion.
    - Confirm whether the source actually had data.
  commands:
    - "aws s3 ls s3://bucket/table/ --recursive | grep 'dt=2026-09'"
    - "SELECT dt, count(*) FROM tbl GROUP BY dt ORDER BY dt DESC LIMIT 30;"
  fix:
    - Re-run the specific logical date once the source is confirmed.
    - Backfill the gap partition with the corrected timezone mapping.
  prevention:
    - A completeness check that asserts every expected partition exists.
    - Store the logical date explicitly as a partition column, not derived at read time.
  monitoring:
    - partition count per day, completeness assertions
  when_to_use:
    - "A date partition is absent and reports quietly exclude a day"
    - "Freshness checks pass while completeness fails"
  why: A missing partition is silent data loss in every downstream report, and the window to catch it cleanly shrinks every day.
  impact: Every downstream report silently excludes a day; decisions made on incomplete history look authoritative.
  escalation: Page the on-call if the partition feeds revenue or executive reporting; inform report consumers the same day either way.
  evidence_to_collect:
    - "Partition listing diffed against the expected calendar"
    - "The job run's logical date, UTC and local timestamps"
    - "Source-side proof the data existed (or didn't) for that date"
  rollback: "Not applicable — recover forward: re-run the logical date once the timezone mapping is confirmed; never delete-and-hope."
  follow_up:
    - "Add the completeness assertion: every expected partition exists"
    - "Store the logical date as a partition column, not read-time derived"
  gotchas:
    - "Confirm the source actually had data before backfilling — otherwise you bake the gap in."
    - "Timezones: job logical date vs UTC vs local — diff all three before re-running."
    - "An empty partition and an absent partition both read as 'no data' downstream."
  production_notes:
    - "Assert every expected partition exists (completeness check, not freshness)."
    - "Store the logical date as a partition column; never derive it at read time."
  diagram: |
    partition missing
       |
       |- source gap --> confirm upstream had data --> re-run the logical date
       |
       |- timezone mapping wrong --> fix mapping --> backfill corrected date
  tradeoffs:
    - "pro: partition-level completeness makes gaps unmissable"
    - "con: strict partition alerts can get noisy during backfill seasons"
