# Runbooks — Spark & warehouse performance
- id: runbook-spark-job-slow
  slug: spark-job-slow
  type: runbook
  title: "Spark job is slow"
  description: A batch Spark job's runtime has jumped — find whether it is skew, partition count, spill or over-scan.
  editorial:
    limitations:
      - The diagnosis steps assume Spark UI or event-log access; wall-clock time alone is not enough.
  severity: high
  category: cat-spark
  difficulty: advanced
  tags: [spark, performance, incident]
  symptoms:
    - Job duration rose sharply with no code change
    - One or a few tasks dominate the stage
    - Executors idle while a handful run long
  possible_causes:
    - Key skew on a join or group-by key
    - Too few partitions after a filter, or too many after a shuffle
    - Spill to disk from an oversized partition
    - Reading far more data than needed (missing partition filter)
  diagnosis:
    - Open the Spark UI stage view; compare p50 vs p99 task duration.
    - Skew if p99 >> p50 (10x+). Uniform slowness if p50 is high.
    - Check shuffle read/write bytes and spill (disk) bytes per task.
    - Check input bytes scanned vs table size.
  commands:
    - "spark-submit --conf spark.sql.adaptive.enabled=true ..."
    - "# inspect the event log: grep 'TaskSetManager' spark.log | tail"
    - "df.explain('formatted')  # confirm broadcast vs sort-merge join"
  fix:
    - Skew → enable AQE skew join; else salt the hot key and aggregate twice.
    - Spill → increase partition count or raise executor memory.
    - Over-scan → add the partition predicate; confirm with bytes scanned.
    - Never repartition(1); it serialises the stage.
  prevention:
    - Baseline shuffle/spill/scan metrics and fail CI on regression.
    - Add a partition filter lint on source reads.
  monitoring:
    - task duration p99/p50 ratio
    - shuffle read/write bytes per run
    - spill bytes per stage
  when_to_use:
    - A batch job's runtime jumped and no code changed
    - Stage tasks are wildly imbalanced in the Spark UI
    - Executors idle while a few tasks run long
  why: Slow jobs miss SLAs and burn executor-hours — attributing between skew, spill and over-scan is the difference between a 10-minute and a 10-hour incident.
  impact: Batch SLAs slip; downstream models and dashboards land late while executor-hours burn at full utilization.
  escalation: Page the on-call data engineer if the job sits on a golden-hour SLA; otherwise file it and let the owning team run diagnosis in hours.
  evidence_to_collect:
    - "Spark UI stage summary: p50/p99 task durations for the slow stages"
    - "Shuffle read/write and spill bytes per task"
    - "Input bytes scanned vs the expected partition size"
    - "The job's event log for the affected run"
  rollback: No code rollback — the job is unchanged. Revert only if a config change (AQE flags, executor sizing) preceded the regression.
  follow_up:
    - "Record the skew/spill/scan signature in the run's cost-per-run history"
    - "Add the partition-filter lint or CI metric guard that would have caught it"
  gotchas:
    - "repartition(1) serialises the stage — never reach for it to 'fix' slowness."
    - "p99 much greater than p50 means skew; uniformly high p50 means capacity. Salting helps the first, not the second."
    - "Spill shows up as slow tasks, not failures — check spill bytes before paying for bigger executors."
    - "AQE skew-join healing does not fix over-scan; check bytes scanned separately."
  production_notes:
    - "Baseline shuffle/spill/scan metrics so CI can fail a regression before users feel it."
    - "Keep AQE on, and confirm broadcast vs sort-merge plans with explain('formatted') before shipping."
    - "Lint source reads for a partition predicate — the default is forgetting it."
  diagram: |
    job slow
       |
       |- p99 >> p50 --> key skew --> AQE skew join, or salt the hot key --> re-run
       |
       |- spill bytes high --> oversized partitions --> more partitions / memory
       |
       |- input bytes >> expected --> over-scan --> restore partition filter
  tradeoffs:
    - "pro: AQE heals skew with no code change"
    - "con: salting doubles shuffle work on the hot key"
    - "con: bigger executors mask spill instead of fixing partitioning"
  agent_skills: [skill-spark-skew-diagnosis, skill-spark-cost-regression-guard]
  agents: [agent-spark-optimizer]
  version: 1.2.0
  license: CC-BY-4.0
