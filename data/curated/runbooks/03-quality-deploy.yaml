- id: runbook-backfill-required
  slug: backfill-required
  type: runbook
  title: "Backfill required"
  description: Historical output is wrong or missing and must be recomputed safely, without breaking production.
  severity: high
  category: cat-airflow
  difficulty: advanced
  tags: [backfill, orchestration, recovery]
  symptoms:
    - A past date range is wrong or missing
    - A logic fix requires historical recompute
    - A new column needs populating historically
  possible_causes:
    - A bug that only affected a date range
    - A late upstream correction
    - A new feature that must be applied retroactively
  diagnosis:
    - Define correctness: what should the values be, and how will you check?
    - Compute the downstream impact set from lineage.
    - Establish the idle window and the resource budget.
  commands:
    - "airflow dags backfill --start-date YYYY-MM-DD --end-date YYYY-MM-DD --reset-dagruns dag_id"
    - "-- prefer batched date ranges over one large range"
  fix:
    - Write to a shadow table, validate a sample, then swap.
    - Batch by date; validate a sample after each batch.
    - Never run a backfill concurrently with the daily production run.
  prevention:
    - Keep pipelines idempotent so a backfill is a routine operation.
    - A documented backfill runbook per pipeline.
  monitoring:
    - backfill progress, resource contention, validation pass rate
  agent_skills: [skill-backfill-planner]
  agents: [agent-backfill-planner]
  version: 1.1.0
  license: CC-BY-4.0
