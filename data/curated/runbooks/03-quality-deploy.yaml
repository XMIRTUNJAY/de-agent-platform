- id: runbook-data-contract-broken
  slug: data-contract-broken
  type: runbook
  title: "Data contract broken"
  description: A producer violated its contract and a consumer broke in production — bound the impact before fixing.
  severity: high
  category: cat-data-contracts
  difficulty: intermediate
  tags: [contract, sla, breaking-change]
  symptoms:
    - A consumer's pipeline fails after a producer deploy
    - A promised column or semantic changed
    - An SLA (freshness/completeness) is breached
  possible_causes:
    - Producer shipped a breaking change without the notice period
    - A "safe" rename that changed semantics
    - SLA breach from an unrelated upstream outage
  diagnosis:
    - Identify which contract clause broke (schema, semantics, or SLA).
    - Establish the impact set from lineage before anything else.
    - Determine if the fix is on the producer (revert) or consumer (adapt).
  commands:
    - "# impact set from lineage"
    - "SELECT * FROM lineage WHERE upstream = 'prod.orders' AND direction = 'downstream';"
  fix:
    - Schema breach → producer reverts or adds a compatibility shim.
    - SLA breach → negotiate a temporary relaxation and a root-cause fix.
  prevention:
    - Contracts with CI enforcement and a dated deprecation path.
    - Consumer-driven contract tests in the producer's pipeline.
  monitoring:
    - contract-violation events, SLA breach count per asset
  when_to_use:
    - "A consumer broke right after a producer deploy"
    - "A promised column or semantic changed, or an SLA was breached"
  why: A broken contract is a negotiation as much as a bug — bound the blast radius from lineage before deciding who reverts and who adapts.
  gotchas:
    - "A 'safe' rename that changed semantics is still a breach."
    - "SLA misses can come from unrelated outages — root-cause before pointing at the producer."
    - "Whatever the fix, the consumer impact set comes first, from lineage."
  production_notes:
    - "Contracts get CI enforcement and a dated deprecation path."
    - "Run consumer-driven contract tests in the producer's pipeline."
  diagram: |
    contract broken
       |
       |- schema breach --> producer reverts or adds a compatibility shim
       |
       |- semantic change --> agree semantics --> version the contract
       |
       |- SLA breach --> negotiate temporary relaxation --> root-cause fix
  tradeoffs:
    - "pro: consumer-driven tests catch breakage before deploy"
    - "con: contract overhead slows fast-moving producers"
  agent_skills: [skill-schema-change-contract-review, skill-lineage-explainer]
  agents: [agent-schema-reviewer, agent-data-catalog-assistant]
