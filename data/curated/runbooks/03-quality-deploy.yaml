- id: runbook-data-quality-failure
  slug: data-quality-failure
  type: runbook
  title: "Data quality failure"
  description: A quality expectation failed in production and bad data may be reaching consumers.
  severity: high
  category: cat-data-quality
  difficulty: intermediate
  tags: [data-quality, quarantine, tests]
  symptoms:
    - An expectation/test fails in production
    - A freshness or volume check alarms
    - Consumers report obviously wrong numbers
  possible_causes:
    - Genuine upstream data problem (source sent bad data)
    - A code change altered the distribution
    - A threshold that is too tight (false positive)
  diagnosis:
    - Read the failing expectation precisely: which column, which rule, what value.
    - Quantify: how many rows, and which ones (sample them).
    - Decide: block, quarantine, or pass-with-warning.
  commands:
    - "dbt test --select fct_orders  # see the failing test"
    - "SELECT * FROM fct_orders WHERE order_id IS NULL LIMIT 20;"
  fix:
    - Quarantine the failing rows, publish the clean set, keep the bad set for reprocessing.
    - If it is upstream, halt promotion and notify the producer.
    - If it is a false positive, loosen the threshold with evidence.
  prevention:
    - Tier the expectations: critical (block) vs warning (alert only).
    - A quarantine table so a bad batch never reaches consumers.
  monitoring:
    - expectation pass rate, quarantine row counts, freshness
  when_to_use:
    - "A quality expectation failed in production"
    - "A freshness or volume check alarmed, or consumers report wrong numbers"
  why: The decision on every failure is the same — block, quarantine or warn; getting it wrong ships bad data to consumers or pages people at 3am for nothing.
  gotchas:
    - "Loosening a threshold to silence an alarm is only right with evidence it was a false positive."
    - "Bad data that already reached consumers needs disclosure, not just a fix."
    - "Blocking on a warning-tier expectation turns small blips into outages."
  production_notes:
    - "Tier expectations: critical blocks, warnings alert."
    - "Keep a quarantine table so a bad batch never ships."
  diagram: |
    quality failure
       |
       |- upstream data --> quarantine rows --> publish clean set --> notify producer
       |
       |- code change --> fix + redeploy --> re-run affected range
       |
       |- false positive --> gather evidence --> loosen threshold
  tradeoffs:
    - "pro: quarantine-publish keeps consumers working during fixes"
    - "con: quarantined data needs an owner, or it becomes a landfill"
  agent_skills: [skill-spark-data-quality-review, skill-dbt-test-writer]
  agents: [agent-data-quality-reviewer]
  version: 1.2.0
