- id: runbook-pipeline-failed
  slug: pipeline-failed
  type: runbook
  title: "Pipeline failed"
  description: A task or DAG run has failed and downstream work is blocked — triage, classify and recover.
  severity: critical
  category: cat-production-operations
  difficulty: beginner
  tags: [incident, orchestration, failure]
  symptoms:
    - A task or DAG run is in a failed state
    - Downstream tasks are skipped/upstream_failed
    - An alert has fired
  possible_causes:
    - Transient (network, throttling) — retry is enough
    - Code/resource error — retry will not help
    - Data error (bad input) — needs a fix upstream or a quarantine
  diagnosis:
    - Read the task log and find the first real error, not the last.
    - Classify: transient, deterministic, or data.
    - Check whether a re-run is safe (idempotency).
  commands:
    - "airflow tasks test dag_id task_id 2026-09-27"
    - "-- read the task log via the UI or the log file path in the task instance"
  fix:
    - Transient → clear and retry the task.
    - Deterministic → fix the code, redeploy, re-run from the failed task.
    - Data → fix or quarantine the input, then re-run idempotently.
  prevention:
    - Idempotent tasks so a re-run is always safe.
    - Retries with backoff and a clear failure classification in the alert.
  monitoring:
    - task failure rate, DAG run duration, SLA misses
  when_to_use:
    - "A task or DAG run failed and downstream work is blocked"
    - "An alert fired and someone must decide retry vs fix now"
  why: The first minute of a pipeline incident decides its length — classify transient, deterministic or data before touching anything, or you re-run the wrong branch all morning.
  gotchas:
    - "Read the first real error in the log, not the last."
    - "Retrying a data error re-runs the same failure; fix or quarantine the input first."
    - "A re-run is only safe if the task is idempotent — check before clearing."
  production_notes:
    - "Make every task idempotent so a re-run is always safe."
    - "Retry with backoff, and put the failure class in the alert text."
  diagram: |
    pipeline failed
       |
       |- transient --> clear + retry
       |
       |- code --> fix --> redeploy --> re-run from failed task
       |
       |- data --> fix or quarantine input --> idempotent re-run
  tradeoffs:
    - "pro: idempotent tasks turn incidents into routine re-runs"
    - "con: idempotency costs an upsert/overwrite pattern on every write"
  agent_skills: [skill-airflow-dag-reviewer, skill-incident-postmortem-writer]
  agents: [agent-incident-assistant, agent-pipeline-reviewer]
