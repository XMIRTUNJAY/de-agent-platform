# Runbooks — quality, contracts, deployment
- id: runbook-schema-drift
  slug: schema-drift
  type: runbook
  title: "Schema drift"
  description: The upstream schema changed without notice and a cast broke or a column silently nulled.
  severity: high
  category: cat-data-contracts
  difficulty: intermediate
  tags: [schema-drift, contracts, ingestion]
  symptoms:
    - A column appears, disappears, or changes type upstream without notice
    - A pipeline fails on a cast, or silently nulls a column
    - Catalogue schema and file schema disagree
  possible_causes:
    - Producer changed the schema with no contract or notice
    - A new column was added dynamically by the source
    - Type widened upstream (int → decimal) and broke a cast
  diagnosis:
    - Diff the source schema against the last accepted contract version.
    - Classify the change: additive, type change, rename, removal.
    - Determine whether the failure is hard (job error) or silent (nulls).
  commands:
    - "diff <(parquet-tools schema old.parquet) <(parquet-tools schema new.parquet)"
    - "-- Glue/Athena: compare catalog columns to the Parquet footer"
  fix:
    - Additive change → evolve the schema forward (safe) and register it.
    - Type change → cast explicitly, or reject and quarantine.
    - Rename/removal → this is breaking; coordinate with consumers.
  prevention:
    - A schema contract with a compatibility policy enforced in CI.
    - Alert on any schema delta, even additive ones.
  monitoring:
    - schema-hash per source, drift events, quarantine counts
  agent_skills: [skill-schema-change-contract-review, skill-data-contract-author]
  agents: [agent-schema-reviewer]
  version: 1.2.0
