- id: runbook-bad-deployment
  slug: bad-deployment
  type: runbook
  title: "Bad deployment"
  description: A deploy broke production; correlate the signal with the change and roll back first.
  severity: critical
  category: cat-cicd
  difficulty: intermediate
  tags: [deployment, rollback, ci-cd]
  symptoms:
    - Errors or data changes began immediately after a deploy
    - A metric or quality check degraded right after promotion
    - A previous-good version is known
  possible_causes:
    - A logic regression shipped without a test catching it
    - A config/env change (e.g. timezone, cluster setting)
    - An incompatible schema or model change
  diagnosis:
    - Correlate the first failing signal with the deployment timestamp.
    - Identify the exact changed artifact and its blast radius.
    - Confirm the previous version is a valid rollback target.
  commands:
    - "git log --since='2 hours ago' --oneline"
    - "dbt ls --select state:modified+  # what changed in the last build"
  fix:
    - Roll back the artifact first, then diagnose at leisure.
    - If data was written, roll back the code and re-run the affected period.
  prevention:
    - Data-aware CI: tests run against a staged build, not production.
    - Deploy pipelines the way you deploy services: small, reversible, observable.
  monitoring:
    - deploy markers on dashboards, post-deploy quality gates
  when_to_use:
    - "Errors or data changes began right after a deploy"
    - "A quality check degraded right after promotion"
  why: Roll back first, diagnose at leisure — every extra hour of a bad model in production is wrong data shipped to consumers.
  gotchas:
    - "Roll back before you root-cause; a known-good target is worth more than the diagnosis."
    - "Config changes count: timezone or cluster settings produce invisible regressions."
    - "If bad data was written, rolling back code isn't enough — re-run the affected period."
  production_notes:
    - "Run tests against a staged build in CI, not production."
    - "Deploy pipelines like services: small diffs, reversible, observable."
  diagram: |
    bad deployment
       |
       |- first failing signal --> deploy timestamp --> exact changed artifact
       |
       |- previous-good exists --> rollback --> diagnose --> re-run affected period
  tradeoffs:
    - "pro: rollback restores consumers in minutes"
    - "con: rollback discards any good changes shipped in the same window"
