      The hit is a capability-matrix row in the README (operations the server can
      execute on request), not a live destructive statement. The capability is
      honestly disclosed; our marketplace security card already records that this
      server can modify data — review before granting write credentials.
    decided_by: "agent-judge (chat session; evidence: snowflake-labs/mcp HEAD, README.md line 515)"
    decided_at: 2026-10-19

  - id: "/mcp/snowflake::sql-truncate-delete-unbounded::README.md"
    verdict: benign-in-context
    scope: docs
    explanation: >-
      Same capability matrix as the DROP verdict — documentation of supported
      operations, not executable DML in the run path.
    decided_by: "agent-judge (chat session; evidence: snowflake-labs/mcp HEAD, README.md line 522)"
    decided_at: 2026-10-19
  - id: "/resources/opa-data-access-policy::secret-token-assign::docs/docs/deploy/azure/container-apps.mdx"
    verdict: benign-in-context
    scope: docs
    explanation: >-
      Same class as the EC2 deployment-doc verdicts: credential placeholders in
