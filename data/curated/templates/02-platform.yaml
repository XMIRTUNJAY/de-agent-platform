- id: tpl-data-contract
  slug: data-contract-template
  type: template
  title: Data Contract Template
  description: >-
    A contract skeleton (ownership, schema, semantics, SLA, compatibility policy)
    with the CI check that enforces it and a deprecation checklist.
  category: cat-data-contracts
  difficulty: intermediate
  tags: [template, data-contract, governance, ci]
  technologies: [tech-dbt]
  contents: [contract.yaml, schema.avsc, ci/check-compat.sh, DEPRECATION.md]
  repo_structure: |
    data-contract-template/
      contract.yaml        # owner, sla, semantics, policy
      schema.avsc          # typed schema
      ci/check-compat.sh   # compatibility gate
      DEPRECATION.md       # dated deprecation path
  installation: "amp template new de-agent/data-contract-template ./contracts"
  version: 1.2.0
  license: MIT
  author: de-agent
  source_url: https://github.com/de-agent/templates/tree/main/data-contract-template
  github_url: https://github.com/de-agent/templates
  verification: reviewed
  last_verified: 2026-09-23
  security: { runs_code: true, network_access: false, credentials: false, filesystem_access: true, external_apis: false }
