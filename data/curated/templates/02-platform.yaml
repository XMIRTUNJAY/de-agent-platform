# Templates — platform, infra, contracts
- id: tpl-terraform-aws-data
  slug: terraform-aws-data-platform
  type: template
  title: Terraform AWS Data Platform
  description: >-
    S3 buckets with lifecycle + encryption, Glue catalogue, IAM roles scoped to
    least privilege, and Athena workgroups with query limits.
  category: cat-aws
  difficulty: advanced
  tags: [template, terraform, aws, iac, security]
  technologies: [tech-terraform, tech-s3, tech-glue, tech-athena]
  contents: [main.tf, variables.tf, modules/s3, modules/glue, modules/iam, modules/athena]
  repo_structure: |
    terraform-aws-data-platform/
      modules/
        s3/       # versioning, SSE-KMS, lifecycle
        glue/     # catalog + crawlers
        iam/      # least-privilege roles
        athena/   # workgroup + bytes-scanned limit
      main.tf
      variables.tf
  installation: "amp template new de-agent/terraform-aws-data-platform ./infra"
  version: 1.1.0
  license: MIT
  author: de-agent
  source_url: https://github.com/de-agent/templates/tree/main/terraform-aws-data-platform
  github_url: https://github.com/de-agent/templates
  verification: reviewed
  last_verified: 2026-09-20
  security: { runs_code: true, network_access: true, credentials: true, filesystem_access: true, external_apis: true }
  relationships: { related_to: [project-s3-glue-athena, cat-infrastructure] }
