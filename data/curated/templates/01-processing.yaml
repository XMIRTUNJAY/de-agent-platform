# Templates — processing & transformation
- id: tpl-pyspark-project
  slug: pyspark-project
  type: template
  title: PySpark Project Template
  description: >-
    A testable PySpark project: src/transforms, tests with a local Spark session,
    a Dockerfile, and a Makefile that runs lint + tests offline.
  category: cat-spark
  difficulty: intermediate
  tags: [template, spark, pyspark, testing, docker]
  technologies: [tech-spark, tech-pyspark, tech-docker]
  contents: [pyproject.toml, src/transforms/, tests/, Dockerfile, Makefile, README.md]
  repo_structure: |
    pyspark-project/
      pyproject.toml
      Makefile
      Dockerfile
      src/
        transforms/
          orders_daily.py
        io/readers.py
      tests/
        data/            # 3-10 row fixtures
        test_orders_daily.py
  installation: "amp template new de-agent/pyspark-project ./my-pipeline"
  version: 1.2.0
  license: MIT
  author: de-agent
  source_url: https://github.com/de-agent/templates/tree/main/pyspark-project
  github_url: https://github.com/de-agent/templates
  verification: community
  last_verified: 2026-09-28
  security: { runs_code: true, network_access: false, credentials: false, filesystem_access: true, external_apis: false }
  relationships: { related_to: [skill-pipeline-test-author, project-api-s3-spark-parquet] }
