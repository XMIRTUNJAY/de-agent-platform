  relationships: { related_to: [cat-agentic] }
- id: tutorial-agentic-skill-anatomy
  slug: agentic-skill-anatomy
  type: tutorial
  title: Inside a skill — SKILL.md, references, examples, the loading protocol
  description: >-
    A skill is the unit of reusable agent behavior: one SKILL.md with
    front-matter, plus directories the agent loads on demand. Dissect a real
    registry skill file by file, learn the evaluation rubric its objectives
    set, then install it and compare the layout with your own draft.
  category: cat-agentic
  difficulty: intermediate
  tags: [tutorial, agentic, skills, skillmd, format]
  series: agentic
  series_title: The Agentic Series
  lesson: 3
  learning_objectives:
    - Describe the SKILL.md schema and the directory layout convention
    - Evaluate a skill's objectives before you trust it
    - Install a registry skill and inspect its files
  what_you_need:
    - An agent host that supports the Agent Skills format
    - A repeatable review you currently do by hand
    - Install: npx de-agent-platform add mcp-tool-contract-auditor
  steps:
    - text: A skill is a SKILL.md file with front-matter (name, description, version), plus references/, scripts/, and examples/ directories that an agent loads on demand.
      from_id: ref-agent-skills
      from_field: description
    - text: The specification covers the SKILL.md schema, the directory layout convention, and the agent loading protocol.
      from_id: ref-agent-skills
      from_field: description
    - text: The format is portable across compatible agents — it is what this platform's Skill object is modelled on.
      from_id: ref-agent-skills
      from_field: why
    - text: Read a real one — the mcp-tool-contract-auditor skill ships SKILL.md, references/blast-radius.md and examples/audit.md.
      from_id: skill-mcp-tool-contract-auditor
      from_field: files
    - text: Judge a skill by its objectives — read a tool schema and predict its side effects, classify tools by blast radius, write a least-privilege MCP configuration.
      from_id: skill-mcp-tool-contract-auditor
      from_field: learning_objectives
    - text: Install it and compare the layout with yours — npx de-agent-platform add mcp-tool-contract-auditor.
      from_id: skill-mcp-tool-contract-auditor
      from_field: install_command
  check_yourself:
    - You can say what belongs in SKILL.md front-matter versus the references/ directory.
    - The auditor's three objectives each name an observable behavior — read, classify, write — not a topic.
  when_to_use:
    - "Writing or reviewing your first SKILL.md"
    - "Deciding whether a registry skill is worth installing"
  why: A skill is a contract — front-matter and the loading protocol tell the agent when it loads, the directories tell it what to do — and the format is portable across compatible agents.
  gotchas:
    - "A skill loads on demand under the agent loading protocol — it is not always in context."
    - "references/, scripts/ and examples/ are convention directories from the layout spec — keep them if you want portable skills."
    - "A skill's objectives should be observable behaviors — read, classify, write — not topics."
  production_notes:
    - "Model your SKILL.md on a registry skill — mcp-tool-contract-auditor shows the SKILL.md + references + examples layout."
    - "Write to the spec, not to one agent — the format is portable across compatible agents."
  diagram: |
    skill anatomy
       |
       |- SKILL.md --> front-matter (name, description, version)
       |
       |- references/ --> deeper docs loaded on demand
       |
       |- scripts/ + examples/ --> runnable checks
       |
       |- loading protocol --> loaded on demand, portable across agents
  code:
    - title: A real skill's file layout
      lang: text
      code: |
        SKILL.md
        references/blast-radius.md
        examples/audit.md
      source_id: skill-mcp-tool-contract-auditor
    - title: The Agent Skills format
      lang: text
      code: |
        A SKILL.md file with front-matter (name, description, version), plus
        references/, scripts/, and examples/ directories that an agent loads
        on demand. Covers the SKILL.md schema, the directory layout convention,
        and the agent loading protocol.
      source_id: ref-agent-skills
    - title: Install the example skill
      lang: bash
      code: |
        npx de-agent-platform add mcp-tool-contract-auditor
      source_id: skill-mcp-tool-contract-auditor
  source_refs: [ref-agent-skills, skill-mcp-tool-contract-auditor]
