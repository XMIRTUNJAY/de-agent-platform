- id: tutorial-agentic-incident-rollback
  slug: agentic-incident-rollback
  type: tutorial
  title: When an agent does the wrong thing — contain, audit, postmortem
  description: >-
    An agent merged a change it should not have. Roll back first, use the
    scoping you configured to contain and reconstruct what happened — diffs,
    logs and approve-once records — walk the incident workflow, and close with
    a blameless postmortem whose action items name the missing gate.
  category: cat-agentic
  difficulty: advanced
  tags: [tutorial, agentic, incident, rollback, audit]
  series: agentic
  series_title: The Agentic Series
  lesson: 9
  learning_objectives:
    - Contain the damage before diagnosing — rollback first
    - Reconstruct what the agent did from the audit trail
    - Produce a blameless postmortem with dated, owned action items
  what_you_need:
    - The scoped, logged execute path your agent writes through
    - The repository the agent worked in
    - Install: npx de-agent-platform add incident-postmortem-writer
  steps:
    - text: "Roll back first — a deploy broke production: correlate the signal with the change and roll back before diagnosing."
      from_id: runbook-bad-deployment
      from_field: description
    - text: Containment was designed in — the git server can commit and create branches in the scoped repository, but cannot push unless credentials are also present in the environment.
      from_id: mcp-git
      from_field: security_notes
    - text: Reconstruct the change from the tools the agent had — git_status, git_diff_unstaged, git_diff_staged, git_log, git_commit.
      from_id: mcp-git
      from_field: tools
    - text: Pull the approval record — any write-class tool against a production target was suspended for an approve-once token scoped to the single call, so the log names the human who approved it.
      from_id: hook-prod-write-confirm
      from_field: implementation
    - text: Walk the incident workflow in order — establish impact and start time, check for a correlated deploy, walk the matching runbook, capture the timeline for the postmortem.
      from_id: agent-incident-assistant
      from_field: workflow
    - text: Keep the assistant's own guardrails on during response — it suggests, never executes, production changes, and escalates to a human before any destructive step.
      from_id: agent-incident-assistant
      from_field: guardrails
    - text: Close with the postmortem — timeline, impact, detection gap, contributing factors, and action items with owners and dates.
      from_id: skill-incident-postmortem-writer
      from_field: description
  check_yourself:
    - You can list every tool call the agent made — read-only tools leave diffs and logs, writes leave approve-once records.
    - The postmortem separates trigger from contributing factors, and every action item has an owner and a date.
  when_to_use:
    - "An agent merged, wrote or executed something it should not have"
    - "After any agent action a human did not explicitly approve"
  why: The scoping that bounded the blast radius — no push credentials, approve-once tokens, a logged execute path — is what makes the incident auditable and the rollback cheap.
  gotchas:
    - "Roll back first — correlate the signal with the change before diagnosing."
    - "The git server cannot push unless credentials are also present — if the agent pushed, a credential was in scope."
    - "Mitigation runs under the same guardrails — suggest, never execute, production changes."
  production_notes:
    - "Keep the approve-once token log with the postmortem — it is the audit record of who approved the write."
    - "Feed the detection gap back into the hooks — the postmortem's action items should name the gate that was missing."
  diagram: |
    agent incident
       |
       |- rollback first --> correlate signal with change
       |
       |- contain --> no push credentials --> wrong commit stays local
       |
       |- audit --> git log/diff + approve-once token log
       |
       |- respond --> impact -> correlated deploy -> runbook -> timeline
       |
       |- close --> blameless postmortem -> owned, dated action items
  code:
    - title: The rollback-first line
      lang: text
      code: |
        A deploy broke production; correlate the signal with the change and roll
        back first.
      source_id: runbook-bad-deployment
    - title: The approval record
      lang: text
      code: |
        Any write-class tool against a production target is suspended and surfaced
        for a human "approve once" token scoped to the single call.
      source_id: hook-prod-write-confirm
    - title: Postmortem structure
      lang: text
      code: |
        Timeline, impact, detection gap, contributing factors, and action items
        with owners and dates.
      source_id: skill-incident-postmortem-writer
  source_refs: [runbook-bad-deployment, mcp-git, hook-prod-write-confirm, agent-incident-assistant, skill-incident-postmortem-writer]
  version: 0.1.0
