- id: tutorial-agentic-hooks-gates
  slug: agentic-hooks-gates
  type: tutorial
  title: Hooks — deterministic gates around an agent
  description: >-
    The model can be talked into anything; a hook is code on the tool path.
    Walk the four safety hooks every data repo should know — destructive-SQL
    guard, prod write confirmation, secret scan, backfill safety check — and
    wire the two the starter plugin ships.
  category: cat-agentic
  difficulty: intermediate
  tags: [tutorial, agentic, hooks, guardrails, security]
  series: agentic
  series_title: The Agentic Series
  lesson: 5
  learning_objectives:
    - Explain where hooks run — on tool-call and pre-run events, outside the model
    - Match each safety hook to the failure it prevents
    - Wire the two starter hooks every agent repo should have
  what_you_need:
    - An agent host with hook support
    - A data repository and a non-production database target
    - The DE Data Toolkit plugin, which wires the destructive-SQL guard and the secret scanner
  steps:
    - text: A hook is a deterministic gate — the destructive SQL guard intercepts DROP / TRUNCATE / DELETE-without-WHERE before an agent executes it.
      from_id: hook-destructive-sql-guard
      from_field: description
    - text: Its policy — destructive statements are denied by default; a DELETE/UPDATE without a WHERE clause is always denied; non-production targets can be allowed with a --allow-destructive flag that requires a human confirmation token.
      from_id: hook-destructive-sql-guard
      from_field: implementation
    - text: Production writes get a human gate — any write-class tool against a production target, classified by connection string, project or catalogue tag, is suspended for an approve-once token scoped to the single call.
      from_id: hook-prod-write-confirm
      from_field: implementation
    - text: Secrets never reach the repo — staged diffs are scanned for high-confidence secret patterns (AWS keys, private key headers, connection strings with passwords, JWTs); entropy-based detection warns, pattern matches block the commit.
      from_id: hook-secret-scan-commit
      from_field: implementation
    - text: Gates also run before a job starts — the backfill safety check refuses to start a backfill that lacks a rollback path or overlaps the daily run.
      from_id: hook-backfill-safety-check
      from_field: description
    - text: The starter plugin wires two of them for you — hook-destructive-sql-guard and hook-secret-scan-commit.
      from_id: plugin-de-data-toolkit
      from_field: hooks
    - text: Encode the whole safety policy as hooks — destructive SQL guard, prod write confirmation — so it holds even when the agent is prompted otherwise.
      from_id: pattern-agent-in-the-loop-review
      from_field: solution
  check_yourself:
    - "A `DROP TABLE prod.orders` from the agent is denied and surfaced for confirmation — before any database call."
    - A write against prod.sales is suspended until a human issues an approve-once token scoped to that single call.
  when_to_use:
    - "Any agent that can call database, git or backfill tools"
    - "Encoding a safety policy that must not depend on the prompt"
  why: The model can be talked into anything — a hook is code on the tool path, so the policy holds even when the agent is prompted otherwise.
  gotchas:
    - "Destructive statements are denied by default — there is no flag that lets a DELETE/UPDATE without a WHERE through."
    - "Entropy-based secret detection warns; pattern matches block — a warning is not a pass."
    - "The guard's failure behavior is block — when it matches, the tool call does not proceed."
  production_notes:
    - "Keep hook-destructive-sql-guard and hook-secret-scan-commit active on every repo agents commit to."
    - "The approve-once token is scoped to the single call — no standing write approvals."
  diagram: |
    agent tool call
       |
       |- on-tool-call --> destructive SQL guard --> DROP/TRUNCATE/DELETE-no-WHERE --> block
       |
       |- write-class tool --> prod target --> suspend --> approve-once token
       |
       |- pre-commit --> secret scan --> pattern match --> block
       |
       |- pre-run --> backfill safety --> rollback path + no daily-run overlap
  code:
    - title: Destructive SQL guard — the policy
      lang: text
      code: |
        Matches the SQL string passed to a database/MCP tool. Destructive statements
        are denied by default; a DELETE/UPDATE without a WHERE clause is always denied.
        Statements on a non-production target can be allowed with a `--allow-destructive`
        flag that requires a human confirmation token.

        Failure behavior: block.
      source_id: hook-destructive-sql-guard
    - title: Prod write confirmation — approve once
      lang: text
      code: |
        Classify the tool target as production by connection string, project or
        catalogue tag. Any write-class tool against a production target is suspended
        and surfaced for a human "approve once" token scoped to the single call.
      source_id: hook-prod-write-confirm
    - title: Secret scan on commit
      lang: text
      code: |
        Scan staged diffs for high-confidence secret patterns (AWS keys, private key
        headers, connection strings with passwords, JWTs). Entropy-based detection runs
        as a warning; pattern matches block the commit.
      source_id: hook-secret-scan-commit
  source_refs: [hook-destructive-sql-guard, hook-prod-write-confirm, hook-secret-scan-commit, hook-backfill-safety-check, plugin-de-data-toolkit, pattern-agent-in-the-loop-review]
  version: 0.1.0
  license: CC-BY-4.0
