# The Agentic Series — new lessons that join the four existing agentic
# tutorials (12-agentic-de.yaml) into one ordered 10-lesson series for the
# agentic roadmap stage. Every step derives from the cited source field;
# structure is ours, wording is the source's.
- id: tutorial-agentic-mental-model
  slug: agentic-mental-model
  type: tutorial
  title: What makes an agent — model, tools, loop, guardrails
  description: >-
    Build the map before touching anything: an agent is a model that reasons,
    tools that act, a loop that iterates, and guardrails that bound it. Meet a
    real data-engineering agent from the registry, point at each of the four
    parts, and see where the guardrails come from — hooks and the human gate.
  category: cat-agentic
  difficulty: beginner
  tags: [tutorial, agentic, mental-model, agents, beginner]
  series: agentic
  series_title: The Agentic Series
  lesson: 1
  learning_objectives:
    - Name the four parts of an agent — model, tools, loop, guardrails
    - Identify each part in a real registry agent
    - Say where DE agents fit — review, triage and planning under guardrails
  what_you_need:
    - A registry agent to inspect — agent-sql-reviewer is the example throughout
    - The Agent Skills format reference
    - No installation — this lesson reads, it does not run
  steps:
    - text: Start from a concrete one — agent-sql-reviewer reviews SQL before it merges, catching correctness bugs and fan-out joins.
      from_id: agent-sql-reviewer
      from_field: description
    - text: Its tools are read_file and git_diff_unstaged — the file and diff access the task needs, nothing more.
      from_id: agent-sql-reviewer
      from_field: tools
    - text: The rules it applies live in a skill it loads — skill-sql-review.
      from_id: agent-sql-reviewer
      from_field: skills
    - text: A skill is a SKILL.md file with front-matter (name, description, version), plus references/, scripts/, and examples/ directories that an agent loads on demand.
      from_id: ref-agent-skills
      from_field: description
    - text: The loop is its workflow — read the diff and the file context, establish the grain of every result set, apply the review rules, emit findings.
      from_id: agent-sql-reviewer
      from_field: workflow
    - text: Guardrails bound it — read-only, never executes SQL, does not modify files without explicit approval.
      from_id: agent-sql-reviewer
      from_field: guardrails
    - text: Guardrails scale up to a pattern — separate read/recommend from write/execute, and keep a human in the loop for anything irreversible.
      from_id: pattern-agent-in-the-loop-review
      from_field: solution
  check_yourself:
    - Given agent-sql-reviewer, you can point at its tools, its skill, its workflow loop and its guardrails.
    - You can say which part of an agent would execute a DROP TABLE — and which parts are supposed to stop it.
  when_to_use:
    - "Before your first hands-on lesson"
    - "Deciding whether a task needs an agent at all"
  why: Every later lesson sharpens one of the four parts — tools, skills, hooks or the human gate — so name them once, here.
  gotchas:
    - "An agent is a loop, not a function — it keeps calling tools until the model decides it is done."
    - "A guardrails list is a promise; hooks are what enforce it."
    - "Read-only tools still reach real data — review what they can read."
  production_notes:
    - "Prefer agents whose tool list is the minimum the task needs."
    - "Encode the safety policy as hooks so it holds even when the agent is prompted otherwise."
  diagram: |
    agent anatomy
       |
       |- model --> reasons about the task
       |
       |- tools --> read_file, git_diff_unstaged --> act in scope
       |
       |- skills --> SKILL.md loaded on demand
       |
       |- loop --> read diff -> grain -> rules -> findings
       |
       |- guardrails --> read-only, no unapproved writes, human gate
  code:
    - title: One agent, four parts
      lang: text
      code: |
        tools:      read_file, git_diff_unstaged
        skills:     skill-sql-review
        workflow:   Read the diff and the file context. Establish the grain of
                    every result set. Apply the SQL review rules; stop at the
                    first fan-out. Emit findings with file:line and a rewritten clause.
        guardrails: Read-only: never executes SQL. Does not modify files
                    without explicit approval.
      source_id: agent-sql-reviewer
    - title: The skill format
      lang: text
      code: |
        A SKILL.md file with front-matter (name, description, version), plus
        references/, scripts/, and examples/ directories that an agent loads
        on demand.
      source_id: ref-agent-skills
  source_refs: [agent-sql-reviewer, ref-agent-skills, pattern-agent-in-the-loop-review]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
