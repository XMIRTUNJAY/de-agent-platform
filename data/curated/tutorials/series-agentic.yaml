- id: tutorial-agentic-capstone
  slug: agentic-capstone
  type: tutorial
  title: Capstone — the guarded agent checklist
  description: >-
    Run the whole series against one agent setup: skills that load on demand,
    tools scoped at the connection, least-privilege credentials, audited tool
    contracts, hooks that fail closed, and a human gate on anything
    irreversible. Prove each box with an attempted violation, not a promise.
  category: cat-agentic
  difficulty: advanced
  tags: [tutorial, agentic, capstone, checklist, production]
  series: agentic
  series_title: The Agentic Series
  lesson: 10
  learning_objectives:
    - Run the series checklist against a complete agent setup
    - Prove each guard with an attempted violation, not a promise
    - Know which artifacts to keep — config, classification table, approval log
  what_you_need:
    - The agent setup from lessons 2 through 9
    - A non-production database and repository
    - The DE Data Toolkit plugin and the contract-auditor skill installed
  steps:
    - text: Skills in place — SKILL.md with front-matter (name, description, version), plus references/, scripts/, and examples/ directories that the agent loads on demand.
      from_id: ref-agent-skills
      from_field: description
    - text: Tools scoped at the connection — the filesystem server grants read/write within the directories you pass as arguments, so scope it to a single working directory and never pass a home directory or a mount containing secrets.
      from_id: mcp-filesystem
      from_field: security_notes
    - text: Credentials least-privilege — a fine-grained GitHub token limited to the target repositories, read-only unless the task must open PRs; never org-wide admin.
      from_id: mcp-github
      from_field: security_notes
    - text: Contracts audited — tools that can write, delete, spend money or exfiltrate data flagged, and a least-privilege connection recommendation produced.
      from_id: skill-mcp-tool-contract-auditor
      from_field: description
    - text: Hooks active — destructive statements are denied by default, and a DELETE/UPDATE without a WHERE clause is always denied.
      from_id: hook-destructive-sql-guard
      from_field: implementation
    - text: Secrets gated — staged diffs scanned for high-confidence secret patterns; pattern matches block the commit.
      from_id: hook-secret-scan-commit
      from_field: implementation
    - text: The pattern underneath — separate read/recommend from write/execute, execute scoped and logged, and keep a human in the loop for anything irreversible.
      from_id: pattern-agent-in-the-loop-review
      from_field: solution
  check_yourself:
    - A write against a production target is suspended pending an approve-once token scoped to the single call.
    - A staged connection string with a password is blocked at commit; a DROP TABLE is denied before any database call.
    - The agent's permissions read like the review agent's — filesystem read-write, network none, credentials none.
  when_to_use:
    - "Before calling any agent setup production-ready"
    - "Periodically re-auditing an agent that already runs"
  why: A guarded agent is a checked list — skills that load on demand, scoped tools and tokens, audited contracts, hooks that fail closed, and a human gate on anything irreversible.
  gotchas:
    - "Prove each guard with an attempted violation — a promise in config is not a hook firing."
    - "Destructive statements are denied by default — if yours went through, the hook was not on the tool path."
    - "Blast radius can be production — re-check scope after every new tool or credential."
  production_notes:
    - "Keep the tools-by-class table, the connection configs and the approve-once log together as the agent's audit pack."
    - "The starter plugin is the baseline — SQL/Spark review skills, the destructive-SQL guard, a secret scanner and the file/git MCP servers, wired together."
  diagram: |
    guarded agent checklist
       |
       |- skills --> SKILL.md + references + examples, loaded on demand
       |
       |- tools --> one dir, one repo, one scoped token
       |
       |- contracts --> Read/Write/Destructive/Spend/Exfiltrate classified
       |
       |- hooks --> destructive denied, prod writes approve-once, secrets blocked
       |
       |- pattern --> read/recommend vs write/execute --> human gate
  code:
    - title: The skills contract
      lang: text
      code: |
        A SKILL.md file with front-matter (name, description, version), plus
        references/, scripts/, and examples/ directories that an agent loads
        on demand.
      source_id: ref-agent-skills
    - title: The execute path
      lang: text
      code: |
        read ─▶ recommend ─▶ human approves ─▶ execute (scoped, logged)
      source_id: pattern-agent-in-the-loop-review
    - title: The deny-by-default hook
      lang: text
      code: |
        Destructive statements are denied by default; a DELETE/UPDATE without a
        WHERE clause is always denied. Failure behavior: block.
      source_id: hook-destructive-sql-guard
  source_refs: [ref-agent-skills, mcp-filesystem, mcp-github, skill-mcp-tool-contract-auditor, hook-destructive-sql-guard, hook-secret-scan-commit, pattern-agent-in-the-loop-review]
