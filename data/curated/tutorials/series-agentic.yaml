- id: tutorial-agentic-prod-gotchas
  slug: agentic-prod-gotchas
  type: tutorial
  title: Production gotchas — untrusted content, destructive actions, permission scope
  description: >-
    An agent executes with your credentials, so its context and config are an
    attack surface. Read the MCP security model, treat fetched content as
    untrusted input, keep destructive statements deny-by-default, and scope
    every credential to the role and repositories the task needs.
  category: cat-agentic
  difficulty: advanced
  tags: [tutorial, agentic, security, least-privilege, prompt-injection]
  series: agentic
  series_title: The Agentic Series
  lesson: 8
  learning_objectives:
    - Treat fetched content as untrusted model input and scope its network path
    - Bound destructive actions with deny-by-default hooks
    - Scope every credential to the role and repositories the task needs
  what_you_need:
    - The MCP specification's security section
    - The tool list and schemas of every server you connect
    - A non-production database role with SELECT only
  steps:
    - text: Read the MCP specification's security section before connecting any MCP server to real data — it is the definitive reference for transports (stdio, SSE, HTTP), tool definitions, resource templates, prompts, and the security model.
      from_id: ref-mcp-spec
      from_field: description
    - text: Anything fetched becomes model context — the fetch tool retrieves a URL and converts it to markdown for the model.
      from_id: mcp-fetch
      from_field: description
    - text: And fetch is network egress to arbitrary URLs — it can reach internal endpoints (SSRF risk), so in a corporate environment route it through an allowlisting proxy.
      from_id: mcp-fetch
      from_field: security_notes
    - text: Destructive actions are denied by default — intercept DROP / TRUNCATE / DELETE-without-WHERE before the agent executes it.
      from_id: hook-destructive-sql-guard
      from_field: description
    - text: "Scope warehouse credentials — the reference SQL server issues raw SQL: connect with a role that only has SELECT on the schemas intended, prefer a replica, and do not point it at production with a superuser."
      from_id: mcp-postgres
      from_field: security_notes
    - text: Scope repository credentials — use a fine-grained GitHub token limited to the target repositories, read-only unless the task must open PRs; never grant org-wide admin.
      from_id: mcp-github
      from_field: security_notes
    - text: Audit the contracts before connecting — flag tools that can write, delete, spend money or exfiltrate data, and produce a least-privilege connection recommendation.
      from_id: skill-mcp-tool-contract-auditor
      from_field: description
  check_yourself:
    - Every MCP server connected has had its tools classified — none can write, delete, spend or exfiltrate beyond what the task needs.
    - The database role has SELECT only, the GitHub token is fine-grained and read-only, and fetch runs behind an allowlist.
  when_to_use:
    - "Before an agent touches production data or credentials"
    - "Reviewing an agent setup that someone else configured"
  why: An agent executes with your credentials — untrusted content in its context and unscoped tools in its config turn one bad task into an incident.
  gotchas:
    - "Network egress to arbitrary URLs can reach internal endpoints — SSRF risk; allowlist the proxy."
    - "Never point a raw-SQL server at production with a superuser — SELECT-only role, prefer a replica."
    - "Never grant org-wide admin on the GitHub token — scope it to the target repositories."
  production_notes:
    - "Treat MCP registry entries as discovery, never as a trust signal."
    - "Classify every tool — write, delete, spend or exfiltrate — before the first connection, and keep the table with the config."
  diagram: |
    production agent
       |
       |- fetched page --> untrusted model context --> allowlisted egress only
       |
       |- SQL tools --> SELECT-only role, replica --> never prod superuser
       |
       |- repo tools --> fine-grained read-only token
       |
       |- destructive SQL --> denied by default
       |
       |- spend/exfiltrate tools --> classified before connect
  code:
    - title: Before connecting any server
      lang: text
      code: |
        The security section of the MCP specification is required reading before
        connecting any MCP server to real data: transports (stdio, SSE, HTTP),
        tool definitions, resource templates, prompts, and the security model.
      source_id: ref-mcp-spec
    - title: SQL server credential scope
      lang: text
      code: |
        The reference server issues raw SQL. Connect with a role that only has
        SELECT on the schemas intended, and prefer a replica. Do not point it at
        production with a superuser.
      source_id: mcp-postgres
    - title: GitHub token scope
      lang: text
      code: |
        Requires a GitHub token. Use a fine-grained token limited to the target
        repositories and read-only unless the task must open PRs. Never grant
        org-wide admin.
      source_id: mcp-github
  source_refs: [ref-mcp-spec, mcp-fetch, hook-destructive-sql-guard, mcp-postgres, mcp-github, skill-mcp-tool-contract-auditor]
  version: 0.1.0
