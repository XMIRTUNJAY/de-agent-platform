- id: tutorial-system-design-resilience-patterns
  slug: system-design-resilience-patterns
  type: tutorial
  title: >-
    Design resilient pipelines — retry, circuit breaker, bulkhead
  description: >-
    Failures are inputs, not exceptions. Microsoft's pattern catalogue gives each
    failure shape a name and a solution — retry, circuit breaker, compensating
    transaction, bulkhead — and each pattern page carries the considerations that
    decide when it backfires. This lesson fits them to pipeline components.
  category: cat-system-design
  series: system-design
  series_title: The System Design Series
  lesson: 6
  difficulty: intermediate
  tags: [tutorial, system-design, resilience, patterns, reliability]
  learning_objectives:
    - Match each pipeline failure shape to its named pattern and its considerations
    - Cap retries with backoff and know when a circuit breaker replaces them
    - Use bulkheads and compensating transactions to bound blast radius
  what_you_need:
    - Lesson 5's SLO (patterns exist to defend the budget)
    - One component that fails messily today
  steps:
    - text: Take the catalogue as-is — Microsoft's cloud design patterns include retry, circuit breaker, compensating transaction, CQRS, event sourcing, and bulkhead, each with problem, solution, and considerations, and the collection is vendor-neutral in practice.
      from_id: ref-cloud-design-patterns
      from_field: summary
    - text: Adopt the format, not just the patterns — each pattern page states the problem/solution pair formally, the format this stage's design exercises expect, so write your pipeline's failure modes in that same pair form.
      from_id: ref-cloud-design-patterns
      from_field: why
    - text: Fit patterns to pipeline components — the catalogue is described as directly applicable to pipeline component design, so retry belongs on the extract, the breaker on the load, and the bulkhead between tenants.
      from_id: ref-cloud-design-patterns
      from_field: description
    - text: Give each pattern a budget to defend — Google's SRE vocabulary supplies the error budgets and incident management that decide when retries are safe and when they are a storm, and patterns without budgets multiply load exactly when the system is weakest.
      from_id: ref-sre-google
      from_field: summary
    - text: Mind the consistency of repeated work — DDIA's consistency chapter is the reason an idempotent retry is safe and a non-idempotent one is not, so pair every retry with the transaction semantics that make replaying it harmless.
      from_id: ref-ddia
      from_field: summary
  check_yourself:
    - Every external call in your pipeline has a named failure policy — retry with capped attempts and backoff, breaker, or fail-fast to a DLQ.
    - You can say which pattern protects which SLO, and what the pattern's own considerations page warns about.
  when_to_use:
    - "A component fails messily and the fix needs a name before a patch"
    - "A pipeline review lists failure modes and each needs a bounded response"
  why: Named patterns turn failure handling from scattered try/except blocks into a reviewable design.
  gotchas:
    - "Retries without backoff and a cap are a self-inflicted outage — the retry storm is a pattern too."
    - "A circuit breaker that trips silently hides a dead dependency — alert on state, not just errors."
    - "Bulkheads partition failure, not capacity — they bound blast radius, they do not add throughput."
  production_notes:
    - "Write the failure policy into the component's interface — callers deserve to know what happens on failure."
    - "Review breaker trip counts in the weekly ops review; frequent trips mean a capacity or design problem."
  diagram: |
    resilience patterns on a pipeline
       |
       |- extract --> flaky API    --> Retry (backoff + cap)
       |- load    --> sinking DW   --> Circuit breaker (stop hammering)
       |- tenants --> noisy neighbor--> Bulkhead (separate pools)
       |- multi-step load --> partial failure --> Compensating transaction
       |
       |- every pattern defends a budget (SLO from lesson 5)
        --> failure is an input; the pattern is the interface
  code:
    - title: Pattern decision table
      lang: text
      code: |
        Failure shape             -> pattern                  -> pipeline application
        transient downstream err  -> Retry                    -> re-poll API; backoff + cap
        cascading overload        -> Circuit breaker          -> stop hammering a sinking DW
        blast radius per tenant   -> Bulkhead                 -> separate pools per domain
        partial multi-step load   -> Compensating transaction -> undo a half-applied load
        read/write shape mismatch -> CQRS                     -> serving table vs ingest
        rebuildable state         -> Event sourcing           -> replay log to reconstruct
      source_id: ref-cloud-design-patterns
