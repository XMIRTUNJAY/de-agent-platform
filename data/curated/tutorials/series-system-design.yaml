- id: tutorial-system-design-scaling-vocabulary
  slug: system-design-scaling-vocabulary
  type: tutorial
  title: >-
    Speak the scaling vocabulary — load balancing, caching, sharding
  description: >-
    Scale arguments go wrong when the words do: horizontal versus vertical,
    cache-aside versus write-through, shard by range versus hash. This lesson
    fixes the Primer's vocabulary and lines it up with DDIA's partitioning and
    replication so one argument covers both worlds.
  category: cat-system-design
  series: system-design
  series_title: The System Design Series
  lesson: 4
  difficulty: intermediate
  tags: [tutorial, system-design, scalability, caching, sharding]
  learning_objectives:
    - Use load balancer, cache, and shard vocabulary precisely in design arguments
    - Translate between the Primer's scaling terms and DDIA's partitioning/replication
    - Pick the first scaling lever for a bottleneck instead of reaching for all of them
  what_you_need:
    - Lesson 2's estimates (scaling needs numbers to bite on)
    - One real bottleneck to reason about
  steps:
    - text: Learn the three levers in one place — the Primer's scaling vocabulary is load balancers, caching, and sharding, taught together so their interactions are visible from day one.
      from_id: ref-system-design-primer
      from_field: summary
    - text: Use the standard on-ramp — the Primer is the standard on-ramp for the estimation and tradeoff vocabulary this stage's interview path needs, so its terms are the ones interviewers and reviewers will expect you to use.
      from_id: ref-system-design-primer
      from_field: why
    - text: Translate to the canonical mechanisms — DDIA teaches the same ideas as replication and partitioning, so sharding is partitioning, and load balancing plus caching sit on top of replicated copies.
      from_id: ref-ddia
      from_field: summary
    - text: Anchor the translation in production terms — the description maps partitioning to lakehouse, so your sharding argument is really a partition-layout argument about the tables you already curate.
      from_id: ref-ddia
      from_field: description
    - text: Check scaling choices against deployed guidance — AWS's best-practice guidance (Well-Architected pillars) shows which levers ship together in real architectures, and at what cost to cost and operability.
      from_id: ref-aws-arch-center
      from_field: summary
  check_yourself:
    - You can name which lever you would pull FIRST for a read-bound serving path, and why cache precedes shard in that order.
    - Asked to shard a lakehouse table, you answer with a partition key and skew story, not with the word sharding alone.
  when_to_use:
    - "A bottleneck review needs the lever named before the budget is spent"
    - "A scaling proposal mixes terms and the team needs one vocabulary"
  why: Scaling debates are won by whoever names the lever and its cost first — vocabulary is the lever.
  gotchas:
    - "Adding replicas scales reads, not writes — replication and partitioning answer different overload shapes."
    - "A cache without an invalidation story is a correctness bug with a latency bonus."
    - "Hash partitioning kills range scans; range partitioning creates hot keys — pick per access pattern."
  production_notes:
    - "Record the chosen scaling lever and its expected headroom in the design doc."
    - "Watch partition skew after every key change — hot keys masquerade as capacity problems."
  diagram: |
    scaling vocabulary
       |
       |- too slow reads   --> 1) cache  2) load-balance replicas
       |- too much data    --> shard / partition (by hash or range)
       |- too many writers --> partition first; replicas do not help writes
       |
       |- primer words:  load balancer | cache | shard
       |- ddia words:    replication   |       | partitioning
       |
        --> name the lever, its cost, and its skew story
  code:
    - title: Lever selection order
      lang: text
      code: |
        Bottleneck            -> first lever          -> canonical mechanism
        read-heavy serving    -> cache, then LB       -> replication
        write throughput      -> partition the writes -> partitioning
        dataset > one node    -> shard by access key  -> partitioning
        spiky traffic         -> LB + autoscale       -> replication
        Rule: one lever at a time; measure before adding the second.
      source_id: ref-system-design-primer
  source_refs: [ref-system-design-primer, ref-ddia, ref-aws-arch-center]
  version: 0.1.0
