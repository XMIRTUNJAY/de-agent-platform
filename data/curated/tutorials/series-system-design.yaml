# The System Design Series — lessons authored for the 13x10 series; structure ours, wording the source's.
# Stage pool is intentionally small (5 references, all cat-system-design): sources are reused at
# field level across lessons; every step cites a real registry resource with an existing from_field.
- id: tutorial-system-design-mental-model
  slug: system-design-mental-model
  type: tutorial
  title: >-
    Hold the system design mental model — data systems as tradeoffs
  description: >-
    Before any diagram, data systems are tradeoffs, not products. This lesson fixes
    the vocabulary — reliability, scalability, maintainability, and the six canonical
    mechanisms behind them — and shows how the canonical chapters map onto systems
    you already run, so every later lesson in the series has a place to land.
  category: cat-system-design
  series: system-design
  series_title: The System Design Series
  lesson: 1
  difficulty: beginner
  tags: [tutorial, system-design, ddia, fundamentals, architecture]
  learning_objectives:
    - Frame any data system as a tradeoff among reliability, scalability, and maintainability
    - Name the six mechanisms DDIA teaches and map each one to a system you operate
    - Argue a design decision in tradeoff language instead of tool-brand language
  what_you_need:
    - No cluster or account required — this is a concepts lesson
    - The DDIA table of contents open beside you
  steps:
    - text: Start from the canonical scope — DDIA's subject is the principles behind data systems, namely reliability, scalability, replication, partitioning, consistency, and batch/stream processing. Those six words are the axes every decision in this series moves along.
      from_id: ref-ddia
      from_field: summary
    - text: Treat data platform architecture as a special case — the Primer states that data platform architectures are a special case of the same throughput/consistency tradeoffs it teaches, so this vocabulary is not a detour from your day job.
      from_id: ref-system-design-primer
      from_field: summary
    - text: Know why this book anchors the series — it is called the single highest-value read for system-design interviews and for understanding why the tools are shaped as they are. Vocabulary outlasts tool versions.
      from_id: ref-ddia
      from_field: why
    - text: Ground each chapter in something you run — the description maps replication to CDC, partitioning to lakehouse, and consistency to transaction semantics, so every abstract chapter has a production counterpart you can point at.
      from_id: ref-ddia
      from_field: description
    - text: Accept the format — DDIA is a book, not a CLI, and that is deliberate. The payoff here is durable vocabulary rather than installable commands, which is why this stage's lessons carry no install step.
      from_id: ref-ddia
      from_field: kind
  check_yourself:
    - Asked to design a pipeline, you open with the three concerns — reliability, scalability, maintainability — before naming any product.
    - You can say which DDIA mechanism (replication, partitioning, consistency) each of your production systems exercises.
  when_to_use:
    - "You are new to system design and need the vocabulary before drawing a single box"
    - "A tool debate needs to be reframed as a tradeoff the team can actually resolve"
  why: Every design argument collapses into the same three tradeoffs — hold the model before holding the tools.
  gotchas:
    - "Naming products instead of tradeoffs is the tell of an unprepared designer — the mechanisms come first."
    - "The six words are axes, not checklists — real designs move along several at once."
    - "A special case is not a different subject — data platforms reuse the same tradeoffs as any other system."
  production_notes:
    - "Review a live pipeline against the six axes once a quarter — assumptions rot silently."
    - "When a new tool enters the stack, state which axis it moves and which it costs."
  diagram: |
    system design mental model
       |
       |- reliability --> the system keeps working when parts fail
       |- scalability  --> the system handles growth in load
       |- maintainability --> the system can be changed without dread
       |
       |- mechanisms (DDIA): replication | partitioning | consistency | batch/stream
       |
       |- replication --> CDC        |- partitioning --> lakehouse
       |- consistency --> tx semantics
       |
        --> every decision = a move along one axis, paid for on another
  code:
    - title: The three concerns in one view
      lang: text
      code: |
        RELIABILITY       SCALABILITY        MAINTAINABILITY
        keeps working     handles growth     stays changeable
             \                  |                  /
              \                 |                 /
               +---- every design moves along these, and pays -----+
      source_id: ref-ddia
    - title: The chapter-to-production map
      lang: text
      code: |
        DDIA chapter    ->  system you already run
        replication     ->  CDC pipelines
        partitioning    ->  lakehouse tables
        consistency     ->  transaction semantics of your MERGE
        batch/stream    ->  your orchestrator and your stream jobs
      source_id: ref-ddia
  source_refs: [ref-ddia, ref-system-design-primer]
