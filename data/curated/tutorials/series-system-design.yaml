- id: tutorial-system-design-reference-architectures
  slug: system-design-reference-architectures
  type: tutorial
  title: >-
    Read reference architectures like an engineer — AWS as precedent
  description: >-
    Reference architectures are precedent, not homework. This lesson teaches a
    reading method: name the moving parts, find the pillar each choice defends,
    spot the serverless data lake pattern, and re-state the diagram in DDIA
    vocabulary so vendor drawings become reusable design evidence.
  category: cat-system-design
  series: system-design
  series_title: The System Design Series
  lesson: 7
  difficulty: intermediate
  tags: [tutorial, system-design, aws, architecture, reference]
  learning_objectives:
    - Decompose a reference architecture into ingest, store, process, and serve
    - Connect each architectural choice to a Well-Architected pillar
    - Re-state a vendor diagram in mechanism vocabulary to test real understanding
  what_you_need:
    - Lessons 1–4 vocabulary (mechanisms, estimation, scaling levers)
    - One AWS reference architecture open in a browser
  steps:
    - text: Pick from the right shelf — AWS's Architecture Center is an official collection of architecture diagrams, reference architectures, and best-practice guidance, including Well-Architected pillars and serverless data lake patterns, which makes it a map of what actually ships.
      from_id: ref-aws-arch-center
      from_field: summary
    - text: Read architectures as evidence — reference architectures are the closest thing to citable evidence when an answer needs a real-world precedent, so treat each diagram as a witness, not a template to copy blind.
      from_id: ref-aws-arch-center
      from_field: why
    - text: Interrogate the drawing — the collection exists to ground sizing and tradeoff arguments in real deployed patterns, so ask what each box implies for cost, failure, and ops, and what the diagram leaves out.
      from_id: ref-aws-arch-center
      from_field: description
    - text: Cross-read the pattern names — Microsoft's catalogue (retry, circuit breaker, CQRS, event sourcing, bulkhead) names the forces a diagram only implies, so a serverless data lake pattern reads differently once the resilience patterns label its joints.
      from_id: ref-cloud-design-patterns
      from_field: summary
    - text: Translate back to mechanisms — restate the diagram in DDIA vocabulary (where is replication, where is partitioning, what consistency does the merge assume) and you have proven understanding, not recognition.
      from_id: ref-ddia
      from_field: summary
  check_yourself:
    - Given any architecture diagram, you can name the moving parts and the pillar each choice defends in under five minutes.
    - You can point at one deployed reference architecture that resembles your own platform — and say where yours deliberately differs.
  when_to_use:
    - "A design needs precedent before a budget or architecture review"
    - "A vendor proposal should be checked against what actually ships"
  why: Precedent turns an argument from taste into evidence — someone already runs this shape in production.
  gotchas:
    - "Diagrams show the happy path — failure, retries, backfills, and cost are off-canvas by default."
    - "A reference architecture is a starting point, not a destination — it encodes the vendor's default tradeoffs."
    - "Recognizing a diagram is not understanding it — the translation test into mechanism vocabulary is the check."
  production_notes:
    - "Keep a 'precedent' section in each design doc with a link to the closest shipped architecture."
    - "Re-check precedents yearly — vendor defaults move faster than your diagrams."
  diagram: |
    reading a reference architecture
       |
       |- 1. name the parts --> ingest | store | process | serve | govern
       |- 2. find the pillar --> which Well-Architected pillar defends each box
       |- 3. spot the shape --> serverless data lake pattern, where ops cost goes
       |- 4. name the joints --> retry? breaker? bulkhead? (pattern catalogue)
       |- 5. translate       --> replication? partitioning? consistency? (DDIA)
       |
        --> the diagram is now evidence you can cite, not a picture you admired
  code:
    - title: Architecture reading checklist
      lang: text
      code: |
        Reading a reference architecture like an engineer:
        1. Name the moving parts (ingest, store, process, serve, govern).
        2. Find the pillar each choice defends (cost, reliability, security...).
        3. Locate the serverless data lake pattern — where does it cut ops cost?
        4. Ask what the diagram does NOT show: failure, retries, backfills, cost.
        5. Re-state it in DDIA vocabulary (replication? partitioning? consistency?).
      source_id: ref-aws-arch-center
  source_refs: [ref-aws-arch-center, ref-cloud-design-patterns, ref-ddia]
