- id: tutorial-system-design-storage-engines
  slug: system-design-storage-engines
  type: tutorial
  title: >-
    Choose storage engines on tradeoffs — reads, writes, and consistency
  description: >-
    Storage choice is where a design's promises become real: the engine you pick
    decides what replication buys, what partitioning costs, and which consistency
    semantics your merges get. This lesson builds a decision habit around the
    DDIA mechanisms instead of brand loyalty.
  category: cat-system-design
  series: system-design
  series_title: The System Design Series
  lesson: 3
  difficulty: intermediate
  tags: [tutorial, system-design, storage, consistency, databases]
  learning_objectives:
    - Argue a storage choice from replication, partitioning, and consistency needs
    - Explain what each consistency semantic means for a merge-based pipeline
    - Recognize read/write shape patterns (CQRS, event sourcing) in vendor storage
  what_you_need:
    - Lesson 1's six-axis vocabulary
    - One storage decision currently on your plate
  steps:
    - text: Re-anchor on the mechanisms — DDIA's core chapters are replication, partitioning, and consistency, and a storage engine is best understood as one particular bundle of answers to those three questions.
      from_id: ref-ddia
      from_field: summary
    - text: Ask the shaping question — the book's stated payoff is understanding why data tools are shaped as they are, so when a warehouse refuses a use case, ask which mechanism answer it encodes rather than blaming the vendor.
      from_id: ref-ddia
      from_field: why
    - text: Make consistency concrete — the description maps consistency to transaction semantics, which in practice means asking what your MERGE does under concurrent writers before the engine is chosen, not after the first lost update.
      from_id: ref-ddia
      from_field: description
    - text: Recognize shape patterns in the catalogue — Microsoft's design patterns include CQRS and event sourcing, each a read/write shape decision, so you can name what a serving-table split or a rebuildable log is buying you.
      from_id: ref-cloud-design-patterns
      from_field: summary
    - text: Check the choice against deployed guidance — AWS's architecture collection (Well-Architected pillars, data lake patterns) shows which storage bundles ship together, turning your tradeoff argument into precedent.
      from_id: ref-aws-arch-center
      from_field: summary
  check_yourself:
    - For any table you own, you can state the partitioning scheme, the replication story, and the consistency semantics your MERGE relies on.
    - Asked why a lakehouse over a row store, your answer names write shape, scan shape, and time-travel semantics — not brand names.
  when_to_use:
    - "A new table or pipeline needs a home and the default is being questioned"
    - "A storage migration is proposed and the real cost drivers need naming"
  why: The engine is where tradeoffs become irreversible — choose it by mechanism, not by familiarity.
  gotchas:
    - "Consistency semantics chosen late are chosen wrong — concurrent-writer behavior belongs in the storage decision."
    - "Every engine bundles all three mechanisms — you never get one answer without paying for the other two."
    - "CQRS and event sourcing solve read/write shape, not scale — do not reach for them as capacity fixes."
  production_notes:
    - "Write the consistency expectation into the table's README — merges depend on it silently."
    - "Revisit the storage bundle when the dominant access pattern changes shape."
  diagram: |
    storage engine decision
       |
       |- write shape  --> append? upsert? log?
       |- read shape   --> scans? point lookups? serving tables?
       |- consistency  --> what must a concurrent MERGE see?
       |
       |- mechanisms: replication | partitioning | consistency
       |- shape patterns (CQRS, event sourcing) name the read/write split
       |
        --> choice grounded in a reference architecture that ships the same bundle
  code:
    - title: Storage decision record
      lang: text
      code: |
        For table T, choose the engine by stating:
        - Replication need   -> HA and read scale required? (replication)
        - Partitioning need  -> what is the natural partition key? (partitioning)
        - Consistency need   -> what must concurrent MERGE writers see? (consistency)
        Then name the shape pattern: plain | CQRS-style serving table | event-sourced replay.
        Finally cite one deployed reference architecture with the same bundle.
      source_id: ref-ddia
  source_refs: [ref-ddia, ref-cloud-design-patterns, ref-aws-arch-center]
  version: 0.1.0
