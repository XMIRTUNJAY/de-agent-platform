# Tutorials — beginner-friendly arrangements of artifact content.
# Every step is verbatim from the cited source field. Structure (need, steps,
# check) is ours; wording is the source's.
- id: tutorial-sql-fanout-review
  slug: sql-fanout-review
  type: tutorial
  title: Review SQL for fan-out joins
  description: >-
    Follow the SQL Reviewer agent's four-step pass over a real query: read the
    diff and its context, establish the grain of every result set, apply the
    SQL Review skill's five rules while stopping at the first fan-out, and
    emit findings with file positions plus a rewritten clause you can verify
    against the twelve-case evaluation fixture.
  category: cat-sql
  difficulty: beginner
  tags: [tutorial, sql, review, joins, correctness, beginner]
  series: python-sql
  series_title: The Python & SQL Series
  lesson: 3
  learning_objectives:
    - Prove a join cannot fan out before writing it
    - Spot NULL-unsafe `NOT IN` and `=` predicates
    - State the grain of a result set in one sentence
  what_you_need:
    - A pull request or a .sql file
    - The target dialect (postgres/duckdb/snowflake)
    - Install: npx de-agent-platform add sql-review
  steps:
    - text: Read the diff and the file context.
      from_id: agent-sql-reviewer
      from_field: workflow
    - text: Establish the grain of every result set.
      from_id: agent-sql-reviewer
      from_field: workflow
    - text: Apply the SQL review rules; stop at the first fan-out.
      from_id: agent-sql-reviewer
      from_field: workflow
    - text: Emit findings with file:line and a rewritten clause.
      from_id: agent-sql-reviewer
      from_field: workflow
  check_yourself:
    - On a 12-case fixture of known-bad SQL, correctly identifies 11 correctness bugs and 0 false positives.
    - Reviewing a PR that joins orders to a non-unique customer snapshot — flags fan-out and proposes a dedupe CTE.
  when_to_use:
    - "A review must prove a join cannot fan out"
    - "Suspicion of NULL-unsafe NOT IN or = predicates"
  why: Fan-out doubles counts silently; this walkthrough turns the SQL Reviewer's four-step pass into a habit with a fixture that proves it worked.
  gotchas:
    - "Stop at the first fan-out — fixing five joins at once hides which fix worked."
    - "NOT IN with a nullable column never compares as you think; use NOT EXISTS."
    - "State the grain of every result set in one sentence before judging the query."
  production_notes:
    - "Keep the 12-case evaluation fixture in CI so regressions resurface."
    - "Emit findings with file positions and a rewritten clause reviewers can verify."
  diagram: |
    sql review pass
       |
       |- read diff + context --> state grain per result set
       |
       |- apply 5 rules --> first fan-out --> dedupe CTE
       |
       |- emit findings --> file:line + rewritten clause --> verify on fixture
  code:
    - title: Install the SQL review skill
      lang: bash
      code: |
        npx de-agent-platform add sql-review
      source_id: skill-sql-review
    - title: The five review rules, applied in order
      lang: text
      code: |
        1. Every join states its cardinality (1:1, N:1, N:N) and justifies it.
        2. NOT IN (subquery) is banned where the subquery can return NULL — use NOT EXISTS.
        3. Comparisons across types must be explicit casts, not implicit.
        4. ORDER BY without LIMIT in a view is meaningless — drop it.
        5. SELECT * in a persisted model freezes an unstable schema.
      source_id: skill-sql-review
  source_refs: [agent-sql-reviewer, skill-sql-review]
