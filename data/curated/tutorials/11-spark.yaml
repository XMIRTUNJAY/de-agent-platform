- id: tutorial-spark-lens-event-log
  slug: spark-lens-event-log
  type: tutorial
  title: Read a Spark event log with the Spark Lens plugin
  description: >-
    Install the Spark Lens plugin and work its three commands over a Spark event
    log: /spark-analyze to build a task histogram and flag skew, /spark-explain-plan
    to check the join strategy, and /spark-baseline to store the cost baseline the
    guard enforces.
  category: cat-spark
  difficulty: intermediate
  tags: [tutorial, spark, plugin, performance, cost]
  series: data-processing
  series_title: The Data Processing Series
  lesson: 7
  learning_objectives:
    - Turn a Spark event log into a task histogram
    - Flag skew and shuffle amplification with /spark-analyze
    - Store a cost baseline with /spark-baseline
  what_you_need:
    - A Spark event log or Spark UI metrics
    - The job source
    - Install: amp plugin add de-agent/spark-lens
  steps:
    - text: "Install the plugin: `amp plugin add de-agent/spark-lens`."
      from_id: plugin-spark-lens
      from_field: installation
    - text: Point it at a Spark event log — it parses the log into a task histogram and flags skew and shuffle amplification.
      from_id: plugin-spark-lens
      from_field: description
    - text: Run `/spark-analyze` on the event log.
      from_id: plugin-spark-lens
      from_field: commands
    - text: Run `/spark-explain-plan` before shipping the change.
      from_id: plugin-spark-lens
      from_field: commands
    - text: Run `/spark-baseline` to store the cost baseline.
      from_id: plugin-spark-lens
      from_field: commands
    - text: Wire the guard — shuffle write grows 3.9x after a join change → build fails with the stage id.
      from_id: hook-spark-cost-check
      from_field: example
  check_yourself:
    - "`/spark-analyze` produces a task histogram from the event log and names skew or shuffle amplification when present."
    - "A join change that grows shuffle write 3.9x fails the build with the stage id."
  when_to_use:
    - "Diagnosing a slow or expensive Spark job from its event log"
    - "Storing a cost baseline before the next Spark change"
  why: Event logs already contain the cost story — the plugin turns them into a histogram and a baseline the CI guard can enforce.
  gotchas:
    - "The cost guard needs prior runs to build its 5-run baseline — a cold start has nothing to compare against."
    - "The plugin's permissions are filesystem read-only with no network — it analyzes logs you provide, it does not fetch metrics."
    - "Event-log retention matters — rotated logs close the run-over-run comparison window."
  production_notes:
    - "Store a baseline per job and compare against the median of the last 5 runs."
    - "The plugin ships the skew-diagnosis and cost-regression-guard skills — use them for the root-cause step."
  diagram: |
    event log
       |
       |- /spark-analyze --> task histogram --> skew / shuffle amplification flags
       |
       |- /spark-explain-plan --> broadcast vs sort-merge
       |
       |- /spark-baseline --> stored baseline --> CI guard fails > 25% growth
  code:
    - title: Install the plugin
      lang: bash
      code: |
        amp plugin add de-agent/spark-lens
      source_id: plugin-spark-lens
    - title: The three commands over one event log
      lang: text
      code: |
        /spark-analyze        # task histogram; flags skew and shuffle amplification
        /spark-explain-plan   # check the join strategy before shipping the change
        /spark-baseline       # store the cost baseline the CI guard enforces
      source_id: plugin-spark-lens
    - title: What the baseline guard enforces
      lang: text
      code: |
        After the job's test run, read shuffle/spill/scan metrics from the event log,
        compare against the stored baseline (median of last 5), and fail if any metric
        grew by more than 25%. Emit the offending stage and metric.

        Example: shuffle write grows 3.9x after a join change → build fails with the stage id.
      source_id: hook-spark-cost-check
  source_refs: [plugin-spark-lens, hook-spark-cost-check, runbook-spark-job-suddenly-costs-4x]
