# Tutorials — beginner-friendly arrangements of artifact content.
# Every step is verbatim from the cited source field. Structure (need, steps,
# check) is ours; wording is the source's.
- id: tutorial-spark-skew-diagnosis-walkthrough
  slug: spark-skew-diagnosis-walkthrough
  type: tutorial
  title: Diagnose a skewed Spark stage
  description: >-
    One Spark stage hangs while other executors idle. Open the stage view, read
    the p50-vs-p99 task durations, and follow the skew skill's decision order:
    AQE skew join first, salting second, broadcast only under a size budget — and
    never repartition(1).
  category: cat-spark
  difficulty: intermediate
  tags: [tutorial, spark, skew, performance, aqe]
  series: data-processing
  series_title: The Data Processing Series
  lesson: 3
  learning_objectives:
    - Read task-level duration histograms to confirm skew
    - Choose between AQE skew join, salting and broadcast
    - Attach the evidence a skew review requires
  what_you_need:
    - Spark UI access or the job's event log
    - The job source
    - Install: npx de-agent-platform add spark-skew-diagnosis
  steps:
    - text: Open the Spark UI stage view; compare p50 vs p99 task duration.
      from_id: runbook-spark-job-slow
      from_field: diagnosis
    - text: Skew if p99 >> p50 (10x+). Uniform slowness if p50 is high.
      from_id: runbook-spark-job-slow
      from_field: diagnosis
    - text: Check shuffle read/write bytes and spill (disk) bytes per task.
      from_id: runbook-spark-job-slow
      from_field: diagnosis
    - text: Confirm with `spark.sql.adaptive.skewJoin.enabled=true` — if it fixes it, ship that.
      from_id: skill-spark-skew-diagnosis
      from_field: body
    - text: If not, salt the hot key on both sides and aggregate twice.
      from_id: skill-spark-skew-diagnosis
      from_field: body
    - text: Broadcast only if the small side is < 100 MB *after* filtering; never `repartition(1)` to 'fix' skew — it serialises the stage.
      from_id: skill-spark-skew-diagnosis
      from_field: body
  check_yourself:
    - Re-running with `spark.sql.adaptive.skewJoin.enabled=true` removes the straggler; if it does not, the salted two-stage aggregate does.
    - The task-duration histogram, the shuffle read/write bytes, and the top-10 keys by row count are attached — the review is not complete without them.
  when_to_use:
    - "A batch job's runtime jumped and no code changed"
    - "Executors idle while a few tasks run long"
  why: Slow jobs miss SLAs and burn executor-hours — attributing between skew, spill and over-scan is the difference between a 10-minute and a 10-hour incident.
  gotchas:
    - "repartition(1) serialises the stage — never reach for it to 'fix' slowness."
    - "p99 much greater than p50 means skew; uniformly high p50 means capacity. Salting helps the first, not the second."
    - "Spill shows up as slow tasks, not failures — check spill bytes before paying for bigger executors."
  production_notes:
    - "Baseline shuffle/spill/scan metrics so CI can fail a regression before users feel it."
    - "Keep AQE on, and confirm broadcast vs sort-merge plans with explain('formatted') before shipping."
  diagram: |
    stage slow
       |
       |- p99 >> p50 --> key skew --> AQE skew join --> fixed? ship
       |                                          > not fixed --> salt hot key, aggregate twice
       |
       |- spill bytes high --> oversized partitions --> more partitions / memory
       |
       |- all tasks slow (high p50) --> capacity, not skew --> do not salt
  code:
    - title: Confirm the diagnosis — AQE on, event log, plan
      lang: bash
      code: |
        spark-submit --conf spark.sql.adaptive.enabled=true ...
        # inspect the event log: grep 'TaskSetManager' spark.log | tail
        df.explain('formatted')  # confirm broadcast vs sort-merge join
      source_id: runbook-spark-job-slow
    - title: Skew signals
      lang: text
      code: |
        - Median task duration ~p50, but p99 is 30x+ → key skew.
        - All tasks slow and shuffle read is huge → partition/scan problem, not skew.
        - One executor at 100% while others idle → hot partition.
      source_id: skill-spark-skew-diagnosis
    - title: Decision order — AQE, salt, broadcast, never repartition(1)
      lang: text
      code: |
        1. Confirm with `spark.sql.adaptive.skewJoin.enabled=true` — if it fixes it, ship that.
        2. If not, salt the hot key on both sides and aggregate twice.
        3. Broadcast only if the small side is < 100 MB *after* filtering.
        4. Never `repartition(1)` to "fix" skew; it serialises the stage.
      source_id: skill-spark-skew-diagnosis
  source_refs: [runbook-spark-job-slow, skill-spark-skew-diagnosis]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
