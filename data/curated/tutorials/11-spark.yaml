- id: tutorial-spark-pyspark-template-start
  slug: spark-pyspark-template-start
  type: tutorial
  title: Start a PySpark project from the template
  description: >-
    Scaffold a testable PySpark project with one command and learn where each
    piece lives: transforms in src/, 3-10 row fixtures in tests/data/, and a
    Makefile that runs lint plus tests offline. Finish by hardening the first
    transform with row-count and null assertions.
  category: cat-spark
  difficulty: beginner
  tags: [tutorial, spark, pyspark, template, testing]
  series: data-processing
  series_title: The Data Processing Series
  lesson: 2
  learning_objectives:
    - Scaffold a PySpark project with the template
    - Arrange transforms and offline test fixtures
    - Add pre/post row-count and null assertions to a job
  what_you_need:
    - An agent host with template support
    - Docker for the containerised test run
    - Install: amp template new de-agent/pyspark-project ./my-pipeline
  steps:
    - text: "Scaffold the project: `amp template new de-agent/pyspark-project ./my-pipeline`."
      from_id: tpl-pyspark-project
      from_field: installation
    - text: Check the scaffold — src/transforms, tests with a local Spark session, a Dockerfile, and a Makefile that runs lint + tests offline.
      from_id: tpl-pyspark-project
      from_field: description
    - text: Put transforms in src/transforms/ (orders_daily.py), readers in src/io/, and 3-10 row fixtures in tests/data/.
      from_id: tpl-pyspark-project
      from_field: repo_structure
    - text: Run the Makefile's lint + tests offline — no cluster needed.
      from_id: tpl-pyspark-project
      from_field: description
    - text: Add pre/post row-count and null assertions to the first job.
      from_id: skill-spark-data-quality-review
      from_field: learning_objectives
  check_yourself:
    - The Makefile runs lint + tests offline against the 3-10 row fixtures in tests/data/.
    - The first transform ships with a row-count and a null-rate check on its primary key.
  when_to_use:
    - "Starting a new PySpark pipeline"
    - "A Spark project that must test offline before touching a cluster"
  why: Transforms that only run on a cluster are transforms nobody tests; the template makes the offline path the default.
  gotchas:
    - "tests/data/ is for 3-10 row fixtures — a fixture that needs a cluster defeats the offline Makefile."
    - "Transforms live in src/transforms/ and I/O in src/io/ — mixing them breaks the layout the tests expect."
    - "The Makefile runs lint + tests offline — a transform that only runs on a cluster has no offline test."
  production_notes:
    - "Keep tests with a local Spark session so CI needs no cluster."
    - "Pair the template with the Spark data-quality review skill before merging transforms."
  diagram: |
    amp template new
       |
       |- scaffold --> src/transforms + src/io + tests/data (3-10 rows)
       |
       |- make lint + tests --> offline, local Spark session
       |
       |- first transform --> row-count + null assertions --> ready for review
  code:
    - title: Scaffold the project
      lang: bash
      code: |
        amp template new de-agent/pyspark-project ./my-pipeline
      source_id: tpl-pyspark-project
    - title: Where each piece lives
      lang: text
      code: |
        pyspark-project/
          pyproject.toml
          Makefile
          Dockerfile
          src/
            transforms/
              orders_daily.py
            io/readers.py
          tests/
            data/            # 3-10 row fixtures
            test_orders_daily.py
      source_id: tpl-pyspark-project
    - title: Ship the first transform with post-write assertions
      lang: text
      code: |
        Missing assertions — every write should be followed by a row-count and a
        null-rate check on the primary key.
      source_id: skill-spark-data-quality-review
  source_refs: [tpl-pyspark-project, skill-spark-data-quality-review]
  version: 0.1.0
