- id: tutorial-spark-dq-review-pass
  slug: spark-dq-review-pass
  type: tutorial
  title: Review a PySpark transform for silent quality failures
  description: >-
    Run the five-check pass over a PySpark transform before it merges: null
    propagation, join fan-out, silent coercion, non-determinism, and missing
    post-write assertions. Each finding lands as severity, file:line, rule and a
    suggested patch.
  category: cat-spark
  difficulty: intermediate
  tags: [tutorial, spark, pyspark, data-quality, code-review]
  series: data-processing
  series_title: The Data Processing Series
  lesson: 8
  learning_objectives:
    - Identify the five classes of silent failure in a Spark transform
    - Add pre/post row-count and null assertions to a job
    - Report findings as severity, file:line, rule, patch
  what_you_need:
    - A PySpark transform about to be merged
    - The intended grain of the output table
    - Install: npx de-agent-platform add spark-data-quality-review
  steps:
    - text: Run this when a PySpark transform is about to be merged, or when a downstream table's row count changed without a code change.
      from_id: skill-spark-data-quality-review
      from_field: body
    - text: Null propagation — every outer join introduces nullable right-side keys; confirm downstream code coalesces or filters them.
      from_id: skill-spark-data-quality-review
      from_field: body
    - text: Join fan-out — assert key uniqueness on the intended 1-side before joining.
      from_id: skill-spark-data-quality-review
      from_field: body
    - text: Silent coercion — `cast` failures return null, not errors; prefer `try_cast` and count the nulls it produces.
      from_id: skill-spark-data-quality-review
      from_field: body
    - text: Non-determinism — `dropDuplicates` without a sort key keeps an arbitrary row.
      from_id: skill-spark-data-quality-review
      from_field: body
    - text: Missing assertions — every write should be followed by a row-count and a null-rate check on the primary key.
      from_id: skill-spark-data-quality-review
      from_field: body
  check_yourself:
    - Every write in the transform is followed by a row-count and a null-rate check on the primary key.
    - "Findings come back as `severity | file:line | rule | suggested patch`."
  when_to_use:
    - "A PySpark transform is about to be merged"
    - "A downstream table's row count changed without a code change"
  why: Spark fails silently — nulls propagate, casts return null, and dropDuplicates keeps an arbitrary row, so the review pass is the defense before consumers see it.
  gotchas:
    - "`cast` failures return null, not errors — count the nulls try_cast produces."
    - "`dropDuplicates` without a sort key keeps an arbitrary row."
    - "Every outer join introduces nullable right-side keys — confirm downstream code coalesces or filters them."
  production_notes:
    - "Every write should be followed by a row-count and a null-rate check on the primary key."
    - "Report findings as `severity | file:line | rule | suggested patch` so they are actionable in a PR."
  diagram: |
    transform review
       |
       |- null propagation --> outer joins --> coalesce or filter downstream
       |
       |- join fan-out --> assert 1-side key uniqueness
       |
       |- silent coercion --> try_cast + count nulls
       |
       |- non-determinism --> sort key before dropDuplicates
       |
       |- missing assertions --> row-count + null-rate after every write
  code:
    - title: The five-check pass, in order
      lang: text
      code: |
        1. Null propagation — every outer join introduces nullable right-side keys.
           Confirm downstream code coalesces or filters them.
        2. Join fan-out — assert key uniqueness on the intended 1-side before joining.
        3. Silent coercion — `cast` failures return null, not errors. Prefer `try_cast`
           and count the nulls it produces.
        4. Non-determinism — `dropDuplicates` without a sort key keeps an arbitrary row.
        5. Missing assertions — every write should be followed by a row-count and a
           null-rate check on the primary key.
      source_id: skill-spark-data-quality-review
    - title: When to run it, and what comes back
      lang: text
      code: |
        Run this when a PySpark transform is about to be merged, or when a downstream
        table's row count changed without a code change.

        Output: a findings list — severity | file:line | rule | suggested patch
      source_id: skill-spark-data-quality-review
  source_refs: [skill-spark-data-quality-review]
