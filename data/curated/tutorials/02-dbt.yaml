- id: tutorial-dbt-warehouse-tests
  slug: dbt-warehouse-tests-starter
  type: tutorial
  title: Run the dbt warehouse tests starter end to end
  description: >-
    Clone the dbt-warehouse-tests starter, seed its deterministic customers
    and orders data, and build the staging → intermediate → marts pipeline
    with dbt build --target dev. You serve the docs, add the tests that
    protect the fct grain, and finish against the failure scenarios the
    project warns about.
  category: cat-dbt
  difficulty: beginner
  tags: [tutorial, dbt, starter, testing, ci, beginner]
  learning_objectives:
    - Layer staging, intermediate, and marts models
    - Run the seed/build/docs loop the starter ships with
    - Enforce unique + not_null on the fact grain key
  what_you_need:
    - The dbt-warehouse-tests starter repo
    - A Postgres or DuckDB dev target
    - dbt installed (dbt deps, dbt seed)
  steps:
    - text: "dbt deps && dbt seed"
      from_id: project-dbt-warehouse-tests
      from_field: setup
    - text: "dbt build --target dev"
      from_id: project-dbt-warehouse-tests
      from_field: setup
    - text: "dbt docs generate && dbt docs serve"
      from_id: project-dbt-warehouse-tests
      from_field: setup
    - text: Write tests that protect the grain.
      from_id: project-dbt-warehouse-tests
      from_field: learning_objectives
    - text: "unique + not_null on the fct grain key"
      from_id: project-dbt-warehouse-tests
      from_field: tests
    - text: "relationships from fct to dims"
      from_id: project-dbt-warehouse-tests
      from_field: tests
  check_yourself:
    - dbt build --target dev finishes with every test passing and docs render for the full DAG.
    - The fct_orders grain key carries unique + not_null, and relationships link fct to dims.
  when_to_use:
    - "Standing up a tested, documented star schema from raw landed data"
    - "A template for gating dbt changes on data-aware CI"
  why: The starter only protects you if you actually run its seed, build, tests, and CI gate against a real target.
  gotchas:
    - "Late-arriving order missed → lookback window too short."
    - "Grain key not unique → a join fanned out upstream."
    - "CI green but prod differs → CI ran on a different target/schema."
  production_notes:
    - "CI builds to a per-PR staging schema and runs full tests."
    - "Declare source freshness checks on raw and exposures for dashboards."
  diagram: |
    starter run
       |
       |- dbt deps && dbt seed --> dbt build --target dev
       |
       |- staging --> intermediate --> fct_orders --> marts
       |
       |- unique + not_null on grain --> relationships to dims --> docs + CI
  code:
    - title: Seed, build, and serve the starter
      lang: bash
      code: |
        dbt deps && dbt seed
        dbt build --target dev
        dbt docs generate && dbt docs serve
      source_id: project-dbt-warehouse-tests
    - title: Tests that protect the fct_orders grain in schema.yml
      lang: yaml
      code: |
        # models/schema.yml - tests + descriptions on every node
        models:
          - name: fct_orders
            columns:
              - name: <grain key>      # unique + not_null on the fct grain key
                tests:
                  - unique
                  - not_null
              - name: <fk column>      # relationships from fct to dims
                tests:
                  - relationships:
                      to: ref('<dim model>')
              - name: status           # accepted_values on status
                tests:
                  - accepted_values:
                      values: [<allowed statuses>]
      source_id: project-dbt-warehouse-tests
