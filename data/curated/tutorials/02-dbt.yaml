- id: tutorial-dbt-workbench
  slug: dbt-workbench-commands
  type: tutorial
  title: Run dbt model review and tests from the workbench plugin
  description: >-
    Install the dbt Workbench plugin and drive one model change through its
    three commands: /dbt-review-model for the model review, /dbt-write-tests
    for a proposed test set, and /dbt-impact before you merge. Along the way
    you apply the same grain and blast-radius checks the plugin's underlying
    skills use, with the full-refresh guard watching destructive rebuilds.
  category: cat-dbt
  difficulty: intermediate
  tags: [tutorial, dbt, plugin, review, testing, intermediate]
  learning_objectives:
    - Run /dbt-review-model, /dbt-write-tests, and /dbt-impact on a model change
    - Read the review output against the model's grain and unique key
    - Rank the generated tests by blast radius before accepting them
  what_you_need:
    - A dbt project with a dev target in profiles.yml
    - Install: amp plugin add de-agent/dbt-workbench
    - A pull request or branch that changes a model
  steps:
    - text: Run /dbt-review-model.
      from_id: plugin-dbt-workbench
      from_field: commands
    - text: State a model's grain and match it to its unique key test.
      from_id: skill-dbt-model-review
      from_field: learning_objectives
    - text: Run /dbt-write-tests.
      from_id: plugin-dbt-workbench
      from_field: commands
    - text: Rank tests by the cost of the failure they prevent.
      from_id: skill-dbt-test-writer
      from_field: learning_objectives
    - text: Run /dbt-impact.
      from_id: plugin-dbt-workbench
      from_field: commands
  check_yourself:
    - /dbt-review-model returns findings that reference the model's grain and materialisation.
    - /dbt-write-tests proposes tests ordered by blast radius, and /dbt-impact lists the downstream nodes.
  when_to_use:
    - "Review and test generation for a dbt model should live in the agent, not memory"
    - "A model change needs a downstream impact check before merge"
  why: The workbench turns review, test generation, and impact checks into three commands instead of habits you have to remember.
  gotchas:
    - "The plugin holds warehouse credentials through the dbt profile — scope it to a dev target."
    - "Late-arriving rows older than the watermark are silently dropped; keep the lookback window."
    - "is_incremental() must guard the filter or every full run is a full reload."
  production_notes:
    - "The full-refresh guard hook blocks destructive rebuilds — leave it enabled."
    - "The plugin runs with filesystem read-write and warehouse network access; review its permissions before installing."
  diagram: |
    dbt workbench
       |
       |- /dbt-review-model --> grain + materialisation findings
       |
       |- /dbt-write-tests --> tests ranked by blast radius
       |
       |- /dbt-impact --> downstream nodes --> merge with guard hook on
  code:
    - title: Install the dbt Workbench plugin
      lang: bash
      code: |
        amp plugin add de-agent/dbt-workbench
      source_id: plugin-dbt-workbench
    - title: The three workbench commands in review order
      lang: text
      code: |
        /dbt-review-model   # model review: grain + materialisation findings
        /dbt-write-tests    # proposed test set, ranked by blast radius
        /dbt-impact         # downstream nodes before you merge
      source_id: plugin-dbt-workbench
    - title: Proposed test set ranked by blast radius in schema.yml
      lang: yaml
      code: |
        models:
          - name: <model>
            columns:
              - name: <grain key>
                tests:
                  - unique
                  - not_null
              - name: <foreign key>
                tests:
                  - relationships:
                      to: ref('<dimension model>')
              - name: <enum column>
                tests:
                  - accepted_values:
                      values: [<allowed values>]
      source_id: skill-dbt-test-writer
