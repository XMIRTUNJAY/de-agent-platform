# Tutorials — dbt: writing a model's test set from scratch, reviewing a model
# PR, driving the dbt Workbench plugin commands, and running the
# dbt-warehouse-tests starter project end to end.
# Every step is verbatim (or lightly compressed) from the cited source field.
# Structure (need, steps, check) is ours; wording is the source's.
- id: tutorial-dbt-test-writer
  slug: minimum-dbt-test-set
  type: tutorial
  title: Write the minimum dbt test set for a model
  description: >-
    Start from the model's grain, then rank dbt tests by the cost of the
    failure they prevent: uniqueness and not-null on the grain key,
    relationships on foreign keys, accepted values on enums, and freshness on
    sources. You add one custom singular test, wire freshness on a source, and
    finish by running the set in data-aware CI against a staging schema.
  category: cat-dbt
  difficulty: beginner
  tags: [tutorial, dbt, testing, data-quality, beginner]
  learning_objectives:
    - Rank dbt tests by blast radius instead of by effort
    - Add a singular test for a rule schema.yml cannot express
    - Wire freshness on a source and read its result
  what_you_need:
    - A dbt project with at least one model
    - models/schema.yml for generic tests
    - Install: npx de-agent-platform add dbt-test-writer
  steps:
    - text: State a model's grain and match it to its unique key test.
      from_id: skill-dbt-model-review
      from_field: learning_objectives
    - text: Rank tests by the cost of the failure they prevent.
      from_id: skill-dbt-test-writer
      from_field: learning_objectives
    - text: Write a custom singular test.
      from_id: skill-dbt-test-writer
      from_field: learning_objectives
    - text: Wire freshness on a source.
      from_id: skill-dbt-test-writer
      from_field: learning_objectives
    - text: Run data-aware CI against a staging schema.
      from_id: project-dbt-warehouse-tests
      from_field: learning_objectives
  check_yourself:
    - schema.yml has unique + not_null on the declared grain key, and dbt test passes on the dev target.
    - The source block carries freshness thresholds, and dbt source freshness runs green.
  when_to_use:
    - "A model's test set does not protect its grain key"
    - "A source has no freshness check while the extractor can stall silently"
  why: Uniqueness and freshness failures are the silent outages, and a test set ranked by blast radius catches them before consumers do.
  gotchas:
    - "Row-count equality tests on raw sources: they flake."
    - "Testing a column nobody reads."
    - "`warn` severity on a correctness test nobody will see."
  production_notes:
    - "Freshness on sources catches a stalled extractor, the #1 silent outage — run it on a schedule."
    - "Keep warn severity off correctness tests nobody will see."
  diagram: |
    dbt test set
       |
       |- state grain --> unique + not_null on grain key
       |
       |- rank by blast radius --> relationships --> accepted_values --> freshness
       |
       |- singular test --> run in data-aware CI on staging schema
  code:
    - title: Install the dbt-test-writer skill
      lang: bash
      code: |
        npx de-agent-platform add dbt-test-writer
      source_id: skill-dbt-test-writer
    - title: Test set ranked by blast radius in schema.yml
      lang: yaml
      code: |
        # Rank by blast radius, not by effort
        models:
          - name: <model>
            columns:
              - name: <grain key>      # 1. unique + not_null - the model is meaningless without it
                tests:
                  - unique
                  - not_null
              - name: <foreign key>    # 2. relationships - catches broken joins upstream
                tests:
                  - relationships:
                      to: ref('<dimension model>')
              - name: <enum column>    # 3. accepted_values - catches upstream renames
                tests:
                  - accepted_values:
                      values: [<allowed values>]
      source_id: skill-dbt-test-writer
    - title: Run the test set with dbt build on the dev target
      lang: bash
      code: |
        dbt deps && dbt seed
        dbt build --target dev
      source_id: project-dbt-warehouse-tests
  source_refs: [skill-dbt-test-writer, skill-dbt-model-review, project-dbt-warehouse-tests]
  agent_skills: [skill-dbt-test-writer]
  agents: [agent-data-quality-reviewer]
