- id: tutorial-dbt-model-review
  slug: review-dbt-model-pr
  type: tutorial
  title: Review a dbt model PR before merge
  description: >-
    Take a pull request that adds or changes a dbt model and walk the
    reviewer's pass: read the diff in context, state the model's grain and
    check it against the unique key test, choose table vs incremental vs view
    deliberately, and handle late-arriving data in the incremental filter. You
    finish with findings a reviewer can verify before the model merges.
  category: cat-dbt
  difficulty: intermediate
  tags: [tutorial, dbt, review, incremental, grain, intermediate]
  learning_objectives:
    - State a model's grain in one sentence and match it to the unique test
    - Justify table vs incremental vs view for a given source
    - Add a lookback window so late-arriving rows are not dropped
  what_you_need:
    - A pull request that adds or changes a dbt model
    - The model's schema.yml with its declared grain
    - Install: npx de-agent-platform add dbt-model-review
  steps:
    - text: Read the diff and the file context.
      from_id: agent-sql-reviewer
      from_field: workflow
    - text: Establish the grain of every result set.
      from_id: agent-sql-reviewer
      from_field: workflow
    - text: State a model's grain and match it to its unique key test.
      from_id: skill-dbt-model-review
      from_field: learning_objectives
    - text: Choose table vs incremental vs view deliberately.
      from_id: skill-dbt-model-review
      from_field: learning_objectives
    - text: Handle late data in an incremental model.
      from_id: skill-dbt-model-review
      from_field: learning_objectives
  check_yourself:
    - The review states the model's grain in one sentence and the unique test sits on that key.
    - "An incremental model carries a lookback window such as >= max(updated_at) - interval '3 days'."
  when_to_use:
    - "A PR changes a dbt model's materialisation or incremental filter"
    - "A model's unique test does not sit on its declared grain key"
  why: Grain, materialisation, and late data decide whether a model lies, and this pass checks all three before merge.
  gotchas:
    - "Late-arriving rows older than the watermark are silently dropped — add a lookback window."
    - "is_incremental() must guard the filter or every full run is a full reload."
    - "Deletes never arrive — decide explicitly: soft-delete, or periodic full-refresh."
  production_notes:
    - "Add a lookback window (e.g. >= max(updated_at) - interval '3 days') to every incremental filter."
    - "Decide soft-delete vs periodic full-refresh explicitly; deletes never arrive on their own."
  diagram: |
    dbt model review
       |
       |- read diff + context --> establish grain per result set
       |
       |- grain statement --> unique test on that key
       |
       |- materialisation picker --> view / table / incremental
       |
       |- incremental --> lookback window --> guard is_incremental()
  code:
    - title: Grain first - the unique test on the declared grain key
      lang: yaml
      code: |
        # One row = one ___ ; the unique test goes on that key
        models:
          - name: <model>
            columns:
              - name: <grain key>
                tests:
                  - unique
      source_id: skill-dbt-model-review
    - title: Materialisation picker - view vs table vs incremental
      lang: text
      code: |
        view        - cheap, and the model is small or rarely queried.
        table       - the source is huge and consumers need speed.
        incremental - the source grows monotonically and you can define the watermark.
      source_id: skill-dbt-model-review
    - title: Incremental filter with a lookback window, guarded by is_incremental()
      lang: sql
      code: |
        -- late-arriving rows older than the watermark are silently dropped
        {% if is_incremental() %}
          where updated_at >= max(updated_at) - interval '3 days'
        {% endif %}
      source_id: skill-dbt-model-review
  source_refs: [skill-dbt-model-review, agent-sql-reviewer]
  agent_skills: [skill-dbt-model-review, skill-sql-review]
