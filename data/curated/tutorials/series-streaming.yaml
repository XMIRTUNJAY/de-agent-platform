- id: tutorial-streaming-consumer-reliability
  slug: streaming-consumer-reliability
  type: tutorial
  title: Own the consumer side — offsets, rebalances, and the KIP-848 protocol
  description: >-
    Consumer reliability is where streams quietly break: a rebalance loop looks
    like slowness, consumers past the partition count buy nothing, and
    stop-the-world rebalances pause consumption. Read group state, fix the
    timeouts, and know what the next-generation protocol changes.
  category: cat-kafka
  series: streaming
  series_title: The Streaming Series
  lesson: 4
  difficulty: intermediate
  tags: [tutorial, kafka, consumer-group, offsets, rebalancing]
  learning_objectives:
    - Explain how consumer groups and offsets decide who reads what
    - Detect a rebalance loop from consumer-group state history
    - Know what the KIP-848 protocol changes about rebalancing
  what_you_need:
    - kafka-consumer-groups CLI access to the cluster
    - Install: npx de-agent-platform add kafka-consumer-lag-triage
  steps:
    - text: Ground yourself in the mechanics — consumer groups and offsets are what decide who reads what, and delivery semantics decide what a restart means.
      from_id: ref-kafka-docs
      from_field: description
    - text: Get per-partition lag — uniform vs skewed tells you capacity vs key skew.
      from_id: runbook-kafka-consumer-lagging
      from_field: diagnosis
    - text: Check the consumer-group state history for `PreparingRebalance`.
      from_id: runbook-kafka-consumer-lagging
      from_field: diagnosis
    - text: Read the signature — lag resets to zero then climbs means a rebalance loop; check `session.timeout.ms`.
      from_id: skill-kafka-lag-triage
      from_field: body
    - text: Know where the protocol is going — the KIP-848 consumer protocol in Apache Kafka 4.0 redesigns consumer group rebalancing to eliminate stop-the-world pauses.
      from_id: ref-optimize-consumer-rebalancing-on-amazon-msk-with-next-generation
      from_field: description
    - text: When a rebalance loop is the bug — raise session.timeout.ms / max.poll.interval.ms.
      from_id: runbook-kafka-consumer-lagging
      from_field: fix
    - text: Before scaling the fleet — adding consumers past the partition count buys nothing.
      from_id: runbook-kafka-consumer-lagging
      from_field: gotchas
  check_yourself:
    - Frequent `PreparingRebalance` in the group state history, with lag that resets to zero then climbs, is a rebalance loop — not a slow consumer.
    - A 13th consumer on a 12-partition topic changes nothing — partitions cap parallelism.
  when_to_use:
    - "Consumers restart or rebalance more often than the workload explains"
    - "You need to reason about offsets before changing consumer configs"
  why: A rebalance loop steals consumption time and can look like slowness, so the consumer side is where streaming reliability is usually lost first.
  gotchas:
    - "A rebalance loop can look like slowness: check the group state history for PreparingRebalance."
    - "Adding consumers past the partition count buys nothing."
    - "Stop-the-world pauses are the problem the next-generation protocol eliminates — older protocols pause all consumption during a rebalance."
  production_notes:
    - "Alert on lag slope, not on an absolute lag number."
    - "Rebalance count belongs in monitoring next to consumer lag per partition and DLQ depth."
  diagram: |
    consumer reliability
       |
       |- group subscribes --> partitions split across members
       |
       |- offsets committed per partition --> restart resumes, not re-reads
       |
       |- PreparingRebalance looping --> raise session.timeout.ms / max.poll.interval.ms
       |
       |- consumers > partitions --> idle members, no gain
       |
        --> KIP-848 (Kafka 4.0): rebalancing without stop-the-world pauses
  code:
    - title: Read group state
      lang: bash
      code: |
        kafka-consumer-groups --bootstrap-server $B --describe --group $G
        kafka-consumer-groups --bootstrap-server $B --describe --group $G --state
      source_id: runbook-kafka-consumer-lagging
    - title: Rebalance signatures
      lang: text
      code: |
        - Lag resets to zero then climbs → rebalance loop; check `session.timeout.ms`.
        - Is the consumer group stable? Frequent `PreparingRebalance` is the real bug.
      source_id: skill-kafka-lag-triage
    - title: Where the protocol is going
      lang: text
      code: |
        The KIP-848 consumer protocol in Apache Kafka 4.0 redesigns consumer
        group rebalancing to eliminate stop-the-world pauses.
      source_id: ref-optimize-consumer-rebalancing-on-amazon-msk-with-next-generation
  source_refs: [ref-kafka-docs, runbook-kafka-consumer-lagging, skill-kafka-lag-triage, ref-optimize-consumer-rebalancing-on-amazon-msk-with-next-generation]
  version: 0.1.0
