- id: tutorial-streaming-windows-watermarks
  slug: streaming-windows-watermarks
  type: tutorial
  title: Window a stream correctly — watermarks, dedupe, and late data
  description: >-
    Stream processing in practice: start from the kafka-streaming template, pick
    event-time over processing-time windows, set a watermark you can defend, and
    prove what happens to late data. Checkpointing and an idempotent MERGE sink
    make the job restartable without duplicating output.
  category: cat-streaming
  series: streaming
  series_title: The Streaming Series
  lesson: 5
  difficulty: intermediate
  tags: [tutorial, streaming, kafka, spark, watermark, windows]
  learning_objectives:
    - Choose event-time vs processing-time windows
    - Set a watermark and reason about late data
    - Run a structured-streaming job with checkpointing and an idempotent MERGE sink
  what_you_need:
    - The kafka-streaming template (checkpointing, watermarking, a dedupe stage, an idempotent MERGE sink)
    - Install: amp template new de-agent/kafka-streaming ./streaming
    - A Kafka topic whose events carry an event timestamp and an event_id
  steps:
    - text: Start from the template — a structured-streaming job with checkpointing, watermarking, a dedupe stage and an idempotent MERGE sink to Delta/Iceberg.
      from_id: tpl-kafka-streaming
      from_field: description
    - text: Decide time semantics first — choose event-time vs processing-time windows.
      from_id: project-kafka-spark-delta
      from_field: learning_objectives
    - text: Follow the reference architecture — Spark SS with watermark 2m and dedupe on event_id, raw_events appended to bronze, agg_5min as a windowed MERGE on the window key.
      from_id: project-kafka-spark-delta
      from_field: architecture
    - text: Read with `startingOffsets=earliest` in dev only; latest in prod.
      from_id: project-kafka-spark-delta
      from_field: implementation
    - text: Dedupe on `event_id` within the watermark; windowed aggregation to 5-minute tumbling windows, appended idempotently.
      from_id: project-kafka-spark-delta
      from_field: implementation
    - text: Prove late-data behavior in tests — a late event beyond the watermark is dropped (documented, not silent), and replaying a batch yields the same aggregate.
      from_id: project-kafka-spark-delta
      from_field: tests
    - text: Watch the two classic failures — watermark too short means late data silently dropped; checkpoint lost means duplicates, fixed by making the sink idempotent.
      from_id: project-kafka-spark-delta
      from_field: failure_scenarios
  check_yourself:
    - An event arriving inside the 2-minute watermark joins its window; one beyond it is dropped — documented in the tests, not silent.
    - Replaying a batch yields the same aggregate because the MERGE is on the window key.
  when_to_use:
    - "Aggregations over event streams — counts and sums per window"
    - "A streaming job that must survive restarts without duplicating output"
  why: Windows turn infinite streams into finite, mergeable results — get the watermark wrong and you either drop late data silently or never emit.
  gotchas:
    - "Watermark too short → late data silently dropped."
    - "Read with `startingOffsets=earliest` in dev only; latest in prod."
    - "Skewed key → one partition saturates; re-key."
  production_notes:
    - "Checkpoints on durable storage with lineage."
    - "Lag + batch-duration metrics; alert on rising batch duration."
  diagram: |
    windowed streaming job
       |
       |- Kafka events (event_id, event time)
       |
       |- watermark 2m --> dedupe on event_id
       |
       |- 5-minute tumbling windows --> aggregate
       |
       |- raw_events --> append (bronze)
       |- agg_5min  --> MERGE on window key (idempotent)
       |
        --> checkpoint on durable storage; alert on rising batch duration
  code:
    - title: Bring up the stack and produce events
      lang: bash
      code: |
        make up
        make produce  # emits events, some deliberately late
        make stream &
      source_id: project-kafka-spark-delta
    - title: Implementation rules
      lang: text
      code: |
        - Read with `startingOffsets=earliest` in dev only; latest in prod.
        - Dedupe on `event_id` within the watermark.
        - Windowed aggregation to 5-minute tumbling windows, appended idempotently.
        - MERGE aggregates on the window key so replays converge.
      source_id: project-kafka-spark-delta
    - title: The reference architecture
      lang: text
      code: |
        Kafka (events) ─▶ Spark SS [watermark 2m, dedupe on event_id]
                          ├─▶ Delta: raw_events (append, bronze)
                          └─▶ Delta: agg_5min  (windowed, MERGE on window key)
      source_id: project-kafka-spark-delta
  source_refs: [tpl-kafka-streaming, project-kafka-spark-delta]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/streaming-windows-watermarks
