# The Streaming Series — lessons authored for the 13x10 series; structure ours, wording the source's.
- id: tutorial-streaming-mental-model
  slug: streaming-mental-model
  type: tutorial
  title: >-
    Hold the streaming mental model: events, partitions, delivery semantics
  description: >-
    Build the vocabulary before touching a cluster: events instead of rows,
    partitions instead of tables, at-least-once delivery instead of exactly-once,
    and the lambda/kappa decision for speed versus correctness. Every later
    lesson in this series leans on these four ideas.
  category: cat-streaming
  series: streaming
  series_title: The Streaming Series
  lesson: 1
  difficulty: beginner
  tags: [tutorial, streaming, kafka, architecture, concepts]
  learning_objectives:
    - Explain why ordering and partitions behave the way they do
    - Treat at-least-once delivery and replays as the normal case
    - Choose between lambda, kappa, and plain batch for a latency and reprocessing need
  what_you_need:
    - No cluster required — this is a concepts lesson
    - The Apache Kafka documentation open beside you
  steps:
    - text: Read the map first — the docs cover architecture and design, delivery semantics, the protocol, consumer groups and offsets, operations, and security.
      from_id: ref-kafka-docs
      from_field: description
    - text: The design section explains why ordering and partitions behave the way they do; the operations section is the runbook companion.
      from_id: ref-kafka-docs
      from_field: why
    - text: Set your expectations for delivery — at-least-once delivery is the norm, replays happen after failure, and consumers must not see duplicates.
      from_id: pattern-streaming-dedup-upsert
      from_field: forces
    - text: Name the core tradeoff — streaming is fast but hard; batch is simple but slow; you need both speed and correctness.
      from_id: pattern-lambda-vs-kappa
      from_field: problem
    - text: Learn the two architectures — Lambda runs a batch layer (authoritative, reprocessable) plus a speed layer (approximate, low-latency), merged at query time; Kappa is one streaming path where reprocessing means replaying the log, which requires long log retention and replay safety.
      from_id: pattern-lambda-vs-kappa
      from_field: solution
    - text: Carry one health probe into every cluster — is lag rising, flat, or falling? Flat at a high number is fine; rising is not.
      from_id: skill-kafka-lag-triage
      from_field: body
  check_yourself:
    - You can say why a partition gives per-key ordering and why the design section of the docs is where that behavior is explained.
    - Asked whether a nightly batch needs lambda or kappa, you answer with the pattern's own exit — neither, if a nightly batch genuinely meets the SLA.
  when_to_use:
    - "You are new to streaming and need the vocabulary before touching a cluster"
    - "A team debate between lambda and kappa needs a decision framework"
  why: Every streaming incident traces back to a violated assumption about ordering, delivery, or replay — hold the model before holding the tools.
  gotchas:
    - "At-least-once is the norm — replays happen after failure, so consumers must tolerate duplicates from day one."
    - "Flat lag at a high number is fine; rising is not — do not alert on an absolute lag number."
    - "Lambda means two code paths and two bugs — the speed layer must stay consistent with the batch layer."
  production_notes:
    - "Keep raw immutable so history is always reprocessable — the modern default is a single lakehouse path with replayable streams, a pragmatic kappa."
    - "Neither pattern if a nightly batch genuinely meets the SLA — keep it simple."
  diagram: |
    streaming mental model
       |
       |- events, not rows --> append-only log, ordered per partition
       |
       |- at-least-once --> replays happen after failure --> consumers dedupe
       |
       |- batch: simple + slow | stream: fast + hard
       |
       |- lambda --> batch (authoritative) + speed (approx) --> serve
       |- kappa  --> one path; reprocess = replay the log
       |
        --> probe every cluster: is lag rising, flat, or falling?
  code:
    - title: Lambda vs Kappa in one view
      lang: text
      code: |
        Lambda:  source ─┬─ batch (authoritative) ─┐
                         └─ speed (approx)       ─┴─▶ serve
        Kappa:   source ─▶ stream ─▶ table ─▶ serve   (reprocess = replay)
      source_id: pattern-lambda-vs-kappa
    - title: The delivery contract
      lang: text
      code: |
        - At-least-once delivery is the norm
        - Replays happen after failure
        - Consumers must not see duplicates
      source_id: pattern-streaming-dedup-upsert
    - title: The three questions
      lang: text
      code: |
        1. Is lag rising, flat, or falling? Flat at a high number is fine; rising is not.
        2. Is lag even across partitions? Skew means a hot key, not capacity.
        3. Is the consumer group stable? Frequent `PreparingRebalance` is the real bug.
      source_id: skill-kafka-lag-triage
  source_refs: [ref-kafka-docs, pattern-lambda-vs-kappa, pattern-streaming-dedup-upsert, skill-kafka-lag-triage]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/streaming-mental-model
  verification: community
  last_verified: '2026-10-21'
  security: { runs_code: false, network_access: false, credentials: false, filesystem_access: false, external_apis: false }
  relationships: { related_to: [cat-streaming] }
- id: tutorial-streaming-idempotent-sink
  slug: streaming-idempotent-sink
  type: tutorial
  title: Make the sink idempotent so replays never duplicate rows
  description: >-
    The core producer-side reliability skill for streams: you cannot stop
    replays, so the sink must converge. Deduplicate by a business key and
    event time within the watermark, MERGE on the key, and rank change events
    by (lsn, ts_ms) — never by arrival time.
  category: cat-streaming
  series: streaming
  series_title: The Streaming Series
  lesson: 3
  difficulty: intermediate
  tags: [tutorial, streaming, kafka, dedup, merge, idempotency]
  learning_objectives:
    - Make the sink idempotent rather than trying to make the source exactly-once
    - Deduplicate by a business key + event time within the watermark
    - Rank change events deterministically by (lsn, ts_ms), never by arrival time
  what_you_need:
    - A stream writing into Delta/Iceberg or a warehouse table with a stable business key
    - Install: npx de-agent-platform add cdc-merge-designer
  steps:
    - text: Name the failure mode — streaming sinks either duplicate on replay or lose rows on failure.
      from_id: pattern-streaming-dedup-upsert
      from_field: problem
    - text: Make the sink idempotent rather than trying to make the source exactly-once.
      from_id: pattern-streaming-dedup-upsert
      from_field: solution
    - text: Deduplicate by a business key + event time within the watermark, then MERGE (upsert) on the key — a replay recomputes the same rows and merges to the same state, idempotent by construction.
      from_id: pattern-streaming-dedup-upsert
      from_field: solution
    - text: Order by event time, not arrival time.
      from_id: pattern-streaming-dedup-upsert
      from_field: solution
    - text: For change streams, rank by `(lsn, ts_ms)` — never by ingestion time; ranking by LSN makes re-running the same micro-batch produce the same table.
      from_id: skill-cdc-merge-designer
      from_field: body
    - text: Deduplicate before merging — keep the latest event per primary key with a window function, then merge once.
      from_id: skill-cdc-merge-designer
      from_field: body
    - text: Plan for checkpoint loss — checkpoint lost means duplicates, and the fix is making the sink idempotent.
      from_id: project-kafka-spark-delta
      from_field: failure_scenarios
  check_yourself:
    - Replaying the same micro-batch twice produces an identical table — the merge is idempotent by construction.
    - The dedupe key is a business key plus event time within the watermark, not an offset and not an arrival timestamp.
  when_to_use:
    - "Kafka → Delta/Iceberg/warehouse"
    - "Any replay-prone stream"
  why: You cannot stop replays, so the sink must converge to the same state no matter how many times a batch arrives.
  gotchas:
    - "Ranking by arrival time breaks idempotency — rank by (lsn, ts_ms) or event time."
    - "The pattern requires a stable business key and event time; state cost is the price."
    - "A pure append-only event log with no dedup need does not need this pattern."
  production_notes:
    - "Correct under replay with no reliance on perfect exactly-once — that is the goal, and it is achievable."
    - "MERGE aggregates on the window key so replays converge."
  diagram: |
    idempotent sink
       |
       |- stream arrives (at-least-once, replays included)
       |
       |- windowed dedupe by business key + event time
       |
       |- MERGE (upsert on key) --> table converges
       |
        --> replay the same batch --> same rows --> same state
  code:
    - title: The pattern in one line
      lang: text
      code: |
        stream ─▶ [windowed dedupe by key] ─▶ MERGE (upsert on key) ─▶ table
      source_id: pattern-streaming-dedup-upsert
    - title: Ordering and idempotency rules
      lang: text
      code: |
        Events arrive out of order. Rank by `(lsn, ts_ms)` — never by ingestion time.

        Re-running the same micro-batch must produce the same table. Ranking by LSN
        guarantees this; ranking by arrival time does not.
      source_id: skill-cdc-merge-designer
  source_refs: [pattern-streaming-dedup-upsert, skill-cdc-merge-designer, project-kafka-spark-delta]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
