- id: tutorial-streaming-prod-gotchas
  slug: streaming-prod-gotchas
  type: tutorial
  title: Production gotchas — the configs and capacities that break streams
  description: >-
    The five causes of consumer lag on one card, the two destructive shortcuts
    that must never happen, and the capacity trap of scaling past the partition
    count. Ends with the alert that matters — lag slope, not absolute lag — and
    the sampling rules that keep PII out of agent contexts.
  category: cat-kafka
  series: streaming
  series_title: The Streaming Series
  lesson: 8
  difficulty: intermediate
  tags: [tutorial, kafka, production, capacity, config, incidents]
  learning_objectives:
    - Map a lag symptom to its cause before changing any config
    - Refuse the destructive shortcuts — offset resets and hand-edited offsets
    - Size consumers to partitions and fix the sink when lag is uniform
  what_you_need:
    - A cluster whose lag, DLQ depth, and group state you can read
    - Install: npx de-agent-platform add kafka-consumer-lag-triage
  steps:
    - text: Keep the five causes on one card — downstream sink (DB/warehouse) bottleneck, a hot key routed to a single partition, a rebalance loop stealing consumption time, a poison message retried forever, too few consumers for the partition count.
      from_id: runbook-kafka-consumer-lagging
      from_field: possible_causes
    - text: Read the lag shape before scaling — uniform lag means capacity; one stuck partition means key skew or a poison message.
      from_id: runbook-kafka-consumer-lagging
      from_field: gotchas
    - text: Respect the capacity ceiling — adding consumers past the partition count buys nothing.
      from_id: runbook-kafka-consumer-lagging
      from_field: gotchas
    - text: Do not "fix" lag by resetting offsets. That is data loss wearing a hat.
      from_id: skill-kafka-lag-triage
      from_field: body
    - text: On the ingestion side the same rule holds — never hand-edit offsets; replay from the snapshot point.
      from_id: runbook-cdc-stopped
      from_field: gotchas
    - text: Before sampling messages in production, know the risk — sampling can expose production PII in the agent's context; grant a read-only principal, prefer a topic allow-list, and never sample topics containing personal data without masking.
      from_id: mcp-kafka
      from_field: security_notes
    - text: Set the alert that matters — alert on lag slope, not on an absolute lag number, and keep a DLQ for messages failing N times.
      from_id: runbook-kafka-consumer-lagging
      from_field: prevention
  check_yourself:
    - Scaling from 6 to 12 consumers on a 6-partition topic fixes nothing — uniform lag is a sink-throughput problem.
    - No incident in this lesson ends with an offset reset or a hand-edited offset — recovery replays from the log or the snapshot point.
  when_to_use:
    - "A config change is being proposed as the fix for lag"
    - "A new stream goes to production and needs its failure modes listed"
  why: Most streaming outages are self-inflicted — a config changed to chase a symptom, a fleet scaled past the partition count, or an offset reset that deleted data.
  gotchas:
    - "Never reset offsets to clear lag; that is silent data loss."
    - "Adding consumers past the partition count buys nothing."
    - "Credential rotation can stall a connector with no error on the consumer side."
  production_notes:
    - "Alert on lag slope, not on an absolute lag number."
    - "Alert on replication-slot retained WAL and on connector task state."
  diagram: |
    production gotchas
       |
       |- lag uniform --> capacity bound --> fix the SINK, not the fleet
       |- consumers > partitions --> idle members, no gain
       |- PreparingRebalance looping --> session.timeout.ms / max.poll.interval.ms
       |- one offset stuck --> poison message --> DLQ + commit past
       |
       |- never: offset resets, hand-edited offsets
       |- sampling: read-only principal, topic allow-list, mask PII
       |
        --> alert on lag slope, not absolute lag
  code:
    - title: The five causes of lag
      lang: text
      code: |
        - Downstream sink (DB/warehouse) is the bottleneck
        - A hot key routes to a single partition
        - Rebalance loop stealing consumption time
        - A poison message retried forever
        - Too few consumers for the partition count
      source_id: runbook-kafka-consumer-lagging
    - title: The never list
      lang: text
      code: |
        Do not "fix" lag by resetting offsets. That is data loss wearing a hat.
      source_id: skill-kafka-lag-triage
    - title: Sampling risk in production
      lang: text
      code: |
        Sampling messages can expose production PII in the agent's context. Grant a
        read-only principal, prefer a topic allow-list, and never sample topics
        containing personal data without masking.
      source_id: mcp-kafka
