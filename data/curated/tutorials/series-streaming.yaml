  relationships: { related_to: [cat-streaming] }
- id: tutorial-streaming-cdc-lakehouse
  slug: streaming-cdc-lakehouse
  type: tutorial
  title: Stream changes, not tables — CDC from Postgres into the lakehouse
  description: >-
    The intermediate pattern that replaces nightly extraction: read the
    write-ahead log through Debezium, stream through Kafka, dedupe by LSN, and
    MERGE into Delta/Iceberg. Covers tombstones, decimal handling, and what a
    dropped replication slot costs you.
  category: cat-cdc
  series: streaming
  series_title: The Streaming Series
  lesson: 6
  difficulty: intermediate
  tags: [tutorial, cdc, debezium, kafka, postgres, lakehouse]
  learning_objectives:
    - Read the write-ahead log instead of polling source tables
    - Order events by LSN and dedupe before merging
    - Handle tombstones without losing history
  what_you_need:
    - A Postgres source with logical replication available
    - Install: npx de-agent-platform add cdc-merge-designer
  steps:
    - text: Name the gap batch extraction leaves — it loads the data and still misses deletes and mid-day changes.
      from_id: pattern-postgres-cdc-lakehouse
      from_field: problem
    - text: Read the write-ahead log, not the tables — WAL → Debezium → Kafka → [dedupe by LSN] → MERGE into lakehouse.
      from_id: pattern-postgres-cdc-lakehouse
      from_field: solution
    - text: Configure Debezium with `decimal.handling.mode=string` to avoid precision loss.
      from_id: project-postgres-cdc-kafka-lakehouse
      from_field: implementation
    - text: Read the stream, keep the latest event per key by (lsn, ts_ms); MERGE on the primary key; `op='d'` → soft delete with `_deleted_at`.
      from_id: project-postgres-cdc-kafka-lakehouse
      from_field: implementation
    - text: Treat deletes as events — a delete is an event with `op = 'd'`; choose hard delete on merge, or soft delete + `_deleted_at` (required if you need history or audit).
      from_id: skill-cdc-merge-designer
      from_field: body
    - text: Configure a logical replication slot safely.
      from_id: project-postgres-cdc-kafka-lakehouse
      from_field: learning_objectives
    - text: Know the watch item before going live — a dropped replication slot forces a full re-snapshot.
      from_id: pattern-postgres-cdc-lakehouse
      from_field: tradeoffs
  check_yourself:
    - A row deleted in Postgres shows up in the lakehouse as an event with `op = 'd'` — applied as a hard delete or a soft delete with `_deleted_at`, not as a missing row.
    - Replaying the same batch produces an identical table, because events are ranked by (lsn, ts_ms) and deduped before the merge.
  when_to_use:
    - "OLTP → lakehouse with freshness < 15 min"
    - "You need deletes/updates"
  why: Batch extraction from an OLTP database loads it and still misses deletes and mid-day changes — the WAL carries every change with an order you can rank on.
  gotchas:
    - "Replication slot dropped / WAL purged → full re-snapshot required."
    - "Out-of-order events flip a value back → ordering used arrival time."
    - "Never read the source tables on a schedule."
  production_notes:
    - "Alert on slot retained WAL and connector task failures."
    - "Monitor source-vs-target row counts continuously."
  diagram: |
    postgres cdc pipeline
       |
       |- Postgres WAL --> Debezium --> Kafka topic
       |
       |- dedupe by LSN --> latest event per key
       |
       |- MERGE on primary key; op='d' --> soft delete (_deleted_at)
       |
        --> Delta/Iceberg; alert on slot retained WAL + task failures
  code:
    - title: Bring up the CDC stack
      lang: bash
      code: |
        make up  # postgres + kafka + connect + minio
        make register-connector
        make seed-mutations  # insert/update/delete
      source_id: project-postgres-cdc-kafka-lakehouse
    - title: Check the replication slot
      lang: sql
      code: |
        SELECT slot_name, active, restart_lsn, confirmed_flush_lsn FROM pg_replication_slots;
      source_id: runbook-cdc-stopped
    - title: The pipeline in one line
      lang: text
      code: |
        Postgres WAL ─▶ Debezium ─▶ Kafka topic ─▶ stream dedupe ─▶ MERGE ─▶ Delta/Iceberg
      source_id: pattern-postgres-cdc-lakehouse
  source_refs: [pattern-postgres-cdc-lakehouse, project-postgres-cdc-kafka-lakehouse, skill-cdc-merge-designer, runbook-cdc-stopped]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
