- id: tutorial-spark-aggregations-windows
  slug: spark-aggregations-windows
  type: tutorial
  title: Aggregations and windows without the skew
  description: >-
    Aggregations and windows are shuffles in disguise. Treat the group-by key
    as a skew suspect, read p50 vs p99 and the spill bytes, then apply the
    matching fix — a salted two-stage aggregate, more partitions, or a
    partition predicate — and never repartition(1).
  category: cat-spark
  difficulty: intermediate
  tags: [tutorial, spark, aggregations, windows, skew]
  series: data-processing
  series_title: The Data Processing Series
  lesson: 4
  learning_objectives:
    - Read p50 vs p99 task durations to confirm an aggregation is skewed
    - Salt a hot key and aggregate twice
    - Right-size partitions when an oversized aggregate spills
  what_you_need:
    - A Spark job with a group-by or window stage, and its Spark UI or event log
    - Install: npx de-agent-platform add spark-skew-diagnosis
  steps:
    - text: "Treat the group-by (and any window over the same key) as a shuffle — key skew on a join or group-by key is the first cause to check."
      from_id: runbook-spark-job-slow
      from_field: possible_causes
    - text: Check shuffle read/write bytes and spill (disk) bytes per task.
      from_id: runbook-spark-job-slow
      from_field: diagnosis
    - text: Skew if p99 >> p50 (10x+). Uniform slowness if p50 is high.
      from_id: runbook-spark-job-slow
      from_field: diagnosis
    - text: If a hot key skews the aggregate, salt the hot key on both sides and aggregate twice.
      from_id: skill-spark-skew-diagnosis
      from_field: body
    - text: Spill → increase partition count or raise executor memory.
      from_id: runbook-spark-job-slow
      from_field: fix
    - text: AQE skew-join healing does not fix over-scan; check bytes scanned separately.
      from_id: runbook-spark-job-slow
      from_field: gotchas
  check_yourself:
    - "The evidence is attached: task-duration histogram, shuffle read/write bytes, top-10 keys by row count."
    - "A skewed aggregate is fixed by AQE skew join or the salted two-stage aggregate — not by repartition(1)."
  when_to_use:
    - "A group-by or window stage has one or a few tasks that dominate"
    - "An aggregation slows down as the table grows"
  why: The same key that groups your rows concentrates your shuffle, so the skew playbook applies to every aggregate before you buy bigger executors.
  gotchas:
    - "p99 much greater than p50 means skew; uniformly high p50 means capacity. Salting helps the first, not the second."
    - "Spill shows up as slow tasks, not failures — check spill bytes before paying for bigger executors."
    - "`repartition(1)` serialises the stage — never reach for it to 'fix' slowness."
  production_notes:
    - "Baseline shuffle/spill/scan metrics and fail CI on regression."
    - "Monitor task duration p99/p50 ratio, shuffle read/write bytes per run, spill bytes per stage."
  diagram: |
    aggregation / window stage
       |
       |- shuffle by key
       |     |- p99 >> p50 --> key skew --> salt hot key, aggregate twice
       |     |- spill bytes high --> more partitions / executor memory
       |     |- all tasks slow, huge shuffle read --> partition/scan, not skew
       |     |- bytes scanned >> table size --> add partition predicate
  code:
    - title: Evidence to attach to any aggregation fix
      lang: text
      code: |
        The task-duration histogram, the shuffle read/write bytes, and the top-10 keys
        by row count — the review is not complete without them.
      source_id: skill-spark-skew-diagnosis
    - title: Fixes by cause
      lang: text
      code: |
        Skew → enable AQE skew join; else salt the hot key and aggregate twice.
        Spill → increase partition count or raise executor memory.
        Over-scan → add the partition predicate; confirm with bytes scanned.
        Never repartition(1); it serialises the stage.
      source_id: runbook-spark-job-slow
    - title: Monitor the aggregate stage
      lang: text
      code: |
        - task duration p99/p50 ratio
        - shuffle read/write bytes per run
        - spill bytes per stage
      source_id: runbook-spark-job-slow
  source_refs: [runbook-spark-job-slow, skill-spark-skew-diagnosis]
  version: 0.1.0
