- id: tutorial-incremental-watermark-batch
  slug: incremental-watermark-batch
  type: tutorial
  title: Incremental processing with a watermark
  description: >-
    Full reloads stop scaling once a table grows past millions of rows. Process
    a bounded window instead: a watermark ends it, a lookback absorbs late
    files, and an idempotent write (partition overwrite or MERGE) makes every
    re-run safe — including re-processing a late window.
  category: cat-batch-processing
  difficulty: intermediate
  tags: [tutorial, batch, incremental, watermark, late-data]
  series: data-processing
  series_title: The Data Processing Series
  lesson: 5
  learning_objectives:
    - Bound incremental work with a watermark and a lookback window
    - Write incremental output idempotently so a re-run is safe
    - Absorb late-arriving files without re-running history
  what_you_need:
    - An append-mostly source with deterministic event or updated timestamps
    - A table past millions of rows where full reloads cost too much
  steps:
    - text: "Process a window that ends at a watermark and starts a lookback before it: scan from (max(watermark) - lookback) to now."
      from_id: pattern-batch-incremental-watermark
      from_field: solution
    - text: The lookback absorbs late arrivals; the watermark bounds the work.
      from_id: pattern-batch-incremental-watermark
      from_field: solution
    - text: Write idempotently (partition overwrite or MERGE) so a re-run is safe.
      from_id: pattern-batch-incremental-watermark
      from_field: solution
    - text: Handle deletes explicitly (soft-delete or periodic full refresh) — they don't arrive in an append-only stream.
      from_id: pattern-batch-incremental-watermark
      from_field: solution
    - text: Watch a naive is_incremental() without a lookback — it silently drops late data.
      from_id: pattern-batch-incremental-watermark
      from_field: tradeoffs
    - text: Files arrive after the daily job already ran, so yesterday's numbers change the next morning.
      from_id: runbook-late-files
      from_field: description
    - text: Re-process the late window idempotently (partition overwrite or MERGE), and widen the reprocessing window to cover observed lateness.
      from_id: runbook-late-files
      from_field: fix
  check_yourself:
    - A re-run for the same window produces identical output — partition overwrite or MERGE, no appends.
    - "Yesterday's late files are absorbed by the lookback, and no full reload ran."
  when_to_use:
    - "Append-mostly sources"
    - "Cost-sensitive pipelines"
    - "Deterministic event/updated timestamps"
  why: Incremental only pays off if it is safe to re-run — the watermark bounds the cost and the idempotent write bounds the blast radius.
  gotchas:
    - "A naive is_incremental() without a lookback silently drops late data."
    - "Re-running the whole partition for one late file is wasteful — overwrite windows, not history."
    - "Timezone mismatch between partner and pipeline shifts lateness by hours — measure arrival times in UTC."
  production_notes:
    - "Adopt a watermark policy: reprocess the last N days every run."
    - "Use idempotent writes keyed by business date so a re-run is safe."
  diagram: |
    incremental run
       |
       |- watermark --> window = [max(watermark) - lookback, now]
       |
       |- lookback --> late files absorbed, no full reload
       |
       |- write --> OVERWRITE dt=... / MERGE --> re-run safe
       |
       |- deletes --> soft-delete or periodic full refresh
  code:
    - title: The incremental scan
      lang: text
      code: |
        Process a window that ends at a watermark and starts a lookback before it.
          scan from (max(watermark) - lookback) to now

        The lookback absorbs late arrivals; the watermark bounds the work. Write
        idempotently (partition overwrite or MERGE) so a re-run is safe.
      source_id: pattern-batch-incremental-watermark
    - title: List raw-file arrival times
      lang: bash
      code: |
        aws s3api list-objects-v2 --bucket b --prefix in/ --query 'Contents[].LastModified'
      source_id: runbook-late-files
    - title: What to monitor
      lang: text
      code: |
        - max file lateness
        - count of late arrivals per run
      source_id: runbook-late-files
  source_refs: [pattern-batch-incremental-watermark, runbook-late-files]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/incremental-watermark-batch
