- id: tutorial-batch-capstone-checklist
  slug: batch-capstone-checklist
  type: tutorial
  title: Capstone — the batch pipeline checklist
  description: >-
    Bring the API → S3 → Spark → Parquet starter up end to end, then audit it:
    offline transform tests, idempotent partition-scoped writes, complete
    partitions, replay-safe extraction, and baseline metrics with a CI guard.
    One pipeline that exercises every lesson in the series.
  category: cat-batch-processing
  difficulty: intermediate
  tags: [tutorial, batch, capstone, idempotency, checklist]
  series: data-processing
  series_title: The Data Processing Series
  lesson: 10
  learning_objectives:
    - Run a batch pipeline end to end with offline tests
    - Prove idempotency with a two-run row-count check
    - Ship the completeness, hardening, and baseline guards
  what_you_need:
    - Docker (the starter runs MinIO + a local Spark)
    - An API endpoint to extract from, or the seeded sample data
  steps:
    - text: The pipeline — REST API → extract (paginate + retry) → S3 raw/ (JSON, immutable) → PySpark transform (type, dedupe, partition) → S3 curated/ (Parquet, dt=.., Hive layout).
      from_id: project-api-s3-spark-parquet
      from_field: architecture
    - text: "Bring it up — `make up` starts MinIO + a local Spark, `make seed` uploads sample raw JSON, `make test` runs the transform tests offline."
      from_id: project-api-s3-spark-parquet
      from_field: setup
    - text: The tests that matter — row count stable across two runs (idempotency), no nulls in the business key, and partition dt matches the logical date, not the wall clock.
      from_id: project-api-s3-spark-parquet
      from_field: tests
    - text: A re-run for the same date must not duplicate rows — the overwrite is partition-scoped.
      from_id: project-api-s3-spark-parquet
      from_field: failure_scenarios
    - text: The invariant — running the same date twice yields identical output.
      from_id: pattern-idempotent-partition-overwrite
      from_field: solution
    - text: Harden — retry with jittered exponential backoff, alert on extract lag and on null business keys, checksum raw files, and store the API's cursor for replay.
      from_id: project-api-s3-spark-parquet
      from_field: production_hardening
    - text: A completeness check asserts every expected partition exists, and the logical date is stored explicitly as a partition column, not derived at read time.
      from_id: runbook-missing-partition
      from_field: prevention
  check_yourself:
    - "Two consecutive runs produce the same row count, and dt equals the logical date."
    - "Baseline shuffle/spill/scan metrics exist and CI fails on a regression."
    - "The overwrite is partition-scoped — a re-run for the same date does not duplicate rows."
  when_to_use:
    - "You finished the series and want one pipeline that exercises every lesson"
    - "A new batch pipeline needs a production checklist before its first real run"
  why: A pipeline is done when re-runs are safe, partitions are complete, and the metrics that would catch today's failure are baselined.
  gotchas:
    - "A re-run for the same date duplicates rows → the overwrite is not partition-scoped."
    - "An API returns 429 → backoff then resume from the last cursor, not from page 1."
    - "An empty partition and an absent partition both read as 'no data' downstream."
  production_notes:
    - "Checksum raw files; store the API's cursor for replay."
    - "Store the logical date explicitly as a partition column, not derived at read time."
  diagram: |
    capstone checklist
       |
       |- run --> make up / seed / test (offline, MinIO + local Spark)
       |
       |- idempotency --> row count stable across two runs
       |
       |- completeness --> every expected dt partition exists
       |
       |- hardening --> backoff, cursor replay, raw checksums
       |
       |- guard --> baseline shuffle/spill/scan, CI fails on regression
  code:
    - title: Bring the pipeline up
      lang: bash
      code: |
        make up    # starts MinIO + a local Spark
        make seed  # uploads sample raw JSON
        make test  # runs the transform tests offline
      source_id: project-api-s3-spark-parquet
    - title: The pipeline under test
      lang: text
      code: |
        REST API ─▶ [extract: paginate + retry] ─▶ S3 raw/ (JSON, immutable)
                                                          │
                                                          ▼
                                        [PySpark transform: type, dedupe, partition]
                                                          │
                                                          ▼
                                        S3 curated/ (Parquet, dt=.., Hive layout)
      source_id: project-api-s3-spark-parquet
    - title: Failure scenarios to drill
      lang: text
      code: |
        - API returns 429 → backoff then resume from the last cursor, not from page 1
        - A page arrives with a changed field type → quarantine the page, alert
        - A re-run for the same date duplicates rows → the overwrite is not partition-scoped
      source_id: project-api-s3-spark-parquet
