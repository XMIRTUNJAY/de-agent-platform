- id: tutorial-spark-incident-diagnosis
  slug: spark-incident-diagnosis
  type: tutorial
  title: The 3am batch incident path
  description: >-
    The nightly job is crawling or dead under memory pressure or skew. Follow
    the incident path: collect the four pieces of evidence, read p50 vs p99
    and the spill bytes, decide revert vs fix, escalate on golden-hour SLAs,
    and record the skew/spill/scan signature so the next run is faster to
    diagnose.
  category: cat-spark
  difficulty: advanced
  tags: [tutorial, spark, incident, skew, spill]
  series: data-processing
  series_title: The Data Processing Series
  lesson: 9
  learning_objectives:
    - Collect the four pieces of evidence a failing Spark run needs
    - Decide between revert, a config change, and a code fix
    - Record the skew/spill/scan signature for the cost-per-run history
  what_you_need:
    - The affected run's event log and Spark UI stage summary
    - The job source and its recent config changes
    - Install: amp plugin add de-agent/spark-lens
  steps:
    - text: Symptoms — job duration rose sharply with no code change, one or a few tasks dominate the stage, and executors idle while a handful run long.
      from_id: runbook-spark-job-slow
      from_field: symptoms
    - text: Collect the evidence — Spark UI stage summary p50/p99 task durations, shuffle read/write and spill bytes per task, input bytes scanned vs the expected partition size, and the run's event log.
      from_id: runbook-spark-job-slow
      from_field: evidence_to_collect
    - text: Skew if p99 >> p50 (10x+), uniform slowness if p50 is high; check input bytes scanned vs table size.
      from_id: runbook-spark-job-slow
      from_field: diagnosis
    - text: No code rollback — the job is unchanged. Revert only if a config change (AQE flags, executor sizing) preceded the regression.
      from_id: runbook-spark-job-slow
      from_field: rollback
    - text: Fix — skew gets AQE skew join or a salted hot key; spill gets more partitions or executor memory; over-scan gets a partition predicate. Never repartition(1).
      from_id: runbook-spark-job-slow
      from_field: fix
    - text: Page the on-call data engineer if the job sits on a golden-hour SLA; otherwise file it and let the owning team run diagnosis in hours.
      from_id: runbook-spark-job-slow
      from_field: escalation
    - text: Follow up — record the skew/spill/scan signature in the run's cost-per-run history, and add the partition-filter lint or CI metric guard that would have caught it.
      from_id: runbook-spark-job-slow
      from_field: follow_up
  check_yourself:
    - "The evidence packet is attached: p50/p99 durations, shuffle/spill bytes per task, input bytes scanned, and the event log."
    - "The decision — revert vs AQE/salt/spill fix — cites a config change or a metric, not a hunch."
  when_to_use:
    - "A batch job's runtime jumped and no code changed"
    - "Executors idle while a few tasks run long"
    - "A nightly run failed or blew past its SLA"
  why: 3am is the wrong time to start instrumenting — the incident path runs symptoms, evidence, rollback-or-fix, and leaves a signature behind.
  gotchas:
    - "Spill shows up as slow tasks, not failures — check spill bytes before paying for bigger executors."
    - "repartition(1) serialises the stage — never reach for it to 'fix' slowness."
    - "p99 much greater than p50 means skew; uniformly high p50 means capacity. Salting helps the first, not the second."
  production_notes:
    - "Monitor task duration p99/p50 ratio, shuffle read/write bytes per run, spill bytes per stage."
    - "Baseline shuffle/spill/scan metrics so CI fails a regression before the SLA does."
  diagram: |
    3am incident
       |
       |- symptoms --> runtime jumped, no code change, few tasks dominate
       |
       |- evidence --> p50/p99 + shuffle/spill bytes + bytes scanned + event log
       |
       |- decide --> config change? revert : AQE / salt / partitions / predicate
       |
       |- escalate --> golden-hour SLA? page on-call
       |
       |- follow up --> record signature, add the CI guard
  code:
    - title: Evidence to collect
      lang: text
      code: |
        - Spark UI stage summary: p50/p99 task durations for the slow stages
        - Shuffle read/write and spill bytes per task
        - Input bytes scanned vs the expected partition size
        - The job's event log for the affected run
      source_id: runbook-spark-job-slow
    - title: Rollback and escalation rules
      lang: text
      code: |
        No code rollback — the job is unchanged. Revert only if a config change
        (AQE flags, executor sizing) preceded the regression.

        Page the on-call data engineer if the job sits on a golden-hour SLA;
        otherwise file it and let the owning team run diagnosis in hours.
      source_id: runbook-spark-job-slow
    - title: Turn the event log into a histogram
      lang: bash
      code: |
        amp plugin add de-agent/spark-lens
        /spark-analyze        # task histogram; flags skew and shuffle amplification
      source_id: plugin-spark-lens
  source_refs: [runbook-spark-job-slow, plugin-spark-lens]
  version: 0.1.0
