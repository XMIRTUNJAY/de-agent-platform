- id: tutorial-spark-tuning-memory-partitions
  slug: spark-tuning-memory-partitions
  type: tutorial
  title: Tune a slow job — memory, partitions, baselines
  description: >-
    Run the tuning loop on a slow batch job: parse task-duration and shuffle
    metrics, classify the stage as skew, partition count, spill or scan, apply
    the single highest-impact change, and verify it against a stored baseline
    the CI guard enforces.
  category: cat-spark
  difficulty: advanced
  tags: [tutorial, spark, performance, tuning, spill]
  series: data-processing
  series_title: The Data Processing Series
  lesson: 6
  learning_objectives:
    - Classify a slow stage into skew, partition count, spill, or scan
    - Apply the single highest-impact fix with an expected effect
    - Verify the change against baseline shuffle/spill/scan metrics
  what_you_need:
    - The job's event log or Spark UI metrics
    - A stored cost baseline for the job
    - Install: amp plugin add de-agent/spark-lens
  steps:
    - text: Parse task-duration and shuffle metrics.
      from_id: agent-spark-optimizer
      from_field: workflow
    - text: Classify the stage — skew, partition count, spill, or scan.
      from_id: agent-spark-optimizer
      from_field: workflow
    - text: Spill → increase partition count or raise executor memory.
      from_id: runbook-spark-job-slow
      from_field: fix
    - text: Over-scan → add the partition predicate; confirm with bytes scanned.
      from_id: runbook-spark-job-slow
      from_field: fix
    - text: Propose the single highest-impact change with expected effect, then verify against the baseline metrics.
      from_id: agent-spark-optimizer
      from_field: workflow
    - text: Baseline shuffle/spill/scan metrics and fail CI on regression, and add a partition filter lint on source reads.
      from_id: runbook-spark-job-slow
      from_field: prevention
  check_yourself:
    - "You can name which of skew, partition count, spill, or scan was the cause, with the metrics to prove it."
    - "The change you shipped is the single highest-impact one, and the stored baseline shows no regression."
  when_to_use:
    - "A batch job's runtime jumped and no code changed"
    - "Before paying for bigger executors"
  why: Tuning without a classification loop is guessing — parse, classify, fix one thing, and verify against a baseline.
  gotchas:
    - "repartition(1) serialises the stage — never reach for it to 'fix' slowness."
    - "Spill shows up as slow tasks, not failures — check spill bytes before paying for bigger executors."
    - "AQE skew-join healing does not fix over-scan; check bytes scanned separately."
  production_notes:
    - "Baseline shuffle/spill/scan metrics and fail CI on regression."
    - "Monitor task duration p99/p50 ratio, shuffle read/write bytes per run, spill bytes per stage."
  diagram: |
    slow job
       |
       |- parse --> task-duration + shuffle metrics
       |
       |- classify --> skew | partition count | spill | scan
       |
       |- fix --> single highest-impact change
       |
       |- verify --> baseline metrics --> CI guard fails on regression
  code:
    - title: The tuning loop
      lang: text
      code: |
        1. Parse task-duration and shuffle metrics.
        2. Classify: skew, partition count, spill, or scan.
        3. Propose the single highest-impact change with expected effect.
        4. Verify against the baseline metrics.
      source_id: agent-spark-optimizer
    - title: What the event-log plugin adds
      lang: text
      code: |
        Parses Spark event logs into a task histogram, flags skew and shuffle
        amplification, and compares against a stored cost baseline.
      source_id: plugin-spark-lens
    - title: The prevention pair
      lang: text
      code: |
        - Baseline shuffle/spill/scan metrics and fail CI on regression.
        - Add a partition filter lint on source reads.
      source_id: runbook-spark-job-slow
  source_refs: [agent-spark-optimizer, runbook-spark-job-slow, plugin-spark-lens]
