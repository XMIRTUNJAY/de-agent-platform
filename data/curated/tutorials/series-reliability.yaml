- id: tutorial-reliability-dr-replication
  slug: reliability-dr-replication
  type: tutorial
  title: DR and replication — design the recovery path before you need it
  description: >-
    Disaster recovery for data systems starts before the outage: DDIA's
    replication and consistency chapters name the mechanisms, and the registry's
    runbooks name the recovery paths — code rollback for deterministic failures,
    quarantine-then-retry for data errors, shadow-then-swap for recomputes.
  category: cat-reliability
  difficulty: intermediate
  tags: [tutorial, reliability, disaster-recovery, replication, rollback]
  series: reliability
  series_title: The Reliability Series
  lesson: 6
  learning_objectives:
    - Map replication and consistency from DDIA to mechanisms in your own stack
    - Keep the old data until the new data is validated — shadow-then-swap as rollback
    - Classify recovery per failure class — code rollback vs quarantine-then-retry vs recompute
  what_you_need:
    - The tables your consumers cannot lose
    - The deploy/revert mechanism for pipeline code
    - A recovery drill scheduled with the platform owner
  steps:
    - text: DDIA's chapters map directly to patterns in this registry — replication to CDC, partitioning to lakehouse, consistency to transaction semantics.
      from_id: ref-ddia
      from_field: description
    - text: A recovery design must satisfy three forces — correctness must be verifiable, production must stay available, rollback must be possible.
      from_id: pattern-backfill-safety
      from_field: forces
    - text: "Keep the old data until validated — shadow-then-swap keeps rollback in reach: delete the shadow, never the production table; swap only after sample validation passes."
      from_id: runbook-backfill-required
      from_field: rollback
    - text: Classify the recovery by failure class — roll back the code deploy if the class is deterministic and new; data errors get quarantine-then-retry, not rollback.
      from_id: runbook-pipeline-failed
      from_field: rollback
    - text: Recovery is when destructive SQL is most dangerous — destructive statements are denied by default, and a DELETE/UPDATE without a WHERE clause is always denied.
      from_id: hook-destructive-sql-guard
      from_field: implementation
    - text: Any write-class tool against a production target is suspended and surfaced for a human "approve once" token scoped to the single call.
      from_id: hook-prod-write-confirm
      from_field: implementation
  check_yourself:
    - Every critical table has a named recovery path — code rollback, quarantine-then-retry, or shadow-then-swap recompute.
    - The old data still exists until the replacement is validated — you have never deleted production to fix production.
  when_to_use:
    - "Deciding which tables need replication, snapshots or both"
    - "Writing the recovery section of a pipeline's runbook"
  why: Rollback must be possible — a recovery path that starts with "delete production" is not a path, and replication is the principle that keeps one open.
  gotchas:
    - "Roll back the code deploy if the class is deterministic and new — data errors get quarantine-then-retry, not rollback."
    - "Delete the shadow, never the production table; swap only after sample validation passes."
    - "A DELETE/UPDATE without a WHERE clause is always denied — recovery scripts are not exempt."
  production_notes:
    - "Map replication to CDC and consistency to transaction semantics when choosing the mechanism for each critical table."
    - "Suspend write-class tools against production targets during recovery — a human approve-once token scoped to a single call."
  diagram: |
    recovery paths
       |
       |- deterministic (new code) --> roll back the deploy
       |
       |- data error --> quarantine input --> re-run idempotently
       |
       |- recompute --> shadow-then-swap --> old data kept until validated
       |
       |- destructive SQL during recovery --> denied by default
  code:
    - title: Recovery classification
      lang: text
      code: |
        Roll back the code deploy if the class is deterministic and new; data errors
        get quarantine-then-retry, not rollback.
      source_id: runbook-pipeline-failed
    - title: The three forces a recovery design satisfies
      lang: text
      code: |
        - Correctness must be verifiable
        - Production must stay available
        - Rollback must be possible
      source_id: pattern-backfill-safety
  source_refs: [ref-ddia, pattern-backfill-safety, runbook-backfill-required, runbook-pipeline-failed, hook-destructive-sql-guard, hook-prod-write-confirm]
