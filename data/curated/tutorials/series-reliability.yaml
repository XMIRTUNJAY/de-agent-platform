# The Reliability Series — new lessons that join the four existing
# reliability-stage tutorials (10-cost-engineering.yaml: lessons 2, 5, 7, 9)
# into one ordered 10-lesson series for the reliability roadmap stage.
# Every step derives from the cited source field; structure is ours, wording
# is the source's.
- id: tutorial-reliability-mental-model
  slug: reliability-mental-model
  type: tutorial
  title: The data reliability mental model — freshness, completeness, correctness
  description: >-
    Build the map before writing a single check: a consumer experiences a table
    as three properties — freshness, completeness, correctness — declared as an
    SLA in a data contract, enforced by a CI test, and spent like an error
    budget when failures land.
  category: cat-reliability
  difficulty: beginner
  tags: [tutorial, reliability, sla, data-contracts, mental-model, beginner]
  series: reliability
  series_title: The Reliability Series
  lesson: 1
  learning_objectives:
    - Name the three properties a consumer experiences — freshness, completeness, correctness
    - Read a data contract's SLA section as the table's reliability promise
    - Explain why an unenforced SLA is documentation, not a contract
  what_you_need:
    - A table your team's consumers depend on
    - The pipeline's schedule and the source's declared freshness SLA
    - Install: npx de-agent-platform add data-contract-author
  steps:
    - text: Reliability is the first word in DDIA's list of what data systems must balance — reliability, scalability, replication, partitioning, consistency — and every chapter maps directly to patterns in this registry.
      from_id: ref-ddia
      from_field: description
    - text: A contract has six parts — owner, schema, semantics, SLA, breaking-change policy, enforcement — and part four is the SLA (freshness, completeness).
      from_id: skill-data-contract-author
      from_field: body
    - text: Specify a freshness and completeness SLA — the two promises consumers experience first.
      from_id: skill-data-contract-author
      from_field: learning_objectives
    - text: Freshness is computed, not felt — compare the schedule/cron with the source's declared freshness SLA, and when a change can produce data older than the SLA, warn with the computed worst-case lag.
      from_id: hook-freshness-pre-merge
      from_field: implementation
    - text: Correctness needs a written definition before anyone re-runs anything — what should the values be, and how will you check?
      from_id: runbook-backfill-required
      from_field: diagnosis
    - text: Design for the forces that never go away — retries are inevitable, backfills are routine, consumers must see stable values.
      from_id: pattern-idempotent-partition-overwrite
      from_field: forces
    - text: A contract with no enforcement is documentation. Documentation is not a contract.
      from_id: skill-data-contract-author
      from_field: body
  check_yourself:
    - You can name freshness, completeness and correctness for a table you consume, and say where each is declared.
    - Given a cron change, you can compute the worst-case lag and say whether it violates the declared freshness SLA.
  when_to_use:
    - "Onboarding onto a table or pipeline your team depends on"
    - "Deciding what 'reliable' means before writing a single check"
  why: Reliability is three promises a consumer experiences — freshness, completeness, correctness — and a promise nobody enforces is documentation, not a contract.
  gotchas:
    - "A contract with no enforcement is documentation. Documentation is not a contract."
    - "The SLA miss cascades — downstream tasks sit skipped/upstream_failed until the failure is classified and recovered."
    - "Retries are inevitable and backfills are routine — design for them instead of hoping."
  production_notes:
    - "Put freshness and completeness in the contract's SLA section, with the CI test that enforces each."
    - "Compute the worst-case lag when a schedule changes instead of trusting the cron."
  diagram: |
    data reliability mental model
       |
       |- freshness --> declared SLA --> worst-case lag computed on schedule change
       |
       |- completeness --> SLA section of the contract
       |
       |- correctness --> written definition: what should the values be?
       |
       |- enforcement --> a CI test that fails on violation, or it is not a contract
  code:
    - title: A contract has six parts
      lang: text
      code: |
        1. Owner (a team, with an on-call).
        2. Schema (typed, versioned).
        3. Semantics (what each field *means*, units, nullability).
        4. SLA (freshness, completeness).
        5. Breaking-change policy (notice period, deprecation path).
        6. Enforcement (which CI test fails on violation).
      source_id: skill-data-contract-author
    - title: The freshness check
      lang: text
      code: |
        Compare the schedule/cron in the diff with the source's declared freshness SLA.
        If the new schedule can produce data older than the SLA (e.g. daily when the
        SLA is 6h), warn with the computed worst-case lag.
      source_id: hook-freshness-pre-merge
  source_refs: [ref-ddia, skill-data-contract-author, hook-freshness-pre-merge, runbook-backfill-required, pattern-idempotent-partition-overwrite]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/reliability-mental-model
  github_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials
  verification: community
  last_verified: '2026-10-23'
  security: { runs_code: false, network_access: false, credentials: false, filesystem_access: false, external_apis: false }
  relationships: { related_to: [cat-reliability] }
- id: tutorial-reliability-safe-backfills
  slug: reliability-safe-backfills
  type: tutorial
  title: Plan and execute a backfill that doesn't break production
  description: >-
    Historical output is wrong or missing, and the fix touches a production
    table: define correct first, map the blast radius from lineage, then
    shadow-write in date batches smallest-first, validate a sample per batch,
    and swap atomically — behind a gate that demands a rollback path.
  category: cat-production-operations
  difficulty: intermediate
  tags: [tutorial, reliability, backfill, production, shadow-swap]
  series: reliability
  series_title: The Reliability Series
  lesson: 3
  learning_objectives:
    - Scope a backfill by date, dependency and blast radius before running anything
    - Shadow-write in date batches, smallest first, validating a sample per batch
    - Gate the backfill on an explicit range and a rollback path
  what_you_need:
    - A past date range in a production table that is wrong or missing
    - The pipeline's idle window and resource budget
    - Install: npx de-agent-platform add backfill-planner
  steps:
    - text: Historical output is wrong or missing and must be recomputed safely, without breaking production.
      from_id: runbook-backfill-required
      from_field: description
    - text: Before running anything — which dates are wrong and what does "correct" look like; every downstream model/table that reads the target; will this run beside the daily job and at what hour the cluster is idle; can each date be re-run safely; snapshot the target or write to a shadow table first.
      from_id: skill-backfill-planner
      from_field: body
    - text: Define correctness first — what should the values be, and how will you check? Then compute the downstream impact set from lineage.
      from_id: runbook-backfill-required
      from_field: diagnosis
    - text: Treat a backfill as a controlled migration — 1. shadow target (or snapshot), 2. batched date ranges smallest first, 3. validate a sample after each batch, 4. swap atomically, 5. keep the old data until validated.
      from_id: pattern-backfill-safety
      from_field: solution
    - text: The safety gate requires an explicit date range, a target that is either a shadow table or snapshotted, and a window that does not overlap the scheduled production run — it denies otherwise.
      from_id: hook-backfill-safety-check
      from_field: implementation
    - text: Never run a backfill concurrently with the daily production run; one huge date range starves the cluster — batch it and validate a sample per batch.
      from_id: runbook-backfill-required
      from_field: gotchas
    - text: Shadow-then-swap keeps rollback in reach — delete the shadow, never the production table; swap only after sample validation passes.
      from_id: runbook-backfill-required
      from_field: rollback
  check_yourself:
    - The plan names the wrong dates, the written definition of correct, the downstream blast radius and the rollback path before anything runs.
    - The run writes to a shadow target in date batches, smallest first, and the swap happens only after sample validation passes.
  when_to_use:
    - "A past date range is wrong or missing"
    - "A logic fix or new column must be applied historically"
  why: A backfill is production work with a bigger blast radius than the original pipeline — shadow-write, sample-validate, then swap.
  gotchas:
    - "Never run a backfill concurrently with the daily production run."
    - "One huge date range starves the cluster; batch it and validate a sample per batch."
    - "Backfilling without a written definition of correctness just relocates the bug."
  production_notes:
    - "Idempotent pipelines make a backfill a routine operation."
    - "Document a backfill runbook per pipeline, with its idle window and resource budget."
  diagram: |
    safe backfill
       |
       |- define correct + lineage impact --> blast radius known
       |
       |- shadow target (or snapshot) --> batched ranges, smallest first
       |
       |- validate sample per batch --> pass --> swap atomically
       |                              fail --> delete the shadow, never prod
  code:
    - title: The batched backfill command
      lang: bash
      code: |
        airflow dags backfill --start-date YYYY-MM-DD --end-date YYYY-MM-DD --reset-dagruns dag_id
        # prefer batched date ranges over one large range
      source_id: runbook-backfill-required
    - title: What the safety gate requires
      lang: text
      code: |
        Intercepts a backfill trigger. Requires: an explicit date range, a target that
        is either a shadow table or snapshotted, and a window that does not overlap the
        scheduled production run. Denies otherwise.
      source_id: hook-backfill-safety-check
    - title: The five-step controlled migration
      lang: text
      code: |
        1. shadow target (or snapshot)
        2. batched date ranges, smallest first
        3. validate a sample after each batch
        4. swap atomically
        5. keep the old data until validated
      source_id: pattern-backfill-safety
  source_refs: [runbook-backfill-required, skill-backfill-planner, pattern-backfill-safety, hook-backfill-safety-check]
  version: 0.1.0
