- id: tutorial-reliability-idempotent-reruns
  slug: reliability-idempotent-reruns
  type: tutorial
  title: Idempotency and reruns — make every task safe to run twice
  description: >-
    Retries are inevitable, so a task that appends duplicates rows every time it
    is cleared: hold each task to the idempotency test, replace its partition
    atomically instead of appending, and assert the invariant in CI with a test
    that runs the same date twice.
  category: cat-reliability
  difficulty: intermediate
  tags: [tutorial, reliability, idempotency, reruns, partitions, testing]
  series: reliability
  series_title: The Reliability Series
  lesson: 4
  learning_objectives:
    - Apply the idempotency test to every task before trusting retries
    - Replace appends with atomic partition overwrites keyed by the logical date, or MERGE
    - Assert idempotency in CI with an invariant test on row counts
  what_you_need:
    - A batch job that can be cleared and retried
    - A logical date or partition key per run
    - Install: npx de-agent-platform add pipeline-test-author
  steps:
    - text: Retries and backfills duplicate or corrupt data because writes are appends.
      from_id: pattern-idempotent-partition-overwrite
      from_field: problem
    - text: Hold every task to the idempotency test — "If this task runs twice for the same logical date, is the output the same?" If no, fix it before anything else — retries will happen.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: Make each run write the complete result for its logical partition and replace that partition atomically — `INSERT OVERWRITE partition(dt=...)` or Delta/Iceberg replace-where. The invariant — running the same date twice yields identical output.
      from_id: pattern-idempotent-partition-overwrite
      from_field: solution
    - text: Every task writes to a partition keyed by the logical date, or uses MERGE.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: A re-run is only safe if the task is idempotent — check before clearing.
      from_id: runbook-pipeline-failed
      from_field: gotchas
    - text: Make every task idempotent so a re-run is always safe, and retry with backoff.
      from_id: runbook-pipeline-failed
      from_field: prevention
    - text: Assert invariants, not snapshots — count(*) is stable across a re-run (idempotency), no nulls in the grain key, sum(revenue) equals the source sum within tolerance.
      from_id: skill-pipeline-test-author
      from_field: body
  check_yourself:
    - Running the same logical date twice yields identical output — proven by a CI test that asserts count(*) is stable across a re-run.
    - No task appends to a partition it can recompute.
  when_to_use:
    - "Wiring retries onto any task that writes"
    - "Preparing a pipeline you will need to backfill"
  why: Retries are inevitable, so a task that is not idempotent turns every retry into a duplicate — make each run replace its partition atomically instead of appending.
  gotchas:
    - "Retries and backfills duplicate or corrupt data because writes are appends."
    - "A re-run is only safe if the task is idempotent — check before clearing."
    - "Idempotency costs an upsert/overwrite pattern on every write — pay it once and retries become routine."
  production_notes:
    - "Idempotent tasks turn incidents into routine re-runs."
    - "If a test needs the network or a running warehouse, it is not a unit test — keep the invariant harness offline."
  diagram: |
    idempotent reruns
       |
       |- idempotency test --> "same logical date twice, same output?"
       |
       |- append --> duplicates on retry   (the bug)
       |- INSERT OVERWRITE partition / MERGE --> atomic replace  (the fix)
       |
       |- CI invariant --> count(*) stable across re-run
  code:
    - title: The idempotency test
      lang: text
      code: |
        "If this task runs twice for the same logical date, is the output the same?"
        If no, fix it before anything else — retries will happen.
      source_id: skill-airflow-dag-reviewer
    - title: The invariant list for the harness
      lang: text
      code: |
        - `count(*)` is stable across a re-run (idempotency)
        - no nulls in the grain key
        - sum(revenue) equals the source sum within tolerance
        - a quarantined row never appears in the published table
      source_id: skill-pipeline-test-author
    - title: The atomic overwrite
      lang: text
      code: |
        Make each run write the complete result for its logical partition and replace
        that partition atomically. Never append to a partition you can recompute.
        `INSERT OVERWRITE partition(dt=...)` or Delta/Iceberg replace-where do this.
      source_id: pattern-idempotent-partition-overwrite
  source_refs: [pattern-idempotent-partition-overwrite, skill-airflow-dag-reviewer, runbook-pipeline-failed, skill-pipeline-test-author]
  version: 0.1.0
