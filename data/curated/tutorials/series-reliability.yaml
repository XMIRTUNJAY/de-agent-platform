- id: tutorial-reliability-prod-gotchas
  slug: reliability-prod-gotchas
  type: tutorial
  title: Production gotchas — silent failures and partial writes
  description: >-
    The failures that become pages are the ones nobody was watching: a
    regression hiding in growth, a cron change that silently widens the
    freshness SLA, and appends that duplicate on retry — cap each with a
    guard, a computed worst-case lag, and an atomic partition replace.
  category: cat-production-operations
  difficulty: intermediate
  tags: [tutorial, reliability, production, silent-failures, partial-writes, hooks]
  series: reliability
  series_title: The Reliability Series
  lesson: 8
  learning_objectives:
    - Catch silent failures — hidden cost regressions and silently widened freshness SLAs
    - Stop partial writes — no appends to recomputable partitions, no unguarded prod writes
    - Put the failure class in the alert text so on-call can triage before touching anything
  what_you_need:
    - The pipelines currently in production
    - An alerting channel wired to task failure rate and SLA misses
    - CI where a hook can warn or block a merge
  steps:
    - text: A working pipeline silently becomes expensive and nobody notices until the invoice.
      from_id: pattern-cost-guardrails
      from_field: problem
    - text: A change can silently widen the freshness SLA of a source — compare the schedule/cron in the diff with the source's declared freshness SLA and warn with the computed worst-case lag.
      from_id: hook-freshness-pre-merge
      from_field: implementation
    - text: Partial writes come from appends — retries and backfills duplicate or corrupt data because writes are appends; replace the partition atomically instead.
      from_id: pattern-idempotent-partition-overwrite
      from_field: problem
    - text: Read the first real error in the log, not the last — and retrying a data error re-runs the same failure; fix or quarantine the input first.
      from_id: runbook-pipeline-failed
      from_field: gotchas
    - text: Guard every production write — any write-class tool against a production target is suspended and surfaced for a human "approve once" token scoped to the single call.
      from_id: hook-prod-write-confirm
      from_field: implementation
    - text: "`DROP TABLE prod.orders` from an agent is denied and surfaced for confirmation."
      from_id: hook-destructive-sql-guard
      from_field: example
    - text: Retry with backoff, and put the failure class in the alert text.
      from_id: runbook-pipeline-failed
      from_field: production_notes
  check_yourself:
    - A cron change that would violate the freshness SLA warns at pre-merge with the computed worst-case lag.
    - No production write path exists that a hook does not classify, confirm or block.
  when_to_use:
    - "Hardening pipelines that already serve consumers"
    - "After an incident caused by a silent failure or a partial write"
  why: The failures that page you are the ones no dashboard was watching — silent regressions, silently widened SLAs and appends that duplicate on retry.
  gotchas:
    - "Read the first real error in the log, not the last."
    - "Retrying a data error re-runs the same failure; fix or quarantine the input first."
    - "Spend varies with data growth and regressions hide in growth — total-spend dashboards cannot see them."
  production_notes:
    - "Retry with backoff, and put the failure class in the alert text."
    - "Make every task idempotent so a re-run is always safe."
  diagram: |
    silent failures + partial writes
       |
       |- regression hides in growth --> unit metric + baseline catches it
       |
       |- cron change --> freshness SLA widened silently --> warn with worst-case lag
       |
       |- append on retry --> duplicated rows --> atomic partition replace
       |
       |- prod write --> classified + confirmed or blocked
  code:
    - title: The silent widening example
      lang: text
      code: |
        Changing a source cron from hourly to daily warns that the 6h freshness SLA
        will be violated.
      source_id: hook-freshness-pre-merge
    - title: The production write suspension
      lang: text
      code: |
        Classify the tool target as production by connection string, project or
        catalogue tag. Any write-class tool against a production target is suspended
        and surfaced for a human "approve once" token scoped to the single call.
      source_id: hook-prod-write-confirm
  source_refs: [pattern-cost-guardrails, hook-freshness-pre-merge, pattern-idempotent-partition-overwrite, runbook-pipeline-failed, hook-prod-write-confirm, hook-destructive-sql-guard]
  version: 0.1.0
