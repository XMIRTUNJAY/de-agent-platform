- id: tutorial-reliability-capstone
  slug: reliability-capstone
  type: tutorial
  title: Capstone — the reliability checklist for a pipeline you can page on
  description: >-
    Close the series by running the reliability checklist over your own
    pipeline: a declared and enforced SLA, idempotent tasks with backoff
    retries, a documented backfill runbook — then drill the incident path from
    alert to blameless postmortem with dated, owned action items.
  category: cat-reliability
  difficulty: intermediate
  tags: [tutorial, reliability, incident, postmortem, checklist, capstone]
  series: reliability
  series_title: The Reliability Series
  lesson: 10
  learning_objectives:
    - Run the reliability checklist over your own pipeline end to end
    - Drill the incident path — match the alert, walk the runbook, capture the timeline
    - Close with a blameless postmortem with dated, owned action items
  what_you_need:
    - The pipeline you built across this series
    - Its SLA, runbook and alert routing
    - Install: npx de-agent-platform add incident-postmortem-writer
  steps:
    - text: Declare the SLA — freshness and completeness — with the CI test that enforces it, because a contract with no enforcement is documentation.
      from_id: skill-data-contract-author
      from_field: body
    - text: Make every task idempotent so a re-run is always safe, and retry with backoff with a clear failure classification in the alert.
      from_id: runbook-pipeline-failed
      from_field: prevention
    - text: Keep a documented backfill runbook per pipeline.
      from_id: runbook-backfill-required
      from_field: prevention
    - text: When the alert fires, load the production playbooks into the agent, match the alert to a runbook, and walk the operator through diagnosis and mitigation step by step.
      from_id: plugin-runbook-runner
      from_field: description
    - text: The incident workflow — establish impact and start time; check for a correlated deploy; walk the matching runbook; capture the timeline for the postmortem.
      from_id: agent-incident-assistant
      from_field: workflow
    - text: The postmortem structure — impact in business terms with a duration; a timestamped, factual, no-blame timeline; how we found out, because if a human told us that's a gap; contributing factors, plural; action items each with an owner, a date and a "done" definition.
      from_id: skill-incident-postmortem-writer
      from_field: body
    - text: '"Be more careful" is not an action item — change the system so a careful mistake is harmless.'
      from_id: skill-incident-postmortem-writer
      from_field: body
  check_yourself:
    - The checklist passes — SLA declared and enforced, tasks idempotent with backoff retries, backfill runbook documented, failure class in the alert text.
    - A tabletop incident produces a rolling timeline and a draft postmortem with dated, owned action items.
  when_to_use:
    - "Signing off a pipeline for on-call"
    - "Running a quarterly reliability drill"
  why: Ten lessons reduce to one page — a declared SLA, idempotent tasks, a backfill runbook, classified alerts, and a postmortem that changes the system.
  gotchas:
    - "\"Be more careful\" is not an action item — change the system so a careful mistake is harmless."
    - "If a human told you about the incident, detection is a gap."
    - "Incidents are rarely single-cause — contributing factors are plural."
  production_notes:
    - "Capture the timeline as the incident happens, not from memory afterwards."
    - "The incident assistant suggests, never executes, production changes — it escalates to a human before any destructive step."
  diagram: |
    reliability capstone
       |
       |- SLA declared + enforced --> freshness, completeness in CI
       |
       |- idempotent tasks + backoff retries --> reruns safe by construction
       |
       |- backfill runbook documented --> history fixable without fear
       |
       |- alert --> match runbook --> walk diagnosis --> capture timeline
       |
       |- postmortem --> impact, timeline, detection, factors, owned actions
  code:
    - title: The postmortem structure
      lang: text
      code: |
        1. **Impact** — who/what, in business terms, with a duration.
        2. **Timeline** — timestamped, factual, no blame.
        3. **Detection** — how we found out; if a human told us, that's a gap.
        4. **Contributing factors** — plural; incidents are rarely single-cause.
        5. **Action items** — each with an owner and a date, and a "done" definition.
      source_id: skill-incident-postmortem-writer
    - title: The incident workflow
      lang: text
      code: |
        Establish impact and start time.
        Check for a correlated deploy.
        Walk the matching runbook.
        Capture the timeline for the postmortem.
      source_id: agent-incident-assistant
    - title: The Runbook Runner commands
      lang: text
      code: |
        /runbook
        /match-alert
        /incident-timeline
      source_id: plugin-runbook-runner
