- id: tutorial-cloud-cost-governance
  slug: cloud-cost-governance
  type: tutorial
  title: >-
    Govern cloud spend — right-sizing, resource monitors, and unit economics
  description: >-
    Govern cloud spend the way you govern data quality: right-size each
    warehouse per environment, put a resource monitor between the workload and
    the invoice, and alert on cost-per-run instead of total spend. Ends with
    the unit-economics rule that turns a 4x regression into a number, not a
    surprise.
  category: cat-aws
  series: cloud
  series_title: The Cloud Series
  lesson: 5
  difficulty: intermediate
  tags: [tutorial, cloud, snowflake, cost, governance, budgets, unit-economics]
  learning_objectives:
    - Right-size warehouses per environment instead of one size for all
    - Enforce budgets with resource monitors and hard credit caps
    - Alert on cost-per-run, not on total spend
  what_you_need:
    - A Snowflake account where you can create warehouses and resource monitors
    - Install: npx de-agent-platform add cost-unit-economics-reporter
  steps:
    - text: Start from a template that covers warehouse sizing, auto-suspend/resume, resource monitors for cost control, query acceleration, and multi-cluster settings — with dev, staging, and production defaults.
      from_id: config-template-snowflake-warehouse
      from_field: description
    - text: Right-size per environment — dev runs XSMALL with a 60-second auto-suspend and 100 monitor credits; staging runs MEDIUM with 500; production runs LARGE with 5,000 credits and 2-5 clusters.
      from_id: config-template-snowflake-warehouse
      from_field: example_values
    - text: Know the parameters that carry money — warehouse_size is compute (credits/hour), auto_suspend is seconds of inactivity before suspend (0 = never), and resource_monitor_credits is the monthly credit quota.
      from_id: config-template-snowflake-warehouse
      from_field: parameters
    - text: Turn billing into unit economics — cost per 1M rows, per run, per model — so a 4x regression shows up as a number, not a surprise invoice.
      from_id: skill-cost-unit-economics
      from_field: description
    - text: Learn why total spend is the wrong alert — total spend rises with growth and hides regressions, while cost-per-unit is flat when growth is healthy and spikes the day a join starts fanning out.
      from_id: skill-cost-unit-economics
      from_field: body
    - text: Back the budget with a hard cap — any principal that can run billable queries gets a resource monitor with a hard credit cap and a read-only role by default.
      from_id: mcp-snowflake
      from_field: security_notes
    - text: When a sizing debate stalls, go to the source — the performance and cost sections are the reference for clustering-key and warehouse-sizing decisions.
      from_id: ref-snowflake-docs
      from_field: why
  check_yourself:
    - The dev warehouse auto-suspends after 60 seconds and carries 100 monitor credits while production runs LARGE with 5,000 — and you can say why they differ.
    - Your alert fires on $ per pipeline run with a regression threshold, not on the month's total bill.
    - Every principal that can run billable queries sits behind a resource monitor with a hard credit cap.
  when_to_use:
    - "Warehouse spend grows with no change in workload"
    - "A team debates warehouse sizing with no documented per-environment defaults"
    - "Cost alerts fire on total spend and everyone ignores them"
  why: Total spend rises with growth and hides regressions — a unit metric behind a resource monitor catches the regression the day it lands.
  gotchas:
    - "auto_suspend = 0 means never suspend — an idle warehouse bills credits until you change it."
    - "Total spend rises with growth and hides regressions — cost-per-unit is the metric that spikes the day a join starts fanning out."
    - "Resource monitor credits must be positive (at least 1) — a zero quota is not a budget."
  production_notes:
    - "Ship the dev/staging/production defaults from the template and change them by review, not by hand."
    - "Alert on cost-per-run, not total spend, and keep the unit metric beside the pipeline's SLA."
  diagram: |
    cost governance
       |
       |- warehouse sizing per env --> dev XSMALL / staging MEDIUM / prod LARGE
       |
       |- auto-suspend --> seconds of inactivity --> 0 = never (bills forever)
       |
       |- resource monitor --> monthly credit quota --> hard credit cap
       |
       |- unit metric --> $ per run, per 1M rows, per model build
       |
        --> alert on cost-per-unit; total spend hides regressions
  code:
    - title: Environment defaults from the template
      lang: text
      code: |
        dev:        XSMALL, auto_suspend 60,  1 cluster,     ECONOMY,  monitor_credits 100
        staging:    MEDIUM, auto_suspend 300, 1-2 clusters,  STANDARD, monitor_credits 500
        production: LARGE,  auto_suspend 600, 2-5 clusters,  STANDARD, monitor_credits 5000
      source_id: config-template-snowflake-warehouse
    - title: Unit metrics that don't lie
      lang: text
      code: |
        - $ per pipeline run (stable denominator)
        - $ per 1M rows processed
        - DBU/credits per model build
      source_id: skill-cost-unit-economics
    - title: Warehouse parameters that matter
      lang: text
      code: |
        warehouse_size:            compute size (credits/hour)
        auto_suspend:              seconds of inactivity before suspend (0 = never)
        resource_monitor_credits:  monthly credit quota for resource monitor
      source_id: config-template-snowflake-warehouse
  source_refs: [config-template-snowflake-warehouse, skill-cost-unit-economics, mcp-snowflake, ref-snowflake-docs]
