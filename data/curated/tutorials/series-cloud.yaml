- id: tutorial-cloud-capstone-checklist
  slug: cloud-capstone-checklist
  type: tutorial
  title: >-
    Capstone — the cloud guardrail checklist
  description: >-
    Close the series by turning nine lessons into one standing checklist:
    workgroup bytes limits and compaction on storage, sized workers and stable
    bookmarks on compute, resource monitors and unit-metric alerts on spend,
    and least-privilege IAM everywhere — then produce the four review outputs
    as evidence.
  category: cat-aws
  series: cloud
  series_title: The Cloud Series
  lesson: 10
  difficulty: intermediate
  tags: [tutorial, cloud, aws, checklist, production, capstone]
  learning_objectives:
    - Run the full cloud guardrail checklist on your own platform
    - Turn each series lesson into a standing check with an owner
    - Produce the four review outputs as evidence
  what_you_need:
    - Your platform's IaC or an architecture description
    - The series lessons 1-9 completed
  steps:
    - text: Storage and query guardrails — an Athena workgroup with a per-query bytes-scanned limit, a nightly compaction job, and CloudWatch alarms on scanned bytes per hour.
      from_id: project-s3-glue-athena
      from_field: production_hardening
    - text: IaC baseline — S3 buckets with lifecycle + encryption, a Glue catalogue, IAM roles scoped to least privilege, and Athena workgroups with query limits.
      from_id: tpl-terraform-aws-data
      from_field: description
    - text: Compute guardrails — size Glue workers from data volume, not habit, use job bookmarks correctly, and avoid full-table reprocessing from catalogue mistakes.
      from_id: skill-aws-glue-reviewer
      from_field: learning_objectives
    - text: Scan guardrails — read the scanned-bytes metric per query, apply partition projection for high-cardinality columns, and compact small files to cut per-request overhead.
      from_id: skill-athena-partition-advisor
      from_field: learning_objectives
    - text: Warehouse guardrails — configure warehouses for different workloads, set up resource monitors for budget enforcement, and optimize auto-scaling for cost/performance.
      from_id: config-template-snowflake-warehouse
      from_field: learning_objectives
    - text: Spend guardrails — attribute compute cost to a pipeline run, define a unit metric that resists regressions, and alert on cost-per-run rather than total spend.
      from_id: skill-cost-unit-economics
      from_field: learning_objectives
    - text: "Evidence — collect the four review outputs: architecture diagram (text), IAM findings, cost drivers, and reliability risks."
      from_id: agent-aws-architecture-reviewer
      from_field: outputs
  check_yourself:
    - Every guardrail family has a live check — bytes-scanned limit and compaction on storage, task histograms on compute, credit caps and cost-per-run alarms on spend, least-privilege roles on IAM.
    - The four review outputs (diagram, IAM findings, cost drivers, reliability risks) exist as artifacts from your last review pass.
    - No agent or job in the account holds an admin role.
  when_to_use:
    - "A platform just left the build phase and needs its guardrails inventoried"
    - "A quarterly review needs one page that covers the whole cloud series"
  why: A cloud platform is production-ready when each guardrail in this series is a standing check with an owner, not a memory.
  gotchas:
    - "A checklist without an owner rots — assign each guardrail family to a person or a pipeline."
    - "The reviewer never creates resources and requires human approval for any IAM recommendation — keep it that way."
    - "Guardrails are per environment — dev XSMALL with 100 credits is not a production config."
  production_notes:
    - "Score each review against the 30-anti-pattern checklist so passes are comparable over time."
    - "Re-run the checklist quarterly and every time a new service joins the stack."
  diagram: |
    cloud capstone checklist
       |
       |- storage: bytes-scanned workgroup limit, nightly compaction, alarms
       |
       |- compute: workers from data volume, bookmarks stable, catalog diffs
       |
       |- spend: env-sized warehouses, resource monitors, $/run alert
       |
       |- IAM: least privilege, short-lived SSO, no admin roles
       |
        --> evidence: diagram + IAM findings + cost drivers + reliability risks
  code:
    - title: Storage and query guardrails
      lang: text
      code: |
        - Athena workgroup with a per-query bytes-scanned limit
        - A nightly compaction job
        - CloudWatch alarms on scanned bytes per hour
      source_id: project-s3-glue-athena
    - title: Review evidence
      lang: text
      code: |
        Outputs:
        - Architecture diagram (text)
        - IAM findings
        - Cost drivers
        - Reliability risks
      source_id: agent-aws-architecture-reviewer
    - title: Spend guardrails
      lang: text
      code: |
        dev:        XSMALL, auto_suspend 60,  monitor_credits 100
        staging:    MEDIUM, auto_suspend 300, monitor_credits 500
        production: LARGE,  auto_suspend 600, monitor_credits 5000
      source_id: config-template-snowflake-warehouse
