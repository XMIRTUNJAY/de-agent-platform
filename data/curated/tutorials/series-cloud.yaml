- id: tutorial-cloud-prod-gotchas
  slug: cloud-prod-gotchas
  type: tutorial
  title: >-
    Production gotchas — surprise bills, region defaults, and IAM overreach
  description: >-
    The surprises that turn into invoices: workers sized by habit, a renamed
    prefix that silently resets a bookmark, thousands of small files, an agent
    holding an admin role, and a query that scans everything because the
    predicate missed the partition column. Each gotcha names the metric that
    catches it early.
  category: cat-aws
  series: cloud
  series_title: The Cloud Series
  lesson: 8
  difficulty: intermediate
  tags: [tutorial, aws, glue, athena, production, cost, iam]
  learning_objectives:
    - Catch the Glue cost leaks before the invoice — oversized workers, reset bookmarks, drifted catalogues
    - Keep small files and repeated metadata repairs out of the bill
    - Bind agents to least-privilege profiles so IAM overreach and region drift stay impossible
  what_you_need:
    - Recent Glue task histograms and Athena scanned-bytes metrics
    - Install: npx de-agent-platform add aws-glue-job-reviewer
  steps:
    - text: Watch for the most common Glue cost leak — over-provisioned workers; size from data volume, not habit.
      from_id: skill-aws-glue-reviewer
      from_field: body
    - text: Check the input path layout before every bookmark-dependent run — a renamed prefix silently resets the bookmark into a full reprocess.
      from_id: skill-aws-glue-reviewer
      from_field: body
    - text: Compact small files — per-file overhead dominates at under 16 MB, so small files inflate the bill even when pruning works.
      from_id: skill-athena-partition-advisor
      from_field: body
    - text: Recognize the classic combo the reviewer flags — a Glue job running with an admin role and no bookmark, causing nightly full reprocessing.
      from_id: agent-aws-architecture-reviewer
      from_field: example
    - text: Never attach an admin role to an agent — bind to a dedicated AWS profile with least privilege and short-lived SSO credentials.
      from_id: mcp-aws
      from_field: security_notes
    - text: Set AWS_REGION deliberately — it is the default region for the AWS MCP servers, while AWS_PROFILE decides what is reachable.
      from_id: mcp-aws
      from_field: environment_variables
    - text: Treat every BigQuery MCP query as billable — grant bigquery.dataViewer + bigquery.jobUser only, set a custom quota, and consider maximum_bytes_billed on every job.
      from_id: mcp-bigquery
      from_field: security_notes
  check_yourself:
    - The task histogram shows balanced tasks after re-sizing, and no Glue job in the account runs with an admin role and no bookmark.
    - Tables averaging under 16 MB per file are compacted, and the per-query bill no longer carries per-file overhead.
    - Agents bind to a dedicated least-privilege profile with short-lived SSO credentials and an explicit AWS_REGION.
  when_to_use:
    - "A Glue job's bill grew without any change in data volume"
    - "An agent was granted broad credentials as a temporary measure"
    - "A new region or profile default may be silently routing resources"
  why: Cloud bills are silent until the invoice — every gotcha here has a metric or a diff that catches it the day it lands.
  gotchas:
    - "A renamed prefix under the input path silently resets the bookmark into a full reprocess."
    - "Per-file overhead dominates at under 16 MB — small files inflate the bill even when pruning works."
    - "A Glue job running with an admin role and no bookmark causes nightly full reprocessing — the reviewer's own worked example."
  production_notes:
    - "Keep the task histogram and the scanned-bytes metric in every review; both are the fastest signals that sizing or layout is wrong."
    - "Treat resource-creating MCP tools as requiring human confirmation, and rotate short-lived SSO credentials on a schedule."
  diagram: |
    cloud production gotchas
       |
       |- workers sized by habit --> over-provisioned --> most common Glue cost leak
       |
       |- renamed prefix --> bookmark silently resets --> full reprocess
       |
       |- files < 16 MB --> per-file overhead dominates --> compact
       |
       |- admin role on a job --> nightly full reprocess + IAM overreach
       |
       |- AWS_REGION unset --> resources land in the wrong default region
       |
        --> billable queries (BigQuery): custom quota + maximum_bytes_billed
  code:
    - title: The Glue review checklist
      lang: text
      code: |
        - Start worker sizing at 2x the number of input files' partitions; watch the task histogram.
        - A bookmark only helps if the input path layout is stable.
        - A renamed prefix silently resets the bookmark → full reprocess.
        - Diff the Glue Data Catalog schema against the file footer.
      source_id: skill-aws-glue-reviewer
    - title: The billable surface
      lang: text
      code: |
        Queries are billable. Grant `bigquery.dataViewer` + `bigquery.jobUser` only,
        set a custom quota, and consider `maximum_bytes_billed` on every job.
      source_id: mcp-bigquery
    - title: Agent credential binding
      lang: text
      code: |
        Bind to a dedicated AWS profile with least privilege, use short-lived SSO
        credentials, and never attach an admin role. Treat resource-creating tools
        as requiring human confirmation.
      source_id: mcp-aws
  source_refs: [skill-aws-glue-reviewer, skill-athena-partition-advisor, agent-aws-architecture-reviewer, mcp-aws, mcp-bigquery]
