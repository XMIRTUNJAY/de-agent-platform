- id: tutorial-cloud-cost-spike-incident
  slug: cloud-cost-spike-incident
  type: tutorial
  title: >-
    Incident — the job that quadrupled in cost overnight
  description: >-
    An invoice alert or a cost-per-run dashboard spike lands: one job's
    compute cost quadrupled with no functional change. Work the runbook — diff
    shuffle write and input bytes run-over-run, rank the four usual suspects,
    fix per cause, and cap the damage with a resource monitor while you
    diagnose.
  category: cat-aws
  series: cloud
  series_title: The Cloud Series
  lesson: 9
  difficulty: intermediate
  tags: [tutorial, cost, incident, spark, snowflake, diagnosis, runbook]
  learning_objectives:
    - Attribute a cost spike to a stage with run-over-run byte diffs
    - Tell apart fan-out, lost filters, and small-file regressions
    - Cap the damage with resource monitors and unit-metric alarms
  what_you_need:
    - Spark event logs or job metrics for the run before and the run during the spike
    - Install: npx de-agent-platform add cost-unit-economics-reporter
  steps:
    - text: Name the incident — one job's compute cost quadrupled without an obvious functional change; attribute it and reverse the regression.
      from_id: runbook-spark-job-suddenly-costs-4x
      from_field: description
    - text: Diagnose run-over-run — diff shuffle write bytes and input bytes, compare output row counts per stage, and check whether the partition predicate still prunes.
      from_id: runbook-spark-job-suddenly-costs-4x
      from_field: diagnosis
    - text: Rank the four usual suspects — a join fanning out, a dropped partition filter re-reading full history, a small-file explosion after a partitioning change, autoscaling widened because a stage became slow.
      from_id: runbook-spark-job-suddenly-costs-4x
      from_field: possible_causes
    - text: Read the masking trap — autoscaling hides the cause because a slow stage widens the cluster and buys speed while the fan-out stays; compare run-over-run, not day-over-day, or traffic deltas will fool the diff.
      from_id: runbook-spark-job-suddenly-costs-4x
      from_field: gotchas
    - text: Fix per cause — dedupe the many-side on the join key, restore the partition predicate and re-run, or OPTIMIZE/compact and re-run.
      from_id: runbook-spark-job-suddenly-costs-4x
      from_field: fix
    - text: Make the alarm precise — $ per pipeline run is a stable denominator, and cost-per-unit spikes the day a join starts fanning out.
      from_id: skill-cost-unit-economics
      from_field: body
    - text: Prevent the repeat — a cost-per-run unit metric with a 25% regression alarm and a CI guard on shuffle/scan metrics (hook-spark-cost-check).
      from_id: runbook-spark-job-suddenly-costs-4x
      from_field: prevention
  check_yourself:
    - The run-over-run diff of shuffle write bytes identifies the guilty stage, and the fix brings cost-per-run back to baseline.
    - A cost-per-run alarm with a regression threshold exists, so the next spike pages within one run instead of one month.
    - Warehouses touched by agents sit behind a resource monitor with a hard credit cap.
  when_to_use:
    - "Cluster or warehouse spend for one job quadrupled overnight"
    - "An invoice alert fired with no functional change in the pipeline"
  why: Silent cost regressions compound — a 4x job running hourly is a new invoice line within a day, so the rollback is the incident response.
  gotchas:
    - "Autoscaling masks the cause — a slow stage widens the cluster and buys speed while the fan-out stays."
    - "Compare run-over-run, not day-over-day — traffic deltas will fool the diff."
    - "A dropped partition filter reads full history — the join looks right, the input bytes don't."
  production_notes:
    - "Monitor $ per run, shuffle write bytes, input bytes, and output rows together."
    - "Add a CI guard on shuffle/scan metrics (hook-spark-cost-check) so cost regressions fail before deploy."
  diagram: |
    cost spike incident
       |
       |- invoice alert / $-per-run spike --> name the incident
       |
       |- diff run-over-run: shuffle write bytes, input bytes
       |
       |- suspects: fan-out | dropped partition filter | small files | autoscaling loop
       |
       |- fix per cause: dedupe many-side | restore predicate | OPTIMIZE/compact
       |
       |- resource monitor with hard credit cap --> blast radius bounded
       |
        --> revert the suspect deploy first; diagnose on the reverted baseline
  code:
    - title: The run-over-run diff
      lang: bash
      code: |
        # from the event log
        grep -E 'Shuffle Write|Input Size' spark.log | tail -40
        SELECT count(*) FROM stage_output_pre JOIN ... -- compare to source count
      source_id: runbook-spark-job-suddenly-costs-4x
    - title: The monitoring set
      lang: text
      code: |
        $ per run, shuffle write bytes, input bytes, output rows
      source_id: runbook-spark-job-suddenly-costs-4x
    - title: Hard cap on warehouse spend
      lang: text
      code: |
        Use a dedicated service user with a least-privilege role, a resource monitor
        with a hard credit cap, and a read-only role by default.
      source_id: mcp-snowflake
  source_refs: [runbook-spark-job-suddenly-costs-4x, skill-cost-unit-economics, mcp-snowflake]
