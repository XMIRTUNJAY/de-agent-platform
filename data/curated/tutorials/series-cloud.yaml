- id: tutorial-cloud-agent-tooling
  slug: cloud-agent-tooling
  type: tutorial
  title: >-
    Wire cloud tooling — registry skills, MCP servers, and one review workflow
  description: >-
    Wire the registry's cloud tooling into one agent workflow: install the
    Glue and Athena review skills, bind the AWS MCP server to a
    least-privilege profile, and compose both skills plus the MCP server into
    the architecture reviewer. The same pattern covers GCP with the BigQuery
    server.
  category: cat-aws
  series: cloud
  series_title: The Cloud Series
  lesson: 7
  difficulty: beginner
  tags: [tutorial, aws, gcp, mcp, agents, tooling, skills]
  learning_objectives:
    - Install a registry skill and bind an MCP server with least-privilege credentials
    - Compose skills and MCP servers into a single review workflow
    - Keep agent access read-only by default
  what_you_need:
    - An AWS named profile with least-privilege permissions
    - Install: npx de-agent-platform add aws-glue-job-reviewer
  steps:
    - text: Add the Athena advisor to your agent — the install command is npx de-agent-platform add athena-partition-advisor.
      from_id: skill-athena-partition-advisor
      from_field: install_command
    - text: Give the agent the Glue checklist — it reviews Glue/Spark jobs for worker sizing, job bookmarks, partition pruning, and the catalogue/schema pitfalls that cause silent full reprocessing.
      from_id: skill-aws-glue-reviewer
      from_field: description
    - text: Give it the Athena lever — the advisor recommends partition projection, bucketing or file-layout changes to reduce bytes-scanned, and writes the projection DDL.
      from_id: skill-athena-partition-advisor
      from_field: description
    - text: Bind the AWS MCP server — uvx awslabs.core-mcp-server@latest, with AWS_PROFILE supplied through the environment.
      from_id: mcp-aws
      from_field: installation
    - text: Know the AWS tool surface — aws_documentation_search, read_documentation, recommend, and run_iac_generation.
      from_id: mcp-aws
      from_field: tools
    - text: Compose the reviewer — it ships with the Glue reviewer and Athena advisor skills attached, plus mcp-aws among its MCP servers.
      from_id: agent-aws-architecture-reviewer
      from_field: skills
    - text: Same pattern for GCP — the BigQuery server exposes execute_query, list_datasets, list_tables, and describe_table.
      from_id: mcp-bigquery
      from_field: tools
  check_yourself:
    - npx de-agent-platform add athena-partition-advisor succeeds and the skill appears in the agent's list.
    - The AWS MCP server starts with AWS_PROFILE pointing at a dedicated least-privilege profile, not an admin role.
    - The architecture reviewer lists skill-aws-glue-reviewer and skill-athena-partition-advisor among its skills, and mcp-aws among its MCP servers.
  when_to_use:
    - "You are setting up an agent to review or operate a cloud data platform"
    - "A team shares one admin role for agents and needs the least-privilege pattern"
  why: An agent is only as safe and useful as the skills and credentials bound to it — least-privilege profiles and curated checklists beat a general-purpose admin role.
  gotchas:
    - "Server capabilities vary widely; some AWS MCP servers can create resources — treat resource-creating tools as requiring human confirmation."
    - "The BigQuery server needs GOOGLE_APPLICATION_CREDENTIALS pointing at a service-account key with BigQuery roles — scope those roles down before binding."
    - "AWS_PROFILE is required for the AWS MCP server — the named profile's IAM permissions define what is reachable."
  production_notes:
    - "Bind each MCP server to a dedicated profile with short-lived SSO credentials; never attach an admin role."
    - "Prefer key-pair auth over passwords for service users on warehouse MCP servers."
  diagram: |
    cloud agent tooling
       |
       |- npx de-agent-platform add aws-glue-job-reviewer   --> Glue checklist
       |- npx de-agent-platform add athena-partition-advisor --> bytes-scanned levers
       |
       |- mcp-aws: uvx awslabs.core-mcp-server@latest + AWS_PROFILE --> least privilege
       |
       |- agent-aws-architecture-reviewer: skills + mcp-aws composed
       |
        --> GCP same pattern: mcp-server-bigquery (execute_query, list_datasets, ...)
  code:
    - title: Install the Athena advisor skill
      lang: bash
      code: |
        npx de-agent-platform add athena-partition-advisor
      source_id: skill-athena-partition-advisor
    - title: Bind the AWS MCP server
      lang: yaml
      code: |
        mcpServers:
          aws-core:
            command: uvx
            args: [awslabs.core-mcp-server@latest]
            env:
              AWS_PROFILE: ${AWS_PROFILE}
              FASTMCP_LOG_LEVEL: ERROR
      source_id: mcp-aws
    - title: Bind the BigQuery MCP server
      lang: yaml
      code: |
        mcpServers:
          bigquery:
            command: uvx
            args: [mcp-server-bigquery, --project, my-project]
      source_id: mcp-bigquery
  source_refs: [skill-athena-partition-advisor, skill-aws-glue-reviewer, mcp-aws, mcp-bigquery, agent-aws-architecture-reviewer]
