# Tutorials — beginner-friendly arrangements of artifact content.
# Every step is verbatim from the cited source field. Structure (need, steps,
# check) is ours; wording is the source's.
- id: tutorial-iceberg-maintenance-routine
  slug: iceberg-maintenance-routine
  type: tutorial
  title: Run the Iceberg maintenance routine
  description: >-
    Work an Iceberg table through the maintenance skill's plan: read the files
    metadata table to size the problem, rewrite data files to a 128-256 MB
    target, rewrite manifests when the manifest list is huge, expire snapshots
    without breaking time travel, and remove orphan files on a schedule with a
    safety margin.
  category: cat-lakehouse
  difficulty: intermediate
  tags: [tutorial, iceberg, compaction, snapshots, maintenance, lakehouse]
  learning_objectives:
    - Read an Iceberg metadata table to size the problem
    - Pick a compaction strategy and rewrite interval
    - Expire snapshots without breaking time travel
  what_you_need:
    - An Iceberg table with a growing file count
    - Query access to the table's metadata tables
    - Install: npx de-agent-platform add iceberg-table-maintenance
  steps:
    - text: "Size the problem from metadata: SELECT count(*) files, avg(file_size_in_bytes)/1e6 avg_mb FROM db.tbl.files; avg_mb < 32 and a growing count means compact."
      from_id: skill-iceberg-maintenance
      from_field: body
    - text: Run rewrite_data_files with a target size (128-256 MB).
      from_id: skill-iceberg-maintenance
      from_field: body
    - text: Run rewrite_manifests when the manifest list is huge.
      from_id: skill-iceberg-maintenance
      from_field: body
    - text: Run expire_snapshots older than the retention window — but keep at least one full snapshot for time travel.
      from_id: skill-iceberg-maintenance
      from_field: body
    - text: Run remove_orphan_files on a schedule, with a safety margin.
      from_id: skill-iceberg-maintenance
      from_field: body
  check_yourself:
    - After compaction, db.tbl.files reports an average file size inside the 128-256 MB target and a falling file count.
    - expire_snapshots leaves at least one full snapshot, so time travel within the retention window still works.
  when_to_use:
    - "Average file size is under 32 MB and the file count keeps growing"
    - "A scheduled cleanup plan is needed for snapshots, manifests, and orphan files"
  why: Small files and manifest bloat tax every query and every planning step, and a fixed maintenance plan restores predictable latency without touching writers.
  gotchas:
    - "Do not run compaction during peak ingestion; it conflicts with concurrent writers."
    - "expire_snapshots must keep at least one full snapshot or time travel breaks."
    - "remove_orphan_files runs on a schedule with a safety margin — never ad hoc."
  production_notes:
    - "Target 128-256 MB files and alert on file-count growth."
    - "Schedule the whole plan outside the ingestion window so compaction and writers never contend."
  diagram: |
    iceberg maintenance
       |
       |- SELECT ... FROM db.tbl.files --> avg_mb < 32 + growing count?
       |
       |- rewrite_data_files (target 128-256 MB)
       |
       |- rewrite_manifests (huge manifest list)
       |
       |- expire_snapshots --> keep one full snapshot for time travel
       |
        |- remove_orphan_files on a schedule --> safety margin
  code:
    - title: Size the problem from the files metadata table
      lang: sql
      code: |
        SELECT count(*) files, avg(file_size_in_bytes)/1e6 avg_mb
        FROM db.tbl.files;
      source_id: skill-iceberg-maintenance
    - title: The maintenance plan
      lang: text
      code: |
        1. `rewrite_data_files` with a target size (128-256 MB).
        2. `rewrite_manifests` when the manifest list is huge.
        3. `expire_snapshots` older than the retention window — but keep at least one
           full snapshot for time travel.
        4. `remove_orphan_files` on a schedule, with a safety margin.
      source_id: skill-iceberg-maintenance
    - title: Compaction call
      lang: sql
      code: |
        CALL catalog.system.rewrite_data_files('db.tbl');  -- Iceberg
      source_id: runbook-small-files-explosion
  source_refs: [skill-iceberg-maintenance]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/iceberg-maintenance-routine
