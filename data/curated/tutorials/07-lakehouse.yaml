- id: tutorial-lakehouse-guard-health
  slug: lakehouse-guard-health
  type: tutorial
  title: Check lakehouse table health with Lakehouse Guard
  description: >-
    Use the Lakehouse Guard plugin's three commands on a Delta/Iceberg table:
    /table-health for a status read, /plan-compaction for a maintenance plan,
    and /expire-snapshots for a safe expiry plan. The guard exists to block
    compaction or snapshot expiry during peak ingestion windows, so plans
    cannot run in the wrong window.
  category: cat-lakehouse
  difficulty: intermediate
  tags: [tutorial, lakehouse, plugin, delta, iceberg, maintenance]
  learning_objectives:
    - Read a table-health report before planning maintenance
    - Generate a compaction plan instead of running compaction ad hoc
    - Understand when the guard blocks maintenance actions
  what_you_need:
    - A Delta or Iceberg table due for maintenance
    - Warehouse credentials with read access
    - Install: amp plugin add de-agent/lakehouse-guard
  steps:
    - text: Run /table-health for a table-health read.
      from_id: plugin-lakehouse-guard
      from_field: commands
    - text: Run /plan-compaction for the compaction plan.
      from_id: plugin-lakehouse-guard
      from_field: commands
    - text: Run /expire-snapshots for the snapshot-expiry plan.
      from_id: plugin-lakehouse-guard
      from_field: commands
    - text: Know what the plugin is — a Delta/Iceberg table maintenance advisor plus a guard that blocks compaction or snapshot expiry during peak ingestion windows.
      from_id: plugin-lakehouse-guard
      from_field: description
    - text: Expect the two capabilities, table-maintenance and guardrails, on every interaction.
      from_id: plugin-lakehouse-guard
      from_field: capabilities
  check_yourself:
    - A /plan-compaction issued during the ingestion window is blocked by the guard instead of executing.
    - The three commands run in order — health read, compaction plan, expiry plan — each producing a plan, not an execution.
  when_to_use:
    - "Compaction or snapshot expiry must never collide with peak ingestion"
    - "Table maintenance should be planned first and executed deliberately"
  why: Maintenance done ad hoc collides with writers and peak traffic, and the guard pairs an advisor with a hard block so the plan cannot run in the wrong window.
  gotchas:
    - "The guard blocks compaction or snapshot expiry during peak ingestion windows — plan around them."
    - "Commands produce plans; executing them still needs your warehouse credentials and judgement."
    - "Permissions are filesystem read with warehouse network and credentials — the plugin reads, it does not hold broad access."
  production_notes:
    - "Keep maintenance inside the plugin's guardrails rather than bypassing them during incidents."
    - "Plan compaction against the ingestion calendar so peak windows are known before planning."
  diagram: |
    lakehouse guard
       |
       |- /table-health --> current health read
       |
       |- /plan-compaction --> maintenance plan
       |
       |- /expire-snapshots --> expiry plan
       |
        |- peak ingestion window? --> guard blocks execution
  code:
    - title: Install the plugin
      lang: bash
      code: |
        amp plugin add de-agent/lakehouse-guard
      source_id: plugin-lakehouse-guard
    - title: The three guard commands
      lang: text
      code: |
        /table-health
        /plan-compaction
        /expire-snapshots
      source_id: plugin-lakehouse-guard
    - title: Capabilities, permissions, wired skills
      lang: yaml
      code: |
        capabilities: [table-maintenance, guardrails]
        permissions: { filesystem: read, network: warehouse, credentials: warehouse }
        skills: [skill-iceberg-maintenance, skill-delta-optimizer]
      source_id: plugin-lakehouse-guard
  source_refs: [plugin-lakehouse-guard]
