- id: tutorial-delta-optimize-decision
  slug: delta-optimize-decision
  type: tutorial
  title: Decide when a Delta table needs OPTIMIZE or Z-ORDER
  description: >-
    Apply the Delta Optimization Advisor's decision rules to one table: read
    file stats for the OPTIMIZE trigger, pick Z-ORDER columns from actual query
    predicates, weigh liquid clustering for high-cardinality write-heavy
    tables, and prove the choice by comparing numFiles and bytes scanned before
    and after.
  category: cat-lakehouse
  difficulty: beginner
  tags: [tutorial, delta-lake, optimize, z-order, liquid-clustering]
  learning_objectives:
    - Decide if a table needs OPTIMIZE from file stats
    - Choose Z-ORDER columns from query predicates
    - Know when liquid clustering beats partitioning
  what_you_need:
    - A Delta table with file-stats and history access
    - The query predicates your consumers actually filter on
    - Install: npx de-agent-platform add delta-optimization-advisor
  steps:
    - text: "Decide: files < 32 MB and many -> run OPTIMIZE."
      from_id: skill-delta-optimizer
      from_field: body
    - text: "Decide: queries filter on 1-2 high-cardinality columns -> ZORDER BY those columns."
      from_id: skill-delta-optimizer
      from_field: body
    - text: "Decide: high-cardinality, many predicates, frequent writes -> liquid clustering."
      from_id: skill-delta-optimizer
      from_field: body
    - text: "Decide: predicate on one low-cardinality column (date) -> partition, or leave it; Delta handles pruning well already."
      from_id: skill-delta-optimizer
      from_field: body
    - text: Measure — compare numFiles and query bytes scanned before and after; if scanning did not drop, the Z-ORDER was on the wrong columns.
      from_id: skill-delta-optimizer
      from_field: body
  check_yourself:
    - A table with thousands of sub-32 MB files is OPTIMIZEd and numFiles drops while the next query reports fewer bytes scanned.
    - A Z-ORDER on a column no query filters on is caught by the before/after measurement and reverted instead of shipped.
  when_to_use:
    - "A Delta table's reads slowed as micro-batch appends piled up"
    - "A choice between OPTIMIZE, Z-ORDER, and liquid clustering must be justified with data"
  why: OPTIMIZE and Z-ORDER both rewrite storage, so the decision rules and the before/after measurement keep you from paying for the wrong one.
  gotchas:
    - "If bytes scanned did not drop after Z-ORDER, the Z-ORDER was on the wrong columns — measure before and after."
    - "A predicate on one low-cardinality column (date) rarely needs Z-ORDER — partition, or leave it; Delta handles pruning well already."
    - "Liquid clustering is for high-cardinality, many-predicate, frequently written tables — not the default for every table."
  production_notes:
    - "Track numFiles and bytes scanned per query as the standing success metric for layout changes."
    - "Re-run the decision rules when write patterns change; frequent writes with many predicates move the answer to liquid clustering."
  diagram: |
    delta optimize decision
       |
       |- files < 32 MB and many --> OPTIMIZE
       |
       |- 1-2 high-cardinality predicates --> ZORDER BY those columns
       |
       |- many predicates + frequent writes --> liquid clustering
       |
       |- low-cardinality date predicate --> partition or leave it
       |
       --> measure numFiles + bytes scanned before/after
  code:
    - title: OPTIMIZE with Z-ORDER (Delta)
      lang: sql
      code: |
        OPTIMIZE db.tbl ZORDER BY (user_id);  -- Delta
      source_id: runbook-small-files-explosion
    - title: Decision rules
      lang: text
      code: |
        - Files < 32 MB and many → `OPTIMIZE`.
        - Queries filter on 1-2 high-cardinality columns → `ZORDER BY` those columns.
        - High-cardinality, many predicates, frequent writes → liquid clustering.
        - Predicate on one low-cardinality column (date) → partition (or leave it; Delta
          handles pruning well already).
      source_id: skill-delta-optimizer
    - title: Measure before and after
      lang: text
      code: |
        Compare `numFiles` and query `bytes scanned` before and after. If scanning
        didn't drop, the Z-ORDER was on the wrong columns.
      source_id: skill-delta-optimizer
  source_refs: [skill-delta-optimizer]
  version: 0.1.0
