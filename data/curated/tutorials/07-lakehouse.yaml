- id: tutorial-small-files-diagnosis
  slug: small-files-diagnosis
  type: tutorial
  title: Diagnose a small-files explosion
  description: >-
    Follow the small-files runbook from symptom to prevention: confirm the
    tens-of-thousands-of-tiny-files signature, query the metadata tables for
    the average file size, compact to a 128-256 MB target, coarsen an
    over-partitioned layout, and schedule compaction outside the ingestion
    window. The fix follows the small-files compaction pattern — separate the
    write path from the layout path.
  category: cat-lakehouse
  difficulty: intermediate
  tags: [tutorial, small-files, lakehouse, compaction, diagnosis]
  learning_objectives:
    - Recognize the small-files signature from file sizes and planning time
    - Query metadata tables to quantify fragmentation
    - Fix the layout, not just the symptoms
  what_you_need:
    - A table whose queries spend more time planning than scanning
    - Metadata-table access (Iceberg files, Delta history)
    - An ingestion window you can schedule compaction around
  steps:
    - text: "Confirm the symptoms: tens of thousands of tiny files, query planning and listing dominating query time, metadata operations (OPTIMIZE/REPAIR) very slow."
      from_id: runbook-small-files-explosion
      from_field: symptoms
    - text: List file sizes; avg < 32 MB and a growing count is the signature.
      from_id: runbook-small-files-explosion
      from_field: diagnosis
    - text: For Iceberg/Delta, query the metadata tables (`files`, `history`).
      from_id: runbook-small-files-explosion
      from_field: diagnosis
    - text: Compact to a 128-256 MB target; rewrite manifests if huge.
      from_id: runbook-small-files-explosion
      from_field: fix
    - text: Reduce partition granularity if the layout over-partitions.
      from_id: runbook-small-files-explosion
      from_field: fix
    - text: Auto-compaction on the table (Delta) or a scheduled maintenance job; partition by date, not by hour/user, unless access patterns demand it.
      from_id: runbook-small-files-explosion
      from_field: prevention
  check_yourself:
    - The metadata query shows an average file size under 32 MB before the fix and inside the 128-256 MB target after compaction.
    - Planning time no longer dominates — the same query's planning phase shrinks below scan time after compaction and layout coarsening.
  when_to_use:
    - "Planning or listing time dominates query time on one table"
    - "Metadata operations (OPTIMIZE/REPAIR) have become very slow"
  why: Fragmentation turns every read into a metadata crawl; compaction restores predictable latency without touching consumers.
  gotchas:
    - "Compact after the ingestion window, never during it."
    - "ZORDER rewrites the whole table — only worth it on a real query predicate."
    - "Over-partitioning is often the root cause; coarsening the layout beats compacting harder."
  production_notes:
    - "Enable Delta auto-compaction or schedule Iceberg rewrite_data_files."
    - "Target 128-256 MB files and alert on file-count growth."
  diagram: |
    small files diagnosis
       |
       |- planning dominates query time --> list file sizes
       |
       |- avg < 32 MB + growing count --> metadata tables (files/history)
       |
       |- compact to 128-256 MB --> rewrite manifests if huge
       |
       |- over-partitioned? --> coarsen layout (date, not hour/user)
       |
        |- schedule compaction after ingestion window --> prevent regrowth
  code:
    - title: Quantify fragmentation from the metadata tables
      lang: sql
      code: |
        SELECT count(*), avg(file_size_in_bytes)/1e6 FROM db.tbl.files;
      source_id: runbook-small-files-explosion
    - title: Compaction commands (Delta and Iceberg)
      lang: sql
      code: |
        OPTIMIZE db.tbl ZORDER BY (user_id);  -- Delta
        CALL catalog.system.rewrite_data_files('db.tbl');  -- Iceberg
      source_id: runbook-small-files-explosion
    - title: Fix and prevention
      lang: text
      code: |
        Fix:
        - Compact to a 128-256 MB target; rewrite manifests if huge.
        - Reduce partition granularity if the layout over-partitions.
        - Schedule compaction after the ingestion window, never during it.

        Prevention:
        - Auto-compaction on the table (Delta) or a scheduled maintenance job.
        - Partition by date, not by hour/user, unless access patterns demand it.
      source_id: runbook-small-files-explosion
  source_refs: [runbook-small-files-explosion, pattern-small-files-compaction]
