- id: tutorial-kafka-topics-via-mcp
  slug: kafka-topics-via-mcp
  type: tutorial
  title: Inspect Kafka topics and groups with the Kafka MCP server
  description: >-
    Connect an agent to a Kafka cluster through the Kafka MCP server and work
    through its four tools: list_topics for inventory, describe_topic for a
    single topic, describe_consumer_group for lag, and consume_messages for
    sampling — stream debugging from an agent, with the sampling risks called
    out up front.
  category: cat-kafka
  series: streaming
  series_title: The Streaming Series
  lesson: 2
  difficulty: beginner
  tags: [tutorial, kafka, mcp, streaming, debugging, lag]
  learning_objectives:
    - Configure the Kafka MCP server against a broker list
    - Inventory topics and read group lag with the four tools
    - Sample messages without leaking production PII
  what_you_need:
    - KAFKA_BROKERS (comma-separated broker list), optionally SASL credentials
    - An agent host with kafka-mcp-server installed
    - A read-only principal scoped to an allow-listed topic
  steps:
    - text: Point the server at the cluster — KAFKA_BROKERS holds the comma-separated broker list, and KAFKA_SASL_USER / KAFKA_SASL_PASSWORD are set if the cluster requires it.
      from_id: mcp-kafka
      from_field: environment_variables
    - text: Run list_topics for a topic inventory.
      from_id: mcp-kafka
      from_field: tools
    - text: Run describe_topic and describe_consumer_group to inspect one topic and its consumer-group lag.
      from_id: mcp-kafka
      from_field: tools
    - text: Use consume_messages to sample messages when the debugging needs content, not just offsets.
      from_id: mcp-kafka
      from_field: tools
    - text: Before sampling, know the risk — it can expose production PII in the agent's context; grant a read-only principal, prefer a topic allow-list, and never sample topics containing personal data without masking.
      from_id: mcp-kafka
      from_field: security_notes
  check_yourself:
    - describe_consumer_group on the suspect group returns the same per-partition offsets the CLI kafka-consumer-groups describe shows.
    - consume_messages runs only against an allow-listed topic with a read-only principal, and no personal data reaches the agent context unmasked.
  when_to_use:
    - "An agent needs read access to topic inventory, lag, and message samples"
    - "Stream debugging should happen from the agent's context instead of ad hoc CLI sessions"
  why: The server puts topic inventory, consumer-group lag, and message sampling behind four tools, so an agent can debug a stream without cluster write access.
  gotchas:
    - "consume_messages can expose production PII in the agent's context — never sample topics containing personal data without masking."
    - "Grant a read-only principal and prefer a topic allow-list before handing the server to an agent."
    - "The server's licensing is ambiguous — MIT badge in the README but no LICENSE file — verify before commercial use."
  production_notes:
    - "Give the server its own KAFKA_CLIENT_ID and stdio transport so its connections are identifiable."
    - "Keep SASL credentials in the environment, scoped to a read-only principal."
  diagram: |
    kafka mcp exploration
       |
       |- KAFKA_BROKERS + optional SASL --> server connects (stdio)
       |
       |- list_topics --> topic inventory
       |
       |- describe_topic + describe_consumer_group --> topic detail + lag
       |
        |- consume_messages --> samples (read-only principal, allow-list, mask PII)
  code:
    - title: Register the server with the agent
      lang: yaml
      code: |
        mcpServers:
          kafka:
            command: kafka-mcp-server
            args: []
            env:
              KAFKA_BROKERS: localhost:9092
              KAFKA_CLIENT_ID: kafka-mcp-server
              MCP_TRANSPORT: stdio
      source_id: mcp-kafka
    - title: Server environment variables
      lang: text
      code: |
        KAFKA_BROKERS       (required) Comma-separated broker list.
        KAFKA_CLIENT_ID     (optional) Kafka client id for connections.
        KAFKA_SASL_USER     (optional) SASL user, if the cluster requires it.
        KAFKA_SASL_PASSWORD (optional) SASL password, if required.
      source_id: mcp-kafka
    - title: Sampling risk — security requirements
      lang: text
      code: |
        Sampling messages can expose production PII in the agent's context. Grant a
        read-only principal, prefer a topic allow-list, and never sample topics
        containing personal data without masking.
      source_id: mcp-kafka
  source_refs: [mcp-kafka]
