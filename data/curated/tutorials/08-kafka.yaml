# Tutorials — beginner-friendly arrangements of artifact content.
# Every step is verbatim from the cited source field. Structure (need, steps,
# check) is ours; wording is the source's.
- id: tutorial-kafka-consumer-lag-triage
  slug: kafka-lag-triage-drill
  type: tutorial
  title: Triage Kafka consumer lag from per-partition offsets
  description: >-
    Combine the lag-triage skill's three questions with the lagging-consumer
    runbook: read per-partition lag to separate capacity from key skew, check
    the group state history for a rebalance loop, find the one stuck offset
    that marks a poison message, then apply the matching fix — and never reset
    offsets.
  category: cat-kafka
  series: streaming
  series_title: The Streaming Series
  lesson: 9
  difficulty: intermediate
  tags: [tutorial, kafka, lag, consumer-group, offsets, incidents]
  learning_objectives:
    - Read per-partition lag to separate skew from throughput
    - Detect a rebalance loop from consumer-group state
    - Find the poison message from retry counts
  what_you_need:
    - kafka-consumer-groups CLI access to the cluster
    - The consumer group's describe output and state
    - Install: npx de-agent-platform add kafka-consumer-lag-triage
  steps:
    - text: Ask the three questions — is lag rising, flat, or falling? Is it even across partitions? Is the consumer group stable?
      from_id: skill-kafka-lag-triage
      from_field: body
    - text: Get per-partition lag — uniform vs skewed tells you capacity vs key skew.
      from_id: runbook-kafka-consumer-lagging
      from_field: diagnosis
    - text: Check the consumer-group state history for `PreparingRebalance`.
      from_id: runbook-kafka-consumer-lagging
      from_field: diagnosis
    - text: Look for one partition whose committed offset is stuck.
      from_id: runbook-kafka-consumer-lagging
      from_field: diagnosis
    - text: Match the signature — lag on one partition only is key skew; all partitions rising with low CPU is a downstream bottleneck; lag resets to zero then climbs is a rebalance loop; one offset stuck while others advance is a poison message.
      from_id: skill-kafka-lag-triage
      from_field: body
    - text: "Fix accordingly — sink-bound: batch/upsert in bulk or scale the sink; key skew: re-key the topic or increase partitions; rebalance: raise session.timeout.ms / max.poll.interval.ms; poison message: route to a DLQ and commit past it."
      from_id: runbook-kafka-consumer-lagging
      from_field: fix
  check_yourself:
    - Lag confined to two partitions with the rest flat is diagnosed as key skew and fixed by re-keying — not by scaling the fleet.
    - Offsets are never reset during the incident; a message that keeps failing lands in a DLQ and the group commits past it.
  when_to_use:
    - "Consumer-group lag keeps rising and won't recover on its own"
    - "Downstream tables are going fresh-to-stale"
  why: Lag compounds — every minute behind is a minute of stale truth downstream, and the sink silently becomes the bottleneck nobody owns.
  gotchas:
    - "Never reset offsets to reduce lag; that is silent data loss."
    - "Uniform lag means capacity; one stuck partition means key skew or a poison message — read per-partition lag before scaling."
    - "A rebalance loop can look like slowness: check the group state history for PreparingRebalance."
  production_notes:
    - "Alert on lag slope, not on an absolute lag number."
    - "Give messages that fail N times a DLQ instead of an endless retry."
  diagram: |
    consumer lag triage
       |
       |- lag rising? uniform? group stable?
       |
       |- lag uniform --> capacity bound --> scale consumers / sink throughput
       |
       |- one partition stuck --> hot key or poison --> re-key, or DLQ + commit past
       |
       |- PreparingRebalance looping --> rebalance storm --> raise session.timeout.ms
       |
        --> never reset offsets
  code:
    - title: Per-partition lag and group state
      lang: bash
      code: |
        kafka-consumer-groups --bootstrap-server $B --describe --group $G
        kafka-consumer-groups --bootstrap-server $B --describe --group $G --state
      source_id: runbook-kafka-consumer-lagging
    - title: Lag signatures
      lang: text
      code: |
        - Lag on one partition only → key skew; re-key or increase partitions.
        - All partitions rising, CPU low → downstream (DB/API) is the bottleneck.
        - Lag resets to zero then climbs → rebalance loop; check `session.timeout.ms`.
        - One offset stuck, others advance → poison message in a retry loop.
      source_id: skill-kafka-lag-triage
    - title: Fix by signature
      lang: text
      code: |
        - Sink-bound → batch/upsert in bulk, or scale the sink.
        - Key skew → re-key the topic or increase partitions (breaks ordering per key).
        - Rebalance → raise session.timeout.ms / max.poll.interval.ms.
        - Poison message → route to a DLQ and commit past it.
        - Never reset offsets to reduce lag; that is silent data loss.
      source_id: runbook-kafka-consumer-lagging
  source_refs: [skill-kafka-lag-triage, runbook-kafka-consumer-lagging]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
