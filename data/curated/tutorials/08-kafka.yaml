- id: tutorial-kafka-console-commands
  slug: kafka-console-commands
  type: tutorial
  title: Debug a Kafka stream with the Kafka Console plugin
  description: >-
    Drive the Kafka Console plugin's three commands across a lag incident:
    /topic-info for inventory, /lag-triage for per-partition lag and rebalance
    detection, and /sample-topic for a read-only message sample with a PII
    redaction pass. Permissions stay at kafka-sasl-read throughout.
  category: cat-kafka
  series: streaming
  series_title: The Streaming Series
  lesson: 7
  difficulty: intermediate
  tags: [tutorial, kafka, plugin, lag, streaming, pii]
  learning_objectives:
    - Inventory topics with /topic-info before touching lag
    - Triage per-partition lag and rebalance detection with /lag-triage
    - Sample messages through the PII redaction pass
  what_you_need:
    - A consumer group showing lag
    - Kafka SASL read credentials
    - Install: amp plugin add de-agent/kafka-console
  steps:
    - text: Run /topic-info for topic inventory.
      from_id: plugin-kafka-console
      from_field: commands
    - text: Run /lag-triage for per-partition lag triage and rebalance detection.
      from_id: plugin-kafka-console
      from_field: commands
    - text: Run /sample-topic for the read-only message sampler.
      from_id: plugin-kafka-console
      from_field: commands
    - text: Know what the plugin covers — topic inventory, per-partition lag triage, rebalance detection, and a read-only message sampler with a PII redaction pass.
      from_id: plugin-kafka-console
      from_field: description
    - text: Expect the PII redaction pass on every sample — the plugin ships with hook-pii-leak-guard wired in.
      from_id: plugin-kafka-console
      from_field: hooks
    - text: Stay inside the permission model — filesystem none, network kafka, credentials kafka-sasl-read.
      from_id: plugin-kafka-console
      from_field: permissions
  check_yourself:
    - /lag-triage output distinguishes a skewed partition from uniformly distributed lag before any scaling decision is made.
    - /sample-topic output contains no unredacted personal data because the PII leak guard hook runs on the sampling path.
  when_to_use:
    - "A lag incident needs topic inventory, triage, and sampling from one place"
    - "Message samples must pass PII redaction before entering the agent context"
  why: One plugin covers inventory, lag triage, and redacted sampling, so debugging does not sprawl across raw CLI tools and unredacted output.
  gotchas:
    - "Credentials are kafka-sasl-read only — the plugin cannot and should not mutate the cluster."
    - "The PII redaction pass (hook-pii-leak-guard) exists because sampling is how personal data leaks into agent contexts."
    - "Lag triage builds on skill-kafka-lag-triage — the command is only as good as the signature model behind it."
  production_notes:
    - "Keep the plugin on read-only SASL credentials even in debug clusters."
    - "Pin the plugin's hook-pii-leak-guard so sampling paths can never bypass redaction."
  diagram: |
    kafka console plugin
       |
       |- /topic-info --> topic inventory
       |
       |- /lag-triage --> per-partition lag + rebalance detection
       |
       |- /sample-topic --> read-only sample --> PII redaction pass
       |
       --> permissions: network kafka, sasl read-only
  code:
    - title: Install the plugin
      lang: bash
      code: |
        amp plugin add de-agent/kafka-console
      source_id: plugin-kafka-console
    - title: The three commands
      lang: text
      code: |
        /lag-triage
        /topic-info
        /sample-topic
      source_id: plugin-kafka-console
    - title: Permissions and the PII redaction hook
      lang: yaml
      code: |
        permissions: { filesystem: none, network: kafka, credentials: kafka-sasl-read }
        hooks: [hook-pii-leak-guard]
        skills: [skill-kafka-lag-triage, skill-kafka-topic-design]
      source_id: plugin-kafka-console
  source_refs: [plugin-kafka-console, skill-kafka-lag-triage]
