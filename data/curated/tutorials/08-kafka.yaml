- id: tutorial-kafka-troubleshooter-workflow
  slug: kafka-troubleshooter-workflow
  type: tutorial
  title: Troubleshoot a lagging group with the Kafka Troubleshooter
  description: >-
    Hand the Kafka Troubleshooter agent the consumer-group describe output,
    per-partition offsets, and consumer logs, then follow its four-step
    workflow from lag trend to the least destructive fix. The agent works
    read-only against the cluster, never resets offsets, and ships every fix
    with a risk rating.
  category: cat-kafka
  series: streaming
  series_title: The Streaming Series
  lesson: 10
  difficulty: beginner
  tags: [tutorial, kafka, agent, incidents, lag, troubleshooting]
  learning_objectives:
    - Feed an incident agent the inputs it needs — group describe, offsets, logs
    - Follow a diagnosis, evidence, fix, prevention loop
    - Keep destructive shortcuts like offset resets off the table
  what_you_need:
    - Consumer-group describe output
    - Per-partition offsets
    - Consumer application logs
    - Install: npx de-agent-platform add kafka-troubleshooter
  steps:
    - text: Check lag trend and per-partition distribution.
      from_id: agent-kafka-troubleshooter
      from_field: workflow
    - text: Check group state history for rebalances.
      from_id: agent-kafka-troubleshooter
      from_field: workflow
    - text: Identify poison messages from retry counts.
      from_id: agent-kafka-troubleshooter
      from_field: workflow
    - text: Recommend the least destructive fix.
      from_id: agent-kafka-troubleshooter
      from_field: workflow
    - text: Expect four outputs — diagnosis, evidence, fix with risk rating, prevention measure.
      from_id: agent-kafka-troubleshooter
      from_field: outputs
    - text: Hold the guardrails — never resets offsets, read-only against the cluster.
      from_id: agent-kafka-troubleshooter
      from_field: guardrails
  check_yourself:
    - The verdict on "lag on partitions 3 and 7 only, others flat" is to re-key the offending key, not scale the fleet — the agent's own worked example.
    - The final recommendation includes a risk rating and a prevention measure, and no offset reset was proposed at any step.
  when_to_use:
    - "An incident needs a diagnosis with evidence, not a guess"
    - "A fix must be the least destructive option with its risk stated"
  why: Triage under pressure drifts toward the most destructive shortcut, and a fixed workflow with guardrails keeps the fix reversible and evidenced.
  gotchas:
    - "The agent never resets offsets — treat any offset-reset suggestion as out of bounds."
    - "It stays read-only against the cluster; it will not mutate group state."
    - "Lag on a few partitions only is key skew, not a capacity problem — the fix is re-keying, not fleet scaling."
  production_notes:
    - "Attach consumer-group describe output and application logs to the incident so the diagnosis is evidence-backed."
    - "File the prevention measure from each diagnosis as a follow-up action so the same lag signature does not recur."
  diagram: |
    kafka troubleshooter
       |
       |- inputs: describe output + offsets + logs
       |
       |- lag trend + per-partition distribution
       |
       |- group state history --> rebalances
       |
       |- retry counts --> poison messages
       |
       |- least destructive fix --> risk rating + prevention
       |
        --> guardrails: read-only, never reset offsets
  code:
    - title: Collect the group describe evidence
      lang: bash
      code: |
        kafka-consumer-groups --bootstrap-server $B --describe --group $G
        kafka-consumer-groups --bootstrap-server $B --describe --group $G --state
      source_id: runbook-kafka-consumer-lagging
    - title: Four-step workflow
      lang: text
      code: |
        - Check lag trend and per-partition distribution.
        - Check group state history for rebalances.
        - Identify poison messages from retry counts.
        - Recommend the least destructive fix.
      source_id: agent-kafka-troubleshooter
    - title: Outputs and guardrails
      lang: text
      code: |
        Outputs: Diagnosis, Evidence, Fix with risk rating, Prevention measure

        Guardrails:
        - Never resets offsets
        - Read-only against the cluster
      source_id: agent-kafka-troubleshooter
  source_refs: [agent-kafka-troubleshooter, skill-kafka-lag-triage]
