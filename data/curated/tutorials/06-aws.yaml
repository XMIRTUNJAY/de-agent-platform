- id: tutorial-aws-architecture-review-pass
  slug: aws-architecture-review-pass
  type: tutorial
  title: Run an AWS data architecture review pass
  description: >-
    Point the AWS Architecture Reviewer at an architecture description or IaC
    and follow its four-step workflow: map the services to a data flow, check
    IAM for least privilege, estimate dominant cost drivers, and identify
    single points of failure. The agent is read-only and never creates
    resources.
  category: cat-aws
  difficulty: intermediate
  tags: [tutorial, aws, architecture, iam, review, cost]
  learning_objectives:
    - Map an AWS data platform into a single data flow before judging it
    - Check IAM roles for least privilege
    - Name the dominant cost drivers and single points of failure
  what_you_need:
    - An architecture description or IaC
    - Workload characteristics (volume, freshness, consumers)
    - Install: npx de-agent-platform add aws-architecture-reviewer
  steps:
    - text: Map the described services to a data flow.
      from_id: agent-aws-architecture-reviewer
      from_field: workflow
    - text: Check IAM for least privilege.
      from_id: agent-aws-architecture-reviewer
      from_field: workflow
    - text: Estimate dominant cost drivers.
      from_id: agent-aws-architecture-reviewer
      from_field: workflow
    - text: Identify single points of failure.
      from_id: agent-aws-architecture-reviewer
      from_field: workflow
    - text: Collect the four outputs — architecture diagram (text), IAM findings, cost drivers, reliability risks.
      from_id: agent-aws-architecture-reviewer
      from_field: outputs
    - text: Hold the guardrails — the agent never creates resources and requires human approval for any IAM recommendation.
      from_id: agent-aws-architecture-reviewer
      from_field: guardrails
  check_yourself:
    - The review flags a Glue job running with an admin role and no bookmark, causing nightly full reprocessing — the agent's own worked example.
    - Every IAM recommendation stops at human approval, and the agent created zero resources during the pass.
  when_to_use:
    - "A new AWS data architecture needs a cost/IAM/reliability pass before build"
    - "An existing platform keeps producing cost surprises or single points of failure"
  why: Thirty AWS data-platform anti-patterns repeat across teams, and a fixed four-step review pass turns them into findings instead of incidents.
  gotchas:
    - "The agent never creates resources — anything beyond findings needs a human."
    - "IAM recommendations always require human approval; never auto-apply them."
    - "Bind mcp-aws to a dedicated least-privilege AWS profile with short-lived SSO credentials — never attach an admin role."
  production_notes:
    - "Score each pass against the 30-anti-pattern checklist so reviews are comparable over time."
    - "Keep the review read-only against the account; resource-creating tools require human confirmation."
  diagram: |
    aws architecture review
       |
       |- map services --> one data flow
       |
       |- IAM --> least privilege --> human approval only
       |
       |- cost drivers --> dominant spend ranked
       |
       |- single points of failure --> reliability risks
       |
       --> findings: diagram + IAM + cost + reliability
  code:
    - title: Bind the AWS MCP server to a named profile
      lang: yaml
      code: |
        mcpServers:
          aws-core:
            command: uvx
            args: [awslabs.core-mcp-server@latest]
            env:
              AWS_PROFILE: ${AWS_PROFILE}
              FASTMCP_LOG_LEVEL: ERROR
      source_id: mcp-aws
    - title: Four-step review workflow
      lang: text
      code: |
        - Map the described services to a data flow.
        - Check IAM for least privilege.
        - Estimate dominant cost drivers.
        - Identify single points of failure.
      source_id: agent-aws-architecture-reviewer
    - title: Outputs and guardrails
      lang: text
      code: |
        Outputs:
        - Architecture diagram (text)
        - IAM findings
        - Cost drivers
        - Reliability risks

        Guardrails:
        - Never creates resources
        - Requires human approval for any IAM recommendation
      source_id: agent-aws-architecture-reviewer
  source_refs: [agent-aws-architecture-reviewer, mcp-aws]
