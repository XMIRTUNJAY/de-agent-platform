# Tutorials — beginner-friendly arrangements of artifact content.
# Every step is verbatim from the cited source field. Structure (need, steps,
# check) is ours; wording is the source's.
- id: tutorial-athena-cut-bytes-scanned
  slug: athena-cut-bytes-scanned
  type: tutorial
  title: Cut Athena bytes scanned with partitions and projection
  description: >-
    Walk one expensive Athena query through the Partition Advisor's levers in
    order: confirm the per-TB bill model, partition on the dominant filter
    column, replace MSCK REPAIR with partition projection, compact small files,
    and move to columnar compression. Every move is judged by a single number —
    bytes scanned.
  category: cat-aws
  difficulty: beginner
  tags: [tutorial, aws, athena, partitions, projection, cost]
  learning_objectives:
    - Read the scanned-bytes metric per query
    - Apply partition projection for high-cardinality columns
    - Compact small files to cut per-request overhead
  what_you_need:
    - An Athena workgroup and a table you can query
    - The scanned-bytes metric for recent queries
    - Install: npx de-agent-platform add athena-partition-advisor
  steps:
    - text: "Judge every recommendation by one question — does this reduce bytes scanned? You pay per TB scanned, and nothing else matters."
      from_id: skill-athena-partition-advisor
      from_field: body
    - text: Partition on the dominant filter column (usually date).
      from_id: skill-athena-partition-advisor
      from_field: body
    - text: Use partition projection instead of `MSCK REPAIR` for predictable layouts.
      from_id: skill-athena-partition-advisor
      from_field: body
    - text: Compact small files — per-file overhead dominates at < 16 MB.
      from_id: skill-athena-partition-advisor
      from_field: body
    - text: Go columnar + compression (Parquet + snappy/zstd) — 10-100x vs CSV.
      from_id: skill-athena-partition-advisor
      from_field: body
  check_yourself:
    - Re-running the expensive query after the levers land shows the scanned-bytes metric dropping to only the touched date partitions.
    - A table whose files average under 16 MB is compacted, and the per-query bill no longer carries per-file overhead.
  when_to_use:
    - "Athena cost climbs with no change in query count"
    - "A partitioned table still scans everything because partition metadata relies on MSCK REPAIR"
  why: Bytes scanned is the only thing Athena bills, so applying the advisor's four levers in order is the shortest path to a smaller invoice on the next run.
  gotchas:
    - "Every recommendation is judged by bytes scanned — a change that adds complexity without cutting scan is a no."
    - "Per-file overhead dominates at < 16 MB — small files inflate the bill even when pruning works."
    - "Partition projection replaces MSCK REPAIR only for predictable layouts."
  production_notes:
    - "Track the scanned-bytes metric per query so layout regressions show up the day they land."
    - "Write Parquet with snappy/zstd; CSV inputs scan 10-100x more bytes for the same data."
  diagram: |
    athena bytes pass
       |
       |- read scanned-bytes metric --> baseline per query
       |
       |- partition on dominant filter column --> projection replaces MSCK REPAIR
       |
       |- compact small files (< 16 MB overhead) --> parquet + snappy/zstd
       |
       --> re-run query --> bytes scanned drops
  code:
    - title: The four levers, in order
      lang: text
      code: |
        ## Levers, in order
        1. Partition on the dominant filter column (usually date).
        2. Partition projection instead of `MSCK REPAIR` for predictable layouts.
        3. Compact small files — per-file overhead dominates at < 16 MB.
        4. Columnar + compression (Parquet + snappy/zstd) — 10-100x vs CSV.
      source_id: skill-athena-partition-advisor
    - title: Bill model — you pay per TB scanned
      lang: text
      code: |
        ## Bill model
        You pay per TB scanned. Every recommendation is judged by "does this reduce
        bytes scanned?" — nothing else matters.
      source_id: skill-athena-partition-advisor
  source_refs: [skill-athena-partition-advisor]
