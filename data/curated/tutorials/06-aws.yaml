- id: tutorial-glue-job-review-pass
  slug: glue-job-review-pass
  type: tutorial
  title: Review a Glue job for sizing, bookmarks, and catalogue drift
  description: >-
    Take a Glue/Spark job through the AWS Glue Job Reviewer's three checks:
    size workers from the input files' partitions instead of habit, verify the
    job bookmark against the input path layout, and diff the Glue Data Catalog
    schema against the Parquet file footer. Each check targets a silent cost
    leak that ends in full reprocessing.
  category: cat-aws
  difficulty: beginner
  tags: [tutorial, aws, glue, spark, cost, review]
  learning_objectives:
    - Size Glue workers from data volume, not habit
    - Use job bookmarks correctly
    - Avoid full-table reprocessing from catalogue mistakes
  what_you_need:
    - A Glue job definition and its input path layout
    - The task histogram from a recent run
    - Install: npx de-agent-platform add aws-glue-job-reviewer
  steps:
    - text: Start worker sizing at 2x the number of input files' partitions, then watch the task histogram.
      from_id: skill-aws-glue-reviewer
      from_field: body
    - text: Check the job bookmark — it only helps if the input path layout is stable.
      from_id: skill-aws-glue-reviewer
      from_field: body
    - text: Look for a renamed prefix under the input path; it silently resets the bookmark and triggers a full reprocess.
      from_id: skill-aws-glue-reviewer
      from_field: body
    - text: Diff the Glue Data Catalog schema against the file footer — drifting schemas make readers drop columns silently.
      from_id: skill-aws-glue-reviewer
      from_field: body
  check_yourself:
    - A job sized by habit is re-sized to 2x the input partitions and the task histogram shows balanced tasks instead of idle executors.
    - A prefix rename under the input path is caught before the next run, so the bookmark never silently resets into a full reprocess.
  when_to_use:
    - "A Glue job's bill grew without any change in data volume"
    - "A bookmark reset caused a surprise full reprocess overnight"
  why: Over-provisioned workers, reset bookmarks, and catalogue drift each cause silent full reprocessing, and this three-check pass catches all of them before the next run.
  gotchas:
    - "A bookmark only helps if the input path layout is stable — a renamed prefix silently resets it into a full reprocess."
    - "If the Glue Data Catalog schema drifts from the actual Parquet schema, readers drop columns silently."
    - "Over-provisioned workers are the most common Glue cost leak — size from data volume, not habit."
  production_notes:
    - "Keep the task histogram in every review; it is the fastest signal that sizing is wrong."
    - "Diff the catalogue schema against the file footer on a schedule, not as a one-off."
  diagram: |
    glue job review
       |
       |- sizing --> 2x input file partitions --> watch task histogram
       |
       |- bookmarks --> stable input layout? --> renamed prefix = full reprocess
       |
       |- catalogue --> diff catalog schema vs file footer --> silent column drops
       |
       --> findings before the next run
  code:
    - title: Sizing rule
      lang: text
      code: |
        ## Sizing
        Start at 2x the number of input files' partitions, then watch the task histogram.
        Over-provisioned workers are the most common Glue cost leak.
      source_id: skill-aws-glue-reviewer
    - title: Bookmarks and the catalogue trap
      lang: text
      code: |
        ## Bookmarks
        A bookmark only helps if the input path layout is stable. A renamed prefix
        silently resets the bookmark → full reprocess.

        ## Catalogue trap
        If the Glue Data Catalog schema drifts from the actual Parquet schema, readers
        drop columns silently. Diff the catalogue schema against the file footer.
      source_id: skill-aws-glue-reviewer
  source_refs: [skill-aws-glue-reviewer]
