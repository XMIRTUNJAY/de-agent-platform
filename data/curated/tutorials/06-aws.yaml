- id: tutorial-s3-glue-athena-starter
  slug: s3-glue-athena-starter
  type: tutorial
  title: Stand up the S3 → Glue → Athena starter
  description: >-
    Deploy the serverless query-in-place starter end to end: Terraform
    provisions buckets, catalog, and a bounded Athena workgroup, Parquet lands
    in a Hive layout, the table is registered with partition projection, and
    pruning is proven with explain analyze. The sample data ships one
    deliberately oversized file to demonstrate compaction.
  category: cat-aws
  difficulty: beginner
  tags: [tutorial, aws, s3, glue, athena, terraform]
  learning_objectives:
    - Lay out Parquet so Athena prunes well
    - Use partition projection instead of repeated crawls
    - Measure and cut bytes scanned
  what_you_need:
    - Terraform and an AWS profile it can apply with
    - The starter repo (terraform/, ddl/table.sql, queries/, sample Parquet under data/dt=)
    - Install: amp template new de-agent/terraform-aws-data-platform ./infra
  steps:
    - text: "Provision the stack: terraform init && terraform apply."
      from_id: project-s3-glue-athena
      from_field: setup
    - text: "Land the data: aws s3 sync data/ s3://<bucket>/<prefix>/."
      from_id: project-s3-glue-athena
      from_field: setup
    - text: "Register the table: run ddl/table.sql in Athena to register with projection."
      from_id: project-s3-glue-athena
      from_field: setup
    - text: Define the table with projection on dt (no MSCK REPAIR).
      from_id: project-s3-glue-athena
      from_field: implementation
    - text: "Verify pruning: explain analyze shows partition pruning on dt."
      from_id: project-s3-glue-athena
      from_field: tests
    - text: Add the workgroup guardrail — an Athena workgroup with a per-query bytes-scanned limit.
      from_id: project-s3-glue-athena
      from_field: production_hardening
  check_yourself:
    - explain analyze on a dt-filtered query shows partition pruning, and the workgroup reports scanned bytes within budget.
    - A query that scans everything is traced to a predicate that is not on the partition column, then fixed without touching the layout.
  when_to_use:
    - "A serverless lakehouse on AWS is needed without a cluster to run"
    - "Athena cost must stay bounded while dashboards query S3 Parquet"
  why: The starter makes the query-in-place pattern real with projection DDL and a workgroup bytes limit, so cost and layout are right from day one.
  gotchas:
    - "A new partition is invisible → the projection pattern does not match the layout."
    - "A query scans everything → the predicate is not on the partition column."
    - "Thousands of tiny files → compact; the sample data ships one deliberately oversized file to demonstrate the fix."
  production_notes:
    - "Run the workgroup with a per-query bytes-scanned limit and CloudWatch alarms on scanned bytes per hour."
    - "Add a nightly compaction job to keep the Parquet layout near the 128 MB target."
  diagram: |
    s3 -> glue -> athena starter
       |
       |- terraform apply --> buckets + catalog + workgroup (bytes limit)
       |
       |- s3 sync data/ --> hive layout dt=..
       |
       |- ddl/table.sql --> partition projection (no MSCK REPAIR)
       |
        |- explain analyze --> pruning on dt --> bytes scanned in budget
  code:
    - title: Provision and land the data
      lang: bash
      code: |
        terraform init && terraform apply
        aws s3 sync data/ s3://<bucket>/<prefix>/
      source_id: project-s3-glue-athena
    - title: Starter repo layout
      lang: text
      code: |
        s3-glue-athena/
          terraform/            # s3, glue catalog, athena workgroup
          ddl/table.sql         # partition projection DDL
          queries/*.sql
          data/dt=2026-09-01/*.parquet
      source_id: project-s3-glue-athena
    - title: Scaffold the stack from the Terraform template
      lang: bash
      code: |
        amp template new de-agent/terraform-aws-data-platform ./infra
      source_id: tpl-terraform-aws-data
  source_refs: [project-s3-glue-athena, tpl-terraform-aws-data]
