- id: tutorial-agentic-de-data-toolkit-start
  slug: agentic-de-data-toolkit-start
  type: tutorial
  title: Onboard an agent with the DE Data Toolkit
  description: >-
    Onboard an agent onto a data repo with the DE Data Toolkit plugin: the
    SQL/Spark review skills, the destructive-SQL guard, a secret scanner, and the
    file/git MCP servers already wired. Learn the three commands and which hooks
    run underneath.
  category: cat-agentic
  difficulty: intermediate
  tags: [tutorial, agentic, plugin, review, guardrails]
  series: agentic
  series_title: The Agentic Series
  lesson: 2
  learning_objectives:
    - Install the starter plugin for a data repo
    - Use /review-sql and /review-spark on a change
    - Verify guard status before writing
  what_you_need:
    - An agent host with plugin support
    - A data repository to review
    - Install: amp plugin add de-agent/de-data-toolkit
  steps:
    - text: "Install the plugin: `amp plugin add de-agent/de-data-toolkit`."
      from_id: plugin-de-data-toolkit
      from_field: installation
    - text: Confirm what ships — SQL/Spark review skills, the destructive-SQL guard, a secret scanner and the file/git MCP servers.
      from_id: plugin-de-data-toolkit
      from_field: description
    - text: Run `/review-sql` on a SQL change.
      from_id: plugin-de-data-toolkit
      from_field: commands
    - text: Run `/review-spark` on a PySpark transform.
      from_id: plugin-de-data-toolkit
      from_field: commands
    - text: Run `/guard-status` to check the wired guards.
      from_id: plugin-de-data-toolkit
      from_field: commands
    - text: Note the hooks wired underneath — hook-destructive-sql-guard and hook-secret-scan-commit.
      from_id: plugin-de-data-toolkit
      from_field: hooks
  check_yourself:
    - "`DROP TABLE prod.orders` from the agent is denied and surfaced for confirmation."
    - A staged diff containing a hardcoded `postgresql://user:pass@...` connection string is blocked at commit.
  when_to_use:
    - "Onboarding an agent onto a data engineering repo"
    - "A starter setup that needs review skills plus guardrails from day one"
  why: The starter plugin wires the review skills, the file/git servers and the safety hooks together, so an agent is useful and guarded on day one.
  gotchas:
    - "The plugin's permissions are filesystem read-write with network none — it reviews code; it does not query warehouses."
    - "A DELETE/UPDATE without a WHERE clause is always denied by the destructive SQL guard."
    - "Entropy-based secret detection warns; pattern matches block — a warning is not a pass."
  production_notes:
    - "Keep hook-secret-scan-commit active on every repo agents commit to."
    - "The plugin uses skill-sql-review and skill-spark-data-quality-review — keep them in sync with the plugin."
  diagram: |
    agent + de-data-toolkit
       |
       |- /review-sql --> SQL findings
       |
       |- /review-spark --> transform findings
       |
       |- /guard-status --> guards active
       |
       |- hooks --> destructive SQL denied + secrets blocked at commit
  code:
    - title: Install the plugin
      lang: bash
      code: |
        amp plugin add de-agent/de-data-toolkit
      source_id: plugin-de-data-toolkit
    - title: The three commands
      lang: text
      code: |
        /review-sql     # review a SQL change
        /review-spark   # review a PySpark transform
        /guard-status   # check the wired guards
      source_id: plugin-de-data-toolkit
    - title: Destructive SQL guard — what gets denied
      lang: text
      code: |
        Destructive statements are denied by default; a DELETE/UPDATE without a WHERE
        clause is always denied. Statements on a non-production target can be allowed
        with a `--allow-destructive` flag that requires a human confirmation token.

        Example: `DROP TABLE prod.orders` from an agent is denied and surfaced for confirmation.
      source_id: hook-destructive-sql-guard
