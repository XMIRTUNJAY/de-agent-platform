- id: tutorial-gate-backfills-with-hook
  slug: gate-backfills-with-hook
  type: tutorial
  title: Gate backfills with the safety check hook
  description: >-
    Wire the Backfill Safety Check as a pre-run gate that refuses any backfill
    lacking an explicit date range, a shadow or snapshotted target, and a window
    clear of the scheduled production run — and watch it block the bare backfill
    command that would otherwise corrupt the target.
  category: cat-airflow
  difficulty: intermediate
  tags: [tutorial, airflow, backfill, hook, guardrail]
  learning_objectives:
    - Install a pre-run gate that intercepts backfill triggers
    - State the three requirements the hook enforces before any backfill
    - Recognize a denied bare backfill command and what it was missing
  what_you_need:
    - A scheduler or wrapper that triggers backfills
    - The daily production schedule for the target DAG
    - A shadow table or snapshot procedure for the target
  steps:
    - text: Set the trigger to pre-run so the check intercepts a backfill trigger.
      from_id: hook-backfill-safety-check
      from_field: trigger
    - text: Require an explicit date range.
      from_id: hook-backfill-safety-check
      from_field: implementation
    - text: Require a target that is either a shadow table or snapshotted.
      from_id: hook-backfill-safety-check
      from_field: implementation
    - text: Require a window that does not overlap the scheduled production run.
      from_id: hook-backfill-safety-check
      from_field: implementation
    - text: Deny the trigger otherwise — failure behavior is block.
      from_id: hook-backfill-safety-check
      from_field: failure_behavior
    - text: "Confirm the gate: a bare `airflow dags backfill --start-date 2024-01-01` is denied for missing a range and rollback."
      from_id: hook-backfill-safety-check
      from_field: example
  check_yourself:
    - A bare `airflow dags backfill --start-date 2024-01-01` is denied for missing a range and rollback.
    - A trigger with an explicit range, a snapshotted target and an off-peak window passes the pre-run check.
  when_to_use:
    - "Any historical recompute of a production table"
    - "A backfill trigger lacks a rollback path or overlaps the daily run"
  why: The cheapest backfill incident is the one denied before it starts — a pre-run block costs seconds, a corrupted target costs days.
  gotchas:
    - "Never overlap the production window; never backfill without a rollback path."
    - "An explicit date range alone is not enough — the target must be a shadow table or snapshotted."
    - "Passing the gate is not the finish line — backfill in date batches, smallest first, validating a sample after each batch."
  production_notes:
    - "failure_behavior is block — the hook denies the trigger instead of warning."
    - "Document a backfill runbook per pipeline, with its idle window and resource budget."
  diagram: |
    backfill trigger
       |
       |- pre-run gate --> explicit date range? --> no --> block
       |
       |- shadow or snapshotted target? --> no --> block
       |
       |- window clear of daily run? --> yes --> run batches, validate samples
  code:
    - title: Pre-run gate requirements
      lang: text
      code: |
        Intercepts a backfill trigger. Requires: an explicit date range, a target that
        is either a shadow table or snapshotted, and a window that does not overlap the
        scheduled production run. Denies otherwise.
      source_id: hook-backfill-safety-check
    - title: Bare backfill command the gate denies
      lang: bash
      code: |
        airflow dags backfill --start-date 2024-01-01
      source_id: hook-backfill-safety-check
    - title: Compliant trigger with an explicit range
      lang: bash
      code: |
        airflow dags backfill --start-date YYYY-MM-DD --end-date YYYY-MM-DD --reset-dagruns dag_id
      source_id: runbook-backfill-required
