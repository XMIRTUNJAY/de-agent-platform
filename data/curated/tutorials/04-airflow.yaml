- id: tutorial-plan-safe-backfill
  slug: plan-safe-backfill
  type: tutorial
  title: Plan and execute a safe backfill
  description: >-
    Use the Backfill Planner's four-step plan — correctness criteria, downstream
    impact from lineage, cost and contention, staged batches — then execute it
    the way the backfill runbook demands: shadow table, sample validation per
    batch, and never beside the daily production run.
  category: cat-airflow
  difficulty: intermediate
  tags: [tutorial, backfill, airflow, planning, safety]
  learning_objectives:
    - Write correctness criteria for a backfill before running it
    - Compute the downstream impact set from lineage
    - Execute the backfill in batches with validation gates and a rollback path
  what_you_need:
    - Target table and date range
    - Pipeline dependencies and lineage
    - An idle window that excludes the daily job
    - Install: npx de-agent-platform add backfill-planner
  steps:
    - text: Define correctness criteria for the backfill.
      from_id: agent-backfill-planner
      from_field: workflow
    - text: Compute downstream impact from lineage.
      from_id: agent-backfill-planner
      from_field: workflow
    - text: Estimate cost and contention.
      from_id: agent-backfill-planner
      from_field: workflow
    - text: Stage batches with validation between them.
      from_id: agent-backfill-planner
      from_field: workflow
    - text: "Write to a shadow table, validate a sample, then swap."
      from_id: runbook-backfill-required
      from_field: fix
    - text: Never run a backfill concurrently with the daily production run.
      from_id: runbook-backfill-required
      from_field: fix
  check_yourself:
    - The plan includes a rollback path and an explicit window with the daily job excluded — the planner refuses to plan without both.
    - A 90-day backfill comes out planned around the daily run, batched weekly, with a shadow table and a row-count gate.
  when_to_use:
    - "A past date range is wrong or missing"
    - "A logic fix or new column must be applied historically"
  why: A backfill is production work with a bigger blast radius than the original pipeline — shadow-write, sample-validate, then swap.
  gotchas:
    - "Never run a backfill concurrently with the daily production run."
    - "One huge date range starves the cluster; batch it and validate a sample per batch."
    - "Backfilling without a written definition of correctness just relocates the bug."
  production_notes:
    - "Idempotent pipelines make a backfill a routine operation."
    - "Document a backfill runbook per pipeline, with its idle window and resource budget."
  diagram: |
    backfill plan
       |
       |- correctness criteria --> downstream impact from lineage
       |
       |- cost + contention --> idle window with daily job excluded
       |
       |- shadow table --> batched dates --> validate sample per batch --> swap
  code:
    - title: Batched backfill command
      lang: bash
      code: |
        airflow dags backfill --start-date YYYY-MM-DD --end-date YYYY-MM-DD --reset-dagruns dag_id
        # prefer batched date ranges over one large range
      source_id: runbook-backfill-required
    - title: Shadow-write, validate, then swap
      lang: text
      code: |
        - Write to a shadow table, validate a sample, then swap.
        - Batch by date; validate a sample after each batch.
        - Never run a backfill concurrently with the daily production run.
      source_id: runbook-backfill-required
  source_refs: [agent-backfill-planner, runbook-backfill-required]
