- id: tutorial-scaffold-airflow-dag
  slug: scaffold-airflow-dag
  type: tutorial
  title: Scaffold an idempotent DAG from the template
  description: >-
    Generate a new pipeline from the Airflow DAG template and keep its
    guarantees — an idempotent skeleton with task groups, retries and backoff,
    SLA, pools, and a reschedule-mode sensor — then make catchup a deliberate
    choice and every write partition-keyed or a MERGE.
  category: cat-airflow
  difficulty: beginner
  tags: [tutorial, airflow, dag, template, scaffolding, beginner]
  learning_objectives:
    - Scaffold a DAG project with tests and a Dockerfile from the template
    - Write tasks that are safe to re-run from day one
    - Set catchup, retries and sensor modes as deliberate choices
  what_you_need:
    - An Airflow development environment
    - Install: amp template new de-agent/airflow-dag ./dags
    - A pipeline to model, such as a daily orders job
  steps:
    - text: Run amp template new de-agent/airflow-dag ./dags.
      from_id: tpl-airflow-dag
      from_field: installation
    - text: "Work in the generated layout: dags/orders_pipeline.py, plugins/, tests/test_dag_integrity.py, Dockerfile."
      from_id: tpl-airflow-dag
      from_field: repo_structure
    - text: Keep the skeleton's guarantees — task groups, retries and backoff, SLA, pools, and a sensor using reschedule mode.
      from_id: tpl-airflow-dag
      from_field: description
    - text: Every task writes to a partition keyed by the logical date, or uses MERGE.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: Set `catchup` as a deliberate choice, not a default.
      from_id: skill-airflow-dag-reviewer
      from_field: body
  check_yourself:
    - The generated project matches the template layout — dags/orders_pipeline.py, plugins/, tests/test_dag_integrity.py and a Dockerfile are all present.
    - Asking the idempotency question of each task — same logical date, same output? — every task answers yes.
  when_to_use:
    - "A new pipeline DAG is being created and must be idempotent from day one"
    - "A team wants a standard layout with DAG-integrity tests included"
  why: A skeleton with retries, backoff, SLA, pools and reschedule sensors built in is cheaper than un-duplicating rows after the first retry.
  gotchas:
    - "`max_active_runs` and pool limits prevent a backfill from starving the daily run."
    - "Sensors use `reschedule`, not `poke`, so they don't hold a worker slot."
    - "Never overlap the production window; never backfill without a rollback path."
  production_notes:
    - "The template ships tests/test_dag_integrity.py — run DAG-integrity tests in CI."
    - "Pair the scaffold with skill-airflow-dag-reviewer and pattern-backfill-safety, the template's declared related resources."
  diagram: |
    scaffold dag
       |
       |- amp template new --> orders_pipeline.py + tests + Dockerfile
       |
       |- keep guarantees --> retries/backoff, SLA, pools, reschedule sensor
       |
       |- partition or MERGE writes --> deliberate catchup --> review with idempotency test
  code:
    - title: Scaffold the DAG project
      lang: bash
      code: |
        amp template new de-agent/airflow-dag ./dags
      source_id: tpl-airflow-dag
    - title: Generated project layout
      lang: text
      code: |
        airflow-dag/
          dags/orders_pipeline.py
          plugins/
          tests/test_dag_integrity.py
          Dockerfile
      source_id: tpl-airflow-dag
    - title: Guarantees the scaffold must keep
      lang: text
      code: |
        1. Every task writes to a partition keyed by the logical date, or uses MERGE.
        2. `catchup` is a deliberate choice, not a default.
        3. Retries have a backoff; a task that retries instantly will hammer a downstream.
        4. `max_active_runs` and pool limits prevent a backfill from starving the daily run.
        5. Sensors use `reschedule`, not `poke`, so they don't hold a worker slot.
      source_id: skill-airflow-dag-reviewer
