# Tutorials — beginner-friendly arrangements of artifact content.
# Every step is verbatim from the cited source field. Structure (need, steps,
# check) is ours; wording is the source's.
- id: tutorial-review-dag-idempotency
  slug: review-dag-idempotency
  type: tutorial
  title: Review a DAG for idempotency and retry safety
  description: >-
    Walk the Pipeline Reviewer's four-step pass over a DAG: apply the
    idempotency test to every task, check retry, timeout and concurrency
    settings, predict backfill behaviour, and propose missing integration
    tests — then close the loop with the Airflow DAG Reviewer's checklist so
    every task is safe to re-run before the DAG merges.
  category: cat-airflow
  difficulty: beginner
  tags: [tutorial, airflow, dag, review, idempotency, beginner]
  learning_objectives:
    - Apply the idempotency test to every task in a DAG
    - Justify retry, timeout and concurrency settings per task
    - Predict what a backfill will do before running it
  what_you_need:
    - A DAG file or pull request to review
    - The pipeline's schedule and SLA
    - Install: npx de-agent-platform add airflow-dag-reviewer
  steps:
    - text: Apply the idempotency test to every task.
      from_id: agent-pipeline-reviewer
      from_field: workflow
    - text: Check retry, timeout and concurrency settings.
      from_id: agent-pipeline-reviewer
      from_field: workflow
    - text: Predict backfill behaviour.
      from_id: agent-pipeline-reviewer
      from_field: workflow
    - text: Propose missing integration tests.
      from_id: agent-pipeline-reviewer
      from_field: workflow
    - text: Set retries with a backoff — a task that retries instantly will hammer a downstream.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: Cap max_active_runs and pool limits so a backfill cannot starve the daily run.
      from_id: skill-airflow-dag-reviewer
      from_field: body
  check_yourself:
    - On the fixture of 8 DAGs with seeded non-idempotency bugs, the review flags every seeded bug and no healthy task.
    - Reviewing a task that appends without a partition key, you flag it as duplicating rows on retry.
  when_to_use:
    - "A DAG is about to merge and must be safe to retry"
    - "A backfill is being considered and its behaviour must be predicted first"
  why: Non-idempotent tasks duplicate rows on every retry, and the reviewer's read-only four-step pass surfaces that before the DAG ships.
  gotchas:
    - "A task that appends without a partition key will duplicate rows on retry."
    - "`catchup` is a deliberate choice, not a default."
    - "Sensors use `reschedule`, not `poke`, so they don't hold a worker slot."
  production_notes:
    - "The reviewer is read-only analysis and never triggers a run."
    - "Keep the fixture of 8 DAGs with seeded non-idempotency bugs in CI so regressions resurface."
  diagram: |
    dag review pass
       |
       |- idempotency test per task --> flag appends without partition keys
       |
       |- retry/timeout/concurrency check --> backoff + max_active_runs
       |
       |- predict backfill behaviour --> propose missing integration tests
  code:
    - title: The idempotency test
      lang: text
      code: |
        "If this task runs twice for the same logical date, is the output the same?"
        If no, fix it before anything else — retries will happen.
      source_id: skill-airflow-dag-reviewer
    - title: DAG review checklist
      lang: text
      code: |
        1. Every task writes to a partition keyed by the logical date, or uses MERGE.
        2. `catchup` is a deliberate choice, not a default.
        3. Retries have a backoff; a task that retries instantly will hammer a downstream.
        4. `max_active_runs` and pool limits prevent a backfill from starving the daily run.
        5. Sensors use `reschedule`, not `poke`, so they don't hold a worker slot.
      source_id: skill-airflow-dag-reviewer
    - title: Install the DAG reviewer
      lang: bash
      code: |
        npx de-agent-platform add airflow-dag-reviewer
      source_id: skill-airflow-dag-reviewer
  source_refs: [agent-pipeline-reviewer, skill-airflow-dag-reviewer]
