  verification: community
  last_verified: '2026-10-24'
  security: { runs_code: false, network_access: true, credentials: true, filesystem_access: false, external_apis: false }
  relationships: { related_to: [cat-data-observability] }
- id: tutorial-obs-lineage-incident
  slug: obs-lineage-incident
  type: tutorial
  title: >-
    Incident drill: a broken upstream caught by freshness and lineage
  description: >-
    The source job quietly changed from hourly to daily; the mart's 6h
    freshness SLA now fails by construction. Run the drill — confirm the
    breach from the diff, walk upstream with get_lineage, and report the
    impact set with owner, criticality and the earliest SLA that breaks.
  category: cat-data-observability
  series: observability
  series_title: The Observability Series
  lesson: 9
  difficulty: intermediate
  tags: [tutorial, observability, incident, lineage, freshness, drill]
  learning_objectives:
    - Confirm a freshness breach from a schedule diff in minutes
    - Walk upstream with get_lineage to find the source that slowed
    - Report the impact set — owner, criticality, earliest SLA — as the incident note
  what_you_need:
    - Install: npx de-agent-platform add lineage-explainer
    - A lineage store reached through mcp-datahub or the lineage-graph plugin
  steps:
    - text: Confirm the trigger — a cron changed from hourly to daily, and a 6h freshness SLA will be violated.
      from_id: hook-freshness-pre-merge
      from_field: example
    - text: Show the arithmetic — the check compares the schedule in the diff with the declared SLA and warns with the computed worst-case lag.
      from_id: hook-freshness-pre-merge
      from_field: implementation
    - text: Name the guard that should have caught it — a hook that warns when a change would silently widen the freshness SLA of a source.
      from_id: hook-freshness-pre-merge
      from_field: description
    - text: Walk upstream — get_lineage from the stale asset finds the source that stopped feeding on time.
      from_id: mcp-datahub
      from_field: tools
    - text: Walk downstream for impact — from the broken node to the published marts; report owner, criticality, and the earliest SLA that will break.
      from_id: skill-lineage-explainer
      from_field: body
    - text: Ask the opening question out loud — "what breaks if I change this column?" is how the drill starts.
      from_id: skill-lineage-explainer
      from_field: tagline
    - text: Run it from commands — /lineage-up to find the culprit, /impact to size the blast radius.
      from_id: plugin-lineage-graph
      from_field: commands
  check_yourself:
    - You can state the breach, the worst-case lag, the broken source and the first SLA that breaks — in that order, with evidence.
    - The incident note names an owner and a criticality, not a dashboard link.
  when_to_use:
    - "A freshness alert fired and nobody knows which upstream moved"
    - "You are rehearsing incidents and want a drill with a provable paper trail"
  why: Freshness tells you something broke; lineage tells you what and who — the drill is the two in sequence.
  gotchas:
    - "The diff is evidence — the schedule change and the SLA it breaks are provable before anyone is paged."
    - "An upstream that slowed rather than stopped still breaches a tight SLA — worst-case lag catches it."
    - "Stop the walk at published marts — that is where owners and SLAs live, and where the walk ends."
  production_notes:
    - "Wire the freshness-pre-merge check into CI so this incident class dies before merge."
    - "Keep the drill to four questions — breach, source, impact set, owner."
  diagram: |
    incident drill
       |
       |- 1. breach:  cron hourly→daily vs 6h SLA ──▶ worst-case lag 24h
       |
       |- 2. source:  get_lineage(stale mart) ──▶ upstream source slowed
       |
       |- 3. impact:  walk downstream ──▶ mart_revenue (published) ──▶ owner, criticality, earliest SLA
       |
        --> 4. page: owner + evidence (the diff), not a dashboard screenshot
  code:
    - title: The drill in four moves
      lang: text
      code: |
        1. breach:  cron hourly→daily vs 6h SLA — worst-case lag 24h
        2. source:  get_lineage(stale mart) — the upstream source slowed
        3. impact:  walk downstream, stop at published marts —
                    owner, criticality, earliest SLA that breaks
        4. page:    owner + evidence (the diff), not a screenshot
      source_id: skill-lineage-explainer
    - title: The command pair for the drill
      lang: text
      code: |
        /lineage-up <stale asset>    # find what feeds it, spot the slow source
        /impact <broken column>      # list downstream consumers a change breaks
      source_id: plugin-lineage-graph
  source_refs: [hook-freshness-pre-merge, mcp-datahub, skill-lineage-explainer, plugin-lineage-graph]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
