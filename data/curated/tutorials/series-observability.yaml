- id: tutorial-obs-prod-gotchas
  slug: obs-prod-gotchas
  type: tutorial
  title: >-
    Production gotchas: alert fatigue, missing contracts, no-data silence
  description: >-
    Three failure modes of a monitoring stack that looks healthy: alerts that
    page until nobody reads them, metrics with no declared SLA behind them,
    and no-data windows that pass as health. Grounded in the alerting
    semantics of Prometheus and Grafana and the schedule-vs-SLA contract.
  category: cat-data-observability
  series: observability
  series_title: The Observability Series
  lesson: 8
  difficulty: intermediate
  tags: [tutorial, observability, alerting, alert-fatigue, production, sla]
  learning_objectives:
    - Tie every alert to a declared SLA so paging has a contract
    - Configure no-data handling and evaluation intervals explicitly
    - Catch schedule-vs-SLA drift at pre-merge instead of at 3 a.m.
  what_you_need:
    - Access to your alerting rules and their no-data settings
    - A schedule change in review to practice the SLA check on
  steps:
    - text: Learn the two silent killers — no-data handling and evaluation intervals are alerting semantics documented precisely, and both decide whether an alert fires at all.
      from_id: ref-grafana-docs
      from_field: why
    - text: Ground the expression — the metrics model and PromQL semantics pages settle how to express and alert on pipeline metrics.
      from_id: ref-prometheus-docs
      from_field: why
    - text: Know where rules live — dashboards, panel queries, alerting including the unified alerting model, and provisioning.
      from_id: ref-grafana-docs
      from_field: description
    - text: See the missing contract — a cron change from hourly to daily silently widens a 6h freshness SLA; nothing in the metric changed, everything in the promise did.
      from_id: hook-freshness-pre-merge
      from_field: example
    - text: Catch it earlier — warn when a change would silently widen the freshness SLA of a source, before it merges.
      from_id: hook-freshness-pre-merge
      from_field: description
    - text: Compute it in review — compare the schedule in the diff with the declared SLA and warn with the computed worst-case lag.
      from_id: hook-freshness-pre-merge
      from_field: implementation
    - text: Audit the tooling itself — the catalog that answers "who owns this" holds sensitive metadata; use a scoped token and keep the endpoint internal.
      from_id: mcp-datahub
      from_field: security_notes
  check_yourself:
    - Every rule you own can answer "which SLA does this defend, and what happens on no data?" in one line.
    - A schedule change that widens worst-case lag past the SLA is caught in review, not by the pager.
  when_to_use:
    - "Alert volume is rising and pages are starting to be ignored"
    - "An incident began with a change nobody connected to a data signal"
  why: Alert fatigue is a contract problem — rules that defend a named SLA page rarely and are read every time.
  gotchas:
    - "An alert on a metric with no declared SLA is an opinion — name the SLA in the rule or delete the rule."
    - "No-data and evaluation interval are set-once-and-forgotten settings that decide everything — review them like code."
    - "Metadata is sensitive too — a scoped token on the catalog beats a shared admin token every time."
  production_notes:
    - "Review no-data handling quarterly — silent dashboards are how incidents start rested."
    - "Move schedule-vs-SLA checks into CI so the pager only fires for things review cannot catch."
  diagram: |
    alert hygiene
       |
       |- rule ──▶ which SLA does it defend? ──▶ name the number
       |
       |- no-data ──▶ fire (default) or pass ──▶ decide explicitly
       |
       |- evaluation interval ──▶ detection lag ──▶ compare to SLA window
       |
       |- schedule change ──▶ worst-case lag vs SLA ──▶ warn pre-merge
       |
        --> pager pages a named owner about a breached contract
  code:
    - title: The contract checklist for every alert rule
      lang: text
      code: |
        1. Which SLA does this rule defend? (name the number)
        2. What happens on no data? (fire, not pass)
        3. How often is it evaluated, and what does that add to detection lag?
      source_id: ref-grafana-docs
    - title: Schedule vs SLA, computed in review
      lang: text
      code: |
        compare(cron_in_diff, declared_sla)
        worst_case_lag = longest interval the schedule can leave the table stale
        warn if worst_case_lag > declared_sla
        # hourly → daily against a 6h SLA warns before the merge
      source_id: hook-freshness-pre-merge
  source_refs: [ref-grafana-docs, ref-prometheus-docs, hook-freshness-pre-merge, mcp-datahub]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
