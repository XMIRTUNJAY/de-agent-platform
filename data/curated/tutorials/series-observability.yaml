- id: tutorial-obs-capstone-checklist
  slug: obs-capstone-checklist
  type: tutorial
  title: >-
    Capstone: the data-platform observability checklist
  description: >-
    Ten lessons compress into one page. Declare SLAs, express them as metrics
    and alerts with explicit no-data handling, instrument runs with traces,
    emit lineage events, keep the catalog authoritative — and gate both
    schedule changes and column changes pre-merge.
  category: cat-data-observability
  series: observability
  series_title: The Observability Series
  lesson: 10
  difficulty: intermediate
  tags: [tutorial, observability, checklist, capstone, production]
  learning_objectives:
    - Assemble the full stack — metrics, alerts, traces, lineage, catalog
    - Gate schedule and column changes pre-merge with SLA and impact checks
    - Run the incident drill from memory
  what_you_need:
    - Install: npx de-agent-platform add lineage-explainer
    - Every surface from lessons 2-9 wired — metrics, alerts, lineage, catalog
  steps:
    - text: Metrics layer — the metrics model and PromQL semantics pages settle how to express and alert on pipeline metrics.
      from_id: ref-prometheus-docs
      from_field: why
    - text: Alert layer — alerting semantics, no-data handling and evaluation intervals, documented in precise, citable terms.
      from_id: ref-grafana-docs
      from_field: why
    - text: Instrumentation layer — the semantic-conventions pages define standard attribute names worth citing exactly.
      from_id: ref-otel-docs
      from_field: why
    - text: Lineage layer — an open specification for lineage events, which is what makes cross-tool lineage possible.
      from_id: ref-openlineage-docs
      from_field: why
    - text: Catalog layer — the metadata model explains how to represent ownership and lineage consistently across tools.
      from_id: ref-datahub-docs
      from_field: why
    - text: Contract layer — every source carries a declared freshness SLA; changes that silently widen it are warned against.
      from_id: hook-freshness-pre-merge
      from_field: description
    - text: Change layer — before merging, walk the impact set from the changed node to the published marts; report owner, criticality, earliest SLA.
      from_id: skill-lineage-explainer
      from_field: body
  check_yourself:
    - You can draw the stack — metrics, data signals, traces, lineage, catalog — and name one tool per layer.
    - You can run the incident drill — breach, source, impact set, owner — without notes.
  when_to_use:
    - "A new pipeline is about to ship and needs its observability wired the same way as the rest"
    - "You are auditing an existing platform and want one page of must-haves"
  why: Observability is a checklist you can run under pressure — this page is it.
  gotchas:
    - "Every layer has a standard — metrics and traces (Prometheus, OpenTelemetry), lineage (OpenLineage), ownership (DataHub); inventing one per tool is how drift starts."
    - "A checklist skipped under deadline pressure is the incident you will have instead — automate the gates where possible."
    - "The pre-merge gates are the cheapest lines on the page — one prevented incident pays for all of it."
  production_notes:
    - "Rehearse the incident drill quarterly — lineage reads fast only for people who have walked it."
    - "Review the checklist when a tool changes — the standards above move slowly, the integrations do not."
  diagram: |
    the observability stack, gated
       |
       |- metrics (Prometheus) ── alerts (Grafana, no-data set)
       |- traces (OpenTelemetry, semantic conventions)
       |- lineage (OpenLineage events) ── catalog (DataHub: owner & SLA)
       |
       |- pre-merge gates:
       |     schedule change ──▶ worst-case lag vs declared SLA ──▶ warn
       |     column change   ──▶ impact set ──▶ owner, criticality, earliest SLA
       |
        --> pager pages a named owner about a breached contract
  code:
    - title: The data-signal half of the checklist
      lang: text
      code: |
        □ Freshness SLA declared per source; staleness metric + alert rule
        □ No-data handling explicit — silence pages, it does not pass
        □ Evaluation interval chosen against the SLA window
        □ Every rule names the SLA it defends
      source_id: ref-grafana-docs
    - title: The lineage half of the checklist
      lang: text
      code: |
        □ Lineage events emitted per job, queryable from the store
        □ Technical and business lineage both readable for any asset
        □ Column change → impact set before merge (owner, criticality, earliest SLA)
      source_id: skill-lineage-explainer
  source_refs: [ref-prometheus-docs, ref-grafana-docs, ref-otel-docs, ref-openlineage-docs, ref-datahub-docs, hook-freshness-pre-merge, skill-lineage-explainer]
