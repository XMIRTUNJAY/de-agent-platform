- id: tutorial-obs-lineage-explainer-walkthrough
  slug: obs-lineage-explainer-walkthrough
  type: tutorial
  title: >-
    Walkthrough: the lineage-explainer skill, from question to impact set
  description: >-
    Install the lineage-explainer skill and walk it end to end: ask what
    breaks if a column changes, read technical and business lineage from the
    store, and produce an impact report with owner, criticality and the
    earliest SLA that breaks.
  category: cat-data-lineage
  series: observability
  series_title: The Observability Series
  lesson: 7
  difficulty: intermediate
  tags: [tutorial, lineage, skill, impact-analysis, walkthrough]
  learning_objectives:
    - Install and invoke the lineage-explainer skill
    - Distinguish technical lineage from business lineage in its output
    - Produce an impact report with owner, criticality and earliest SLA
  what_you_need:
    - Install: npx de-agent-platform add lineage-explainer
    - A lineage store the skill can read (DataHub or any OpenLineage-compatible backend)
  steps:
    - text: Install it — npx de-agent-platform add lineage-explainer.
      from_id: skill-lineage-explainer
      from_field: install_command
    - text: Start from the question — "what breaks if I change this column?", answered with evidence.
      from_id: skill-lineage-explainer
      from_field: tagline
    - text: Know what it does — traces column-level lineage from an asset to its upstream sources and downstream consumers, and reports the impact set for a proposed change.
      from_id: skill-lineage-explainer
      from_field: description
    - text: Read the two graphs — technical lineage (tables and jobs) versus business lineage (metrics and reports); a CFO does not read table names.
      from_id: skill-lineage-explainer
      from_field: body
    - text: Walk the impact set — downstream from the changed node, stopping at published marts; report owner, criticality, and the earliest SLA that will break.
      from_id: skill-lineage-explainer
      from_field: body
    - text: Open the files — SKILL.md for the method, examples/impact.md for a worked report, references/lineage-stores.md for supported stores.
      from_id: skill-lineage-explainer
      from_field: files
    - text: Reach the same answers from commands — /impact for blast radius, /lineage-up and /lineage-down for the graph in either direction.
      from_id: plugin-lineage-graph
      from_field: commands
  check_yourself:
    - The skill's report has three numbers — owner, criticality, earliest SLA — not a wall of edges.
    - You can state which marts stop the walk and why — they are where business impact lives.
  when_to_use:
    - "A column change is proposed and the reviewer asks for evidence, not opinions"
    - "You are about to rename or retype a column feeding a published mart"
  why: Impact analysis that stops at table names moves the argument; impact analysis that names the earliest SLA that breaks ends it.
  gotchas:
    - "Answering only the technical graph under-serves the business — the metric owner cares about the report, not the table."
    - "The walk stops at published marts on purpose — edges beyond them do not change the decision."
    - "A lineage store the skill cannot read is a guessing game — check the supported stores reference first."
  production_notes:
    - "Run the skill in the PR template for column changes — evidence beats memory in review."
    - "Keep examples/impact.md as the format contract for incident reports too."
  diagram: |
    lineage-explainer walkthrough
       |
       |- question: what breaks if I change this column?
       |
       |- technical graph: tables/jobs ──▶ who depends on it
       |- business graph:  metrics/reports ──▶ who feels it
       |
       |- walk downstream ──▶ stop at published marts
       |
        --> impact set: owner + criticality + earliest SLA that breaks
  code:
    - title: The skill in three lines
      lang: text
      code: |
        1. Technical lineage — which tables/jobs depend on this column.
        2. Business lineage — which metrics/reports depend on it.
        3. Impact set — walk downstream from the changed node, stopping at
           published marts. Report owner, criticality, earliest SLA that breaks.
      source_id: skill-lineage-explainer
    - title: The files and what each is for
      lang: text
      code: |
        SKILL.md                      — the two questions, two graphs
        examples/impact.md            — a worked impact report
        references/lineage-stores.md  — stores the skill can read
      source_id: skill-lineage-explainer
  source_refs: [skill-lineage-explainer, plugin-lineage-graph]
  version: 0.1.0
  license: CC-BY-4.0
