# The Observability Series — lessons authored for the 13x10 series; structure ours, wording the source's.
- id: tutorial-obs-mental-model
  slug: obs-mental-model
  type: tutorial
  title: >-
    Hold the observability mental model: infrastructure metrics versus data signals
  description: >-
    Two layers live on one data platform: infrastructure metrics (CPU, lag, job
    success) and data signals (freshness, volume, schema, distribution). This
    lesson separates them, places lineage and catalogs on the map, and names
    the four data signals every pipeline owes you before you write a dashboard.
  category: cat-data-observability
  series: observability
  series_title: The Observability Series
  lesson: 1
  difficulty: beginner
  tags: [tutorial, observability, concepts, architecture, prometheus, grafana]
  learning_objectives:
    - Separate infrastructure metrics from data signals — freshness, volume, schema, distribution
    - Place lineage and the catalog on the observability map, next to metrics and traces
    - State what each layer answers and which tool owns it
  what_you_need:
    - No cluster required — this is a concepts lesson
    - The Prometheus and Grafana documentation open beside you
  steps:
    - text: Ground the infra layer — the pull-based metrics model, PromQL, exporters, service discovery and alerting rules, with infra- and job-level metrics that sit underneath data-quality signals like freshness and volume.
      from_id: ref-prometheus-docs
      from_field: description
    - text: Ground the data layer's surface — dashboards, panel queries, alerting including the unified alerting model; the standard surface where pipeline freshness, volume and job-health dashboards live.
      from_id: ref-grafana-docs
      from_field: description
    - text: Add the instrumentation layer — traces, metrics and logs through a vendor-neutral API/SDK, the collector, and semantic conventions; increasingly the default for distributed pipelines and services.
      from_id: ref-otel-docs
      from_field: description
    - text: Add the lineage layer — an open specification for lineage events with integrations for Airflow, Spark and dbt; not a tool or a service, a standard that makes cross-tool lineage possible.
      from_id: ref-openlineage-docs
      from_field: description
    - text: Add the catalog layer — the open metadata model for ownership and lineage, ingestion framework, search, and governance integration; the vocabulary for catalog-related pipeline design.
      from_id: ref-datahub-docs
      from_field: description
    - text: See why lineage earns its layer — technical lineage (tables and jobs) versus business lineage (metrics and reports); a breaking change needs both.
      from_id: skill-lineage-explainer
      from_field: body
    - text: See that data signals can gate changes — a hook that warns when a change would silently widen the freshness SLA of a source.
      from_id: hook-freshness-pre-merge
      from_field: description
  check_yourself:
    - You can name the four data signals and give one example threshold for each.
    - Asked what lineage adds that metrics cannot, you answer — the blast radius and the owner.
  when_to_use:
    - "You are planning monitoring for a new pipeline and must decide what to instrument first"
    - "A dashboard exists but nobody trusts it because job success and data health are conflated"
  why: Metrics tell you the machine is healthy; data signals tell you the data is usable — and lineage tells you who to call when it is not.
  gotchas:
    - "A green job is not fresh data — the schedule can succeed forever while the source quietly stops changing."
    - "Infrastructure metrics sit underneath data signals — do not stop at the infra layer and call it data observability."
    - "Lineage is not decoration — without it a freshness alert cannot name a blast radius."
  production_notes:
    - "Instrument in layers — infra metrics from the scheduler, data signals from the tables, lineage events from the jobs."
    - "Keep ownership in the catalog, not in a runbook — alerts resolve faster when the owner is one query away."
  diagram: |
    observability layers
       |
       |- infra: CPU, lag, job success --> Prometheus pull model + PromQL
       |
       |- data signals: freshness | volume | schema | distribution
       |
       |- instrumentation: traces + metrics + logs (vendor-neutral API/SDK)
       |
       |- lineage: what feeds what --> blast radius + earliest SLA
       |
        --> catalog: who owns it, is it safe to use
  code:
    - title: The observability stack in one view
      lang: text
      code: |
        infra metrics   ─▶ is the job running?   (pull-based metrics model, PromQL, alerting rules)
        data signals    ─▶ is the data usable?   (freshness, volume, schema, distribution)
        traces          ─▶ what ran, how long?   (vendor-neutral API/SDK + collector)
        lineage events  ─▶ what feeds what?      (open spec; cross-tool lineage)
        catalog         ─▶ who owns it?          (metadata model; ownership + lineage)
      source_id: ref-prometheus-docs
    - title: Two questions, two graphs
      lang: text
      code: |
        Technical lineage — which tables/jobs depend on this column.
        Business lineage — which metrics/reports depend on it.
        A breaking change needs both, because a CFO does not read table names.
      source_id: skill-lineage-explainer
  source_refs: [ref-prometheus-docs, ref-grafana-docs, ref-otel-docs, ref-openlineage-docs, ref-datahub-docs, skill-lineage-explainer, hook-freshness-pre-merge]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/obs-mental-model
  verification: community
  last_verified: '2026-10-24'
  security: { runs_code: false, network_access: false, credentials: false, filesystem_access: false, external_apis: false }
  relationships: { related_to: [cat-data-observability] }
- id: tutorial-obs-first-freshness-alert
  slug: obs-first-freshness-alert
  type: tutorial
  title: >-
    Express a freshness check as a metric and an alert
  description: >-
    The first hands-on of the series: declare a freshness SLA, express
    staleness as a metric, and write an alert rule — including what happens
    when no data arrives at all. Ends with the pre-merge check that keeps
    schedules honest against the SLA they claim.
  category: cat-data-observability
  series: observability
  series_title: The Observability Series
  lesson: 2
  difficulty: beginner
  tags: [tutorial, observability, freshness, sla, prometheus, grafana, alerting]
  learning_objectives:
    - Declare a freshness SLA and compute worst-case lag from a schedule
    - Express staleness as a metric and write an alerting rule
    - Configure no-data handling so silence is an alert, not a pass
  what_you_need:
    - A table with a declared freshness SLA (in hours)
    - A Prometheus + Grafana stack, or any metrics store with alert rules you can edit
  steps:
    - text: Declare the contract — a freshness SLA per source, the number the hook can warn against when a change would silently widen it.
      from_id: hook-freshness-pre-merge
      from_field: description
    - text: Learn the arithmetic the SLA needs — compare the schedule in the diff with the declared SLA and compute the worst-case lag.
      from_id: hook-freshness-pre-merge
      from_field: implementation
    - text: Run the example — a cron changed from hourly to daily violates a 6h freshness SLA; the check warns with the computed lag.
      from_id: hook-freshness-pre-merge
      from_field: example
    - text: Express staleness as a metric — the pull-based metrics model, PromQL, exporters, service discovery and alerting rules are what turn "table age" into a queryable series.
      from_id: ref-prometheus-docs
      from_field: description
    - text: Trust the semantics — the metrics model and PromQL semantics pages settle how to express and alert on pipeline metrics.
      from_id: ref-prometheus-docs
      from_field: why
    - text: Put the alert somewhere real — dashboards, panel queries and alerting including the unified alerting model, the surface where pipeline freshness dashboards live.
      from_id: ref-grafana-docs
      from_field: description
    - text: Handle the silence — alerting semantics (no-data handling, evaluation intervals) are documented precisely; configure them or an absent series passes as health.
      from_id: ref-grafana-docs
      from_field: why
  check_yourself:
    - A daily schedule against a 6h SLA fails by construction — worst-case lag is 24h, not 6h.
    - An absent series is not a healthy one — no-data handling decides whether silence pages you.
  when_to_use:
    - "You are adding the first data-quality alert for a table"
    - "A schedule change is proposed and someone asks what it does to the SLA"
  why: A freshness SLA that lives in a wiki page guards nothing — encode it as a metric and an alert and it defends itself.
  gotchas:
    - "No-data is not healthy — an absent series under default handling never fires the alert."
    - "The evaluation interval adds detection lag — a 6h SLA checked hourly can page an hour late."
    - "Design for worst-case lag, not average — a schedule that can emit 24h-old data eventually will."
  production_notes:
    - "Store the SLA next to the dataset definition so the metric, the alert and the docs share one number."
    - "Route data-signal alerts to the table owner from the catalog, not to a shared channel."
  diagram: |
    freshness SLA ──▶ staleness metric ──▶ alert rule
        |
        |- cron × interval ─▶ worst-case lag ─▶ compare to SLA
        |
        |- no-data? ─▶ decide: fire (default) or pass (rare)
        |
        |- pre-merge: cron in diff vs SLA ─▶ warn before it pages anyone
  code:
    - title: Staleness as a metric and an alert rule
      lang: text
      code: |
        # illustrative sketch of the model the docs define —
        # exporter exposes last success, PromQL computes staleness,
        # an alerting rule compares it to the SLA
        pipeline_last_success_timestamp{table="orders"}
        staleness_seconds = now - pipeline_last_success_timestamp
        alert if staleness_seconds > freshness_sla{table="orders"}
      source_id: ref-prometheus-docs
    - title: The worst-case lag rule
      lang: text
      code: |
        Compare the schedule/cron in the diff with the source's declared
        freshness SLA. If the new schedule can produce data older than the
        SLA (e.g. daily when the SLA is 6h), warn with the computed
        worst-case lag.
      source_id: hook-freshness-pre-merge
    - title: The no-data decision
      lang: text
      code: |
        Alerting semantics to set on every rule — no-data handling and the
        evaluation interval. Decide what an absent series means before the
        first silent night, not after it.
      source_id: ref-grafana-docs
  source_refs: [hook-freshness-pre-merge, ref-prometheus-docs, ref-grafana-docs]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/obs-first-freshness-alert
  verification: community
  last_verified: '2026-10-24'
  security: { runs_code: false, network_access: false, credentials: false, filesystem_access: false, external_apis: false }
  relationships: { related_to: [cat-data-observability] }
- id: tutorial-obs-otel-traces
  slug: obs-otel-traces
  type: tutorial
  title: >-
    Instrument pipelines with OpenTelemetry: traces for data jobs
  description: >-
    Traces give every pipeline run a story — which task ran, how long, with
    what attributes. Wrap a job with OpenTelemetry, adopt the semantic
    conventions so attribute names match across teams, and see exactly where
    runtime traces end and lineage events begin.
  category: cat-data-observability
  series: observability
  series_title: The Observability Series
  lesson: 3
  difficulty: intermediate
  tags: [tutorial, observability, opentelemetry, tracing, instrumentation]
  learning_objectives:
    - Emit one trace per pipeline run with spans per task
    - Adopt semantic conventions for attribute names
    - Distinguish runtime traces from lineage events
  what_you_need:
    - A pipeline job you can wrap (Airflow task, dbt run, Spark job, or a script)
    - An OpenTelemetry collector endpoint (or any OTLP receiver)
  steps:
    - text: Learn the instrumentation layer — traces, metrics and logs through a vendor-neutral API/SDK, with the collector and semantic conventions; the default instrumentation layer for distributed pipelines and services.
      from_id: ref-otel-docs
      from_field: description
    - text: Name attributes the standard way — the semantic-conventions pages define standard attribute names worth citing exactly.
      from_id: ref-otel-docs
      from_field: why
    - text: Wire the metric leg alongside — the metrics model and PromQL semantics pages settle how to express and alert on pipeline metrics.
      from_id: ref-prometheus-docs
      from_field: why
    - text: Give traces a home — dashboards, panel queries and alerting where job-health dashboards and trace panels live.
      from_id: ref-grafana-docs
      from_field: description
    - text: Separate the signals — lineage events are a different signal; an open specification for lineage events emitted per job, describing what moved between assets rather than how long a span took.
      from_id: ref-openlineage-docs
      from_field: description
    - text: End where traces end — the question traces cannot answer is "what breaks if I change this column?", which needs lineage.
      from_id: skill-lineage-explainer
      from_field: tagline
  check_yourself:
    - One run equals one trace with one span per task — you can read failure and duration off it.
    - A trace says the extract took 40 minutes; a lineage event says the extract fed stg_orders — different questions.
  when_to_use:
    - "A pipeline fails or slows and the logs do not say which stage"
    - "Multiple teams instrument jobs and attribute names keep drifting"
  why: Without traces a slow pipeline is a rumor — with them it is a span tree you can read top-down.
  gotchas:
    - "Invent nothing at the attribute level — the semantic conventions already define the names worth citing exactly."
    - "A trace describes the run; it does not describe the data — lineage events are the second half."
    - "Do not put row-level detail in spans — traces are for control flow, not payloads."
  production_notes:
    - "Send spans to a collector, not directly to vendors — repointing backends is then a config change."
    - "Keep one trace per run keyed by run_id so traces, logs and lineage events join."
  diagram: |
    one pipeline run = one trace
       |
       |- span: extract   (source=postgres.orders)      ─┐
       |- span: transform (sql=stg_orders.sql)           ├─ runtime story
       |- span: load     (target=warehouse.stg_orders)  ─┘
       |
       |- lineage event: orders → stg_orders ─────── data story
       |
        --> traces: how long? | lineage: what moved? | both per job
  code:
    - title: One run, one trace
      lang: text
      code: |
        trace: daily_orders_load (run_id=2026-10-24)
          ├─ span: extract   (source=postgres.orders)
          ├─ span: transform (sql=stg_orders.sql)
          └─ span: load      (target=warehouse.stg_orders)
        Attribute names follow the semantic conventions so they match
        across teams and backends.
      source_id: ref-otel-docs
    - title: Traces versus lineage events
      lang: text
      code: |
        A trace answers — what ran, how long, did it fail?
        A lineage event answers — what moved between which assets?
        Both are emitted per job; the trace describes the run, the lineage
        event describes the data.
      source_id: ref-openlineage-docs
  source_refs: [ref-otel-docs, ref-prometheus-docs, ref-grafana-docs, ref-openlineage-docs, skill-lineage-explainer]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/obs-otel-traces
  verification: community
  last_verified: '2026-10-24'
  security: { runs_code: false, network_access: false, credentials: false, filesystem_access: false, external_apis: false }
  relationships: { related_to: [cat-data-observability] }
- id: tutorial-obs-column-lineage-concepts
  slug: obs-column-lineage-concepts
  type: tutorial
  title: >-
    Column-level lineage: the concepts and the event standard
  description: >-
    Table-level lineage says a job touched a table; column-level lineage says
    which columns feed which. Learn the concepts, the OpenLineage event model
    that makes lineage work across tools, and how an impact set is computed
    from a lineage store.
  category: cat-data-lineage
  series: observability
  series_title: The Observability Series
  lesson: 4
  difficulty: intermediate
  tags: [tutorial, lineage, openlineage, provenance, impact-analysis]
  learning_objectives:
    - Explain why column-level lineage beats table-level for change impact
    - Read an OpenLineage event and name its Airflow, Spark and dbt integrations
    - Compute a downstream impact set from a lineage store
  what_you_need:
    - Install: npx de-agent-platform add lineage-explainer
    - A lineage store (DataHub or any OpenLineage-compatible backend)
  steps:
    - text: Start from the standard — an open specification for lineage events with integrations for Airflow, Spark and dbt; not a tool or a service, a standard for emitting lineage events.
      from_id: ref-openlineage-docs
      from_field: description
    - text: See why the standard matters — an open specification for lineage events is what makes cross-tool lineage possible.
      from_id: ref-openlineage-docs
      from_field: why
    - text: Define column-level lineage — traces from an asset to its upstream sources and downstream consumers, reporting the impact set for a proposed change.
      from_id: skill-lineage-explainer
      from_field: description
    - text: Hold the two graphs — technical lineage (tables and jobs) versus business lineage (metrics and reports); a breaking change needs both.
      from_id: skill-lineage-explainer
      from_field: body
    - text: Practice the walk — read lineages from a lineage store, compute the downstream impact set, distinguish technical from business lineage.
      from_id: skill-lineage-explainer
      from_field: learning_objectives
    - text: Know where events land — the open metadata model for ownership and lineage, plus the ingestion framework that keeps emitted events queryable.
      from_id: ref-datahub-docs
      from_field: description
    - text: Keep the driving question in view — "what breaks if I change this column?", answered with evidence.
      from_id: skill-lineage-explainer
      from_field: tagline
  check_yourself:
    - A table-level edge hides the fact that only one column changed — column-level lineage localizes the blast radius.
    - An Airflow task, a Spark job and a dbt model produce lineage into one graph because they emit the same event standard.
  when_to_use:
    - "A schema change is proposed and someone asks who else uses that column"
    - "You must choose a lineage approach and need the vocabulary first"
  why: Table-level lineage answers "something downstream broke"; column-level lineage answers "this exact field, these exact consumers".
  gotchas:
    - "Lineage without a standard is a per-tool island — the open spec is what stitches Airflow, Spark and dbt into one graph."
    - "Column-level lineage is a commitment — parsers must keep up with SQL dialects or the graph lies quietly."
    - "The impact set is a walk, not a lookup — stop at published marts, where owners and SLAs live."
  production_notes:
    - "Emit events from every job that moves data — partial graphs are worse than none because they look complete."
    - "Version the lineage store like code — schema of the graph changes with the platform."
  diagram: |
    column-level lineage
       |
       |- postgres.orders ──(job)──▶ stg_orders ──▶ dim_customers ──▶ mart_revenue
       |         │                      │                │
       |         └── column edges ──────┴────────────────┘
       |
       |- change: stg_orders.customer_email
       |
       |- walk downstream ──▶ stop at published marts
       |
        --> impact set: owner + criticality + earliest SLA that breaks
  code:
    - title: An OpenLineage event, sketched
      lang: text
      code: |
        job:      dbt://analytics/stg_orders
        inputs:   [postgres://prod/orders]
        outputs:  [warehouse://analytics/stg_orders]
        # emitted per run by the integration; column facets carry the
        # column-level edges that make the graph worth querying
      source_id: ref-openlineage-docs
    - title: The impact set walk
      lang: text
      code: |
        changed: stg_orders.customer_email (type widened)
          └─▶ downstream: dim_customers.email ──▶ mart_revenue (published — stop)
        report: owner, criticality, earliest SLA that breaks
      source_id: skill-lineage-explainer
  source_refs: [ref-openlineage-docs, skill-lineage-explainer, ref-datahub-docs]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/obs-column-lineage-concepts
  verification: community
  last_verified: '2026-10-24'
  security: { runs_code: false, network_access: false, credentials: false, filesystem_access: false, external_apis: false }
  relationships: { related_to: [cat-data-lineage] }
- id: tutorial-obs-lineage-tooling
  slug: obs-lineage-tooling
  type: tutorial
  title: >-
    Lineage tooling in practice: DataHub MCP and the lineage-graph plugin
  description: >-
    Put lineage to work with two tools — a DataHub MCP server that lets an
    agent search entities and read lineage and schema, and a lineage-graph
    plugin that turns column-level impact analysis into agent commands. Wire
    both, learn each tool surface, and scope the token before sharing it.
  category: cat-data-lineage
  series: observability
  series_title: The Observability Series
  lesson: 5
  difficulty: intermediate
  tags: [tutorial, lineage, datahub, mcp, tooling, impact-analysis]
  learning_objectives:
    - Wire mcp-server-datahub and call its four tools
    - Use /impact, /lineage-up and /lineage-down for change analysis
    - Choose the right tool for a catalog question versus an impact question
  what_you_need:
    - Install: uvx mcp-server-datahub
    - Install: amp plugin add de-agent/lineage-graph
    - DATAHUB_GMS_URL and DATAHUB_GMS_TOKEN for the GMS endpoint
  steps:
    - text: Meet the catalog door — an MCP server that exposes a DataHub catalog so an agent can search entities, read lineage and schema, and inspect metadata.
      from_id: mcp-datahub
      from_field: description
    - text: Learn the tool surface — search, get_entities, get_lineage and get_dataset_queries.
      from_id: mcp-datahub
      from_field: tools
    - text: Install it — uvx mcp-server-datahub, with the GMS URL and token wired through environment variables.
      from_id: mcp-datahub
      from_field: installation
    - text: Meet the plugin — column-level impact analysis over a lineage store, with a change-impact command that lists the downstream consumers a schema change would break.
      from_id: plugin-lineage-graph
      from_field: description
    - text: Learn the command surface — /impact for blast radius, /lineage-up for what feeds an asset, /lineage-down for what depends on it.
      from_id: plugin-lineage-graph
      from_field: commands
    - text: Keep one vocabulary — the metadata model explains how to represent ownership and lineage consistently across tools.
      from_id: ref-datahub-docs
      from_field: why
    - text: Scope before sharing — read-only against the catalog, but catalogue metadata can itself be sensitive; use a scoped token and keep the GMS endpoint internal.
      from_id: mcp-datahub
      from_field: security_notes
  check_yourself:
    - get_lineage answers "what feeds this table"; /impact answers "what breaks if this column changes" — different questions.
    - Both tools read the same metadata model, so an answer from one is not contradicted by the other.
  when_to_use:
    - "You want an agent to answer catalog questions against a real DataHub instance"
    - "A schema change is in review and the reviewer wants the downstream list in the thread"
  why: Lineage in a UI helps one person; lineage behind tools and commands helps every agent and every review.
  gotchas:
    - "Catalog metadata is sensitive even when read-only — PII tags and internal table names ride along; use a scoped token."
    - "get_dataset_queries and get_lineage answer different questions — searching for the wrong one wastes a turn."
    - "The plugin's /impact walks the same store the MCP server reads — configure both against the same GMS."
  production_notes:
    - "Keep the GMS endpoint internal and hand each integration its own scoped token."
    - "Treat the four MCP tools as the stable contract — scripts that call them survive catalog UI redesigns."
  diagram: |
    lineage tooling
       |
       |- mcp-datahub ──▶ search | get_entities | get_lineage | get_dataset_queries
       |        (uvx mcp-server-datahub, DATAHUB_GMS_URL + TOKEN)
       |
       |- plugin-lineage-graph ──▶ /impact | /lineage-up | /lineage-down
       |
        --> both read the same metadata model (ownership + lineage)
  code:
    - title: Wire the catalog MCP server
      lang: bash
      code: |
        uvx mcp-server-datahub
        # required env
        #   DATAHUB_GMS_URL=<url of the DataHub GMS endpoint>
        #   DATAHUB_GMS_TOKEN=<personal access token>
      source_id: mcp-datahub
    - title: The plugin's three commands
      lang: text
      code: |
        /impact <asset|column>   # downstream consumers a change would break
        /lineage-up <asset>      # what feeds this
        /lineage-down <asset>    # what depends on this
      source_id: plugin-lineage-graph
  source_refs: [mcp-datahub, plugin-lineage-graph, ref-datahub-docs]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/obs-lineage-tooling
  verification: community
  last_verified: '2026-10-24'
  security: { runs_code: false, network_access: true, credentials: true, filesystem_access: false, external_apis: false }
  relationships: { related_to: [cat-data-lineage, cat-data-catalog] }
- id: tutorial-obs-catalog-ownership
  slug: obs-catalog-ownership
  type: tutorial
  title: >-
    Catalogs and ownership: who owns this table and is it safe to use?
  description: >-
    Every incident resolves faster when you can ask a catalog what this data
    is, who owns it, and whether it is safe to use. Run the catalog-assistant
    workflow end to end — resolve, retrieve, summarise — and keep it
    read-only and metadata-only by design.
  category: cat-data-catalog
  series: observability
  series_title: The Observability Series
  lesson: 6
  difficulty: beginner
  tags: [tutorial, catalog, metadata, ownership, governance]
  learning_objectives:
    - Run the catalog assistant's four-step workflow on a real asset
    - Answer owner, SLA and classification questions from metadata alone
    - Keep catalog access read-only and metadata-only
  what_you_need:
    - A DataHub catalog with owners, tags and classifications populated
    - The data-catalog-assistant agent wired to mcp-datahub
  steps:
    - text: Name the job — an agent that answers "what is this data, who owns it, and is it safe to use?".
      from_id: agent-data-catalog-assistant
      from_field: description
    - text: Follow the workflow — resolve the assets from the catalogue, retrieve schema, ownership and classification, retrieve lineage and freshness, then summarise with provenance and caveats.
      from_id: agent-data-catalog-assistant
      from_field: workflow
    - text: Know the outputs — an asset summary, owner and SLA, classification, and upstream/downstream.
      from_id: agent-data-catalog-assistant
      from_field: outputs
    - text: See it answer — 'which tables feed the revenue mart and who owns them?', with owners and freshness.
      from_id: agent-data-catalog-assistant
      from_field: example
    - text: Respect the guardrails — read-only, and never returns raw row data, only metadata.
      from_id: agent-data-catalog-assistant
      from_field: guardrails
    - text: Ground it in the model — the open metadata model for ownership and lineage, ingestion framework, search, and governance integration.
      from_id: ref-datahub-docs
      from_field: description
    - text: Secure the path — read-only against the catalog, but catalogue metadata can itself be sensitive; use a scoped token and keep the GMS endpoint internal.
      from_id: mcp-datahub
      from_field: security_notes
  check_yourself:
    - Asked "which tables feed the revenue mart and who owns them?", the answer names tables, owners and freshness — not guesses.
    - The assistant returns metadata only — if an answer contains row values, the guardrail was violated.
  when_to_use:
    - "A new teammate asks what a table means and who to ask about it"
    - "An incident needs an owner and you have a name, not a person"
  why: An alert that names an owner resolves in minutes; an alert that names a table name resolves whenever someone feels like it.
  gotchas:
    - "A catalog without owners is a faster search engine — populate ownership before you need it."
    - "Classification is part of the answer, not garnish — it decides who may see the data at all."
    - "The GMS token is scoped for a reason — a shared admin token turns a read-only assistant into a liability."
  production_notes:
    - "Point the assistant at the same catalog your lineage tools read — one source of truth for ownership."
    - "Audit quarterly that every alerting asset has an owner and an SLA in the catalog."
  diagram: |
    catalog assistant workflow
       |
       |- 1. resolve asset(s) from the catalogue
       |- 2. retrieve schema, ownership, classification
       |- 3. retrieve lineage and freshness
       |- 4. summarise with provenance and caveats
       |
        --> outputs: asset summary | owner & SLA | classification | upstream/downstream
  code:
    - title: The question the catalog answers
      lang: text
      code: |
        Q: which tables feed the revenue mart and who owns them?
        A: per asset — summary, owner & SLA, classification, upstream/downstream
        Guardrails: read-only; never returns raw row data, only metadata.
      source_id: agent-data-catalog-assistant
  source_refs: [agent-data-catalog-assistant, ref-datahub-docs, mcp-datahub]
