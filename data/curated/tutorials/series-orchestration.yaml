# The Orchestration Series — new lessons that join the four existing Airflow
# tutorials (04-airflow.yaml) into one ordered 10-lesson series for the
# orchestration roadmap stage. Every step derives from the cited source
# field; structure is ours, wording is the source's.
- id: tutorial-orchestration-mental-model
  slug: orchestration-mental-model
  type: tutorial
  title: The orchestration mental model — DAGs, schedules, idempotency, backfills
  description: >-
    Build the map before touching code: a DAG plus its schedule decides when
    runs happen, the idempotency test decides whether re-runs are safe,
    catchup decides what happens to missed intervals, and a backfill decides
    how history gets fixed — four decisions every later lesson sharpens.
  category: cat-airflow
  difficulty: beginner
  tags: [tutorial, orchestration, airflow, mental-model, beginner]
  series: orchestration
  series_title: The Orchestration Series
  lesson: 1
  learning_objectives:
    - Name the four decisions orchestration makes — schedule, catchup, idempotency, backfill
    - Apply the idempotency test to a task before running anything
    - Say what a backfill is for and why it is dangerous
  what_you_need:
    - An Airflow project to reason about — real or planned
    - The pipeline's schedule and SLA
    - The Airflow documentation at airflow.apache.org/docs
  steps:
    - text: Airflow's documentation covers DAG authoring, scheduling semantics and timetables, backfills and catchup, task state and retries, dynamic task mapping, and best practices — that list is the map of orchestration.
      from_id: ref-airflow-docs
      from_field: description
    - text: Read the scheduling and best-practices pages before designing any recurring pipeline — they answer the idempotency and backfill questions the skills only sketch.
      from_id: ref-airflow-docs
      from_field: why
    - text: Set `catchup` as a deliberate choice, not a default.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: Hold every task to the idempotency test — "If this task runs twice for the same logical date, is the output the same?"
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: If no, fix it before anything else — retries will happen.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: A backfill exists because historical output is wrong or missing and must be recomputed safely, without breaking production.
      from_id: runbook-backfill-required
      from_field: description
    - text: Respect its blast radius — backfills corrupt production or take down the daily run.
      from_id: pattern-backfill-safety
      from_field: problem
  check_yourself:
    - You can say what a DAG, a logical date, `catchup` and a backfill each decide about a pipeline.
    - Asked whether a task is safe to re-run, you reach for the idempotency test instead of a guess.
    - Given a wrong historical date range, you name the backfill runbook before touching anything.
  when_to_use:
    - "Designing your first recurring pipeline"
    - "Onboarding onto a codebase full of scheduled DAGs"
  why: Orchestration is four decisions — what runs, when it runs, whether re-runs are safe, and how history gets fixed — and every later lesson sharpens one of them.
  gotchas:
    - "`catchup` is a deliberate choice, not a default."
    - "Retries will happen — fix a task that is not idempotent before anything else."
    - "Backfills corrupt production or take down the daily run when run unmanaged."
  production_notes:
    - "The scheduling and best-practices pages answer the idempotency and backfill questions the skills only sketch."
    - "Keep pipelines idempotent so a backfill is a routine operation."
  diagram: |
    orchestration mental model
       |
       |- DAG + schedule + catchup --> when runs happen
       |
       |- idempotency test --> whether re-runs are safe
       |
       |- backfill + shadow swap --> how history gets fixed
  code:
    - title: The idempotency test
      lang: text
      code: |
        "If this task runs twice for the same logical date, is the output the same?"
        If no, fix it before anything else — retries will happen.
      source_id: skill-airflow-dag-reviewer
    - title: What the Airflow docs cover
      lang: text
      code: |
        DAG authoring, scheduling semantics and timetables, backfills and catchup,
        task state and retries, dynamic task mapping, and best practices.
      source_id: ref-airflow-docs
  source_refs: [ref-airflow-docs, skill-airflow-dag-reviewer, runbook-backfill-required, pattern-backfill-safety]
