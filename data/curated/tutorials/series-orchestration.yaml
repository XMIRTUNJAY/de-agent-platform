- id: tutorial-dynamic-mapping-date-batches
  slug: dynamic-mapping-date-batches
  type: tutorial
  title: Fan out over date batches with dynamic task mapping
  description: >-
    Run one task definition over many date batches with dynamic task mapping —
    the docs' mapping feature applied the way the backfill material demands:
    batched ranges, smallest first, a validated sample after each batch.
  category: cat-airflow
  difficulty: intermediate
  tags: [tutorial, airflow, dynamic-task-mapping, backfill, batches]
  series: orchestration
  series_title: The Orchestration Series
  lesson: 6
  learning_objectives:
    - Map one task over many date batches with dynamic task mapping
    - Scope the fan-out by date and by dependency
    - Validate a sample after each batch before continuing
  what_you_need:
    - A date range to recompute or process
    - The cluster's idle window and resource budget
    - Install: npx de-agent-platform add backfill-planner
  steps:
    - text: Use dynamic task mapping — one of the topics Airflow's documentation covers — to run one task definition over many inputs.
      from_id: ref-airflow-docs
      from_field: description
    - text: Scope a backfill by date and by dependency.
      from_id: skill-backfill-planner
      from_field: learning_objectives
    - text: Prefer batched date ranges over one large range.
      from_id: runbook-backfill-required
      from_field: commands
    - text: One huge date range starves the cluster; batch it and validate a sample per batch.
      from_id: runbook-backfill-required
      from_field: gotchas
    - text: Backfill in date batches, smallest first, validating a sample after each batch.
      from_id: skill-backfill-planner
      from_field: body
    - text: Stage a backfill gradually with validation between batches.
      from_id: skill-backfill-planner
      from_field: learning_objectives
  check_yourself:
    - The DAG maps the task over weekly date batches, smallest first, instead of one 90-day range.
    - Each batch instance validates a sample before the next batch starts.
  when_to_use:
    - "The same transformation must run over many dates or partitions"
    - "A single large range would starve the cluster"
  why: Dynamic task mapping turns 'run this over N dates' into N checked instances — the batched, validated shape the backfill material demands.
  gotchas:
    - "One huge date range starves the cluster; batch it and validate a sample per batch."
    - "Backfill in date batches, smallest first, validating a sample after each batch."
  production_notes:
    - "Detect which downstream tables must also be rebuilt before fanning out."
    - "Monitor backfill progress, resource contention and validation pass rate."
  diagram: |
    dynamic mapping over date batches
       |
       |- date range --> batch into ranges, smallest first
       |
       |- map task over batches --> N instances
       |
       |- validate sample per batch --> proceed or stop
  code:
    - title: Batched range command
      lang: bash
      code: |
        airflow dags backfill --start-date YYYY-MM-DD --end-date YYYY-MM-DD --reset-dagruns dag_id
        # prefer batched date ranges over one large range
      source_id: runbook-backfill-required
    - title: Execution rule
      lang: text
      code: |
        Backfill in date batches, smallest first, validating a sample after each batch.
      source_id: skill-backfill-planner
  source_refs: [ref-airflow-docs, skill-backfill-planner, runbook-backfill-required]
