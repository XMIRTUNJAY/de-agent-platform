- id: tutorial-sensors-data-aware-scheduling
  slug: sensors-data-aware-scheduling
  type: tutorial
  title: Make a DAG data-aware with reschedule-mode sensors
  description: >-
    Stop guessing when upstream data arrives: add a sensor in reschedule mode
    so the DAG waits for its input without holding a worker slot, read the
    scheduling-semantics pages first, and bound the sensor with timeout and
    concurrency settings like any other task.
  category: cat-airflow
  difficulty: intermediate
  tags: [tutorial, airflow, sensors, scheduling, data-aware]
  series: orchestration
  series_title: The Orchestration Series
  lesson: 4
  learning_objectives:
    - Add a sensor that waits for upstream data instead of assuming arrival
    - Run sensors in reschedule mode so they release worker slots
    - Bound the sensor with retry, timeout and concurrency settings
  what_you_need:
    - A DAG whose input arrives on someone else's schedule
    - The daily production schedule for the target DAG
    - Install: npx de-agent-platform add airflow-dag-reviewer
  steps:
    - text: Give the DAG a sensor using reschedule mode so it waits for its input.
      from_id: tpl-airflow-dag
      from_field: description
    - text: Sensors use `reschedule`, not `poke`, so they don't hold a worker slot.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: Read the scheduling semantics and timetables pages before designing data-aware waits.
      from_id: ref-airflow-docs
      from_field: description
    - text: Check retry, timeout and concurrency settings for the sensor too.
      from_id: agent-pipeline-reviewer
      from_field: workflow
    - text: The reviewer flags unbounded concurrency — a `poke` sensor holding a slot is exactly that.
      from_id: skill-airflow-dag-reviewer
      from_field: description
  check_yourself:
    - The sensor declares reschedule mode, a timeout and a pool.
    - While the sensor waits, no worker slot is held.
  when_to_use:
    - "A DAG depends on a file, table or partition another job produces"
    - "Sensors are consuming worker slots during the day"
  why: A sensor turns someone else's schedule into your dependency — but only reschedule mode does it without holding a worker slot hostage.
  gotchas:
    - "Sensors use `reschedule`, not `poke`, so they don't hold a worker slot."
    - "A sensor needs retry, timeout and concurrency settings like any other task."
  production_notes:
    - "The template ships a sensor using reschedule mode — keep it when you edit the skeleton."
    - "Read scheduling semantics and timetables before designing data-aware waits."
  diagram: |
    data-aware scheduling
       |
       |- upstream job writes input --> sensor waits
       |
       |- reschedule mode --> worker slot released between pokes
       |
       |- timeout + retries --> bounded wait
  code:
    - title: Sensor rule from the review checklist
      lang: text
      code: |
        Sensors use `reschedule`, not `poke`, so they don't hold a worker slot.
      source_id: skill-airflow-dag-reviewer
    - title: What the template ships
      lang: text
      code: |
        An idempotent DAG skeleton with task groups, retries and backoff, SLA,
        pools, and a sensor using reschedule mode.
      source_id: tpl-airflow-dag
  source_refs: [tpl-airflow-dag, skill-airflow-dag-reviewer, ref-airflow-docs, agent-pipeline-reviewer]
