- id: tutorial-orchestration-capstone
  slug: orchestration-capstone
  type: tutorial
  title: Capstone — the checklist that decides whether a DAG ships
  description: >-
    Close the series by running the full review pass over your own pipeline:
    the idempotency test per task, partitioned or MERGE writes, deliberate
    catchup, backoff retries, reschedule sensors, bounded concurrency — and
    a documented runbook for the day history needs fixing.
  category: cat-airflow
  difficulty: intermediate
  tags: [tutorial, orchestration, airflow, checklist, capstone]
  series: orchestration
  series_title: The Orchestration Series
  lesson: 10
  learning_objectives:
    - Run the full four-step review pass end to end
    - Confirm every checklist item on your own pipeline
    - Leave behind a runbook so the next backfill is routine
  what_you_need:
    - The DAG you built across this series
    - The pipeline's schedule, SLA and lineage
    - Install: npx de-agent-platform add airflow-dag-reviewer
  steps:
    - text: Apply the idempotency test to every task.
      from_id: agent-pipeline-reviewer
      from_field: workflow
    - text: Every task writes to a partition keyed by the logical date, or uses MERGE.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: Set `catchup` as a deliberate choice, not a default.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: Retries have a backoff; a task that retries instantly will hammer a downstream.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: Cap max_active_runs and pool limits so a backfill cannot starve the daily run.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: Sensors use `reschedule`, not `poke`, so they don't hold a worker slot.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: Keep pipelines idempotent so a backfill is a routine operation.
      from_id: runbook-backfill-required
      from_field: prevention
  check_yourself:
    - The four-step review pass — idempotency, retry/timeout/concurrency, backfill prediction, missing tests — runs clean over the capstone DAG.
    - A documented backfill runbook exists for the pipeline, with its idle window and resource budget.
  when_to_use:
    - "Signing off a DAG before it merges or takes production traffic"
    - "Auditing an inherited DAG for the first time"
  why: Ten lessons reduce to one list — if the checklist passes, the DAG survives retries, catchup and the next backfill.
  gotchas:
    - "A task that appends without a partition key will duplicate rows on retry."
    - "Never overlap the production window; never backfill without a rollback path."
    - "Backfilling without a written definition of correctness just relocates the bug."
  production_notes:
    - "Document a backfill runbook per pipeline, with its idle window and resource budget."
    - "Keep the fixture of 8 DAGs with seeded non-idempotency bugs in CI so regressions resurface."
  diagram: |
    capstone checklist
       |
       |- idempotency test --> partition or MERGE writes
       |
       |- deliberate catchup --> backoff retries --> reschedule sensors
       |
       |- bounded concurrency --> backfill runbook --> ship
  code:
    - title: The full DAG review checklist
      lang: text
      code: |
        1. Every task writes to a partition keyed by the logical date, or uses MERGE.
        2. `catchup` is a deliberate choice, not a default.
        3. Retries have a backoff; a task that retries instantly will hammer a downstream.
        4. `max_active_runs` and pool limits prevent a backfill from starving the daily run.
        5. Sensors use `reschedule`, not `poke`, so they don't hold a worker slot.
      source_id: skill-airflow-dag-reviewer
    - title: The four-step review pass
      lang: text
      code: |
        1. Apply the idempotency test to every task.
        2. Check retry, timeout and concurrency settings.
        3. Predict backfill behaviour.
        4. Propose missing integration tests.
      source_id: agent-pipeline-reviewer
