- id: tutorial-dag-dependencies-retries
  slug: dag-dependencies-retries
  type: tutorial
  title: Wire task dependencies and retries that survive failure
  description: >-
    Model the pipeline as task groups and give every task deliberate retries
    with backoff, a timeout and a pool — the skeleton's guarantees, verified
    the way the DAG reviewer verifies them before the DAG ships.
  category: cat-airflow
  difficulty: intermediate
  tags: [tutorial, airflow, dag, dependencies, retries]
  series: orchestration
  series_title: The Orchestration Series
  lesson: 3
  learning_objectives:
    - Model task structure with task groups from the idempotent skeleton
    - Choose retries and timeouts deliberately, with backoff
    - Pass the reviewer's retry and concurrency check
  what_you_need:
    - A scaffolded DAG or any DAG file under review
    - The pipeline's SLA
    - Install: npx de-agent-platform add airflow-dag-reviewer
  steps:
    - text: Scaffold from the idempotent DAG skeleton — task groups, retries and backoff, SLA, pools, and a sensor using reschedule mode are built in.
      from_id: tpl-airflow-dag
      from_field: description
    - text: Choose retries and timeouts deliberately.
      from_id: skill-airflow-dag-reviewer
      from_field: learning_objectives
    - text: Retries have a backoff; a task that retries instantly will hammer a downstream.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: Check retry, timeout and concurrency settings for every task.
      from_id: agent-pipeline-reviewer
      from_field: workflow
    - text: Run the reviewer over the DAG — it flags unsafe retries, missing catchup policy and unbounded concurrency.
      from_id: skill-airflow-dag-reviewer
      from_field: description
    - text: Make every task safe to re-run before adding the next one.
      from_id: skill-airflow-dag-reviewer
      from_field: learning_objectives
  check_yourself:
    - Every task in the DAG declares retries with backoff, a timeout and a pool.
    - Running the reviewer over the DAG returns no unsafe-retry or unbounded-concurrency findings.
  when_to_use:
    - "Wiring task dependencies and retry settings in a new or inherited DAG"
    - "A task retries instantly and hammers a downstream system"
  why: Dependencies decide what runs with what, retries decide what happens when it fails — take both from the skeleton instead of rediscovering them per task.
  gotchas:
    - "Retries have a backoff; a task that retries instantly will hammer a downstream."
    - "The reviewer checks for non-idempotent tasks, unsafe retries, missing catchup policy and unbounded concurrency."
  production_notes:
    - "SLA, pools and backoff come from the template — keep them instead of stripping defaults."
    - "Make every task safe to re-run before adding the next one."
  diagram: |
    dependencies + retries
       |
       |- task groups --> pipeline structure
       |
       |- retries + backoff --> failure handling
       |
       |- timeouts + pools + SLA --> bounded resource use
  code:
    - title: What the reviewer checks
      lang: text
      code: |
        Checks a DAG for non-idempotent tasks, unsafe retries, missing catchup
        policy, ambiguous catchup/backfill semantics and unbounded concurrency.
      source_id: skill-airflow-dag-reviewer
    - title: Scaffold with the guarantees
      lang: bash
      code: |
        amp template new de-agent/airflow-dag ./dags
      source_id: tpl-airflow-dag
  source_refs: [tpl-airflow-dag, skill-airflow-dag-reviewer, agent-pipeline-reviewer]
  version: 0.1.0
