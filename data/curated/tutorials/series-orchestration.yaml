- id: tutorial-production-dag-gotchas
  slug: production-dag-gotchas
  type: tutorial
  title: Production gotchas — topology, timeouts, concurrency
  description: >-
    The DAG failures that become pages: unbounded concurrency, missing
    catchup policy, and a backfill that starves the daily run — cap them with
    max_active_runs and pools, then wire the monitoring and escalation path
    the backfill runbook prescribes.
  category: cat-airflow
  difficulty: intermediate
  tags: [tutorial, airflow, production, concurrency, gotchas]
  series: orchestration
  series_title: The Orchestration Series
  lesson: 8
  learning_objectives:
    - Cap max_active_runs and pool limits before a backfill starves the daily run
    - Find unsafe retries, missing catchup policy and unbounded concurrency
    - Monitor backfill progress, resource contention and validation pass rate
  what_you_need:
    - The DAGs currently in production
    - The daily production schedule and golden-hour windows
    - Install: npx de-agent-platform add airflow-dag-reviewer
  steps:
    - text: Check the DAG for unsafe retries, missing catchup policy, ambiguous catchup/backfill semantics and unbounded concurrency.
      from_id: skill-airflow-dag-reviewer
      from_field: description
    - text: Cap max_active_runs and pool limits so a backfill cannot starve the daily run.
      from_id: skill-airflow-dag-reviewer
      from_field: body
    - text: Never overlap the production window; never backfill without a rollback path.
      from_id: pattern-backfill-safety
      from_field: solution
    - text: Design against the incident — an unmanaged backfill can starve daily production runs and double-write history.
      from_id: runbook-backfill-required
      from_field: impact
    - text: Monitor backfill progress, resource contention and validation pass rate.
      from_id: runbook-backfill-required
      from_field: monitoring
    - text: Schedule with the platform owner; escalate if the backfill window collides with a golden-hour production run.
      from_id: runbook-backfill-required
      from_field: escalation
  check_yourself:
    - max_active_runs and pool limits are set on every DAG a backfill could touch.
    - The escalation path names the platform owner and the golden-hour window that must stay clear.
  when_to_use:
    - "Hardening a DAG before it takes production traffic"
    - "Planning a backfill that runs beside live schedules"
  why: Unbounded concurrency and a missing catchup policy only surface when a backfill collides with the daily run — cap both first.
  gotchas:
    - "Cap max_active_runs and pool limits so a backfill cannot starve the daily run."
    - "Never overlap the production window; never backfill without a rollback path."
    - "Ambiguous catchup/backfill semantics are a review finding, not a footnote."
  production_notes:
    - "Monitor backfill progress, resource contention and validation pass rate."
    - "Escalate if the backfill window collides with a golden-hour production run."
  diagram: |
    production topology
       |
       |- max_active_runs + pools --> contention capped
       |
       |- catchup policy --> catchup/backfill semantics explicit
       |
       |- monitoring --> progress, contention, validation pass rate
  code:
    - title: Concurrency guard from the checklist
      lang: text
      code: |
        `max_active_runs` and pool limits prevent a backfill from starving the daily run.
      source_id: skill-airflow-dag-reviewer
    - title: What the reviewer flags
      lang: text
      code: |
        Non-idempotent tasks, unsafe retries, missing catchup policy, ambiguous
        catchup/backfill semantics and unbounded concurrency.
      source_id: skill-airflow-dag-reviewer
  source_refs: [skill-airflow-dag-reviewer, pattern-backfill-safety, runbook-backfill-required]
