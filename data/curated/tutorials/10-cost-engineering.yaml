# Tutorials — beginner-friendly arrangements of artifact content.
# Every step is verbatim from the cited source field. Structure (need, steps,
# check) is ours; wording is the source's.
- id: tutorial-cost-unit-economics-report
  slug: cost-unit-economics-report
  type: tutorial
  title: Compute unit economics for a pipeline
  description: >-
    Turn cluster and warehouse billing into unit economics — cost per run, per 1M
    rows, per model build — so a regression shows up as a number, not a surprise
    invoice. The Cost Optimizer starts with attribution; this walkthrough ends
    with an alert on cost-per-run instead of total spend.
  category: cat-cost-engineering
  difficulty: beginner
  tags: [tutorial, cost, finops, unit-economics, attribution]
  series: reliability
  series_title: The Reliability Series
  lesson: 2
  learning_objectives:
    - Attribute compute cost to a pipeline run
    - Define a unit metric that resists regressions
    - Set an alert on cost-per-run, not on total spend
  what_you_need:
    - A billing/usage export and pipeline and query logs
    - Per-run compute granularity from the cluster or warehouse
    - Install: npx de-agent-platform add cost-unit-economics-reporter
  steps:
    - text: Attribute spend to pipelines and tables.
      from_id: agent-cost-optimizer
      from_field: workflow
    - text: Rank by cost and by wasteful ratio (scan vs needed).
      from_id: agent-cost-optimizer
      from_field: workflow
    - text: Pick a unit metric with a stable denominator — $ per pipeline run, $ per 1M rows processed, or DBU/credits per model build.
      from_id: skill-cost-unit-economics
      from_field: body
    - text: Total spend rises with growth and hides regressions; cost-per-unit is flat when growth is healthy and spikes the day a join starts fanning out.
      from_id: skill-cost-unit-economics
      from_field: body
    - text: Define the unit metric to watch afterwards.
      from_id: agent-cost-optimizer
      from_field: workflow
    - text: Set an alert on cost-per-run, not on total spend.
      from_id: skill-cost-unit-economics
      from_field: learning_objectives
  check_yourself:
    - Cost-per-run stays flat while volume grows and total spend rises in the same period — proving the denominator resists growth.
    - A deliberate join fan-out in a test run doubles cost-per-run and fires the alert while total spend still looks normal.
  when_to_use:
    - "Attributing a billing surprise to pipelines and tables"
    - "Choosing an alert that survives healthy growth"
  why: Total spend is the wrong alert — it rises with growth and hides regressions, while cost-per-unit spikes the day a join starts fanning out.
  gotchas:
    - "Total spend rises with growth and hides regressions — a healthy month can hide a 4x regression."
    - "Never accept a recommendation that could change results — the Cost Optimizer flags those for a reason."
    - "The optimizer never applies a change — apply savings through your own review, not through the agent."
  production_notes:
    - "Define the unit metric to watch after every optimization."
    - "Validate savings estimates against historical billing after applying the change."
  diagram: |
    billing export
       |
       |- attribute spend --> pipelines + tables
       |
       |- rank by cost + wasteful ratio --> top offenders
       |
       |- define unit metric --> $ per run / per 1M rows --> alert on cost-per-run
  code:
    - title: The Cost Optimizer workflow
      lang: text
      code: |
        Attribute spend to pipelines and tables.
        Rank by cost and by wasteful ratio (scan vs needed).
        Propose changes ordered by savings / risk.
        Define the unit metric to watch afterwards.
      source_id: agent-cost-optimizer
    - title: Unit metrics that don't lie
      lang: text
      code: |
        - $ per pipeline run (stable denominator)
        - $ per 1M rows processed
        - DBU/credits per model build
      source_id: skill-cost-unit-economics
    - title: Why total spend is the wrong alert
      lang: text
      code: |
        Total spend rises with growth and hides regressions. Cost-per-unit is flat when
        growth is healthy and spikes the day a join starts fanning out.
      source_id: skill-cost-unit-economics
  source_refs: [skill-cost-unit-economics, agent-cost-optimizer]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/cost-unit-economics-report
  verification: community
  last_verified: '2026-10-21'
  security: { runs_code: false, network_access: false, credentials: false, filesystem_access: false, external_apis: false }
  relationships: { related_to: [cat-cost-engineering] }
- id: tutorial-cost-attribute-4x-regression
  slug: cost-attribute-4x-regression
  type: tutorial
  title: Attribute a 4x Spark cost regression
  description: >-
    One job's compute cost quadrupled overnight with no functional change. Run the
    4x runbook: diff shuffle and input bytes run-over-run, find the guilty stage,
    reverse the regression — then wire hook-spark-cost-check so the next one fails
    CI before the invoice.
  category: cat-cost-engineering
  difficulty: intermediate
  tags: [tutorial, cost, spark, regression, runbook]
  series: reliability
  series_title: The Reliability Series
  lesson: 9
  learning_objectives:
    - Diff shuffle write and input bytes run-over-run
    - Attribute a cost regression to one stage
    - Gate deploys on shuffle/scan metrics
  what_you_need:
    - The event log or job metrics for two runs (before and after the cost jump)
    - The job source
    - Install: npx de-agent-platform add spark-cost-regression-guard
  steps:
    - text: Diff shuffle write bytes and input bytes for the job run-over-run.
      from_id: runbook-spark-job-suddenly-costs-4x
      from_field: diagnosis
    - text: Compare output row counts before/after the join, per stage.
      from_id: runbook-spark-job-suddenly-costs-4x
      from_field: diagnosis
    - text: Check whether the partition predicate still prunes (bytes scanned).
      from_id: runbook-spark-job-suddenly-costs-4x
      from_field: diagnosis
    - text: Fan-out → dedupe the many-side on the join key before joining.
      from_id: runbook-spark-job-suddenly-costs-4x
      from_field: fix
    - text: Lost filter → restore the partition predicate and re-run.
      from_id: runbook-spark-job-suddenly-costs-4x
      from_field: fix
    - text: Read shuffle/spill/scan metrics from the event log, compare against the stored baseline (median of last 5), and fail if any metric grew by more than 25%.
      from_id: hook-spark-cost-check
      from_field: implementation
  check_yourself:
    - Output rows from the join stage greatly exceed source rows → fan-out confirmed; after deduping the many-side, output rows match and cost returns to baseline.
    - "A deliberate join change grows shuffle write 3.9x → the build fails with the stage id."
  when_to_use:
    - "Compute spend for one job multiplied without a functional change"
    - "A cost-per-run alarm fired right after a deploy"
  why: Silent cost regressions compound — a 4x job running hourly is a new invoice line within a day; run-over-run byte diffs find the guilty stage fast.
  gotchas:
    - "Autoscaling masks the cause: a slow stage widens the cluster and buys speed while the fan-out stays."
    - "Compare run-over-run, not day-over-day — traffic deltas will fool the diff."
    - "A dropped partition filter reads full history: the join looks right, the input bytes don't."
  production_notes:
    - "Track cost per run as a unit metric with a 25% regression alarm."
    - "Gate deploys on shuffle/scan metrics (hook-spark-cost-check)."
  diagram: |
    cost 4x
       |
       |- diff bytes run-over-run --> shuffle write + input bytes
       |
       |- output rows >> source rows --> join fan-out --> dedupe the many-side
       |
       |- input bytes >> usual --> lost partition filter --> restore predicate
       |
       |- baseline (median of last 5) --> >25% growth --> fail CI with stage id
  code:
    - title: Diff shuffle write and input bytes from the event log
      lang: bash
      code: |
        # from the event log
        grep -E 'Shuffle Write|Input Size' spark.log | tail -40
      source_id: runbook-spark-job-suddenly-costs-4x
    - title: Compare join output rows to the source count
      lang: sql
      code: |
        SELECT count(*) FROM stage_output_pre JOIN ... -- compare to source count
      source_id: runbook-spark-job-suddenly-costs-4x
    - title: Guard — fail CI when a metric grows > 25% vs the 5-run baseline
      lang: text
      code: |
        After the job's test run, read shuffle/spill/scan metrics from the event log,
        compare against the stored baseline (median of last 5), and fail if any metric
        grew by more than 25%. Emit the offending stage and metric.

        Example: shuffle write grows 3.9x after a join change → build fails with the stage id.
      source_id: hook-spark-cost-check
  source_refs: [runbook-spark-job-suddenly-costs-4x, hook-spark-cost-check]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/cost-attribute-4x-regression
