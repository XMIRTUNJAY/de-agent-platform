- id: tutorial-cost-guardrails-setup
  slug: cost-guardrails-setup
  type: tutorial
  title: Install cost guardrails before the invoice
  description: >-
    Instrument, attribute, then guard: the Cost Guardrails pattern in four moves —
    a unit metric per pipeline, a baseline of the last N runs, CI failing on
    regression, and hard caps. It ends with a build that fails on a 3.9x shuffle
    jump instead of a surprise invoice.
  category: cat-cost-engineering
  difficulty: beginner
  tags: [tutorial, cost, finops, guardrails, ci]
  series: reliability
  series_title: The Reliability Series
  lesson: 5
  learning_objectives:
    - Define a unit metric per pipeline
    - Baseline the last N runs and fail CI past a threshold
    - Add hard caps on top of CI guards
  what_you_need:
    - Cost-relevant metrics per run (shuffle/spill/scan)
    - CI where a build can fail on a metric check
    - Install: npx de-agent-platform add spark-cost-regression-guard
  steps:
    - text: Define a unit metric per pipeline ($ per run, per 1M rows).
      from_id: pattern-cost-guardrails
      from_field: solution
    - text: Baseline the last N runs.
      from_id: pattern-cost-guardrails
      from_field: solution
    - text: Fail CI on regression > threshold.
      from_id: pattern-cost-guardrails
      from_field: solution
    - text: Add hard caps (warehouse resource monitors, quota limits).
      from_id: pattern-cost-guardrails
      from_field: solution
    - text: Alert on the unit metric, never on total spend, so healthy growth doesn't page anyone and a regression does.
      from_id: pattern-cost-guardrails
      from_field: solution
    - text: Verify the guard — shuffle write grows 3.9x after a join change → the build fails with the stage id.
      from_id: hook-spark-cost-check
      from_field: example
  check_yourself:
    - A change that grows any metric > 25% vs the baseline fails CI with the offending stage and metric named.
    - Healthy growth (more data, same cost per run) does not page anyone.
  when_to_use:
    - "Any pipeline with variable compute cost"
    - "Multi-team platforms"
  why: Alert on the unit metric, never on total spend, so healthy growth doesn't page anyone and a regression does.
  gotchas:
    - "Spend varies with data growth and regressions hide in growth — total-spend dashboards cannot see them."
    - "Guardrails need metrics plumbing and a baseline to be maintained — skip the baseline and the guard has nothing to compare."
    - "Needs prior runs to build its 5-run baseline, so a cold start has nothing to compare against."
  production_notes:
    - "Keep the baseline as the median of the last 5 runs."
    - "Gate deploys on shuffle/scan metrics, and keep resource monitors as the hard cap."
  diagram: |
    run
       |
       |- metrics --> unit metric ($ per run / per 1M rows)
       |
       |- baseline last N runs --> within baseline --> pass
       |                          > regressed --> fail CI / alert
       |
       |- hard caps --> resource monitors + quotas --> invoice backstop
  code:
    - title: The four moves — instrument, attribute, guard, cap
      lang: text
      code: |
        Instrument, attribute, then guard.
          1. unit metric per pipeline ($ per run, per 1M rows)
          2. baseline the last N runs
          3. fail CI on regression > threshold
          4. hard caps (warehouse resource monitors, quota limits)
        Alert on the *unit* metric, never on total spend, so healthy growth doesn't page
        anyone and a regression does.
      source_id: pattern-cost-guardrails
    - title: Metrics worth baselining
      lang: text
      code: |
        shuffle read/write bytes, spill (disk) bytes, task count, max task duration,
        input bytes. These predict cost far better than wall-clock time.
      source_id: skill-spark-cost-regression-guard
    - title: The guard in CI — 25% vs the median of the last 5 runs
      lang: text
      code: |
        After the job's test run, read shuffle/spill/scan metrics from the event log,
        compare against the stored baseline (median of last 5), and fail if any metric
        grew by more than 25%. Emit the offending stage and metric.

        Example: shuffle write grows 3.9x after a join change → build fails with the stage id.
      source_id: hook-spark-cost-check
