- id: tutorial-cost-lens-plugin-walkthrough
  slug: cost-lens-plugin-walkthrough
  type: tutorial
  title: Attribute spend with the Cost Lens plugin
  description: >-
    Install the Cost Lens plugin and use its three commands to attribute spend,
    compute unit economics, and guard cost-per-run. The plugin pairs the
    unit-economics skill with the Spark cost regression guard, and ships the
    hooks that enforce the guard in CI.
  category: cat-cost-engineering
  difficulty: intermediate
  tags: [tutorial, cost, plugin, finops, attribution]
  series: reliability
  series_title: The Reliability Series
  lesson: 7
  learning_objectives:
    - Attribute warehouse/cluster spend with /cost-by-pipeline
    - Compute unit economics with /unit-cost
    - Guard cost-per-run regressions with /cost-guard
  what_you_need:
    - A billing export the plugin can read (credentials: billing-read)
    - An agent host with plugin support
    - Install: amp plugin add de-agent/cost-lens
  steps:
    - text: "Install the plugin: `amp plugin add de-agent/cost-lens`."
      from_id: plugin-cost-lens
      from_field: installation
    - text: Confirm the two capabilities you are wiring — cost-attribution and unit-economics.
      from_id: plugin-cost-lens
      from_field: capabilities
    - text: Run `/cost-by-pipeline` to attribute warehouse/cluster spend to pipelines.
      from_id: plugin-cost-lens
      from_field: commands
    - text: Run `/unit-cost` to compute unit economics.
      from_id: plugin-cost-lens
      from_field: commands
    - text: Run `/cost-guard` to alert on cost-per-run regressions rather than on total spend.
      from_id: plugin-cost-lens
      from_field: commands
    - text: Set an alert on cost-per-run, not on total spend.
      from_id: skill-cost-unit-economics
      from_field: learning_objectives
  check_yourself:
    - "`/cost-by-pipeline` returns spend attributed per pipeline, not one lump sum."
    - "`/cost-guard` alerts on a cost-per-run regression and stays quiet when total spend grows with traffic."
  when_to_use:
    - "You need spend attributed to pipelines without writing attribution SQL by hand"
    - "A team wants unit-economics alerts wired into the agent"
  why: The plugin bundles attribution, unit economics and the cost guard, so a 4x regression shows up as a cost-per-run number instead of an invoice.
  gotchas:
    - "The plugin needs billing-read credentials and billing+catalog network access — without them /cost-by-pipeline has nothing to attribute."
    - "Alerts fire on cost-per-run regressions, not total spend — do not 'fix' the alert by watching the invoice instead."
    - "Its hook-spark-cost-check needs prior runs to build its 5-run baseline — a cold start has nothing to compare against."
  production_notes:
    - "Pair /cost-guard with hook-spark-cost-check so regressions fail CI before the invoice."
    - "Keep the underlying skills (cost-unit-economics, spark-cost-regression-guard) for the deeper analysis."
  diagram: |
    billing export
       |
       |- /cost-by-pipeline --> spend per pipeline
       |
       |- /unit-cost --> $ per run / per 1M rows
       |
       |- /cost-guard --> regression vs baseline --> alert --> fix in CI
  code:
    - title: Install the plugin
      lang: bash
      code: |
        amp plugin add de-agent/cost-lens
      source_id: plugin-cost-lens
    - title: The three commands
      lang: text
      code: |
        /cost-by-pipeline   # attribute warehouse/cluster spend to pipelines
        /unit-cost          # compute unit economics ($ per run, per 1M rows)
        /cost-guard         # alert on cost-per-run regressions, not total spend
      source_id: plugin-cost-lens
    - title: What the wired guard enforces
      lang: text
      code: |
        After the job's test run, read shuffle/spill/scan metrics from the event log,
        compare against the stored baseline (median of last 5), and fail if any metric
        grew by more than 25%. Emit the offending stage and metric.

        Example: shuffle write grows 3.9x after a join change → build fails with the stage id.
      source_id: hook-spark-cost-check
  source_refs: [plugin-cost-lens, skill-cost-unit-economics, hook-spark-cost-check]
  version: 0.1.0
