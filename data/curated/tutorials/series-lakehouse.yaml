- id: tutorial-schema-evolution-time-travel
  slug: schema-evolution-time-travel
  type: tutorial
  title: Schema evolution and time travel — change the table, keep the past
  description: >-
    Change a table without breaking its readers or its history: the Iceberg
    spec's schema and partition evolution, Delta time travel, the history
    metadata table you query to see what happened, and the snapshot-expiry rule
    that keeps time travel working while storage stays bounded. The immutable
    raw zone is the floor under all of it.
  category: cat-lakehouse
  difficulty: intermediate
  tags: [tutorial, lakehouse, schema-evolution, time-travel, snapshots, iceberg]
  series: lakehouse
  series_title: The Lakehouse Series
  lesson: 6
  learning_objectives:
    - Use schema and partition evolution instead of recreate-and-copy
    - Query the history metadata table and time travel within the retention window
    - Expire snapshots without breaking time travel — keep one full snapshot
  what_you_need:
    - A Delta or Iceberg table with a schema you are tempted to change
    - Metadata-table access (files, history)
    - An ingestion window expiry can be scheduled around
  steps:
    - text: "Evolution is a spec feature: Iceberg's documentation covers schema and partition evolution alongside the table format, snapshots and manifests, and hidden partitioning."
      from_id: ref-iceberg-docs
      from_field: summary
    - text: "Delta's side of the bargain: its official docs cover ACID transactions on object storage, time travel, OPTIMIZE and Z-ORDER clustering, Delta Live Tables, and Unity Catalog integration."
      from_id: ref-delta-docs
      from_field: summary
    - text: "See the past with SQL: for Iceberg/Delta, query the metadata tables (files, history)."
      from_id: runbook-small-files-explosion
      from_field: diagnosis
    - text: "Bound the past safely: expire_snapshots older than the retention window — but keep at least one full snapshot for time travel."
      from_id: skill-iceberg-maintenance
      from_field: body
    - text: "Evolution without loss starts at the bottom zone: raw/ — immutable, exactly as received; never edited; schema-on-read."
      from_id: pattern-medallion-zones
      from_field: solution
    - text: "Reprocessing needs the original bytes — that force is why raw is immutable and why an evolved table can always be rebuilt from its source."
      from_id: pattern-medallion-zones
      from_field: forces
    - text: "Schedule expiry like compaction: Lakehouse Guard is a guard that blocks compaction or snapshot expiry during peak ingestion windows."
      from_id: plugin-lakehouse-guard
      from_field: description
  check_yourself:
    - You can time travel to a snapshot inside the retention window after expiry ran.
    - A schema change on curated/ required no rewrite of raw/ — the original bytes were never edited.
    - The history metadata table answers what changed and when without leaving SQL.
  when_to_use:
    - "A consumer asks for last month's numbers exactly as they were"
    - "A schema change is pending and you want evolution, not a table rebuild"
  why: Snapshots make the past addressable and evolution makes change cheap; the retention window and the immutable raw zone decide how far back both reach.
  gotchas:
    - "expire_snapshots must keep at least one full snapshot or time travel breaks."
    - "Schema and partition evolution are spec features — the format, not a copy job, is the mechanism."
    - "Snapshot expiry is maintenance with a window: the guard blocks it during peak ingestion."
  production_notes:
    - "Set the snapshot retention window deliberately — it is the knob that trades storage for time-travel depth."
    - "Keep raw/ immutable and schema-on-read so every evolution has an original to return to."
  diagram: |
    schema evolution & time travel
       |
       |- spec: schema evolution | partition evolution | hidden partitioning
       |
       |- db.tbl.history --> what changed, when
       |
       |- time travel --> snapshot inside the retention window
       |
       |- expire_snapshots --> keep one full snapshot
       |
       raw (immutable, schema-on-read) --> curated (evolved) --> serving
  code:
    - title: The snapshot expiry rule
      lang: text
      code: |
        `expire_snapshots` older than the retention window — but keep at least
        one full snapshot for time travel.
      source_id: skill-iceberg-maintenance
    - title: The raw zone contract
      lang: text
      code: |
        raw/       — immutable, exactly as received; never edited; schema-on-read.
      source_id: pattern-medallion-zones
  source_refs: [ref-iceberg-docs, ref-delta-docs, runbook-small-files-explosion, skill-iceberg-maintenance, pattern-medallion-zones, plugin-lakehouse-guard]
