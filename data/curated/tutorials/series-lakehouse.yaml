- id: tutorial-acid-concurrent-writes
  slug: acid-concurrent-writes
  type: tutorial
  title: ACID and concurrent writes — why compaction and ingestion collide
  description: >-
    What ACID on object storage actually guards, and where it stops: Delta
    commits transactions on files, but compaction is also a writer, and the two
    meet in the ingestion window. Learn the schedule rule, the
    write-path/layout-path separation, and how a guardrail blocks maintenance
    from running in the wrong window.
  category: cat-lakehouse
  difficulty: intermediate
  tags: [tutorial, lakehouse, acid, concurrency, delta, ingestion-window]
  series: lakehouse
  series_title: The Lakehouse Series
  lesson: 4
  learning_objectives:
    - Say what ACID transactions on object storage guarantee concurrent writers
    - Schedule compaction outside the ingestion window and explain the contention
    - Handle a contending OPTIMIZE — compaction is additive, so halt it, no rollback
  what_you_need:
    - A Delta or Iceberg table with real ingestion traffic
    - An ingestion window you can schedule around
    - Install: amp plugin add de-agent/lakehouse-guard
  steps:
    - text: "Ground truth first: Delta's official docs cover ACID transactions on object storage, time travel, OPTIMIZE and Z-ORDER clustering, Delta Live Tables, and Unity Catalog integration."
      from_id: ref-delta-docs
      from_field: summary
    - text: "The classic conflict: do not run compaction during peak ingestion — it conflicts with concurrent writers."
      from_id: skill-iceberg-maintenance
      from_field: body
    - text: "The schedule rule: compact after the ingestion window, never during it."
      from_id: runbook-small-files-explosion
      from_field: gotchas
    - text: "The pattern behind the rule: separate the write path from the layout path — writes make many small files, scheduled compaction makes 128-256 MB files — and do it outside the ingestion window so compaction and writers don't contend."
      from_id: pattern-small-files-compaction
      from_field: solution
    - text: "When contention happens anyway: compaction is additive, so there is nothing to roll back — halt any concurrent OPTIMIZE that contends with the ingestion window."
      from_id: runbook-small-files-explosion
      from_field: rollback
    - text: "Guardrail it: Lakehouse Guard is a Delta/Iceberg table maintenance advisor plus a guard that blocks compaction or snapshot expiry during peak ingestion windows."
      from_id: plugin-lakehouse-guard
      from_field: description
  check_yourself:
    - You can point at the ingestion window on a calendar and say when compaction may run.
    - A compaction plan issued during peak ingestion is blocked by the guard instead of executing.
    - You can explain why halting a contending OPTIMIZE needs no rollback.
  when_to_use:
    - "Compaction and ingestion keep colliding on one table"
    - "You are writing the maintenance calendar and need the rules written down"
  why: ACID protects writers from each other, but maintenance is also a writer — the ingestion window is the contract that keeps them apart.
  gotchas:
    - "Compaction during peak ingestion conflicts with concurrent writers — schedule it after the window."
    - "ZORDER rewrites the whole table — only worth it on a real query predicate."
    - "Compaction is additive: halt the contending OPTIMIZE, do not attempt a rollback."
  production_notes:
    - "Separate the write path from the layout path: let writers be small and fast, and let scheduled compaction own file size."
    - "Enforce the window with a guardrail (Lakehouse Guard) rather than a calendar reminder."
  diagram: |
    acid + concurrent writes
       |
       |- writes --> many small files --> peak window: writers only
       |
       |- after the window --> [compaction] --> 128-256 MB files
       |
       |- contending OPTIMIZE? --> halt it (additive, no rollback)
       |
       |- guard --> blocks compaction/expiry during peak ingestion
  code:
    - title: The do-not that ends most contention stories
      lang: text
      code: |
        Do not run compaction during peak ingestion; it conflicts with
        concurrent writers.
      source_id: skill-iceberg-maintenance
    - title: Write path vs layout path
      lang: text
      code: |
        writes ─▶ many small files ─▶ [scheduled compaction] ─▶ 128-256 MB files
        Compact on a schedule (or auto-compact), targeting a file size that
        matches your read pattern. Do it outside the ingestion window so
        compaction and writers don't contend.
      source_id: pattern-small-files-compaction
  source_refs: [ref-delta-docs, skill-iceberg-maintenance, runbook-small-files-explosion, pattern-small-files-compaction, plugin-lakehouse-guard]
  version: 0.1.0
