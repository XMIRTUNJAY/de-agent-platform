- id: tutorial-first-lakehouse-table
  slug: first-lakehouse-table
  type: tutorial
  title: Your first lakehouse table — create, query, measure, compact
  description: >-
    Run the whole loop in one sitting on a scratch table: create and query a
    first Delta or Iceberg table from the official docs, read its health from
    the files metadata table with one SQL query, run a first OPTIMIZE or
    rewrite_data_files, and prove it worked by comparing numFiles and bytes
    scanned before and after.
  category: cat-lakehouse
  difficulty: beginner
  tags: [tutorial, lakehouse, delta-lake, iceberg, hands-on, metadata]
  series: lakehouse
  series_title: The Lakehouse Series
  lesson: 2
  learning_objectives:
    - Create and query a first table on a real table format using the official docs
    - Read a table's file health from the metadata table with one SQL query
    - Run a first compaction and prove it with before/after numbers
  what_you_need:
    - A lakehouse with Delta or Iceberg available (Spark, Trino, or a warehouse that reads the format)
    - Permission to create one scratch table
    - Install: npx de-agent-platform add iceberg-table-maintenance
  steps:
    - text: "Create and query your first Delta table following the official docs — the definitive source for ACID transactions on object storage, time travel, OPTIMIZE and Z-ORDER clustering."
      from_id: ref-delta-docs
      from_field: summary
    - text: "Prefer Iceberg? The spec and docs cover the table format, snapshots and manifests, hidden partitioning, and maintenance procedures like compaction and snapshot expiry — read them before writing the first table."
      from_id: ref-iceberg-docs
      from_field: summary
    - text: "Before adding data, learn the one health query: SELECT count(*), avg(file_size_in_bytes)/1e6 FROM db.tbl.files;"
      from_id: runbook-small-files-explosion
      from_field: commands
    - text: "Write like production does — streaming or high-frequency writes without compaction, over-partitioning (partition per hour, per user), or many small appends from a micro-batch job — and watch the health query report the damage."
      from_id: runbook-small-files-explosion
      from_field: possible_causes
    - text: "Interpret the numbers with the skill's rule: avg_mb < 32 and a growing count means compact."
      from_id: skill-iceberg-maintenance
      from_field: body
    - text: "Run your first maintenance call: OPTIMIZE db.tbl ZORDER BY (user_id); on Delta, or CALL catalog.system.rewrite_data_files('db.tbl'); on Iceberg."
      from_id: runbook-small-files-explosion
      from_field: commands
    - text: "Close the loop: compare numFiles and query bytes scanned before and after. If scanning didn't drop, the Z-ORDER was on the wrong columns."
      from_id: skill-delta-optimizer
      from_field: body
  check_yourself:
    - The health query runs on your table and returns a count and an average file size you can write down.
    - After OPTIMIZE or rewrite_data_files, numFiles drops and the next query reports fewer bytes scanned.
    - You can state the compact trigger — avg_mb < 32 and a growing count — without looking it up.
  when_to_use:
    - "First contact with a Delta or Iceberg table — yours to create, query, and break safely"
    - "You want the create → query → measure → compact loop demonstrated end to end before touching production tables"
  why: The whole lakehouse discipline — metadata, file health, compaction, before/after measurement — fits on one first table, and practicing the loop on a scratch table makes every later lesson concrete.
  gotchas:
    - "The compact trigger is avg_mb < 32 and a growing count — measure, do not guess."
    - "If bytes scanned did not drop after Z-ORDER, the Z-ORDER was on the wrong columns."
    - "One scratch table is the whole exercise — do not point OPTIMIZE at a shared table."
  production_notes:
    - "Keep the health query standing — SELECT count(*), avg(file_size_in_bytes)/1e6 FROM db.tbl.files is the check on every table you own."
    - "Install the Iceberg maintenance skill once and reuse its plan on every table: npx de-agent-platform add iceberg-table-maintenance."
  diagram: |
    first lakehouse table
       |
       |- create + query (Delta docs | Iceberg spec)
       |
       |- SELECT count(*), avg(file_size_in_bytes)/1e6 FROM db.tbl.files
       |
       |- avg_mb < 32 and growing --> compact
       |
       |- OPTIMIZE (Delta) | rewrite_data_files (Iceberg)
       |
       --> numFiles + bytes scanned before/after
  code:
    - title: The health query
      lang: sql
      code: |
        SELECT count(*), avg(file_size_in_bytes)/1e6 FROM db.tbl.files;
      source_id: runbook-small-files-explosion
    - title: First compaction on each format
      lang: sql
      code: |
        OPTIMIZE db.tbl ZORDER BY (user_id);  -- Delta
        CALL catalog.system.rewrite_data_files('db.tbl');  -- Iceberg
      source_id: runbook-small-files-explosion
    - title: The measure rule
      lang: text
      code: |
        Compare `numFiles` and query `bytes scanned` before and after. If
        scanning didn't drop, the Z-ORDER was on the wrong columns.
      source_id: skill-delta-optimizer
  source_refs: [ref-delta-docs, ref-iceberg-docs, runbook-small-files-explosion, skill-iceberg-maintenance, skill-delta-optimizer]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/tutorials/first-lakehouse-table
  verification: community
  last_verified: '2026-10-23'
  security: { runs_code: false, network_access: false, credentials: false, filesystem_access: false, external_apis: false }
  relationships: { related_to: [cat-lakehouse] }
- id: tutorial-iceberg-metadata-mechanics
  slug: iceberg-metadata-mechanics
  type: tutorial
  title: Table format mechanics — snapshots, manifests, and the metadata tables
  description: >-
    Open the hood on an Iceberg table: the spec's layers (snapshots, manifests,
    hidden partitioning), the files and history metadata tables you query with
    plain SQL, and the manifest list as a maintenance target in its own right.
    One catalog then spans Iceberg, Delta, Hudi, and Hive.
  category: cat-lakehouse
  difficulty: intermediate
  tags: [tutorial, iceberg, metadata, snapshots, manifests, lakehouse]
  series: lakehouse
  series_title: The Lakehouse Series
  lesson: 3
  learning_objectives:
    - Name the layers the Iceberg spec defines — snapshots, manifests, hidden partitioning
    - Query the files and history metadata tables with plain SQL
    - Explain when manifests need rewriting and why the spec outranks engine docs
  what_you_need:
    - An Iceberg table you can query (any engine that reads the format)
    - Read access to the table's metadata tables (files, history)
    - No installs — the spec and the metadata tables are the materials
  steps:
    - text: "A table format is a specification: the spec is the ground truth when tools disagree."
      from_id: ref-iceberg-docs
      from_field: why
    - text: "The spec defines the layers: the table format, snapshots and manifests, hidden partitioning, schema and partition evolution, and maintenance procedures like compaction and snapshot expiry."
      from_id: ref-iceberg-docs
      from_field: summary
    - text: "Metadata is queryable SQL: for Iceberg/Delta, query the metadata tables (files, history)."
      from_id: runbook-small-files-explosion
      from_field: diagnosis
    - text: "Start with files: SELECT count(*) files, avg(file_size_in_bytes)/1e6 avg_mb FROM db.tbl.files; — avg_mb < 32 and a growing count means compact."
      from_id: skill-iceberg-maintenance
      from_field: body
    - text: "Metadata itself needs maintenance: run rewrite_manifests when the manifest list is huge."
      from_id: skill-iceberg-maintenance
      from_field: body
    - text: "One format is not the whole story: Amazon EMR's multi-catalog queries Iceberg, Delta Lake, Hudi, and Hive tables through a single catalog and joins data across AWS accounts without copying it."
      from_id: ref-query-across-accounts-and-table-formats-with-multi-catalog-in-am
      from_field: description
  check_yourself:
    - db.tbl.files returns a count and an average file size on your table, and you can say which layer of the spec it reads.
    - You can explain what rewrite_manifests fixes and when to run it — when the manifest list is huge.
    - You can say why the spec, not any engine's docs, settles a disagreement between two engines over the same table.
  when_to_use:
    - "You are about to maintain or debug an Iceberg table and want to know what the engine actually reads"
    - "Multiple engines touch the same table and you need the ground truth"
  why: Every query plan and every maintenance decision walks the metadata tree first; knowing snapshots, manifests, and the files/history tables turns magic into reading.
  gotchas:
    - "The spec is the ground truth when tools disagree — do not settle format questions from an engine's blog post."
    - "A huge manifest list is its own problem: rewrite_manifests, not just data-file compaction."
    - "Metadata tables (files, history) are queried like tables — no special tooling required."
  production_notes:
    - "Read the spec once end to end: it covers snapshots, manifests, hidden partitioning, evolution, and the maintenance procedures your skills automate."
    - "Multi-engine shops share tables through catalogs; verify which catalog each engine resolves before comparing query plans."
  diagram: |
    iceberg metadata mechanics
       |
       spec: snapshots | manifests | hidden partitioning | evolution
       |
       |- db.tbl.files  --> count, avg file size --> compact trigger
       |
       |- db.tbl.history --> what happened, when
       |
       |- manifest list huge --> rewrite_manifests
       |
       |- one catalog --> Iceberg + Delta + Hudi + Hive
  code:
    - title: Read the files metadata table
      lang: sql
      code: |
        SELECT count(*) files, avg(file_size_in_bytes)/1e6 avg_mb
        FROM db.tbl.files;
      source_id: skill-iceberg-maintenance
    - title: The maintenance plan the metadata implies
      lang: text
      code: |
        1. `rewrite_data_files` with a target size (128-256 MB).
        2. `rewrite_manifests` when the manifest list is huge.
        3. `expire_snapshots` older than the retention window — but keep at least one
           full snapshot for time travel.
        4. `remove_orphan_files` on a schedule, with a safety margin.
      source_id: skill-iceberg-maintenance
  source_refs: [ref-iceberg-docs, runbook-small-files-explosion, skill-iceberg-maintenance, ref-query-across-accounts-and-table-formats-with-multi-catalog-in-am]
