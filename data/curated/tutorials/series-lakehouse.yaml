# The Lakehouse Series — six new lessons that join the four existing lakehouse
# tutorials (07-lakehouse.yaml) into one ordered 10-lesson series for the
# lakehouse roadmap stage. Every step derives from the cited source field;
# structure is ours, wording is the source's.
- id: tutorial-lakehouse-mental-model
  slug: lakehouse-mental-model
  type: tutorial
  title: The lakehouse mental model — lake vs warehouse vs table formats vs zones
  description: >-
    Build the map before touching a table: object storage is files with no
    structure for trust or ownership, a table format (Iceberg or Delta) adds
    snapshots, manifests, hidden partitioning, ACID, and evolution, and
    medallion zones make trust legible from raw to serving. Multi-catalog
    means the formats coexist — pick each one deliberately.
  category: cat-lakehouse
  difficulty: beginner
  tags: [tutorial, lakehouse, mental-model, table-formats, medallion, beginner]
  series: lakehouse
  series_title: The Lakehouse Series
  lesson: 1
  learning_objectives:
    - Contrast lake, warehouse, and lakehouse by what each does to raw files
    - Name the table format's jobs — snapshots, manifests, hidden partitioning, schema evolution
    - Place the medallion zones over a lakehouse and say who owns each zone
  what_you_need:
    - An object-storage lake or lakehouse you can point at
    - The Iceberg spec and Delta docs — both are in the DE//AGENT registry
    - No installs — this lesson is the map, not the tools
  steps:
    - text: "Start from the gap: object storage gives you a place to put files but no structure for trust or ownership."
      from_id: pattern-medallion-zones
      from_field: problem
    - text: "Name the setting: a lake or lakehouse where many teams write and read, and consumers need to know how far to trust a table."
      from_id: pattern-medallion-zones
      from_field: context
    - text: "The table format is what turns the lake into a lakehouse: Iceberg's spec covers the table format, snapshots and manifests, hidden partitioning, schema and partition evolution, and maintenance procedures like compaction and snapshot expiry."
      from_id: ref-iceberg-docs
      from_field: summary
    - text: "Delta is the other major format: its official docs cover ACID transactions on object storage, time travel, OPTIMIZE and Z-ORDER clustering — and the registry says compare with a Delta vs Iceberg decision guide before committing to a format."
      from_id: ref-delta-docs
      from_field: summary
    - text: "Multi-format is normal, not a compromise: Amazon EMR's multi-catalog queries Iceberg, Delta Lake, Hudi, and Hive tables through a single catalog and joins data across AWS accounts without copying it."
      from_id: ref-query-across-accounts-and-table-formats-with-multi-catalog-in-am
      from_field: description
    - text: "Give the house its zones: raw/ is immutable, exactly as received, never edited, schema-on-read; curated/ is cleaned, typed, deduplicated, quality-gated; serving/ is modelled marts optimised for consumption, SLA-bearing — and promotion between zones is a pipeline step with a gate, not a copy."
      from_id: pattern-medallion-zones
      from_field: solution
  check_yourself:
    - You can say what object storage lacks — structure for trust or ownership — and which zone supplies it for a given consumer.
    - You can name four things the Iceberg spec covers beyond "a table": snapshots and manifests, hidden partitioning, schema and partition evolution, maintenance procedures.
    - You can explain why promotion between zones is a gated pipeline step, not a copy.
  when_to_use:
    - "Before laying out a new lakehouse or admitting a new table format to one"
    - "Onboarding onto a team where many teams write and read the same storage"
  why: A lakehouse is two decisions — a table format and a zoning contract — and both are cheap to make deliberately now and expensive to reverse later.
  gotchas:
    - "Object storage alone gives no structure for trust or ownership — zones and formats are what turn a lake into a lakehouse."
    - "The table format is a specification; the spec is the ground truth when tools disagree."
    - "Do not let curated become a dumping ground; enforce the gate."
  production_notes:
    - "The spec is essential reading for multi-engine shops where Spark, Trino, and warehouses share tables — start there, not at engine docs."
    - "Cross-account joins without copying are possible through multi-catalog; every extra copy is extra storage and another pipeline to run."
  diagram: |
    lakehouse mental model
       |
       |- object storage --> files, no structure for trust or ownership
       |
       |- table format (Iceberg | Delta) --> ACID, snapshots, manifests, evolution
       |
       |- raw (immutable) --> curated (quality gate) --> serving (SLA)
       |
       |- multi-catalog --> Iceberg + Delta + Hudi + Hive through one catalog
  code:
    - title: The medallion contract
      lang: text
      code: |
        raw/       — immutable, exactly as received; never edited; schema-on-read.
        curated/   — cleaned, typed, deduplicated; partitioned; quality-gated.
        serving/   — modelled marts optimised for consumption; SLA-bearing.
        Each zone has a different retention, quality bar and owner. Promotion
        between zones is a pipeline step with a gate, not a copy.
      source_id: pattern-medallion-zones
    - title: One catalog, many formats
      lang: text
      code: |
        Query Iceberg, Delta Lake, Hudi, and Hive tables through a single
        catalog and join data across AWS accounts without copying it.
      source_id: ref-query-across-accounts-and-table-formats-with-multi-catalog-in-am
  source_refs: [pattern-medallion-zones, ref-iceberg-docs, ref-delta-docs, ref-query-across-accounts-and-table-formats-with-multi-catalog-in-am]
