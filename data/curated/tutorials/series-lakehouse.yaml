  lesson: 10
  learning_objectives:
    - Run the full standing checklist on one table you own
    - Turn the four-part maintenance plan into a scheduled job with alerts
    - Apply the escalation line — page only on a freshness-SLA threat
  what_you_need:
    - One production lakehouse table you own
    - Install: npx de-agent-platform add iceberg-table-maintenance
    - Install: amp plugin add de-agent/lakehouse-guard
  steps:
    - text: "Check the zones: raw/ is immutable, exactly as received, never edited, schema-on-read; curated/ is cleaned, typed, deduplicated, quality-gated; serving/ is SLA-bearing — and each zone has a different retention, quality bar and owner, with promotion between zones a pipeline step with a gate, not a copy."
      from_id: pattern-medallion-zones
      from_field: solution
    - text: "Check the format decision: Delta's docs are the definitive source for Delta features and the maintenance operations the lakehouse skills reference — compare with a Delta vs Iceberg decision guide before committing to a format."
      from_id: ref-delta-docs
      from_field: summary
    - text: "Check the monitors: file count, avg file size, planning time."
      from_id: runbook-small-files-explosion
      from_field: monitoring
    - text: "Check the maintenance plan: rewrite_data_files with a target size (128-256 MB), rewrite_manifests when the manifest list is huge, expire_snapshots within retention keeping one full snapshot for time travel, remove_orphan_files on a schedule with a safety margin."
      from_id: skill-iceberg-maintenance
      from_field: body
    - text: "Check the automation: enable Delta auto-compaction or schedule Iceberg rewrite_data_files; target 128-256 MB files and alert on file-count growth."
      from_id: runbook-small-files-explosion
      from_field: production_notes
    - text: "Check the guardrails: /table-health for a status read, /plan-compaction for the maintenance plan, /expire-snapshots for the expiry plan — plans first, not ad hoc runs."
      from_id: plugin-lakehouse-guard
      from_field: commands
    - text: "Check the escalation line: no page — schedule compaction; escalate only if planning time threatens a critical dashboard's freshness SLA."
      from_id: runbook-small-files-explosion
      from_field: escalation
  check_yourself:
    - Every zone has a named owner, a quality bar, and a gate — and curated is not a dumping ground.
    - The three monitors (file count, avg file size, planning time) have alerts, and 128-256 MB is the recorded target.
    - A /plan-compaction during peak ingestion is blocked; the same plan after the window runs.
  when_to_use:
    - "A new table joins the lakehouse and needs the full standing setup"
    - "A quarterly review of an existing table's zones, monitors, maintenance, and escalation"
  why: The series was nine lessons of one idea — a lakehouse is metadata — and the checklist is what keeps it operable after the tutorials end.
  gotchas:
    - "Compaction and snapshot expiry never run during peak ingestion — the guard blocks them, and so should you."
    - "Curated becomes a dumping ground without an enforced gate — promotion is a pipeline step, not a copy."
    - "Escalate only when planning time threatens a critical dashboard's freshness SLA — otherwise schedule, do not page."
  production_notes:
    - "The four-part plan (data files, manifests, snapshots, orphans) is one scheduled job with a safety margin — never four ad hoc commands."
    - "Alert on file-count growth and target 128-256 MB files; those two numbers catch most lakehouse decay early."
  diagram: |
    lakehouse capstone
       |
       |- zones: raw --> curated --> serving (gated promotion)
       |
       |- format: Delta vs Iceberg, chosen deliberately
       |
       |- monitors: file count | avg file size | planning time
       |
       |- maintenance: data files | manifests | snapshots | orphans
       |
       |- guard: /table-health /plan-compaction /expire-snapshots
       |
       |- escalation: page only on a freshness-SLA threat
  code:
    - title: The standing monitors
      lang: text
      code: |
        file count, avg file size, planning time
      source_id: runbook-small-files-explosion
    - title: The four-part maintenance plan
      lang: text
      code: |
        1. `rewrite_data_files` with a target size (128-256 MB).
        2. `rewrite_manifests` when the manifest list is huge.
        3. `expire_snapshots` older than the retention window — but keep at least one
           full snapshot for time travel.
        4. `remove_orphan_files` on a schedule, with a safety margin.
      source_id: skill-iceberg-maintenance
    - title: The three guard commands
      lang: text
      code: |
        /table-health
        /plan-compaction
        /expire-snapshots
      source_id: plugin-lakehouse-guard
  source_refs: [pattern-medallion-zones, ref-delta-docs, runbook-small-files-explosion, skill-iceberg-maintenance, plugin-lakehouse-guard]
