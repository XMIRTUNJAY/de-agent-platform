- id: tutorial-dq-pre-deploy-dq-gate
  slug: dq-pre-deploy-dq-gate
  type: tutorial
  title: Gate promotion with a pre-deploy DQ check
  description: >-
    Wire the pre-deployment DQ check so a pipeline is only promoted when its
    quality suite passes against staged output. You attach the pre-deploy trigger,
    run dbt/GE tests on the staging namespace, and prove a failed expectation
    leaves production untouched.
  category: cat-data-quality
  difficulty: intermediate
  tags: [tutorial, data-quality, deployment, ci, hooks]
  series: data-quality
  series_title: The Data Quality Series
  lesson: 7
  learning_objectives:
    - Attach the DQ suite to a pre-deploy trigger
    - Promote only when critical tests pass on staged output
    - Block promotion while keeping the previous production data
  what_you_need:
    - A pipeline that writes to a staging namespace before production
    - A dbt or Great Expectations test suite for the model
    - A deployment workflow with a pre-deploy stage to register the hook
  steps:
    - text: Wire the check to the pre-deploy trigger, before promotion to production.
      from_id: hook-pre-deployment-dq-check
      from_field: trigger
    - text: After a pipeline writes to the staging namespace, run the model's dbt/GE tests against the staged output.
      from_id: hook-pre-deployment-dq-check
      from_field: implementation
    - text: Promote only if all critical tests pass.
      from_id: hook-pre-deployment-dq-check
      from_field: implementation
    - text: Otherwise leave the previous production data in place and report the failed expectations.
      from_id: hook-pre-deployment-dq-check
      from_field: implementation
    - text: Confirm the failure behavior is block — a not-null test failing on 412 rows in staging blocks promotion, production untouched.
      from_id: hook-pre-deployment-dq-check
      from_field: example
  check_yourself:
    - Stage a run with a not-null violation: promotion is blocked and the previous production data is still in place.
    - "The hook's failure_behavior is block — an all-green critical suite is the only path to promotion."
  when_to_use:
    - "A staged run must pass its quality suite before promotion to production"
    - "Bad data must never reach consumers, even under a urgent deploy"
  why: Promotion is the last chance to stop a bad batch — this hook turns the quality suite into that last gate.
  gotchas:
    - "The check runs after the pipeline writes to staging — an empty or stale staging namespace has nothing to test."
    - "Tier the expectations: critical (block) vs warning (alert only) — blocking on a warning-tier expectation turns small blips into outages."
    - "When the gate blocks, production still serves the previous data — say so in the report instead of assuming the deploy partially landed."
  production_notes:
    - "Promote only on an all-green critical suite; anything else leaves the previous production data in place."
    - "Report the failed expectations with the block — the operator needs the column, rule and row count."
  diagram: |
    deploy
       |
       |- pipeline writes --> staging namespace
       |
       |- pre-deploy hook --> run dbt/GE tests on staged output
       |
       |- all critical pass --> promote --> production
       |
       |- any critical fail --> block --> production untouched --> report failures
  code:
    - title: Hook contract — pre-deploy trigger, block on failure
      lang: yaml
      code: |
        # hook-pre-deployment-dq-check
        trigger: pre-deploy
        purpose: Run the quality suite against a staged run before promoting to production.
        failure_behavior: block
      source_id: hook-pre-deployment-dq-check
    - title: Run the quality suite against the staged output
      lang: text
      code: |
        After a pipeline writes to the staging namespace, run the model's dbt/GE tests
        against the staged output. Promote only if all critical tests pass; otherwise
        leave the previous production data in place and report the failed expectations.
      source_id: hook-pre-deployment-dq-check
    - title: What a blocked promotion looks like
      lang: text
      code: |
        A not-null test fails on 412 rows in staging → promotion blocked, production untouched.
      source_id: hook-pre-deployment-dq-check
  source_refs: [hook-pre-deployment-dq-check, runbook-data-quality-failure]
