- id: tutorial-dq-respond-failing-expectation
  slug: dq-respond-failing-expectation
  type: tutorial
  title: Respond to a failing quality expectation
  description: >-
    A quality expectation failed in production and bad data may be reaching
    consumers. Follow the data-quality-failure runbook: read the failure
    precisely, quantify it, then make the one decision that matters — block,
    quarantine, or pass-with-warning.
  category: cat-data-quality
  difficulty: beginner
  tags: [tutorial, data-quality, runbook, expectations, incident]
  series: data-quality
  series_title: The Data Quality Series
  lesson: 9
  learning_objectives:
    - Read a failing expectation precisely — column, rule, value
    - Quantify a failure — how many rows and which ones
    - Decide block vs quarantine vs pass-with-warning on evidence
  what_you_need:
    - The failing test name and its output (dbt or Great Expectations)
    - Read access to the failing table
    - Install: npx de-agent-platform add spark-data-quality-review
  steps:
    - text: "Read the failing expectation precisely: which column, which rule, what value."
      from_id: runbook-data-quality-failure
      from_field: diagnosis
    - text: "Quantify: how many rows, and which ones (sample them)."
      from_id: runbook-data-quality-failure
      from_field: diagnosis
    - text: "Decide: block, quarantine, or pass-with-warning."
      from_id: runbook-data-quality-failure
      from_field: diagnosis
    - text: Quarantine the failing rows, publish the clean set, keep the bad set for reprocessing.
      from_id: runbook-data-quality-failure
      from_field: fix
    - text: If it is upstream, halt promotion and notify the producer.
      from_id: runbook-data-quality-failure
      from_field: fix
    - text: If it is a false positive, loosen the threshold with evidence.
      from_id: runbook-data-quality-failure
      from_field: fix
  check_yourself:
    - "`dbt test --select fct_orders` isolates the failing test, and `SELECT * FROM fct_orders WHERE order_id IS NULL LIMIT 20;` samples the offending rows."
    - "Given an upstream null-rate jump, you halt promotion and notify the producer instead of loosening the threshold."
  when_to_use:
    - "A quality expectation failed in production"
    - "A freshness or volume check alarmed, or consumers report wrong numbers"
  why: The decision on every failure is the same — block, quarantine or warn; getting it wrong ships bad data to consumers or pages people at 3am for nothing.
  gotchas:
    - "Loosening a threshold to silence an alarm is only right with evidence it was a false positive."
    - "Bad data that already reached consumers needs disclosure, not just a fix."
    - "Blocking on a warning-tier expectation turns small blips into outages."
  production_notes:
    - "Tier expectations: critical blocks, warnings alert."
    - "Keep a quarantine table so a bad batch never ships."
  diagram: |
    expectation failed
       |
       |- read precisely --> column + rule + value
       |
       |- quantify --> row count + samples
       |
       |- decide --> upstream --> halt promotion --> notify producer
       |             false positive --> evidence --> loosen threshold
       |             genuine --> quarantine rows --> publish clean set
  code:
    - title: Isolate the failing test
      lang: bash
      code: |
        dbt test --select fct_orders  # see the failing test
      source_id: runbook-data-quality-failure
    - title: Sample the offending rows
      lang: sql
      code: |
        SELECT * FROM fct_orders WHERE order_id IS NULL LIMIT 20;
      source_id: runbook-data-quality-failure
    - title: The three-way decision
      lang: text
      code: |
        Quarantine the failing rows, publish the clean set, keep the bad set for reprocessing.
        If it is upstream, halt promotion and notify the producer.
        If it is a false positive, loosen the threshold with evidence.
      source_id: runbook-data-quality-failure
  source_refs: [runbook-data-quality-failure]
