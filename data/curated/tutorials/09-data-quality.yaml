# Tutorials — beginner-friendly arrangements of artifact content.
# Every step is verbatim from the cited source field. Structure (need, steps,
# check) is ours; wording is the source's.
- id: tutorial-dq-quarantine-publish-walkthrough
  slug: dq-quarantine-publish-walkthrough
  type: tutorial
  title: Split a batch into quarantine and publish
  description: >-
    Build the pipeline-dq-quarantine starter the way the Quarantine then Publish
    pattern prescribes: a quality contract splits each batch into a published set
    and a quarantine with reasons. You finish with a test that proves no row is
    ever lost and an alert on the quarantine rate.
  category: cat-data-quality
  difficulty: intermediate
  tags: [tutorial, data-quality, quarantine, contracts, pyspark, starter]
  series: data-quality
  series_title: The Data Quality Series
  lesson: 5
  learning_objectives:
    - Express a quality contract as executable checks
    - Design a quarantine table with a reason
    - Alert on the quarantine rate, not just on failure
  what_you_need:
    - The pipeline-dq-quarantine starter (contract/orders.yml, src/validate.py, src/publish.py)
    - DuckDB or PySpark to compile the contract rules to SQL
    - A batch with ~5% deliberately invalid rows (nulls, dupes, out-of-range)
    - Install: npx de-agent-platform add spark-data-quality-review
  steps:
    - text: Split every batch into publish and quarantine on a quality contract.
      from_id: pattern-quarantine-publish
      from_field: solution
    - text: Validate the contract offline against fixtures with `make test`, then run `make run`.
      from_id: project-pipeline-dq-quarantine
      from_field: setup
    - text: Load the contract and compile rules to SQL (DuckDB) or Spark expressions.
      from_id: project-pipeline-dq-quarantine
      from_field: implementation
    - text: Split into pass/fail with a stable `failure_reason`.
      from_id: project-pipeline-dq-quarantine
      from_field: implementation
    - text: Publish the pass set; write the fail set to quarantine with provenance.
      from_id: project-pipeline-dq-quarantine
      from_field: implementation
    - text: Alert when the quarantine rate > 1% for 2 consecutive runs.
      from_id: project-pipeline-dq-quarantine
      from_field: production_hardening
  check_yourself:
    - Every row is either published or quarantined — never lost; the quarantine contains exactly the seeded bad rows, and a clean batch produces an empty quarantine.
    - A quarantine rate above 1% for 2 consecutive runs fires the alert with the failure_reason breakdown attached.
  when_to_use:
    - "External/partner data or any table with an SLA"
    - "High-value downstream metrics that one bad batch could poison"
  why: A row never disappears — it is either published or quarantined with a reason, so one bad batch cannot poison the table.
  gotchas:
    - "A quarantine nobody reviews is just a slower data loss."
    - "Contract too strict → quarantine rate explodes; tier rules and loosen with evidence."
    - "Alert on quarantine rate, not just on a hard failure — a rising rate is the early signal of an upstream problem."
  production_notes:
    - "Alert when quarantine rate > 1% for 2 consecutive runs."
    - "Ship a reprocess command that re-runs the quarantined rows after a fix."
  diagram: |
    batch
       |
       |- [contract check] --> pass --> published/ (SLA-bearing)
       |
       |- [contract check] --> fail --> quarantine/ (+reason, +source_file)
       |
       |- quarantine rate > 1% x2 runs --> alert --> review + reprocess
  code:
    - title: Split every batch — pass publishes, fail quarantines with a reason
      lang: text
      code: |
        Split every batch into publish and quarantine on a quality contract.
          pass ─▶ published table (SLA-bearing)
          fail ─▶ quarantine table (retained, alertable, reprocessable)
        A row never disappears: it is either published or quarantined with a reason.
        Alert on quarantine *rate*, not just on a hard failure — a rising rate is the
        early signal of an upstream problem.
      source_id: pattern-quarantine-publish
    - title: Starter layout — contract, validate, publish
      lang: text
      code: |
        pipeline-dq-quarantine/
          contract/orders.yml       # rules: not_null, unique, range, enum
          src/validate.py
          src/publish.py
          tests/test_quarantine.py
      source_id: project-pipeline-dq-quarantine
    - title: Validate the contract offline, then run the batch
      lang: bash
      code: |
        make test  # validates against the fixtures offline
        make run
      source_id: project-pipeline-dq-quarantine
  source_refs: [pattern-quarantine-publish, project-pipeline-dq-quarantine]
  version: 0.1.0
