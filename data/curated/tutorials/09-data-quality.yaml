- id: tutorial-dq-deduplicate-records
  slug: dq-deduplicate-records
  type: tutorial
  title: Deduplicate records without rewriting the table
  description: >-
    Row counts are inflated and revenue double-counted after a retry or a fan-out
    join. Work the duplicate-records runbook: find the first duplicate date,
    correlate it with a deploy, dedupe on the business key, and rewrite only the
    affected partitions.
  category: cat-data-quality
  difficulty: beginner
  tags: [tutorial, data-quality, duplicates, idempotency, sql]
  series: data-quality
  series_title: The Data Quality Series
  lesson: 2
  learning_objectives:
    - Count duplicates per key with one GROUP BY query
    - Correlate the first duplicate date with a deploy
    - Rewrite affected partitions instead of the whole table
  what_you_need:
    - The inflated table and its business (grain) key
    - Warehouse SQL access to run the grouping queries
    - Install: npx de-agent-platform add spark-data-quality-review
  steps:
    - text: Identify the duplicate key and count duplicates per key.
      from_id: runbook-duplicate-records
      from_field: diagnosis
    - text: "Run: `SELECT k, count(*) c FROM t GROUP BY k HAVING count(*) > 1 ORDER BY c DESC LIMIT 20;`"
      from_id: runbook-duplicate-records
      from_field: commands
    - text: Determine the earliest date duplicates appeared → correlate with a deploy.
      from_id: runbook-duplicate-records
      from_field: diagnosis
    - text: Check whether the write is append vs merge/overwrite.
      from_id: runbook-duplicate-records
      from_field: diagnosis
    - text: Deduplicate on the business key, keeping the latest by event time.
      from_id: runbook-duplicate-records
      from_field: fix
    - text: Rewrite the affected partitions (overwrite), not the whole table.
      from_id: runbook-duplicate-records
      from_field: fix
  check_yourself:
    - "After the fix, the duplicates query returns zero rows for the rewritten partitions: `SELECT k, count(*) c FROM t GROUP BY k HAVING count(*) > 1` is empty."
    - "Duplicate-rate per key is back to 0 and row count vs source count reconciles."
  when_to_use:
    - "Row counts are inflated and metrics double-counted"
    - "A unique-key test starts failing after a retry, join change or backfill"
  why: Duplicates corrupt every metric quietly; finding the first duplicate date and the deploy that introduced it is the whole diagnosis.
  gotchas:
    - "Fix the destination partitions, not the whole table — a full rewrite is both slow and a new risk."
    - "An append instead of overwrite on retry is the classic maker of duplicates."
    - "A non-unique 'one' side in a join fans out silently; test the grain, not the totals."
  production_notes:
    - "Idempotent writes: partition overwrite or MERGE on the business key."
    - "Run a unique test on the grain key in CI and in production."
  diagram: |
    duplicates
       |
       |- count per key --> top duplicated keys
       |
       |- min duplicate date --> correlate with deploy --> fix write mode
       |
       |- dedupe by business key --> keep latest by event time --> overwrite affected partitions
  code:
    - title: Count duplicates per key
      lang: sql
      code: |
        SELECT k, count(*) c FROM t GROUP BY k HAVING count(*) > 1 ORDER BY c DESC LIMIT 20;
      source_id: runbook-duplicate-records
    - title: Find the first and last duplicate dates
      lang: sql
      code: |
        SELECT min(dt), max(dt) FROM (SELECT dt, k, count(*) FROM t GROUP BY dt, k HAVING count(*)>1);
      source_id: runbook-duplicate-records
    - title: Dedupe keeping latest event time, overwrite affected partitions
      lang: text
      code: |
        Deduplicate on the business key, keeping the latest by event time.
        Rewrite the affected partitions (overwrite), not the whole table.

        Prevention: idempotent writes (partition overwrite or MERGE on the key);
        a `unique` test on the grain key in CI and in production.
      source_id: runbook-duplicate-records
  source_refs: [runbook-duplicate-records]
