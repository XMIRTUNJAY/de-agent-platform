# The Data Quality Series — new lessons that join the eight existing
# data-quality tutorials (05-data-contracts.yaml, 09-data-quality.yaml) into
# one ordered 10-lesson series for the data-quality roadmap stage. Every step
# derives from the cited source field; structure is ours, wording is the
# source's.
- id: tutorial-dq-four-dimensions
  slug: dq-four-dimensions
  type: tutorial
  title: Name the four dimensions of data quality
  description: >-
    Build the mental model before writing a single test: freshness,
    completeness, validity, consistency. See each dimension in a real registry
    artifact — the SLA part of a contract, the profiling workflow of the
    data-quality reviewer, the rule vocabulary of the quarantine starter — and
    leave able to name the dimension behind any "the data is bad" complaint.
  category: cat-data-quality
  difficulty: beginner
  tags: [tutorial, data-quality, mental-model, freshness, completeness, beginner]
  series: data-quality
  series_title: The Data Quality Series
  lesson: 1
  learning_objectives:
    - Name the four dimensions of data quality — freshness, completeness, validity, consistency
    - Map each dimension to a concrete signal — SLA, null rate, range, uniqueness
    - Rank failure modes by blast radius before writing any test
  what_you_need:
    - No installation — this lesson reads registry artifacts, it does not run them
    - The cited artifacts — the data-contract skill, the data-quality reviewer agent, the quarantine starter
  steps:
    - text: The SLA part of a contract states freshness and completeness — the first two dimensions, with numbers.
      from_id: skill-data-contract-author
      from_field: body
    - text: Semantics is next — what each field means, units, nullability — the validity a consumer was promised.
      from_id: skill-data-contract-author
      from_field: body
    - text: Profile key columns (null rate, uniqueness, ranges) — the measurements that turn each dimension into a check.
      from_id: agent-data-quality-reviewer
      from_field: workflow
    - text: Rank failure modes by blast radius before writing a single test.
      from_id: agent-data-quality-reviewer
      from_field: workflow
    - text: The starter's rule vocabulary covers the dimensions — not_null, unique, range, enum.
      from_id: project-pipeline-dq-quarantine
      from_field: repo_structure
    - text: Monitor the three signals that watch the dimensions in production — expectation pass rate, quarantine row counts, freshness.
      from_id: runbook-data-quality-failure
      from_field: monitoring
  check_yourself:
    - "A table loads six hours late — freshness; a promised column is 30% null — completeness; profiling key columns (null rate, uniqueness, ranges) surfaces both."
    - "The SLA part of the contract names freshness and completeness, and the semantics part names units and nullability."
    - "Failure modes are ranked by blast radius, and the minimum test set follows from that ranking."
  when_to_use:
    - "You are about to write quality tests and need to decide what to test first"
    - "A stakeholder asks 'is the data good?' and you want to answer with a named dimension, not a shrug"
  why: Every quality complaint is one of four complaints — freshness, completeness, validity, consistency — and naming the dimension turns "the data is bad" into a testable claim.
  gotchas:
    - "A contract with no enforcement is documentation. Documentation is not a contract."
    - "Producers change schemas and semantics with no notice; consumers break in production."
    - "Profiling runs against a provided sample or a read-only replica only; never writes to the source."
  production_notes:
    - "Monitor expectation pass rate, quarantine row counts, freshness."
    - "Propose the minimum test set — the dimensions ranked by blast radius, not every column."
  diagram: |
    the four dimensions
       |
       |- freshness    --> how recently the data landed (SLA)
       |
       |- completeness --> null rate on promised columns
       |
       |- validity     --> ranges, enums, types, units
       |
       |- consistency  --> uniqueness on the grain key, stable semantics
       |
       |- profile key columns (null rate, uniqueness, ranges)
       |
       |- rank failure modes by blast radius --> minimum test set
  code:
    - title: The six parts of a contract
      lang: text
      code: |
        1. Owner (a team, with an on-call).
        2. Schema (typed, versioned).
        3. Semantics (what each field *means*, units, nullability).
        4. SLA (freshness, completeness).
        5. Breaking-change policy (notice period, deprecation path).
        6. Enforcement (which CI test fails on violation).
      source_id: skill-data-contract-author
    - title: Profiling workflow of the data-quality reviewer
      lang: text
      code: |
        Profile key columns (null rate, uniqueness, ranges).
        Rank failure modes by blast radius.
        Propose the minimum test set.
        Emit a quarantine path for rows that fail.
      source_id: agent-data-quality-reviewer
    - title: Rule vocabulary in the starter contract
      lang: text
      code: |
        contract/orders.yml  # rules: not_null, unique, range, enum
      source_id: project-pipeline-dq-quarantine
  source_refs: [skill-data-contract-author, agent-data-quality-reviewer, project-pipeline-dq-quarantine, runbook-data-quality-failure, pattern-contracts-quality-gate]
