- id: tutorial-dq-capstone-checklist
  slug: dq-capstone-checklist
  type: tutorial
  title: Capstone — wire a dataset's quality gates end to end
  description: >-
    Close the series by walking one SLA-bearing dataset through every gate the
    series taught — six-part contract, CI compatibility check, staged quality
    suite, quarantine split, quarantine-rate alerts — and finish with the
    monitoring signals and incident paths that keep the gates honest.
  category: cat-data-quality
  difficulty: intermediate
  tags: [tutorial, data-quality, capstone, checklist, production]
  series: data-quality
  series_title: The Data Quality Series
  lesson: 10
  learning_objectives:
    - Run the full checklist — contract, CI gate, promotion gate, quarantine, alerts — against one dataset
    - Point at the registry artifact that enforces each gate
    - Name the monitoring signals and prevention paths that keep the gates honest
  what_you_need:
    - The eight earlier lessons of this series, or their registry artifacts
    - Install: npx de-agent-platform add data-contract-author
    - A dataset with a consumer and an SLA worth defending
  steps:
    - text: Write the six-part contract — owner, schema, semantics, SLA, breaking-change policy, enforcement.
      from_id: skill-data-contract-author
      from_field: body
    - text: Run the contract as code in the producer's CI — compatibility check, then build, then publish.
      from_id: pattern-contracts-quality-gate
      from_field: solution
    - text: After a pipeline writes to the staging namespace, run the model's dbt/GE tests against the staged output; promote only if all critical tests pass.
      from_id: hook-pre-deployment-dq-check
      from_field: implementation
    - text: Split every batch into publish and quarantine on a quality contract — a row never disappears.
      from_id: pattern-quarantine-publish
      from_field: solution
    - text: Alert when quarantine rate > 1% for 2 consecutive runs, and ship a reprocess command that re-runs the quarantined rows after a fix.
      from_id: project-pipeline-dq-quarantine
      from_field: production_hardening
    - text: Watch the signals — expectation pass rate, quarantine row counts, freshness.
      from_id: runbook-data-quality-failure
      from_field: monitoring
    - text: Close the loop with consumer-driven contract tests in the producer's pipeline.
      from_id: runbook-data-contract-broken
      from_field: prevention
  check_yourself:
    - "The checklist names the CI test that fails on violation — enforcement, part six of the contract."
    - "A not-null test failing on 412 rows in staging blocks promotion and leaves the previous production data in place."
    - "The quarantine alert fires on rate — 1% for 2 consecutive runs — not only on a hard failure."
  when_to_use:
    - "A dataset is about to become SLA-bearing and needs its gates wired in one pass"
    - "Auditing an existing pipeline for missing quality gates"
  why: A quality gate you cannot point at in the registry is a hope, not a gate — the capstone makes every gate concrete, named and enforced.
  gotchas:
    - "Tier the expectations: critical (block) vs warning (alert only) — blocking on a warning-tier expectation turns small blips into outages."
    - "Quarantine never reviewed → add a scheduled review and a reprocess path."
    - "The gate lives where the change is made (producer CI), not in the consumer's runtime — the cheapest place to catch it is before merge."
  production_notes:
    - "Alert when quarantine rate > 1% for 2 consecutive runs."
    - "Contracts get CI enforcement and a dated deprecation path."
  diagram: |
    capstone checklist
       |
       |- contract (six parts) --> CI compatibility check --> build --> publish
       |
       |- staged run --> dbt/GE tests --> all critical pass --> promote
       |                                  any critical fail --> block --> production untouched
       |
       |- batch --> pass --> published
       |             fail --> quarantine (+reason) --> rate > 1% x2 runs --> alert --> review --> reprocess
       |
       |- signals: expectation pass rate, quarantine row counts, freshness
       |
       |- consumer-driven contract tests in the producer's pipeline
  code:
    - title: The six-part contract
      lang: text
      code: |
        1. Owner (a team, with an on-call).
        2. Schema (typed, versioned).
        3. Semantics (what each field *means*, units, nullability).
        4. SLA (freshness, completeness).
        5. Breaking-change policy (notice period, deprecation path).
        6. Enforcement (which CI test fails on violation).
      source_id: skill-data-contract-author
    - title: The promotion gate
      lang: yaml
      code: |
        trigger: pre-deploy
        purpose: Run the quality suite against a staged run before promoting to production.
        failure_behavior: block
      source_id: hook-pre-deployment-dq-check
    - title: The monitoring signals
      lang: text
      code: |
        expectation pass rate, quarantine row counts, freshness
      source_id: runbook-data-quality-failure
  source_refs: [skill-data-contract-author, pattern-contracts-quality-gate, hook-pre-deployment-dq-check, pattern-quarantine-publish, project-pipeline-dq-quarantine, runbook-data-quality-failure, runbook-data-contract-broken]
