# The Foundations Series — lessons authored for the 13x10 series; structure ours, wording the source's.
- id: tutorial-foundations-rows-vs-columns
  slug: foundations-rows-vs-columns
  type: tutorial
  title: >-
    Hold the row-versus-column mental model
  description: >-
    Before you pick a file format, understand why analytics engines read
    columnar files at all: row groups carrying min/max statistics let a reader
    prune most of the file before decoding it, and columnar layout means a
    scan of three columns never touches the other twenty. Every later lesson
    in this series builds on this model.
  category: cat-data-formats
  series: foundations
  series_title: The Foundations Series
  lesson: 1
  difficulty: beginner
  tags: [tutorial, foundations, columnar, parquet, arrow, concepts]
  learning_objectives:
    - Say why analytics engines read columnar files — columnar files scan less data
    - Place file-format decisions on the storage stage of the data engineering lifecycle
    - Point at the sources that make columnar claims exact — layout, statistics, memory
  what_you_need:
    - No tooling required — this is a concepts lesson
    - The Apache Parquet and Apache Arrow documentation open beside you
  steps:
    - text: Start from the lifecycle — data engineering is a lifecycle of generation, storage, ingestion, transformation, and serving, with the undercurrents of security, governance, and cost; file-format decisions live on the storage stage.
      from_id: ref-fundamentals-de
      from_field: description
    - text: Columnar is a read-side promise — the Parquet format documentation is the ground truth for why columnar files scan less data and how row-group pruning works.
      from_id: ref-parquet-format
      from_field: description
    - text: Columnar is also an in-memory promise — the Arrow docs cover the columnar in-memory format, its language bindings, IPC and Flight protocols, and zero-copy interchange between systems.
      from_id: ref-arrow-docs
      from_field: description
    - text: Know the lever that makes layout matter — understanding row groups and statistics is what turns use Parquet into and lay it out like this.
      from_id: ref-parquet-docs
      from_field: why
    - text: Know why Arrow matters outside memory — Arrow is the substrate most modern data tools exchange data through, and the format spec resolves type and layout questions definitively.
      from_id: ref-arrow-docs
      from_field: why
    - text: Keep the right source for disputes — when file-layout questions come up (row groups, min/max statistics, compression), the format docs are the citable source.
      from_id: ref-parquet-format
      from_field: why
  check_yourself:
    - You can say why a scan of three columns reads less data in a columnar file — the format docs call themselves the ground truth for why columnar files scan less data.
    - You can point at the lifecycle stage where file-format choices live — storage, between generation and ingestion.
  when_to_use:
    - "You are new to data engineering and need the why behind columnar before touching formats"
    - "A teammate asks why an analytics engine ignores the row-oriented file you handed it"
  why: Every format decision later in this series traces back to one idea — columnar layout plus statistics lets readers skip data they do not need.
  gotchas:
    - "Columnar is not automatically better — the win shows on scans that read few columns of many, and storage is one lifecycle stage among five."
    - "Use Parquet alone is not a layout — statistics and row-group sizing are what turn it into one."
  production_notes:
    - "Carry the lifecycle frame into design reviews — generation, storage, ingestion, transformation, serving, plus the security, governance, and cost undercurrents."
    - "Default analytics storage to columnar files and expect Arrow as the in-memory substrate most modern data tools exchange data through."
  diagram: |
    rows vs columns
       |
       |- row-oriented --> reader touches every field to reach one column
       |
       |- columnar --> values of one column live together
       |               a scan of three columns reads three column streams
       |
       |- row group + min/max statistics --> predicate pushdown
       |               the reader prunes row groups without decoding them
       |
        --> columnar files scan less data (Parquet on disk, Arrow in memory)
  code:
    - title: Rows versus columns in one view
      lang: text
      code: |
        Row-oriented:  [r1a r1b r1c] [r2a r2b r2c] ...  read one column -> touch every row
        Columnar:      [a1 a2 a3 ...] [b1 b2 b3 ...]     read three columns -> three streams

        Why analytics engines care (Parquet format docs): the ground truth for why
        columnar files scan less data and how row-group pruning works.
      source_id: ref-parquet-format
    - title: The Arrow side of the model
      lang: text
      code: |
        Arrow docs: the columnar in-memory format, its language bindings, IPC and
        Flight protocols, and zero-copy interchange between systems.
      source_id: ref-arrow-docs
  source_refs: [ref-fundamentals-de, ref-parquet-format, ref-arrow-docs, ref-parquet-docs]
  version: 0.1.0
