- id: tutorial-foundations-reading-data-files
  slug: foundations-reading-data-files
  type: tutorial
  title: Reading data files — from bytes to columnar memory
  description: >-
    A read is a pipeline in miniature — the reader consults statistics,
    prunes row groups, decodes only the columns you asked for, and hands you
    an in-memory columnar structure. Walk the read path with the sources,
    then place it on the lifecycle between storage and transformation.
  category: cat-data-formats
  series: foundations
  series_title: The Foundations Series
  lesson: 8
  difficulty: intermediate
  tags: [tutorial, parquet, reading, predicate-pushdown, arrow, lifecycle]
  learning_objectives:
    - Describe the read path — statistics, pruning, column decoding, in-memory handoff
    - Use predicate-pushdown vocabulary when a scan reads more than the query asked
    - Place the read path on the lifecycle between storage and transformation
  what_you_need:
    - Lesson 2's file anatomy
    - A Parquet file you are allowed to read — the concepts hold without one
  steps:
    - text: Start from the lifecycle — after generation and storage comes ingestion, then transformation; reading a file sits at that boundary, and the fundamentals book gives practical patterns for each stage.
      from_id: ref-fundamentals-de
      from_field: description
    - text: Follow the reader's own logic — the format documentation describes the statistics and predicate-pushdown behavior that columnar readers rely on.
      from_id: ref-parquet-format
      from_field: description
    - text: Name what pruning skips — row-group pruning works on per-row-group statistics, the mechanism the Parquet documentation and specification covers under row groups and statistics.
      from_id: ref-parquet-docs
      from_field: description
    - text: Know what lands in memory — after decoding, the columns live in the columnar in-memory format; the Arrow docs cover that format, its language bindings, IPC and Flight protocols, and zero-copy interchange.
      from_id: ref-arrow-docs
      from_field: description
    - text: Keep the map of the field nearby — the fundamentals book is the practitioner-oriented map for someone moving into data engineering, and the read path is one of its stages.
      from_id: ref-fundamentals-de
      from_field: why
  check_yourself:
    - You can narrate a scan — statistics first, pruned row groups next, only the requested columns decoded, handed over in columnar memory.
    - A scan reads a whole file for two columns — you ask what the row-group statistics said before blaming the engine.
  when_to_use:
    - "You are debugging why a scan reads more than the query asked for"
    - "You are teaching a newcomer how a table read actually travels"
  why: Every slow-read complaint is a question about the read path — statistics, pruning, and column decoding are the vocabulary the answers use.
  gotchas:
    - "Predicate pushdown depends on statistics — without them the reader has nothing to prune with; the format docs name statistics and pushdown as a pair."
    - "Reading is not one step — file format, then in-memory format; the Arrow docs describe the second layer."
  production_notes:
    - "Structure files for efficient reads — the Parquet documentation names statistics, row groups, and predicate pushdown as the levers."
    - "Expect the in-memory shape to be Arrow — the substrate most modern data tools exchange data through."
  diagram: |
    the read path
       |
       |- query: two columns, one predicate
       |
       |- footer: row-group statistics (min/max)
       |
       |- predicate pushdown --> prunes row groups that cannot match
       |
       |- decode only the requested columns (pages, encodings, codecs)
       |
       |- handoff: columnar in-memory format (Arrow-shaped)
       |
        --> fewer bytes decoded, zero-copy between systems
  code:
    - title: The read path in one view
      lang: text
      code: |
        statistics + predicate-pushdown behavior that columnar readers rely on
        -> row-group pruning (ground truth per the Parquet format docs)
        -> decode the requested columns
        -> columnar in-memory format, zero-copy interchange (Arrow docs)
      source_id: ref-parquet-format
