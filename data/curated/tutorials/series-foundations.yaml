- id: tutorial-foundations-twelve-factor-pipelines
  slug: foundations-twelve-factor-pipelines
  type: tutorial
  title: The twelve-factor vocabulary for pipeline jobs
  description: >-
    Data pipelines run as jobs on shared infrastructure, so the twelve-factor
    principles apply to them — config in the environment, backing services as
    attached resources, logs as event streams, disposability, and dev/prod
    parity. Learn the vocabulary engineers already share when arguing about
    config, logs, and process design.
  category: cat-engineering-foundations
  series: foundations
  series_title: The Foundations Series
  lesson: 7
  difficulty: beginner
  tags: [tutorial, twelve-factor, config, logging, foundations, jobs]
  learning_objectives:
    - Name the twelve-factor principles that map onto pipeline jobs
    - Treat config, backing services, logs, and disposability as shared vocabulary
    - Connect the methodology to the data engineering lifecycle
  what_you_need:
    - A job or pipeline whose config and logs you can point at
    - The twelve-factor site bookmarked
  steps:
    - text: Read the principles as they are written — the classic twelve principles for building services that run portably — config in the environment, backing services as attached resources, logs as event streams, disposability and dev/prod parity.
      from_id: ref-12factor
      from_field: description
    - text: Apply them to your job — data pipelines inherit these ideas whenever they run as jobs on shared infrastructure.
      from_id: ref-12factor
      from_field: description
    - text: Know the source's standing — short, canonical, and the shared vocabulary engineers reach for when arguing about config, logs and process design.
      from_id: ref-12factor
      from_field: why
    - text: Orient by the tag set — methodology, config, logging, foundations — which is the outline of this lesson.
      from_id: ref-12factor
      from_field: tags
    - text: Tie the methodology to the lifecycle — the fundamentals book's lifecycle of generation, storage, ingestion, transformation, and serving is where these jobs live, with the undercurrents of security, governance, and cost.
      from_id: ref-fundamentals-de
      from_field: description
  check_yourself:
    - You can name where a pipeline job's config should live — in the environment — and why backing services are attached resources.
    - Asked what a job's logs are in twelve-factor terms, you answer — event streams.
  when_to_use:
    - "A pipeline is being containerized or scheduled on shared infrastructure"
    - "A config or logging argument needs a canonical reference"
  why: Pipelines inherit the twelve-factor ideas whenever they run as jobs on shared infrastructure — and the vocabulary is already shared across your team.
  gotchas:
    - "Twelve-factor is a methodology, not a framework — the registry tags it methodology, config, logging, foundations."
    - "The principles describe services that run portably — apply the ideas to jobs rather than expecting a pipeline-specific checklist."
  production_notes:
    - "Config in the environment, backing services attached, logs as event streams — carry the exact terms into job templates."
    - "Dev/prod parity and disposability are the two principles your scheduler tests every day."
  diagram: |
    twelve factors for pipeline jobs
       |
       |- config --> in the environment, not in the code
       |- backing services --> attached resources (databases, queues, buckets)
       |- logs --> event streams
       |- disposability --> fast start, clean shutdown, restart-safe
       |- dev/prod parity --> the same shape everywhere
       |
        --> pipelines inherit all of it when they run as jobs on shared infrastructure
