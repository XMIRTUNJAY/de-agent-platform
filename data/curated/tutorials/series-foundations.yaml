- id: tutorial-foundations-parquet-anatomy
  slug: foundations-parquet-anatomy
  type: tutorial
  title: Open the Parquet file — row groups, pages, encodings
  description: >-
    A Parquet file is not a black box — it is row groups of column chunks made
    of pages, with statistics that readers use for predicate pushdown. Learn
    the anatomy from the two Parquet sources and you can reason about every
    read and every layout decision later in this series.
  category: cat-data-formats
  series: foundations
  series_title: The Foundations Series
  lesson: 2
  difficulty: beginner
  tags: [tutorial, parquet, row-groups, pages, encodings, statistics]
  learning_objectives:
    - Name the parts of a Parquet file — row groups, column chunks, pages, statistics
    - Explain what per-row-group statistics buy a reader through predicate pushdown
    - Reach the authoritative wording instead of paraphrasing the format
  what_you_need:
    - Lesson 1's row-versus-column mental model
    - The Parquet documentation and the Parquet format documentation bookmarked
  steps:
    - text: Read the map of the docs first — the Parquet documentation and specification covers columnar encoding, row groups, statistics, predicate pushdown, and how to structure files for efficient reads.
      from_id: ref-parquet-docs
      from_field: description
    - text: Know what kind of source this is — the registry classifies the Parquet documentation and specification as a spec.
      from_id: ref-parquet-docs
      from_field: kind
    - text: Go one level deeper with the format documentation — page structure, encodings, compression codecs, statistics, and the predicate-pushdown behavior that columnar readers rely on.
      from_id: ref-parquet-format
      from_field: description
    - text: Learn the pruning chain — predicate pushdown runs on statistics, which is why row-group sizing is a read-performance decision rather than a cosmetic one.
      from_id: ref-parquet-docs
      from_field: why
    - text: Know where to settle arguments — when file-layout questions come up (row groups, min/max statistics, compression), the format docs are the citable source.
      from_id: ref-parquet-format
      from_field: why
    - text: Keep the canonical address — the registry's source_url for the Parquet documentation points at parquet.apache.org/docs.
      from_id: ref-parquet-docs
      from_field: source_url
  check_yourself:
    - You can sketch a Parquet file — row groups of column chunks made of pages, with statistics feeding predicate pushdown.
    - Asked where min/max statistics live and what they buy, you answer with row-group pruning from the format docs.
  when_to_use:
    - "You are about to choose row-group sizes, encodings, or compression and want the spec's own terms"
    - "A read is slower than expected and you need the anatomy to reason about pruning"
  why: You cannot reason about Parquet read behavior without the anatomy — row groups, pages, encodings, and statistics are the whole vocabulary.
  gotchas:
    - "Row-group sizing is a read-performance decision — statistics and row-group sizing are what turn use Parquet into a layout."
    - "The two Parquet sources are different documents — the documentation covers usage and structure for efficient reads, the format documentation covers page structure, encodings, codecs, statistics, and pushdown."
  production_notes:
    - "Structure files for efficient reads — the documentation names columnar encoding, row groups, statistics, and predicate pushdown as the levers."
    - "Keep the format docs as the citable source in design reviews about row groups, min/max statistics, or compression."
  diagram: |
    parquet file anatomy
       |
       |- file = row groups (metadata + statistics in the footer)
       |
       |- row group = column chunks, one per column
       |               column chunk = pages (page structure, encodings)
       |
       |- per row group: min/max statistics -> predicate pushdown
       |               the reader prunes whole row groups without decoding
       |
       |- encodings + compression codecs apply at the chunk / page level
       |
        --> sources: Parquet documentation + format documentation
  code:
    - title: Anatomy in one view
      lang: text
      code: |
        Parquet file
          row group 1 ... row group N        <- statistics per row group
            column chunk (col A) = pages     <- page structure, encodings
            column chunk (col B) = pages     <- compression codecs
          footer: metadata + statistics      <- predicate pushdown lives here
      source_id: ref-parquet-format
    - title: The docs' own table of contents
      lang: text
      code: |
        Parquet documentation & spec: columnar encoding, row groups, statistics,
        predicate pushdown, and how to structure files for efficient reads.
      source_id: ref-parquet-docs
