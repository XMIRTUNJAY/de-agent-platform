- id: tutorial-foundations-choosing-file-formats
  slug: foundations-choosing-file-formats
  type: tutorial
  title: Choosing file formats — Parquet, Avro, and Arrow's role
  description: >-
    The three formats in this series are not competitors — they answer
    different questions. Parquet is the columnar file for analytics scans,
    Avro is the schema-evolving container for event payloads, and Arrow is
    the in-memory substrate between systems. Make the comparison explicit so
    the next format debate takes minutes, not days.
  category: cat-data-formats
  series: foundations
  series_title: The Foundations Series
  lesson: 6
  difficulty: intermediate
  tags: [tutorial, parquet, avro, arrow, formats, decision]
  learning_objectives:
    - Match each format to its lane — analytics files, event payloads, in-memory interchange
    - Argue a format choice with the sources' own wording
    - Explain why most pipelines use more than one format
  what_you_need:
    - Lessons 1 through 5
    - The Parquet, Avro, and Arrow docs bookmarked
  steps:
    - text: State the analytics case — the Parquet documentation is about columnar encoding, row groups, statistics, predicate pushdown, and structuring files for efficient reads.
      from_id: ref-parquet-docs
      from_field: description
    - text: State the event case — Avro's documentation covers schema declaration, schema-registry evolution rules, encoding, and the container format used for event and stream payloads and Kafka wire formats.
      from_id: ref-avro-docs
      from_field: description
    - text: State the in-memory case — Arrow's docs cover the columnar in-memory format, language bindings, IPC and Flight protocols, and zero-copy interchange between systems.
      from_id: ref-arrow-docs
      from_field: description
    - text: Ground the comparison in read behavior — the Parquet format documentation is the ground truth for why columnar files scan less data and how row-group pruning works.
      from_id: ref-parquet-format
      from_field: description
    - text: Note the family ties — the registry scores the three format docs as top companions of one another, which matches how pipelines actually use them together.
      from_id: ref-parquet-docs
      from_field: related_computed
    - text: Anchor the whole choice in the lifecycle — file-format decisions are storage-stage decisions inside the generation, storage, ingestion, transformation, serving lifecycle.
      from_id: ref-fundamentals-de
      from_field: description
  check_yourself:
    - You can say in one sentence each what Parquet, Avro, and Arrow are for, using the docs' own wording.
    - A pipeline lands Kafka events and serves warehouse scans — you explain why both Avro and Parquet appear, with Arrow in between.
  when_to_use:
    - "A new pipeline is being designed and the format question is open"
    - "A format debate needs a shared, citable vocabulary"
  why: The formats solve different problems — analytics scans, event evolution, in-memory interchange — so the debate ends when the questions are stated.
  gotchas:
    - "Do not compare the formats head-to-head — Parquet is a file format for scans, Avro is the event container, Arrow is in-memory; the docs describe different layers."
    - "The comparison is not either-or — the registry links the three docs as closest companions because pipelines use them together."
  production_notes:
    - "Default analytics storage to columnar files structured for efficient reads; keep event payloads in a schema-evolving container."
    - "Expect Arrow at the boundaries between engines — IPC and Flight are the protocols the docs name."
  diagram: |
    choosing formats
       |
       |- analytics scans, few columns --> Parquet (columnar file, stats, pushdown)
       |
       |- event payloads, evolving schemas --> Avro (schema + container)
       |
       |- between tools, in memory --> Arrow (columnar memory, zero-copy)
       |
       |- lifecycle frame: a storage-stage decision (generation .. serving)
       |
        --> most pipelines use all three, one lane each
  code:
    - title: The three lanes
      lang: text
      code: |
        Parquet documentation: columnar encoding, row groups, statistics,
        predicate pushdown, structuring files for efficient reads.

        Avro documentation: schema declaration, schema-registry evolution
        rules, encoding, container format for event/stream payloads.

        Arrow documentation: columnar in-memory format, language bindings,
        IPC and Flight protocols, zero-copy interchange.
      source_id: ref-parquet-docs
    - title: Why columnar scans win
      lang: text
      code: |
        The Parquet format documentation is the ground truth for why columnar
        files scan less data and how row-group pruning works.
      source_id: ref-parquet-format
