- id: tutorial-foundations-compression-encodings
  slug: foundations-compression-encodings
  type: tutorial
  title: Compression and encodings — the tradeoffs behind the file
  description: >-
    Encodings and compression codecs are where file size and scan speed are
    actually decided — Parquet applies encodings and codecs per column chunk
    with statistics on top, while Avro carries schema plus encoding for event
    payloads. Learn what each layer buys you before you pick defaults.
  category: cat-data-formats
  series: foundations
  series_title: The Foundations Series
  lesson: 4
  difficulty: intermediate
  tags: [tutorial, parquet, avro, compression, encodings, codecs]
  learning_objectives:
    - Distinguish encodings from compression codecs in a columnar file
    - Explain how statistics sit on top of encoded, compressed data to enable pushdown
    - Compare Parquet's columnar encoding with Avro's encoding for event payloads
  what_you_need:
    - Lesson 2's Parquet anatomy
    - The Parquet format docs and the Avro docs bookmarked
  steps:
    - text: Get the layering from the spec — the Parquet format documentation covers page structure, encodings, compression codecs, statistics, and the predicate-pushdown behavior that columnar readers rely on.
      from_id: ref-parquet-format
      from_field: description
    - text: Treat encoding and compression as file-layout questions — when file-layout questions come up (row groups, min/max statistics, compression), the format docs are the citable source.
      from_id: ref-parquet-format
      from_field: why
    - text: Connect encoding back to layout — the Parquet documentation covers columnar encoding, row groups, statistics, predicate pushdown, and how to structure files for efficient reads.
      from_id: ref-parquet-docs
      from_field: description
    - text: See the event-side counterpart — Avro's official documentation covers schema declaration, the schema-registry evolution rules, encoding, and the container format widely used for event and stream payloads.
      from_id: ref-avro-docs
      from_field: description
    - text: Keep the Arrow boundary in mind — Arrow's docs describe the columnar in-memory format with zero-copy interchange, the layer these on-disk encodings feed into and out of.
      from_id: ref-arrow-docs
      from_field: description
  check_yourself:
    - You can name the layers a Parquet reader passes through — pages with encodings, compression codecs, then statistics for pushdown.
    - Asked where encoding lives for an event payload, you point at Avro's encoding and container format rather than the columnar file.
  when_to_use:
    - "You are choosing codecs and encodings for a Parquet layout and want the spec's terms"
    - "You are deciding how event payloads are encoded before they land in columnar files"
  why: Encodings and codecs decide what a scan actually reads — the format documentation is the ground truth for why columnar files scan less data.
  gotchas:
    - "Encodings, codecs, and statistics are three different layers — the format documentation lists page structure, encodings, compression codecs, statistics, and pushdown separately."
    - "Columnar encodings serve scans — Avro's encoding serves event and stream payloads — the same word, different jobs."
  production_notes:
    - "Pick encodings and codecs as a layout decision — structure files for efficient reads, per the Parquet documentation."
    - "For event payloads, the container format and evolution rules come from the Avro docs, not from the columnar spec."
  diagram: |
    compression + encodings
       |
       |- parquet column chunk: pages
       |      encodings -> compression codecs -> statistics (min/max)
       |      reader: statistics -> predicate pushdown -> decode less
       |
       |- avro payload: schema declaration -> encoding -> container file
       |      the format for event / stream payloads and Kafka wire formats
       |
       |- arrow: columnar in-memory, zero-copy interchange (no file layout)
       |
        --> on-disk columnar (parquet) | event container (avro) | in-memory (arrow)
  code:
    - title: The layers in one view
      lang: text
      code: |
        Parquet format docs: page structure, encodings, compression codecs,
        statistics and the predicate-pushdown behavior that columnar readers
        rely on.

        Avro docs: schema declaration, schema-registry evolution rules, encoding
        and the container format widely used for event/stream payloads and
        Kafka wire formats.
      source_id: ref-parquet-format
    - title: The Arrow boundary
      lang: text
      code: |
        Official Arrow docs: the columnar in-memory format, its language
        bindings, IPC and Flight protocols, and zero-copy interchange between
        systems.
      source_id: ref-arrow-docs
