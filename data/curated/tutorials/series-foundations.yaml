- id: tutorial-foundations-capstone-checklist
  slug: foundations-capstone-checklist
  type: tutorial
  title: Capstone — the foundations checklist
  description: >-
    Ten lessons compress into one checklist — place every decision on the
    lifecycle, lay out analytics files with row groups and statistics, expect
    Arrow at the boundaries, evolve event payloads with Avro's rules, and run
    jobs twelve-factor style. Each line cites the source that owns the claim.
  category: cat-engineering-foundations
  series: foundations
  series_title: The Foundations Series
  lesson: 10
  difficulty: intermediate
  tags: [tutorial, foundations, checklist, capstone, lifecycle]
  learning_objectives:
    - Run a design review using the six sources' own claims
    - Assign each format its lane and each job its twelve-factor vocabulary
    - Know where to look when a claim needs verification
  what_you_need:
    - Lessons 1 through 9
    - All six reference sources bookmarked
  steps:
    - text: Place every decision on the lifecycle — generation, storage, ingestion, transformation, and serving, with the undercurrents of security, governance, and cost.
      from_id: ref-fundamentals-de
      from_field: description
    - text: Analytics files — row groups and statistics are what turn use Parquet into and lay it out like this.
      from_id: ref-parquet-docs
      from_field: why
    - text: File internals — page structure, encodings, compression codecs, statistics, and the predicate-pushdown behavior that columnar readers rely on.
      from_id: ref-parquet-format
      from_field: description
    - text: Between systems — Arrow is the substrate most modern data tools exchange data through, and the format spec resolves type and layout questions definitively.
      from_id: ref-arrow-docs
      from_field: why
    - text: Event payloads — schema declaration, the schema-registry evolution rules, encoding, and the container format for event and stream payloads.
      from_id: ref-avro-docs
      from_field: description
    - text: The jobs themselves — config in the environment, backing services as attached resources, logs as event streams, disposability and dev/prod parity.
      from_id: ref-12factor
      from_field: description
  check_yourself:
    - You can walk the checklist line by line and name the source behind each claim.
    - Given a new pipeline design, you can say which lifecycle stage each decision belongs to and which source owns the wording.
  when_to_use:
    - "Reviewing a pipeline design end to end"
    - "Onboarding an engineer onto the foundations this series covers"
  why: A checklist is the series compressed — every line is a claim you can trace to the source that owns it.
  gotchas:
    - "The checklist is six claims, not six tools — each line cites the source that owns the wording."
    - "Revisit the lifecycle undercurrents — security, governance, and cost — at every stage, not only at storage."
  production_notes:
    - "Keep the six sources bookmarked — file-layout questions come back (row groups, min/max statistics, compression) and the format docs are the citable source."
    - "Run the checklist before every design review, not after the first incident."
  diagram: |
    foundations checklist
       |
       |- [lifecycle]  generation > storage > ingestion > transformation > serving
       |                undercurrents: security, governance, cost
       |- [analytics]  row groups + statistics -> "lay it out like this"
       |- [internals]  pages, encodings, codecs, statistics, pushdown
       |- [memory]     Arrow substrate, zero-copy, IPC / Flight
       |- [events]     Avro schema declaration + registry evolution rules
       |- [jobs]       config in env, attached services, logs as streams
       |
        --> every line traceable to its source
  code:
    - title: The checklist with owners
      lang: text
      code: |
        lifecycle       -> Fundamentals of Data Engineering (O'Reilly)
        analytics file  -> Apache Parquet Documentation & Spec
        file internals  -> Apache Parquet Format Documentation
        in-memory       -> Apache Arrow Documentation
        event payloads  -> Apache Avro Documentation
        jobs            -> The Twelve-Factor App
      source_id: ref-fundamentals-de
