    - Explain why schema evolution rules belong to the schema registry
    - Place Avro against Parquet and Arrow in the format family
  what_you_need:
    - A stream or queue whose payloads you control — concepts only, no cluster needed
    - The Avro documentation bookmarked
  steps:
    - text: Read the docs' own list — Avro's official documentation covers schema declaration, the schema-registry evolution rules, encoding, and the container format widely used for event and stream payloads and Kafka wire formats.
      from_id: ref-avro-docs
      from_field: description
    - text: Treat the evolution rules as citable detail — schema evolution rules for event payloads are exactly the kind of detail worth citing verbatim rather than paraphrasing.
      from_id: ref-avro-docs
      from_field: why
    - text: Orient by the tag set — avro, serialization, schema, docs, official; the schema tag is this lesson's center of gravity.
      from_id: ref-avro-docs
      from_field: tags
    - text: See how the format docs group — in the registry the Avro docs' closest companions are the Arrow docs, the Parquet docs, and the Parquet format docs, each scored five.
      from_id: ref-avro-docs
      from_field: related_computed
    - text: Check depth expectations — the registry scores this resource thin on depth, so read it for the schema and evolution rules rather than expecting step-by-step tutorials.
      from_id: ref-avro-docs
      from_field: depth
  check_yourself:
    - You can list Avro's four topics from the docs — schema declaration, schema-registry evolution rules, encoding, container format.
    - Asked how an event payload survives a producer upgrade, you answer with the schema-registry evolution rules, cited from the docs.
