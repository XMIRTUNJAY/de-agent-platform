- id: tutorial-foundations-format-performance-incidents
  slug: foundations-format-performance-incidents
  type: tutorial
  title: Format-driven performance incidents — small scans and wrong layouts
  description: >-
    When a scan reads the whole lake for one column, the cause is usually the
    file layout, not the engine — missing statistics, row groups sized
    without intent, encodings chosen by default. Walk two incident patterns
    grounded in what the Parquet sources actually claim about statistics and
    pruning.
  category: cat-data-formats
  series: foundations
  series_title: The Foundations Series
  lesson: 9
  difficulty: intermediate
  tags: [tutorial, parquet, performance, statistics, pruning, incidents]
  learning_objectives:
    - Map a too-big scan to its layout cause — statistics, row groups, encodings
    - Explain how pruning fails when statistics are absent
    - Use the lifecycle's cost undercurrent to size the blast radius
  what_you_need:
    - Lesson 8's read path
    - The Parquet docs and format docs bookmarked
  steps:
    - text: Name the incident class — a scan that reads everything for one column; the format documentation is the ground truth for why columnar files scan less data and how row-group pruning works, so start there when a scan does not.
      from_id: ref-parquet-format
      from_field: description
    - text: Check statistics first — understanding statistics and row-group sizing is the practical step that turns use Parquet into and lay out the file like this.
      from_id: ref-parquet-docs
      from_field: description
    - text: Recite the pruning chain — the predicate-pushdown behavior that columnar readers rely on runs on statistics, so a layout without statistics leaves the reader nothing to prune with.
      from_id: ref-parquet-format
      from_field: description
    - text: Treat layout as the fix — row groups and statistics are what turn use Parquet into and lay it out like this, not a bigger cluster.
      from_id: ref-parquet-docs
      from_field: why
    - text: Size the blast radius with the lifecycle — cost is one of the undercurrents of the data engineering lifecycle, alongside security and governance.
      from_id: ref-fundamentals-de
      from_field: description
    - text: Run the review in shared vocabulary — config, logs and process design are where engineers reach for the canonical twelve-factor terms, and a defaulted encoding is a config decision as much as a format one.
      from_id: ref-12factor
      from_field: why
  check_yourself:
    - A scan reads every row group despite a filter — you check row-group statistics before scaling anything.
    - You can explain why row-group sizing is a performance decision — pruning works per row group on its statistics.
  when_to_use:
    - "A warehouse or lake scan bills more than the query justifies"
    - "A new table layout is rolling out and you want its failure modes listed"
  why: Columnar is a promise about scans, and incidents are where the promise gets audited — statistics, row groups, and encodings are the usual suspects.
  gotchas:
    - "No statistics, no pruning — the predicate-pushdown behavior columnar readers rely on runs on statistics."
    - "Use Parquet is not a layout — statistics and row-group sizing are the practical step that turns it into one."
    - "Default encodings are decisions — a wrong one shows up as a slow scan, and the format docs are the citable source."
  production_notes:
    - "Audit layouts for statistics and row-group sizing — the docs name them as the practical levers."
    - "Track cost as a lifecycle undercurrent, not an afterthought."
  diagram: |
    format incidents
       |
       |- symptom: a scan reads everything for one column
       |
       |- check 1: row-group statistics present? -> no -> pushdown cannot prune
       |- check 2: row groups sized with intent? -> huge groups -> little pruning
       |- check 3: encodings defaulted? -> format docs are the citable source
       |
        --> fix the layout, not the cluster; cost is a lifecycle undercurrent
  code:
    - title: Incident card — the scan that reads everything
      lang: text
      code: |
        Claim (format docs): the ground truth for why columnar files scan less
        data and how row-group pruning works.
        Leverage (Parquet docs): understanding statistics and row-group sizing
        is the practical step that turns "use Parquet" into "and lay out the
        file like this".
      source_id: ref-parquet-format
  source_refs: [ref-parquet-format, ref-parquet-docs, ref-fundamentals-de, ref-12factor]
