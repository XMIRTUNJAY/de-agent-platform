    schema declared next to the data, evolution rules carried by the schema
    registry, and a container format used across event and stream pipelines.
    Walk the Avro docs' own four topics and see where the format sits against
    Parquet and Arrow.
  category: cat-data-formats
  series: foundations
  series_title: The Foundations Series
  lesson: 5
  difficulty: intermediate
  tags: [tutorial, avro, schema, evolution, events, kafka]
  learning_objectives:
