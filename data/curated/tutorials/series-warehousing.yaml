- id: tutorial-warehouse-capstone
  slug: warehouse-capstone-checklist
  type: tutorial
  title: Capstone — the warehousing checklist, end to end
  description: >-
    Close the series by auditing one warehouse project against everything it
    taught: models with tests and docs, layered staging to marts with a declared
    grain, incremental loads with a lookback, CI on a staging schema, monitored
    query history, and a repo structure a new joiner can read.
  category: cat-dbt
  difficulty: intermediate
  tags: [tutorial, warehousing, capstone, checklist, best-practices]
  series: warehousing
  series_title: The Warehousing Series
  lesson: 10
  learning_objectives:
    - Audit a warehouse project against the model-tests-docs triad
    - Verify layering, grain, incremental lookback, and CI staging on one project
    - Leave a repo whose structure a new joiner can read
  what_you_need:
    - A warehouse project you own or review — the dbt-warehouse-tests starter works
    - The project's query history and CI configuration
    - One afternoon to run the checklist for real
  steps:
    - text: "Audit the triad — every model is code with three faces: model (SQL) + tests (schema.yml) + docs (descriptions); ref() builds the DAG, tests encode the invariants, and materialisation is a deliberate choice per model."
      from_id: pattern-dbt-tests-docs
      from_field: solution
    - text: Check the layers and the load — staging, intermediate, and marts with the grain declared, and incremental on fct_orders with a 3-day lookback.
      from_id: project-dbt-warehouse-tests
      from_field: implementation
    - text: Check the test set — unique + not_null on the fct grain key, relationships from fct to dims, and accepted_values on status.
      from_id: project-dbt-warehouse-tests
      from_field: tests
    - text: Check the production gate — CI builds to a per-PR staging schema and runs full tests, source freshness checks on raw, and exposures declared for dashboards.
      from_id: project-dbt-warehouse-tests
      from_field: production_hardening
    - text: Check the watchtower — alert on the partitions_scanned/partitions_total ratio and review query history weekly for the top cost queries.
      from_id: runbook-warehouse-query-slow
      from_field: prevention
    - text: Check the team constraints — logic must be reviewable, changes must be testable, and new joiners need to understand the lineage.
      from_id: pattern-dbt-tests-docs
      from_field: forces
    - text: Check the repo reads clean — models/staging, models/intermediate, models/marts, schema.yml with tests and descriptions, singular tests, macros, and the CI workflow.
      from_id: tpl-dbt-project
      from_field: repo_structure
  check_yourself:
    - Every model you audited has SQL, tests in schema.yml, and a description — no exceptions found or all filed.
    - The fact grain key carries unique + not_null, relationships tie fct to dims, and CI runs full tests on a staging schema.
    - The partitions-ratio alert exists and someone owns the weekly top-cost review.
  when_to_use:
    - "Closing out a warehouse build before handover"
    - "Quarterly review of an existing warehouse project"
  why: A warehouse is trustworthy only when the triad, the grain, the lookback, the CI gate, and the watchtower are all true at once — this checklist proves each.
  gotchas:
    - "Grain key not unique → a join fanned out upstream."
    - "CI green but prod differs → CI ran on a different target/schema."
    - "Late-arriving order missed → lookback window too short."
  production_notes:
    - "Keep tests and descriptions on every node; CI on a staging schema with source freshness on raw."
    - "Keep the partitions-ratio alert and the weekly top-cost review on the calendar."
  diagram: |
    warehousing capstone checklist
       |
       |- triad --> model SQL + tests + docs per model
       |
       |- layers --> staging / intermediate / marts, grain declared
       |
       |- load --> incremental + 3-day lookback on fct_orders
       |
       |- gate --> CI on staging schema + freshness + exposures
       |
       |- watchtower --> partitions-ratio alert + weekly top-cost review
  code:
    - title: The repo structure the checklist expects
      lang: text
      code: |
        dbt-project/
          dbt_project.yml
          models/
            staging/
            intermediate/
            marts/
          macros/
          tests/
          .github/workflows/ci.yml
      source_id: tpl-dbt-project
    - title: The starter's DAG with tests and docs on every node
      lang: text
      code: |
        raw.orders ─▶ stg_orders ─▶ int_orders_enriched ─┐
        raw.customers ─▶ stg_customers ──────────────────┼─▶ fct_orders ─▶ marts
        seeds/ ─▶ dim_date ──────────────────────────────┘
                    (tests + docs on every node; CI on staging schema)
      source_id: project-dbt-warehouse-tests
