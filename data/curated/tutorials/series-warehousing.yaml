- id: tutorial-warehouse-query-incident
  slug: warehouse-query-incident
  type: tutorial
  title: Incident — the dashboard query that went slow
  description: >-
    Run the slow-query runbook as an incident: confirm the regression, split
    scan cost from compute contention, pull partitions_scanned and bytes from
    query history as evidence, apply the matched fix, and escalate on the
    shared-warehouse SLA before the queue takes other teams down with it.
  category: cat-dbt
  difficulty: intermediate
  tags: [tutorial, warehousing, incident, runbook, performance]
  series: warehousing
  series_title: The Warehousing Series
  lesson: 9
  learning_objectives:
    - Confirm a query regression from symptoms and query history
    - Collect the evidence packet — query_id, partitions ratio, bytes, queue split
    - Apply the fix that matches the disease and escalate on the SLA
  what_you_need:
    - A regressed query and access to its query history
    - "Install: npx de-agent-platform add warehouse-clustering-advisor"
    - The shared warehouse's queue-time SLA
  steps:
    - text: Confirm the regression — a dashboard or model query that used to take seconds now takes minutes, or queue times rising on a shared warehouse.
      from_id: runbook-warehouse-query-slow
      from_field: symptoms
    - text: Name the two candidate diseases before touching anything — separate scan inefficiency from compute inefficiency.
      from_id: skill-warehouse-clustering-advisor
      from_field: learning_objectives
    - text: Diagnose — separate scan cost from compute time (bytes/partitions scanned vs queue time) and compare the plan against the clustering/partition key.
      from_id: runbook-warehouse-query-slow
      from_field: diagnosis
    - text: Pull the evidence — query_id, partitions_scanned, partitions_total, and bytes_scanned from query history, ordered by start time.
      from_id: runbook-warehouse-query-slow
      from_field: commands
    - text: Complete the evidence packet — the query_id with its partitions ratio and bytes, the plan compared against the clustering/partition key, and the queue-time vs execution-time split.
      from_id: runbook-warehouse-query-slow
      from_field: evidence_to_collect
    - text: Fix what the evidence says — over-scan means fixing the predicate or adding/adjusting the clustering key; compute-bound with high queue time means adding clusters, not size; rebuild clustering on a low-selectivity key.
      from_id: runbook-warehouse-query-slow
      from_field: fix
    - text: Escalate to the warehouse admin when queue time breaches the shared-warehouse SLA; otherwise the query owner fixes the predicate.
      from_id: runbook-warehouse-query-slow
      from_field: escalation
  check_yourself:
    - Your incident notes contain a query_id with its partitions ratio, bytes scanned, and a queue-vs-execution split.
    - The fix you applied matches the disease — predicate/key for over-scan, clusters for queue time.
    - Escalation happened on the SLA breach, not on feelings.
  when_to_use:
    - "A dashboard that used to take seconds now takes minutes"
    - "Queue times rising on a shared warehouse"
  why: A regressed dashboard erodes trust quietly, and a scan-bound query melts everyone else's queue too.
  gotchas:
    - "Bytes scanned and queue time are different diseases — fix the predicate vs add clusters; sizing up a scan-bound query buys nothing."
    - "Clustering on a low-selectivity key stops pruning entirely."
    - "Data volume growth silently crosses micro-partition thresholds — a query can go slow with no change at all."
  production_notes:
    - "Monitor bytes scanned, partitions scanned ratio, and queue time on the shared warehouse."
    - "Alert on the partitions_scanned/partitions_total ratio; review weekly query history for the top-cost queries."
  diagram: |
    slow-query incident
       |
       |- symptom confirmed --> scan vs compute split
       |
       |- evidence --> query_id + partitions ratio + bytes + queue/execution
       |
       |- over-scan --> predicate / clustering key
       |- queue-bound --> add clusters, not size
       |
       |- SLA breach --> escalate to warehouse admin
  code:
    - title: Pull the evidence from query history
      lang: sql
      code: |
        -- Snowflake
        SELECT query_id, partitions_scanned, partitions_total, bytes_scanned
        FROM table(information_schema.query_history_by_session())
        ORDER BY start_time DESC LIMIT 10;
      source_id: runbook-warehouse-query-slow
    - title: What the runbook monitors
      lang: text
      code: |
        bytes scanned, partitions scanned ratio, queue time
      source_id: runbook-warehouse-query-slow
  source_refs: [runbook-warehouse-query-slow, skill-warehouse-clustering-advisor]
