- id: tutorial-warehouse-clustering-pruning
  slug: warehouse-clustering-pruning
  type: tutorial
  title: Make queries prune — clustering keys and scan diagnosis
  description: >-
    Choose a clustering key from the predicates of your most expensive queries,
    prove the prune with partitions_scanned versus partitions_total, and fix the
    disease you actually have — a lost predicate or a low-selectivity key on the
    scan side, or queue time on the compute side.
  category: cat-dbt
  difficulty: intermediate
  tags: [tutorial, warehousing, clustering, performance, pruning]
  series: warehousing
  series_title: The Warehousing Series
  lesson: 4
  learning_objectives:
    - Choose a clustering key from predicate selectivity
    - Prove pruning with partitions_scanned versus partitions_total
    - Fix the scan or compute problem you actually measured
  what_you_need:
    - A shared warehouse with a query history you can read
    - "Install: npx de-agent-platform add warehouse-clustering-advisor"
    - Your top-cost queries and their WHERE clauses
  steps:
    - text: Pick the clustering column from the workload — the one that appears in the WHERE clause of the most expensive queries, with reasonable cardinality; order matters, so put the most selective first.
      from_id: skill-warehouse-clustering-advisor
      from_field: body
    - text: Know the failure mode — clustering on a low-selectivity key stops pruning entirely.
      from_id: runbook-warehouse-query-slow
      from_field: gotchas
    - text: Diagnose before changing anything — separate scan cost from compute time (bytes/partitions scanned vs queue time) and compare the plan against the clustering/partition key.
      from_id: runbook-warehouse-query-slow
      from_field: diagnosis
    - text: Measure the prune directly — query_id, partitions_scanned, partitions_total, and bytes_scanned from the session's query history.
      from_id: runbook-warehouse-query-slow
      from_field: commands
    - text: Match the fix to the finding — over-scan means fixing the predicate or adding/adjusting the clustering key; rebuilding clustering on a low-selectivity key.
      from_id: runbook-warehouse-query-slow
      from_field: fix
    - text: Keep it fixed — alert on the partitions_scanned/partitions_total ratio and review query history weekly for the top cost queries.
      from_id: runbook-warehouse-query-slow
      from_field: prevention
  check_yourself:
    - Your clustering key's first column is the most selective predicate of your costliest queries.
    - You can quote partitions_scanned/partitions_total for a query before and after the change.
    - Scan-bound and queue-bound queries get different fixes, and you can name which yours is.
  when_to_use:
    - "A dashboard or model scans far more partitions than it needs"
    - "Choosing the first clustering key for a large fact table"
  why: Pruning is the single biggest lever on warehouse cost and latency, and it is decided by one key and the predicates that use it.
  gotchas:
    - "Clustering on a low-selectivity key stops pruning entirely."
    - "Scan is optimal but the query waits → warehouse sizing or concurrency problem."
    - "Bytes scanned and queue time are different diseases — fix the predicate vs add clusters; sizing up a scan-bound query buys nothing."
  production_notes:
    - "Alert on the partitions_scanned/partitions_total ratio."
    - "Review weekly query history for the top-cost queries."
  diagram: |
    clustering and pruning
       |
       |- most expensive queries --> WHERE columns --> cardinality --> key order
       |
       |- query history --> partitions_scanned / partitions_total --> prune proof
       |
       |- over-scan --> fix predicate / adjust key
       |
       |- waits with optimal scan --> sizing or concurrency, not the key
  code:
    - title: Prove the prune from query history
      lang: sql
      code: |
        -- Snowflake
        SELECT query_id, partitions_scanned, partitions_total, bytes_scanned
        FROM table(information_schema.query_history_by_session())
        ORDER BY start_time DESC LIMIT 10;
      source_id: runbook-warehouse-query-slow
    - title: Clustering key choice, from the advisor
      lang: text
      code: |
        Pick the column that appears in the WHERE clause of the *most expensive*
        queries, with reasonable cardinality. Order matters: put the most
        selective first.
      source_id: skill-warehouse-clustering-advisor
  source_refs: [skill-warehouse-clustering-advisor, runbook-warehouse-query-slow]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
