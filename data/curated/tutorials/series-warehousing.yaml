# The Warehousing Series — six new lessons that join the four existing dbt
# tutorials (02-dbt.yaml) into one ordered 10-lesson series for the
# warehousing roadmap stage. Every step derives from the cited source field;
# structure is ours, wording is the source's.
- id: tutorial-warehouse-mental-model
  slug: warehouse-mental-model
  type: tutorial
  title: The warehouse mental model — micro-partitions, clustering, scan vs compute
  description: >-
    Build the map before tuning anything: a table is a set of micro-partitions,
    every query is described by bytes scanned, partitions scanned ratio, and
    queue time, a clustering key decides how much gets pruned, and a slow query
    is either a scan problem or a compute problem — never both at once.
  category: cat-dbt
  difficulty: beginner
  tags: [tutorial, warehousing, mental-model, clustering, beginner]
  series: warehousing
  series_title: The Warehousing Series
  lesson: 1
  learning_objectives:
    - Name the three numbers that describe a warehouse query — bytes scanned, partitions scanned ratio, queue time
    - Explain why a table is a set of micro-partitions and what a clustering key prunes
    - Separate a scan problem from a compute problem before touching any knob
  what_you_need:
    - A warehouse to reason about — Snowflake, BigQuery, or Redshift
    - "Install: npx de-agent-platform add warehouse-clustering-advisor"
    - One slow query and one fast query from your own history to compare
  steps:
    - text: "The advisor's scope is the mental model's table of contents: clustering keys, warehouse sizing, result caching, and the difference between a scan problem and a compute problem."
      from_id: skill-warehouse-clustering-advisor
      from_field: description
    - text: Describe any warehouse query with the three numbers on the runbook's monitoring list — bytes scanned, partitions scanned ratio, queue time.
      from_id: runbook-warehouse-query-slow
      from_field: monitoring
    - text: A table is physically a set of micro-partitions; the runbook lists data volume growth crossing a micro-partition threshold as a cause — a query can go slow with no change at all.
      from_id: runbook-warehouse-query-slow
      from_field: possible_causes
    - text: "Diagnose first: a query that scans far more partitions than it needs is a clustering/partition problem; a scan that is optimal but still waits is a warehouse sizing or concurrency problem."
      from_id: skill-warehouse-clustering-advisor
      from_field: body
    - text: The clustering key is picked from workload shape — the column that appears in the WHERE clause of the most expensive queries, with reasonable cardinality, most selective first.
      from_id: skill-warehouse-clustering-advisor
      from_field: body
    - text: Compute is elastic and separate from storage — if queue time is far above execution time for short queries, scale out (more clusters), not up (bigger warehouse).
      from_id: skill-warehouse-clustering-advisor
      from_field: body
    - text: Under the engine sits the logical layer the lesson arc builds — the star schema that stops analysts re-deriving the same joins and disagreeing on metric definitions.
      from_id: pattern-dimensional-model
      from_field: problem
  check_yourself:
    - You can read a query's bytes scanned, partitions scanned ratio, and queue time and say which side is sick.
    - Asked why a query got slow when nothing changed, you answer micro-partition thresholds before blaming code.
    - You can name the clustering key you would pick for your most expensive query and why.
  when_to_use:
    - "Before tuning anything on a warehouse"
    - "Onboarding onto a team that shares one warehouse"
  why: Every warehousing decision later in the series is a choice about partitions, clustering, or compute — and this is the map of all three.
  gotchas:
    - "Bytes scanned and queue time are different diseases — fix the predicate vs add clusters; sizing up a scan-bound query buys nothing."
    - "Clustering on a low-selectivity key stops pruning entirely."
    - "Data volume growth silently crosses micro-partition thresholds — a query can go slow with no change at all."
  production_notes:
    - "Alert on the partitions_scanned/partitions_total ratio from day one."
    - "Scale out for queue time on short queries; scale up never fixes a scan-bound query."
  diagram: |
    warehouse mental model
       |
       |- table = micro-partitions --> volume growth crosses thresholds silently
       |
       |- scan side --> bytes + partitions scanned --> clustering key / predicate
       |
       |- compute side --> queue time --> scale out (more clusters), not up
       |
       |- logical layer --> star schema under the engine
  code:
    - title: The three numbers for any query, from query history
      lang: sql
      code: |
        -- Snowflake
        SELECT query_id, partitions_scanned, partitions_total, bytes_scanned
        FROM table(information_schema.query_history_by_session())
        ORDER BY start_time DESC LIMIT 10;
      source_id: runbook-warehouse-query-slow
    - title: Install the clustering advisor skill
      lang: bash
      code: |
        npx de-agent-platform add warehouse-clustering-advisor
      source_id: skill-warehouse-clustering-advisor
  source_refs: [skill-warehouse-clustering-advisor, runbook-warehouse-query-slow, pattern-dimensional-model]
