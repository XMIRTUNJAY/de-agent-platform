- id: tutorial-warehouse-production-gotchas
  slug: warehouse-production-gotchas
  type: tutorial
  title: Warehouse production gotchas — cost, full refreshes, late data
  description: >-
    The three ways a healthy warehouse model hurts production: a full-refresh
    that rebuilds a 4B-row table unannounced, a lookback window too short to
    catch late-arriving orders, and cost drift nobody reviews. Guard the
    destructive command, harden CI, and put the cost query on a weekly cadence.
  category: cat-dbt
  difficulty: advanced
  tags: [tutorial, warehousing, production, cost, full-refresh, late-data]
  series: warehousing
  series_title: The Warehousing Series
  lesson: 8
  learning_objectives:
    - Gate full-refreshes on row thresholds and criticality before they run
    - Size lookback windows against real late-arriving data
    - Keep warehouse cost visible with weekly top-cost query reviews
  what_you_need:
    - A dbt project with at least one incremental model in production
    - The manifest stats the guard hook reads row thresholds from
    - "Install: npx de-agent-platform add dbt-model-review"
  steps:
    - text: See the blast radius concretely — `dbt run --full-refresh --select fct_orders` on a 4B-row model is the command the guard pauses for confirmation.
      from_id: hook-dbt-full-refresh-guard
      from_field: example
    - text: Understand the gate — the hook inspects dbt commands for `--full-refresh`; if any affected model exceeds a row threshold from the manifest's stats or is tagged `critical`, it requires an explicit confirmation token and logs the operator identity.
      from_id: hook-dbt-full-refresh-guard
      from_field: implementation
    - text: Late data is the silent drop — a late-arriving order missed means the lookback window was too short.
      from_id: project-dbt-warehouse-tests
      from_field: failure_scenarios
    - text: Environments lie too — CI green but prod differs means CI ran on a different target/schema.
      from_id: project-dbt-warehouse-tests
      from_field: failure_scenarios
    - text: Deletes never arrive on their own — decide explicitly between soft-delete and a periodic full-refresh.
      from_id: skill-dbt-model-review
      from_field: body
    - text: Watch the bill — review weekly query history for the top cost queries and alert on the partitions_scanned/partitions_total ratio.
      from_id: runbook-warehouse-query-slow
      from_field: production_notes
    - text: Harden the loop — CI builds to a per-PR staging schema and runs full tests, source freshness checks watch raw, and exposures are declared for dashboards.
      from_id: project-dbt-warehouse-tests
      from_field: production_hardening
  check_yourself:
    - A full-refresh of your largest model now requires a confirmation token and is logged with the operator identity.
    - Your lookback window is sized from observed late-arriving data, not guessed.
    - Top-cost queries are reviewed weekly and the partitions ratio has an alert.
  when_to_use:
    - "Before the first full-refresh of a large production model"
    - "Cost or reliability reviews of an existing warehouse model"
  why: The commands that fix warehouses are also the ones that can destroy them — cost, full-refreshes, and late data are where models meet production.
  gotchas:
    - "Late-arriving order missed → lookback window too short."
    - "CI green but prod differs → CI ran on a different target/schema."
    - "Deletes never arrive. Decide explicitly: soft-delete, or periodic full-refresh."
  production_notes:
    - "Leave the full-refresh guard hook enabled — it pauses destructive rebuilds on models over the row threshold or tagged critical."
    - "Run CI to a per-PR staging schema with full tests, source freshness on raw, and declared exposures."
  diagram: |
    production gotchas
       |
       |- --full-refresh --> row threshold / critical tag --> confirmation + logged identity
       |
       |- incremental --> lookback window sized for late data
       |
       |- deletes --> soft-delete or periodic full-refresh, decided explicitly
       |
       |- cost --> weekly top-cost review + partitions-ratio alert
  code:
    - title: The command the guard pauses
      lang: text
      code: |
        dbt run --full-refresh --select fct_orders
        # on a 4B-row model this is paused for confirmation
      source_id: hook-dbt-full-refresh-guard
    - title: Production hardening checklist, from the starter project
      lang: text
      code: |
        CI builds to a per-PR staging schema and runs full tests
        Source freshness checks on raw
        Exposures declared for dashboards
      source_id: project-dbt-warehouse-tests
  source_refs: [hook-dbt-full-refresh-guard, project-dbt-warehouse-tests, skill-dbt-model-review, runbook-warehouse-query-slow]
