- id: tutorial-warehouse-star-schema
  slug: warehouse-star-schema
  type: tutorial
  title: Model a star schema — facts, conformed dimensions, declared grain
  description: >-
    Turn the analytical layer into facts surrounded by conformed dimensions:
    declare the fact grain in schema.yml, stage and intermediate models below
    it, SCD2 where history must survive, and scaffold the whole thing from the
    dbt project template so staging, marts, tests, and CI exist from commit one.
  category: cat-dbt
  difficulty: intermediate
  tags: [tutorial, warehousing, dimensional-modeling, star-schema, dbt]
  series: warehousing
  series_title: The Warehousing Series
  lesson: 3
  learning_objectives:
    - Declare a fact grain and surround it with conformed dimensions
    - Layer staging, intermediate, and marts models below the star
    - Scaffold the layered project with tests and CI from the template
  what_you_need:
    - A dbt project (or the template below) with raw source tables landed
    - One business process with a defensible grain, such as order lines
    - Dimensions that recur across facts, such as customer, product, date
  steps:
    - text: The pattern exists because analysts re-derive the same joins and disagree on metric definitions — the star schema is the fix.
      from_id: pattern-dimensional-model
      from_field: problem
    - text: It fits a warehouse serving BI and analytics with recurring query patterns.
      from_id: pattern-dimensional-model
      from_field: context
    - text: "Model facts (events/measures) surrounded by conformed dimensions (context): fct_orders at the grain of one row per order line, with dim_customer (SCD2 for history), dim_product, and dim_date."
      from_id: pattern-dimensional-model
      from_field: solution
    - text: Declare the fact grain explicitly, conform dimensions across facts so they can be combined, and use SCD type 2 when an attribute's history must be preserved at the point of the fact.
      from_id: pattern-dimensional-model
      from_field: solution
    - text: Layer the project below the star — staging renames and casts one row per source row, intermediate holds business logic with no direct consumer reads, and marts split fct vs dim with the grain declared in schema.yml.
      from_id: project-dbt-warehouse-tests
      from_field: implementation
    - text: Check the design against the pattern's forces — analysts need simple fast queries, definitions must be consistent, and history matters for some attributes.
      from_id: pattern-dimensional-model
      from_field: forces
    - text: Scaffold rather than hand-roll — the template ships dbt_project.yml, models/staging, models/intermediate, models/marts, tests/, and a CI workflow.
      from_id: tpl-dbt-project
      from_field: contents
  check_yourself:
    - fct_orders declares its grain in schema.yml and every dim can be joined to every fact.
    - Staging models are one row per source row, and no consumer reads intermediate directly.
    - Any attribute whose history matters at the point of the fact is an SCD2 dimension column.
  when_to_use:
    - "Designing the analytical layer for BI and recurring queries"
    - "Metric definitions that must be consistent across dashboards"
  why: A star schema with a declared grain is the difference between one shared definition of a metric and five private ones.
  gotchas:
    - "Grain key not unique → a join fanned out upstream."
    - "con: less flexible for rare queries; ETL to maintain SCDs"
    - "Intermediate holds business logic — no direct consumer reads."
  production_notes:
    - "Declare the fact grain in schema.yml; marts split fct vs dim with that declaration."
    - "Conform dimensions across facts so they can be combined."
  diagram: |
    dim_customer ─┐
    dim_product  ─┼─▶ fct_orders ─▶ marts
    dim_date     ─┘

    staging ─▶ intermediate ─▶ fct / dim (grain declared in schema.yml)
  code:
    - title: The star schema, from the pattern's solution
      lang: text
      code: |
        Facts (events/measures) surrounded by conformed dimensions (context).
          fct_orders (grain: one row per order line)
            ├─ dim_customer (SCD2 for history)
            ├─ dim_product
            └─ dim_date
      source_id: pattern-dimensional-model
    - title: Scaffold the layered project from the template
      lang: bash
      code: |
        amp template new de-agent/dbt-project ./my-dbt
      source_id: tpl-dbt-project
    - title: The DAG the starter project ships
      lang: text
      code: |
        raw.orders ─▶ stg_orders ─▶ int_orders_enriched ─┐
        raw.customers ─▶ stg_customers ──────────────────┼─▶ fct_orders ─▶ marts
        seeds/ ─▶ dim_date ──────────────────────────────┘
      source_id: project-dbt-warehouse-tests
  source_refs: [pattern-dimensional-model, project-dbt-warehouse-tests, tpl-dbt-project]
  version: 0.1.0
