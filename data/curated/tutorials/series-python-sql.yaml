# The Python & SQL Series — six new lessons that join the four existing SQL
# tutorials (01-sql-fanout.yaml, 03-sql.yaml) into one ordered 10-lesson series
# for the python-sql roadmap stage. Every step derives from the cited source
# field; structure is ours, wording is the source's.
- id: tutorial-sql-mental-model
  slug: sql-relational-mental-model
  type: tutorial
  title: The relational mental model — sets, grain, and NULL
  description: >-
    Before the first SELECT, build the model every later lesson uses: a query
    returns a set with a stated grain, a join changes that grain by its
    cardinality, and NULL never compares as you expect. You learn the first
    question every SQL review asks, the five rules that follow from it, and
    the failure modes — fan-out joins, NULL-unsafe predicates, implicit
    casts, non-deterministic ordering, functions that silently change grain —
    the rest of the series attacks.
  category: cat-sql
  difficulty: beginner
  tags: [tutorial, sql, mental-model, grain, nulls, beginner]
  series: python-sql
  series_title: The Python & SQL Series
  lesson: 1
  learning_objectives:
    - State the grain of a result set in one sentence
    - Explain how a join's cardinality (1:1, N:1, N:N) changes the row count of the result
    - Name the five correctness failure modes the SQL review rules target
  what_you_need:
    - No engine required — this is a concepts lesson
    - Install: npx de-agent-platform add sql-review
    - A query from your own team to state the grain of
  steps:
    - text: "Start every query with the review skill's first question: what is the grain of this result? If the author can't answer, stop."
      from_id: skill-sql-review
      from_field: body
    - text: State the grain of a result set in one sentence.
      from_id: skill-sql-review
      from_field: learning_objectives
    - text: A query returns a set — and every join states its cardinality (1:1, N:1, N:N) and justifies it, because cardinality is what changes the grain.
      from_id: skill-sql-review
      from_field: body
    - text: NULL is part of the model and it never compares as you think — learn to spot NULL-unsafe `NOT IN` and `=` predicates.
      from_id: skill-sql-review
      from_field: learning_objectives
    - text: The failure modes the series attacks — fan-out joins, NULL-unsafe predicates, implicit casts, non-deterministic ordering, and functions that silently change grain.
      from_id: skill-sql-review
      from_field: description
    - text: The artifact of the mental model is a grain statement for each SELECT.
      from_id: agent-sql-reviewer
      from_field: outputs
  check_yourself:
    - You can answer the first question — the grain of a given result set — in one sentence.
    - Given a join, you can say whether it is 1:1, N:1, or N:N and what that does to the row count.
    - You can explain why NOT IN over a nullable subquery column is banned.
  when_to_use:
    - "Before writing your first production query"
    - "Onboarding onto a team that reviews SQL with the sql-review skill"
  why: Sets, grain, and NULL semantics are the three ideas every later lesson — joins, windows, plans, review — keeps returning to.
  gotchas:
    - "NOT IN with a nullable column never compares as you think; use NOT EXISTS."
    - "A result set can be technically correct and still wrong — if the grain is wrong, the numbers are wrong."
    - "Grain is a property of the result, not of the tables — the same join can be N:1 or N:N depending on the keys."
  production_notes:
    - "Make a grain statement part of every SQL PR description."
    - "The five review rules come from the sql-review skill — keep them next to the mental model."
  diagram: |
    relational mental model
       |
       |- query = set --> state the grain in one sentence
       |
       |- join cardinality (1:1, N:1, N:N) --> what happens to the row count
       |
       |- NULL --> never compares as you think --> NOT EXISTS over NOT IN
       |
       |- failure modes --> fan-out, NULL-unsafe, casts, ordering, grain-changing functions
  code:
    - title: The first question, and the rules that follow from it
      lang: text
      code: |
        The first question: what is the grain of this result?
        If the author can't answer, stop.

        1. Every join states its cardinality (1:1, N:1, N:N) and justifies it.
        2. NOT IN (subquery) is banned where the subquery can return NULL — use NOT EXISTS.
        3. Comparisons across types must be explicit casts, not implicit.
        4. ORDER BY without LIMIT in a view is meaningless — drop it.
        5. SELECT * in a persisted model freezes an unstable schema.
      source_id: skill-sql-review
  source_refs: [skill-sql-review, agent-sql-reviewer]
  agent_skills: [skill-sql-review]
  version: 0.1.0
  license: CC-BY-4.0
