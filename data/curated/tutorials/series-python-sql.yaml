- id: tutorial-sql-capstone
  slug: sql-capstone-checklist
  type: tutorial
  title: Capstone — the SQL correctness checklist
  description: >-
    Close the series by turning nine lessons into one standing checklist: a
    grain statement for every SELECT, a cardinality justification for every
    join, NULL-safe anti-joins, explicit casts, lint in CI, and one decision
    rule for slow queries. Each line cites the lesson that earned it, and the
    checklist ends where the review agent ends — with findings that cite
    severity, location, rule, and fix.
  category: cat-sql
  difficulty: intermediate
  tags: [tutorial, sql, checklist, review, capstone, intermediate]
  series: python-sql
  series_title: The Python & SQL Series
  lesson: 10
  learning_objectives:
    - Assemble the series' rules into one checklist you can run on any query
    - Turn each checklist line into a standing check with an owner
    - Emit findings with severity, location, rule, and fix
  what_you_need:
    - The series lessons 1-9 completed
    - Install: npx de-agent-platform add sql-review
    - Install: npx de-agent-platform add sql-query-plan-explainer
  steps:
    - text: "Line one, from lesson 1 — ask the first question: what is the grain of this result? If the author can't answer, stop."
      from_id: skill-sql-review
      from_field: body
    - text: Line two, from lesson 3 — every join states its cardinality (1:1, N:1, N:N) and justifies it.
      from_id: skill-sql-review
      from_field: body
    - text: Line three, from lessons 3 and 4 — prove a join cannot fan out before writing it.
      from_id: skill-sql-review
      from_field: learning_objectives
    - text: Line four, from lesson 8 — NOT IN where the subquery can return NULL is banned; use NOT EXISTS.
      from_id: skill-sql-review
      from_field: body
    - text: Line five, from lesson 8 — comparisons across types must be explicit casts, not implicit.
      from_id: skill-sql-review
      from_field: body
    - text: Line six, from lesson 5 — integrate SQLFluff into CI/CD pipelines so the structure rules hold without review time.
      from_id: rule-pack-sqlfluff-core
      from_field: learning_objectives
    - text: Line seven, from lesson 6 — for the slow query, decide between an index, a rewrite, or a stats refresh.
      from_id: skill-sql-query-plan
      from_field: learning_objectives
    - text: The standing output — a findings list (severity, location, rule, fix) and a grain statement for each SELECT.
      from_id: agent-sql-reviewer
      from_field: outputs
  check_yourself:
    - You can run the whole checklist on a query you have never seen and produce findings with severity, location, rule, and fix.
    - Each checklist line names the lesson and the rule that backs it.
    - The checklist is wired into CI — lint and review rules run without a human remembering them.
  when_to_use:
