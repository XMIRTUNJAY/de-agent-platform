- id: tutorial-sql-gotchas
  slug: sql-production-gotchas
  type: tutorial
  title: Production gotchas — NULL traps, implicit casts, silent drift
  description: >-
    The bugs that survive testing compare wrong instead of failing loud:
    NOT IN over a nullable subquery, a comparison across types left to an
    implicit cast, and a schema change that silently turns a column to NULLs.
    You walk the review rules that ban each pattern, then use the
    schema-drift runbook to tell a hard failure from a silent one and to
    decide between an explicit cast and a quarantine.
  category: cat-sql
  difficulty: intermediate
  tags: [tutorial, sql, nulls, casting, schema-drift, intermediate]
  series: python-sql
  series_title: The Python & SQL Series
  lesson: 8
  learning_objectives:
    - Spot NULL-unsafe `NOT IN` and `=` predicates and rewrite them with NOT EXISTS
    - Make every cross-type comparison an explicit cast, not an implicit one
    - Classify a schema drift failure as hard (job error) or silent (nulls)
  what_you_need:
    - Install: npx de-agent-platform add sql-review
    - A query with a cross-type comparison or a NOT IN to audit
    - The schema-drift runbook for the silent-null cases
  steps:
    - text: "`NOT IN (subquery)` is banned where the subquery can return NULL — use `NOT EXISTS`."
      from_id: skill-sql-review
      from_field: body
    - text: Spot NULL-unsafe `NOT IN` and `=` predicates.
      from_id: skill-sql-review
      from_field: learning_objectives
    - text: Comparisons across types must be explicit casts, not implicit.
      from_id: skill-sql-review
      from_field: body
    - text: A drift can be silent — determine whether the failure is hard (job error) or silent (nulls).
      from_id: runbook-schema-drift
      from_field: diagnosis
    - text: A type change gets cast explicitly, or reject and quarantine.
      from_id: runbook-schema-drift
      from_field: fix
    - text: Audit the quiet ones together — non-deterministic ordering is in the same review pass as the NULL and cast traps.
      from_id: skill-sql-review
      from_field: description
  check_yourself:
    - Every NOT IN in the query has a nullable-column story — or is rewritten as NOT EXISTS.
    - Every cross-type comparison shows an explicit CAST.
    - For the last schema change on the source, you can say whether it failed hard or silently.
  when_to_use:
    - "Before merging SQL with NOT IN, cross-type comparisons, or a changed source schema"
    - "A pipeline went quiet instead of failing — checking for silent nulls"
  why: NULL traps and implicit casts compare wrong without erroring — the only defense is a rule you apply before the query runs.
  gotchas:
    - "NOT IN with a nullable column never compares as you think; use NOT EXISTS."
    - "An implicit cast that works in dev can flip semantics when the source type changes."
    - "Silent nulls pass green pipelines — diff the source schema, not just the row counts."
  production_notes:
    - "Quarantine type-change rejections instead of letting the cast decide."
    - "Run the sql-review rules in CI so the NULL and cast traps are caught before merge."
  diagram: |
    production gotchas
       |
       |- NOT IN vs NULL --> never compares as expected --> NOT EXISTS
       |
       |- cross-type comparison --> explicit cast, not implicit
       |
       |- schema drift --> hard (job error) vs silent (nulls)
       |
       |- type change --> cast explicitly, or reject and quarantine
  code:
    - title: The two review rules this lesson enforces
      lang: text
      code: |
        2. NOT IN (subquery) is banned where the subquery can return NULL — use NOT EXISTS.
        3. Comparisons across types must be explicit casts, not implicit.
      source_id: skill-sql-review
    - title: What the schema-drift runbook does with a type change
      lang: text
      code: |
        Type change → cast explicitly, or reject and quarantine.
      source_id: runbook-schema-drift
