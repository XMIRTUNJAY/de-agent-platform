- id: tutorial-sql-incident-fanout
  slug: sql-incident-silent-fanout
  type: tutorial
  title: Incident — the numbers doubled and no alarm fired
  description: >-
    Row counts are inflated and metrics double-counted after a retry, a
    fan-out join or a backfill — the incident signature of a silent fan-out.
    You work the duplicate-records runbook end to end: count duplicates per
    key with one query, correlate the first duplicate date with a deploy,
    check whether the write is append or merge/overwrite, then dedupe on the
    business key and rewrite only the affected partitions.
  category: cat-sql
  difficulty: intermediate
  tags: [tutorial, sql, incident, fanout, dedupe, intermediate]
  series: python-sql
  series_title: The Python & SQL Series
  lesson: 9
  learning_objectives:
    - Recognize inflated row counts and double-counted metrics as the fan-out signature
    - Count duplicates per key and correlate the first duplicate date with a deploy
    - Rewrite affected partitions instead of the whole table
  what_you_need:
    - A table whose counts jumped and the pipeline that wrote it
    - Write access to rewrite the affected partitions
    - Install: npx de-agent-platform add sql-review
  steps:
    - text: Name the incident — row counts are inflated and metrics double-counted after a retry, a fan-out join or a backfill.
      from_id: runbook-duplicate-records
      from_field: description
    - text: Identify the duplicate key and count duplicates per key.
      from_id: runbook-duplicate-records
      from_field: diagnosis
    - text: "Run: SELECT k, count(*) c FROM t GROUP BY k HAVING count(*) > 1 ORDER BY c DESC LIMIT 20;"
      from_id: runbook-duplicate-records
      from_field: commands
    - text: Determine the earliest date duplicates appeared → correlate with a deploy.
      from_id: runbook-duplicate-records
      from_field: diagnosis
    - text: Check whether the write is append vs merge/overwrite.
      from_id: runbook-duplicate-records
      from_field: diagnosis
    - text: Deduplicate on the business key, keeping the latest by event time.
      from_id: runbook-duplicate-records
      from_field: fix
    - text: Rewrite the affected partitions (overwrite), not the whole table.
      from_id: runbook-duplicate-records
      from_field: fix
  check_yourself:
    - The GROUP BY duplicate count returns zero rows after the fix, on the affected partitions.
    - You can name the deploy that introduced the duplicates and the date it landed.
    - The rewrite touched only the partitions with duplicates — the rest of the table is untouched.
  when_to_use:
    - "Metrics double-counted and no alarm fired"
    - "Row counts jumped after a retry, a fan-out join, or a backfill"
  why: A silent fan-out ships wrong numbers with green dashboards — the runbook turns the blast into a dated, partitioned, deduped fix.
  gotchas:
    - "The earliest duplicate date, not the loudest metric, points at the causing deploy."
    - "Append vs merge/overwrite decides whether the fix is a dedupe or a re-run."
    - "Rewriting the whole table for one bad day widens the blast radius."
  production_notes:
    - "Alert on duplicates per key, not just on row-count deltas."
    - "Prevent the recurrence with the review rule: prove a join cannot fan out before writing it."
  diagram: |
    silent fan-out incident
       |
       |- signature --> counts inflated, metrics double-counted
       |
       |- GROUP BY HAVING --> duplicates per key
       |
       |- earliest duplicate date --> correlate with deploy
       |
       |- append vs merge/overwrite --> dedupe on business key
       |
       |- rewrite affected partitions --> verify duplicate count returns to zero
  code:
    - title: Count duplicates per key, and bound the damage window
      lang: sql
      code: |
        SELECT k, count(*) c FROM t GROUP BY k HAVING count(*) > 1 ORDER BY c DESC LIMIT 20;
        SELECT min(dt), max(dt) FROM (SELECT dt, k, count(*) FROM t GROUP BY dt, k HAVING count(*)>1);
      source_id: runbook-duplicate-records
  source_refs: [runbook-duplicate-records, skill-sql-review]
