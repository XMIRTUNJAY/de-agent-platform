- id: tutorial-sql-window-grain
  slug: sql-window-functions-grain
  type: tutorial
  title: Window functions — keep the grain, rank the rows
  description: >-
    A window function computes over a set of rows and hands the answer back
    to every row, so the result keeps its grain — the property that makes a
    keep-latest dedupe safe and a bare GROUP BY grain-changing. You find the
    duplicates first with one GROUP BY query, dedupe on the business key
    keeping the latest by event time, and learn when a window over the same
    key is a shuffle that can skew or spill.
  category: cat-sql
  difficulty: intermediate
  tags: [tutorial, sql, window-functions, grain, dedupe, intermediate]
  series: python-sql
  series_title: The Python & SQL Series
  lesson: 4
  learning_objectives:
    - Keep the result grain intact — a window computes over a set without collapsing rows
    - Find duplicate keys with one GROUP BY query before deduplicating
    - Deduplicate on the business key, keeping the latest by event time
  what_you_need:
    - A table with a business key and an event-time column
    - Install: npx de-agent-platform add sql-review
    - The local DuckDB from lesson 2 works for all the practice queries
  steps:
    - text: Review the failure modes first — the sql-review skill exists to catch functions that silently change grain, alongside fan-out joins, NULL-unsafe predicates, implicit casts, and non-deterministic ordering.
      from_id: skill-sql-review
      from_field: description
    - text: State the grain of a result set in one sentence — a window keeps the row grain while computing over its partition, a GROUP BY changes it.
      from_id: skill-sql-review
      from_field: learning_objectives
    - text: Find the duplicate key first — identify the duplicate key and count duplicates per key.
      from_id: runbook-duplicate-records
      from_field: diagnosis
    - text: "Count duplicates per key with one query: SELECT k, count(*) c FROM t GROUP BY k HAVING count(*) > 1 ORDER BY c DESC LIMIT 20;"
      from_id: runbook-duplicate-records
      from_field: commands
    - text: Deduplicate on the business key, keeping the latest by event time.
      from_id: runbook-duplicate-records
      from_field: fix
    - text: Treat the group-by (and any window over the same key) as a shuffle — key skew on a join or group-by key is the first cause to check.
      from_id: tutorial-spark-aggregations-windows
      from_field: steps
    - text: Spill to disk from an oversized partition — a window partition that gets too big is a known shuffle failure.
      from_id: runbook-spark-job-slow
      from_field: possible_causes
  check_yourself:
    - The deduped table has one row per business key, and the GROUP BY duplicate count proves it.
    - You can say in one sentence what the window preserved that a GROUP BY would have collapsed.
    - The window's PARTITION BY key is the same key you checked for skew.
  when_to_use:
    - "Row counts are inflated and the fix must keep one row per key"
    - "A ranking or latest-per-key read has to stay at the row grain"
  why: Windows are the tool that computes over a set without changing the grain — which is why dedupe and rankings go through them.
  gotchas:
    - "A window keeps the grain, a GROUP BY changes it — pick by the grain you owe the consumer."
    - "Dedupe on the business key, keeping the latest by event time — not by insertion order."
    - "A window over a skewed key is a shuffle with a hot partition — it can spill to disk."
  production_notes:
    - "Keep the GROUP BY duplicate-count query next to the dedupe job as its check."
    - "Check the write mode before dedupe — append vs merge/overwrite decides what the rewrite touches."
  diagram: |
    window functions and grain
       |
       |- GROUP BY --> new grain (one row per key)
       |
       |- window --> same grain, value computed over the partition
       |
       |- dedupe --> business key --> keep latest by event time
       |
       |- at scale --> window = shuffle --> skew / spill to disk
  code:
    - title: Find the duplicate keys the window dedupe will remove
      lang: sql
      code: |
        SELECT k, count(*) c FROM t GROUP BY k HAVING count(*) > 1 ORDER BY c DESC LIMIT 20;
        SELECT min(dt), max(dt) FROM (SELECT dt, k, count(*) FROM t GROUP BY dt, k HAVING count(*)>1);
      source_id: runbook-duplicate-records
  source_refs: [skill-sql-review, runbook-duplicate-records, tutorial-spark-aggregations-windows, runbook-spark-job-slow]
