- id: tutorial-sql-first-select
  slug: sql-first-correct-select
  type: tutorial
  title: First hands-on — a correct SELECT with a justified join
  description: >-
    Stand up a local DuckDB through the DuckDB MCP server, inspect before you
    query with list_tables and describe_table, and write one SELECT with a
    join whose cardinality you can justify. You read CSV and Parquet straight
    into the engine, state the grain of the result, and finish by proving the
    join cannot fan out — the habit the sql-review skill demands.
  category: cat-sql
  difficulty: beginner
  tags: [tutorial, sql, duckdb, joins, hands-on, beginner]
  series: python-sql
  series_title: The Python & SQL Series
  lesson: 2
  learning_objectives:
    - Inspect a database with list_tables and describe_table before writing SQL
    - Write a SELECT with a join whose cardinality is stated and justified
    - Prove a join cannot fan out before writing it
  what_you_need:
    - DuckDB via the MCP server — uvx mcp-server-motherduck --db-path /data/warehouse.duckdb
    - A CSV or Parquet file to load
    - Install: npx de-agent-platform add sql-review
  steps:
    - text: Run DuckDB locally through the DuckDB MCP server, which queries DuckDB databases and MotherDuck, including reading Parquet/CSV directly from object storage.
      from_id: mcp-duckdb
      from_field: description
    - text: Inspect before you query — list_tables and describe_table, then query, are the three tools the server exposes.
      from_id: mcp-duckdb
      from_field: tools
    - text: The DuckDB documentation covers the embedded analytics SQL engine, Parquet and CSV readers, and in-process query execution.
      from_id: ref-duckdb-docs
      from_field: description
    - text: Every join states its cardinality (1:1, N:1, N:N) and justifies it.
      from_id: skill-sql-review
      from_field: body
    - text: Prove a join cannot fan out before writing it.
      from_id: skill-sql-review
      from_field: learning_objectives
    - text: Close by writing a grain statement for each SELECT — the artifact the SQL Reviewer emits for every result set.
      from_id: agent-sql-reviewer
      from_field: outputs
  check_yourself:
    - describe_table names every column and key you used in the join, and you can say which side is the many side.
    - Your join's cardinality is written down (1:1, N:1, N:N) with a one-line justification.
    - Counting rows before and after the join shows no inflation — the join cannot fan out.
  when_to_use:
    - "First query against a new local dataset"
    - "Teaching a new analyst the inspect-then-query habit"
  why: The inspect-then-query habit plus a justified join is the smallest complete unit of correct SQL.
  gotchas:
    - "SELECT * hides which columns the join keys came from — name them."
    - "Parquet and CSV readers mean no import step — point the query at the file."
    - "A join that cannot fan out on today's data can fan out tomorrow — state the cardinality, not the current counts."
  production_notes:
    - "Keep the MCP server pointed at a local file (mcp-server-motherduck --db-path) so experiments never touch shared data."
    - "Read the DuckDB documentation's Parquet and SQL pages — they cover what the review skill checks."
  diagram: |
    first correct SELECT
       |
       |- start mcp-server-motherduck --> local DuckDB
       |
       |- list_tables --> describe_table --> keys and columns
       |
       |- SELECT with join --> cardinality stated (1:1, N:1, N:N)
       |
       |- row count before/after --> no inflation --> grain statement
  code:
    - title: Start the DuckDB MCP server on a local database
      lang: bash
      code: |
        uvx mcp-server-motherduck --db-path /data/warehouse.duckdb
      source_id: mcp-duckdb
    - title: Register the server with your agent
      lang: yaml
      code: |
        mcpServers:
          duckdb:
            command: uvx
            args:
              - mcp-server-motherduck
              - --db-path
              - /data/warehouse.duckdb
      source_id: mcp-duckdb
