- id: tutorial-review-schema-change-against-contract
  slug: review-schema-change-against-contract
  type: tutorial
  title: Review a schema change against its contract
  description: >-
    Run the Schema Reviewer's four-step pass over a producer's schema diff —
    classify each field change, resolve consumers from lineage, emit a dated
    migration plan — and use the schema-drift runbook to separate hard failures
    from silent nulls before anything merges.
  category: cat-data-contracts
  difficulty: intermediate
  tags: [tutorial, schema, contracts, review, migration]
  series: data-quality
  series_title: The Data Quality Series
  lesson: 6
  learning_objectives:
    - Classify each schema change as compatible, risky, or breaking
    - Resolve the consumer impact set from lineage
    - Emit a migration plan with dates for any breaking change
  what_you_need:
    - Before/after schema for the change
    - A consumer list or lineage
    - Install: npx de-agent-platform add schema-change-contract-review
  steps:
    - text: Diff the schemas field by field.
      from_id: agent-schema-reviewer
      from_field: workflow
    - text: "Classify each change: compatible, risky, breaking."
      from_id: agent-schema-reviewer
      from_field: workflow
    - text: Determine whether the failure is hard (job error) or silent (nulls).
      from_id: runbook-schema-drift
      from_field: diagnosis
    - text: Resolve consumers from lineage.
      from_id: agent-schema-reviewer
      from_field: workflow
    - text: Emit a migration plan with dates.
      from_id: agent-schema-reviewer
      from_field: workflow
    - text: Rename/removal is breaking; coordinate with consumers.
      from_id: runbook-schema-drift
      from_field: fix
  check_yourself:
    - A diff narrowing decimal(18,2) to decimal(10,2) is classified risky and blocked as data-loss risky.
    - On a labelled set of 20 schema changes, every classification matches its label.
  when_to_use:
    - "A producer PR touches a column a contract covers"
    - "A column appeared, disappeared or changed type upstream without notice"
  why: A schema change shipped unreviewed is a loaded gun in the pipeline — hard casts break loudly, silent nulls break worse.
  gotchas:
    - "Assume breaking when semantics are ambiguous."
    - "Renames are removals in disguise; treat them as breaking."
    - "A rename + a new column with the old name looks compatible to a schema differ — always diff semantics, not just names."
  production_notes:
    - "Never approve a breaking change without a dated plan."
    - "Enforce a schema contract with a compatibility policy in CI."
  diagram: |
    schema change review
       |
       |- field-by-field diff --> classify compatible / risky / breaking
       |
       |- hard failure or silent nulls? --> silent nulls keep the job green
       |
       |- consumers from lineage --> migration plan with dates --> approve or block
  code:
    - title: Diff the old and new schema
      lang: bash
      code: |
        diff <(parquet-tools schema old.parquet) <(parquet-tools schema new.parquet)
        # Glue/Athena: compare catalog columns to the Parquet footer
      source_id: runbook-schema-drift
    - title: Classification — compatible / risky / breaking
      lang: text
      code: |
        - **Compatible** — new nullable column, widened type that preserves values.
        - **Risky** — narrowing a type, adding a NOT NULL without a default, changing units.
        - **Breaking** — rename, remove, or semantic change to an existing column.
      source_id: skill-schema-change-contract-review
    - title: Dated migration skeleton
      lang: text
      code: |
        Add → dual-write → backfill → announce → migrate consumers → remove (dated).
      source_id: skill-schema-change-contract-review
  source_refs: [agent-schema-reviewer, runbook-schema-drift, skill-schema-change-contract-review]
  version: 0.1.0
