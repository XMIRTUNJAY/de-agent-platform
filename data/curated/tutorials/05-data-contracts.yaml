- id: tutorial-respond-broken-contract
  slug: respond-broken-contract
  type: tutorial
  title: Respond when a data contract breaks
  description: >-
    Work the broken-contract runbook end to end: identify which clause broke,
    bound the consumer impact set from lineage before anything else, decide
    whether the producer reverts or the consumer adapts, and close with
    consumer-driven contract tests in the producer's pipeline.
  category: cat-data-contracts
  difficulty: intermediate
  tags: [tutorial, contracts, incident, lineage, sla]
  series: data-quality
  series_title: The Data Quality Series
  lesson: 8
  learning_objectives:
    - Classify a breach by clause — schema, semantics, or SLA
    - Bound the consumer impact set from lineage before assigning the fix
    - Choose between a producer revert and a consumer adaptation
  what_you_need:
    - The failing consumer's error and the producer's recent deploys
    - Lineage for the broken asset
    - The contract document with its SLA and breaking-change policy
  steps:
    - text: Identify which contract clause broke — schema, semantics, or SLA.
      from_id: runbook-data-contract-broken
      from_field: diagnosis
    - text: Establish the impact set from lineage before anything else.
      from_id: runbook-data-contract-broken
      from_field: diagnosis
    - text: Determine if the fix is on the producer (revert) or consumer (adapt).
      from_id: runbook-data-contract-broken
      from_field: diagnosis
    - text: "Schema breach → producer reverts or adds a compatibility shim."
      from_id: runbook-data-contract-broken
      from_field: fix
    - text: "SLA breach → negotiate a temporary relaxation and a root-cause fix."
      from_id: runbook-data-contract-broken
      from_field: fix
    - text: Add consumer-driven contract tests in the producer's pipeline.
      from_id: runbook-data-contract-broken
      from_field: prevention
  check_yourself:
    - The impact-set query returns every downstream consumer of the broken asset before anyone assigns the fix.
    - A consumer that broke right after a producer deploy traces to a rename that changed semantics, and is treated as a breach.
  when_to_use:
    - "A consumer broke right after a producer deploy"
    - "A promised column or semantic changed, or an SLA was breached"
  why: A broken contract is a negotiation as much as a bug — bound the blast radius from lineage before deciding who reverts and who adapts.
  gotchas:
    - "A rename that changed semantics is still a breach, even when it looks safe."
    - "SLA misses can come from unrelated outages — root-cause before pointing at the producer."
    - "Whatever the fix, the consumer impact set comes first, from lineage."
  production_notes:
    - "Contracts get CI enforcement and a dated deprecation path."
    - "Run consumer-driven contract tests in the producer's pipeline."
  diagram: |
    contract broken
       |
       |- which clause broke? --> schema / semantics / SLA
       |
       |- impact set from lineage --> consumers listed first
       |
       |- schema breach --> producer reverts or adds a compatibility shim
       |
       |- SLA breach --> temporary relaxation --> root-cause fix
  code:
    - title: Bound the consumer impact set from lineage
      lang: sql
      code: |
        # impact set from lineage
        SELECT * FROM lineage WHERE upstream = 'prod.orders' AND direction = 'downstream';
      source_id: runbook-data-contract-broken
    - title: Classify the breach by clause
      lang: text
      code: |
        - Identify which contract clause broke (schema, semantics, or SLA).
        - Establish the impact set from lineage before anything else.
        - Determine if the fix is on the producer (revert) or consumer (adapt).
      source_id: runbook-data-contract-broken
    - title: Who fixes it — producer reverts, consumer adapts
      lang: text
      code: |
        - Schema breach → producer reverts or adds a compatibility shim.
        - SLA breach → negotiate a temporary relaxation and a root-cause fix.
      source_id: runbook-data-contract-broken
  source_refs: [runbook-data-contract-broken]
