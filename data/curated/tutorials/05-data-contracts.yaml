- id: tutorial-gate-contracts-in-ci
  slug: gate-contracts-in-ci
  type: tutorial
  title: Enforce contracts in CI with the schema change check
  description: >-
    Install the Schema Change Check as a pre-commit gate over staged schema
    files so a breaking change exits non-zero unless a migration plan or
    deprecation annotation rides along with it — the producer-CI placement that
    catches breakage before merge.
  category: cat-data-contracts
  difficulty: beginner
  tags: [tutorial, contracts, ci, hook, guardrail, beginner]
  series: data-quality
  series_title: The Data Quality Series
  lesson: 4
  learning_objectives:
    - Configure a pre-commit check over staged schema files
    - State what lets a breaking change pass — MIGRATION.md or a deprecated_at annotation
    - Explain why the gate belongs in the producer's CI, not the consumer's runtime
  what_you_need:
    - A repo carrying schema files (*.avsc, *.sql DDL, dbt schema.yml)
    - A pre-commit hook setup in the producer repo
    - The consumer list for the covered datasets
  steps:
    - text: "Run the check on staged schema files: *.avsc, *.sql DDL, dbt schema.yml."
      from_id: hook-schema-change-check
      from_field: implementation
    - text: Diff the staged files against HEAD and classify the change.
      from_id: hook-schema-change-check
      from_field: implementation
    - text: Exit non-zero on a breaking change — failure_behavior is block.
      from_id: hook-schema-change-check
      from_field: failure_behavior
    - text: Allow the commit only when a MIGRATION.md or a `deprecated_at` annotation is present.
      from_id: hook-schema-change-check
      from_field: implementation
    - text: Keep the gate in the producer's CI, where the change is made — the cheapest place to catch it is before merge.
      from_id: pattern-contracts-quality-gate
      from_field: solution
    - text: "Verify with the documented case: a commit narrowing `amount` from decimal(18,2) to decimal(10,2) is blocked with an explanation and a suggested migration."
      from_id: hook-schema-change-check
      from_field: example
  check_yourself:
    - A commit narrowing `amount` from decimal(18,2) to decimal(10,2) is blocked with an explanation and a suggested migration.
    - The same commit passes once MIGRATION.md or a `deprecated_at` annotation is present.
  when_to_use:
    - "Shared assets across teams"
    - "Regulated or SLA-bearing data"
  why: A pre-commit gate blocks breaking schema changes at the producer, where catching them is cheapest.
  gotchas:
    - "The check only sees staged schema files (*.avsc, *.sql DDL, dbt schema.yml) — schema changes elsewhere never reach it."
    - "Producers carry process overhead; the gate needs buy-in, or it gets bypassed."
    - "A rename + a new column with the old name looks compatible to a schema differ — always diff semantics, not just names."
  production_notes:
    - "Wire it as a pre-commit trigger so classification happens before the change leaves the branch."
    - "Additive changes pass; breaking changes require a dated deprecation plan."
  diagram: |
    producer commit
       |
       |- staged schema files --> diff vs HEAD --> classify
       |
       |- compatible --> pass
       |
       |- breaking --> MIGRATION.md or deprecated_at? --> yes --> pass
                                                     --> no --> block (exit non-zero)
  code:
    - title: Pre-commit gate over staged schema files
      lang: text
      code: |
        Runs on staged schema files (*.avsc, *.sql DDL, dbt schema.yml).
        Diffs against HEAD, classifies the change, and exits non-zero on a breaking
        change unless a MIGRATION.md or a `deprecated_at` annotation is present.
      source_id: hook-schema-change-check
    - title: Documented case — decimal narrowing blocked
      lang: text
      code: |
        A commit narrowing `amount` from decimal(18,2) to decimal(10,2) is blocked
        with an explanation and a suggested migration.
      source_id: hook-schema-change-check
    - title: Gate placement — producer CI, before merge
      lang: text
      code: |
        producer change ─▶ [contract CI] ─┬─ compatible ─▶ deploy
                                          └─ breaking ─▶ blocked + plan required
      source_id: pattern-contracts-quality-gate
  source_refs: [hook-schema-change-check, pattern-contracts-quality-gate, skill-schema-change-contract-review]
