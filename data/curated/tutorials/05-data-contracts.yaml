# Tutorials — beginner-friendly arrangements of artifact content.
# Every step is verbatim from the cited source field. Structure (need, steps,
# check) is ours; wording is the source's.
- id: tutorial-author-first-data-contract
  slug: author-first-data-contract
  type: tutorial
  title: Author your first data contract
  description: >-
    Draft an enforceable contract for one real dataset by walking the six parts
    — owner, schema, semantics, SLA, breaking-change policy, enforcement —
    starting from the data-contract template, and finish with the CI test that
    makes it a contract instead of documentation.
  category: cat-data-contracts
  difficulty: beginner
  tags: [tutorial, data-contract, governance, sla, beginner]
  series: data-quality
  series_title: The Data Quality Series
  lesson: 3
  learning_objectives:
    - Write all six parts of a contract for a real dataset
    - Specify freshness and completeness numbers in the SLA
    - Name the CI test that fails when the contract is violated
  what_you_need:
    - A producer dataset with at least one consumer
    - Install: amp template new de-agent/data-contract-template ./contracts
    - Install: npx de-agent-platform add data-contract-author
  steps:
    - text: Name an owner — a team, with an on-call.
      from_id: skill-data-contract-author
      from_field: body
    - text: Define the schema, typed and versioned.
      from_id: skill-data-contract-author
      from_field: body
    - text: "Write the semantics: what each field means, units, nullability."
      from_id: skill-data-contract-author
      from_field: body
    - text: Set the SLA — freshness and completeness.
      from_id: skill-data-contract-author
      from_field: body
    - text: Agree the breaking-change policy — notice period and a deprecation path.
      from_id: skill-data-contract-author
      from_field: body
    - text: "Wire enforcement: name the CI test that fails on violation."
      from_id: skill-data-contract-author
      from_field: body
  check_yourself:
    - The contract names a team with an on-call as owner, not a distribution list.
    - Renaming a promised field in a test branch fails the CI test named in part six.
  when_to_use:
    - "A producer and its consumers keep arguing about what a column means"
    - "A dataset feeds multiple teams and needs a freshness or completeness SLA"
  why: A contract with no enforcement is documentation, and documentation is not a contract — the sixth part is what makes the other five binding.
  gotchas:
    - "A contract with no enforcement is documentation. Documentation is not a contract."
    - "The owner is a team with an on-call — a contract owned by nobody has no pager."
    - "A rename + a new column with the old name looks compatible to a schema differ but breaks every consumer that read the old semantics — write the semantics section so the diff catches it."
  production_notes:
    - "Enforcement is part six — the contract must name the CI test that fails on violation."
    - "Keep contract.yaml, schema.avsc, ci/check-compat.sh and DEPRECATION.md together; the template ships all four."
  diagram: |
    contract authoring
       |
       |- owner + schema --> semantics (units, nullability)
       |
       |- SLA (freshness, completeness) --> breaking-change policy
       |
       |- enforcement --> CI test fails on violation --> contract, not documentation
  code:
    - title: Scaffold the contract repo
      lang: bash
      code: |
        amp template new de-agent/data-contract-template ./contracts
      source_id: tpl-data-contract
    - title: The six parts of a contract
      lang: text
      code: |
        1. Owner (a team, with an on-call).
        2. Schema (typed, versioned).
        3. Semantics (what each field *means*, units, nullability).
        4. SLA (freshness, completeness).
        5. Breaking-change policy (notice period, deprecation path).
        6. Enforcement (which CI test fails on violation).
      source_id: skill-data-contract-author
    - title: Template layout — contract, schema, CI gate, deprecation path
      lang: text
      code: |
        data-contract-template/
          contract.yaml        # owner, sla, semantics, policy
          schema.avsc          # typed schema
          ci/check-compat.sh   # compatibility gate
          DEPRECATION.md       # dated deprecation path
      source_id: tpl-data-contract
  source_refs: [skill-data-contract-author, tpl-data-contract, skill-schema-change-contract-review]
  version: 0.1.0
  license: CC-BY-4.0
  author: de-agent
  publisher: DE//AGENT Registry
