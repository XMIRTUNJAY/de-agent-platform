- id: tutorial-sql-sqlfluff-rules
  slug: sql-sqlfluff-core-rules
  type: tutorial
  title: Fix SQL lint with the SQLFluff core rule pack
  description: >-
    Install the SQLFluff core rule pack, point it at your warehouse dialect,
    and lint a fixture that fails on purpose: indentation, keyword
    capitalisation, SELECT star, and unused CTEs. You fix each finding while
    the passing fixture stays green, then wire the same lint run into CI.
  category: cat-sql
  difficulty: beginner
  tags: [tutorial, sql, sqlfluff, linting, ci, beginner]
  series: python-sql
  series_title: The Python & SQL Series
  lesson: 5
  learning_objectives:
    - Configure SQLFluff for your warehouse dialect
    - Fix L003, L010, L030, and L057 findings in real SQL
    - Integrate SQLFluff into CI/CD pipelines
  what_you_need:
    - Python >= 3.8 with pip
    - pip install sqlfluff==3.0.0 sqlfluff-templater-dbt
    - A .sql file or dbt project to lint
  steps:
    - text: Configure SQLFluff for your warehouse dialect.
      from_id: rule-pack-sqlfluff-core
      from_field: learning_objectives
    - text: L003 — Consistent indentation.
      from_id: rule-pack-sqlfluff-core
      from_field: rules
    - text: L010 — Keywords capitalisation policy (UPPER).
      from_id: rule-pack-sqlfluff-core
      from_field: rules
    - text: L030 — SELECT star usage.
      from_id: rule-pack-sqlfluff-core
      from_field: rules
    - text: L057 — Unused CTE detection.
      from_id: rule-pack-sqlfluff-core
      from_field: rules
    - text: Integrate SQLFluff into CI/CD pipelines.
      from_id: rule-pack-sqlfluff-core
      from_field: learning_objectives
  check_yourself:
    - sqlfluff lint flags the seeded violations in the failing fixture and returns nothing on the passing one.
    - CI fails on style-severity findings and stays green on the passing fixture.
  when_to_use:
    - "Team SQL style drifts and review time burns on formatting"
    - "Legacy SQL debt needs fixing incrementally instead of one big reformat"
  why: Mechanical lint rules settle formatting and naming so review time goes to correctness.
  gotchas:
    - "The pack defaults to the dbt templater and the snowflake dialect — set both to your project or findings mislead."
    - "L014 and L030 are warnings, not style errors — severity decides what blocks CI."
    - "Fix legacy SQL debt incrementally; a whole-repo reformat buries the real diff."
  production_notes:
    - "Pin sqlfluff==3.0.0 with sqlfluff-templater-dbt so CI and local runs agree."
    - "Exclude rules deliberately via exclude_rules rather than ignoring findings inline."
  diagram: |
    sqlfluff pass
       |
       |- install sqlfluff==3.0.0 + dbt templater
       |
       |- set dialect + templater --> lint fixture
       |
       |- L003 --> L010 --> L030 --> L057 --> fix each finding
       |
       |- lint in CI --> passing fixture stays green
  code:
    - title: Install SQLFluff 3.0.0 with the dbt templater
      lang: bash
      code: |
        pip install sqlfluff==3.0.0 sqlfluff-templater-dbt
        sqlfluff --version
      source_id: rule-pack-sqlfluff-core
    - title: Set dialect and templater for your project (.sqlfluff)
      lang: text
      code: |
        [sqlfluff]
        dialect = snowflake   # pack default - set to your warehouse dialect
        templater = dbt       # pack default - or jinja for plain SQL
      source_id: rule-pack-sqlfluff-core
    - title: Lint the failing fixture and keep the passing one green
      lang: bash
      code: |
        sqlfluff lint tests/fixtures/style_fail.sql   # flags the seeded violations
        sqlfluff lint tests/fixtures/style_pass.sql   # returns nothing
      source_id: rule-pack-sqlfluff-core
