- id: tutorial-sql-review-pass
  slug: sql-review-full-pass
  type: tutorial
  title: Run the full SQL review pass on a PR
  description: >-
    Run the SQL Reviewer agent's full pass over a pull request: read the diff
    in context, state the grain of every result set, then check the
    correctness bugs the SQL Review skill targets — fan-out joins, NULL-unsafe
    NOT IN and = predicates — and emit findings with file:line and a
    rewritten clause you can verify against the evaluation fixture.
  category: cat-sql
  difficulty: beginner
  tags: [tutorial, sql, review, correctness, beginner]
  series: python-sql
  series_title: The Python & SQL Series
  lesson: 7
  learning_objectives:
    - State the grain of every result set in one sentence
    - Apply the review rules in order and stop at the first violation
    - Emit findings with severity, location, rule, and a rewritten clause
  what_you_need:
    - A pull request or a .sql file
    - The target dialect (postgres/duckdb/snowflake)
    - Install: npx de-agent-platform add sql-review
  steps:
    - text: Read the diff and the file context.
      from_id: agent-sql-reviewer
      from_field: workflow
    - text: Establish the grain of every result set.
      from_id: agent-sql-reviewer
      from_field: workflow
    - text: State the grain of a result set in one sentence.
      from_id: skill-sql-review
      from_field: learning_objectives
    - text: Prove a join cannot fan out before writing it.
      from_id: skill-sql-review
      from_field: learning_objectives
    - text: Spot NULL-unsafe `NOT IN` and `=` predicates.
      from_id: skill-sql-review
      from_field: learning_objectives
    - text: Emit findings with file:line and a rewritten clause.
      from_id: agent-sql-reviewer
      from_field: workflow
  check_yourself:
    - On the 12-case fixture of known-bad SQL, findings cite severity, location, rule, and a fix — with 0 false positives.
    - Every SELECT in the PR has a one-sentence grain statement before you judge the query.
  when_to_use:
    - "A SQL PR needs a full correctness pass, not a single-issue check"
    - "Findings must cite the rule, the failure case, and a rewritten clause"
  why: A fixed rule order plus a findings format turns ad-hoc SQL review into a pass anyone can repeat.
  gotchas:
    - "NOT IN with a nullable column never compares as you think; use NOT EXISTS."
    - "`ORDER BY` without `LIMIT` in a view is meaningless — drop it."
    - "`SELECT *` in a persisted model freezes an unstable schema."
  production_notes:
    - "Keep the 12-case evaluation fixture in CI so regressions resurface."
    - "Emit findings with the exact predicate, the failure case, and a rewritten clause reviewers can verify."
  diagram: |
    full review pass
       |
       |- read diff + context --> grain statement per result set
       |
       |- grain stated --> fan-out-proof joins --> NULL-unsafe predicates
       |
       |- emit findings --> file:line + rewritten clause --> verify on fixture
  code:
    - title: Install the SQL review skill
      lang: bash
      code: |
        npx de-agent-platform add sql-review
      source_id: skill-sql-review
    - title: The review rules, applied in order
      lang: text
      code: |
        1. Every join states its cardinality (1:1, N:1, N:N) and justifies it.
        2. NOT IN (subquery) is banned where the subquery can return NULL - use NOT EXISTS.
        3. Comparisons across types must be explicit casts, not implicit.
        4. ORDER BY without LIMIT in a view is meaningless - drop it.
        5. SELECT * in a persisted model freezes an unstable schema.
      source_id: skill-sql-review
    - title: What the pass emits
      lang: text
      code: |
        Findings list (severity, location, rule, fix)
        Grain statement for each SELECT
      source_id: agent-sql-reviewer
