# Tutorials — SQL: reading an EXPLAIN plan, applying the SQLFluff core rule
# pack, and running the full SQL review pass on a PR.
# Every step is verbatim (or lightly compressed) from the cited source field.
# Structure (need, steps, check) is ours; wording is the source's.
- id: tutorial-sql-query-plan
  slug: sql-query-plan-read
  type: tutorial
  title: Read an EXPLAIN plan and pick the one fix
  description: >-
    Take the EXPLAIN output of a slow query and read it bottom-up, naming the
    expensive node before you touch anything. You compare estimated rows to
    actual rows to catch stale statistics, separate scan cost from compute
    time with the warehouse runbook, and finish by deciding between an index,
    a rewrite, or a stats refresh — one change, with a way to measure it.
  category: cat-sql
  difficulty: intermediate
  tags: [tutorial, sql, explain, query-plan, performance, intermediate]
  series: python-sql
  series_title: The Python & SQL Series
  lesson: 6
  learning_objectives:
    - Read a plan bottom-up and name the expensive node
    - Detect cardinality misestimation from stale statistics
    - Separate scan cost from compute time before choosing a fix
  what_you_need:
    - EXPLAIN or EXPLAIN ANALYZE output for a slow query
    - The target dialect (postgres/duckdb)
    - Install: npx de-agent-platform add sql-query-plan-explainer
  steps:
    - text: Read a plan bottom-up and name the expensive node.
      from_id: skill-sql-query-plan
      from_field: learning_objectives
    - text: Detect cardinality misestimation from stale statistics.
      from_id: skill-sql-query-plan
      from_field: learning_objectives
    - text: Separate scan cost from compute time (bytes/partitions scanned vs queue time).
      from_id: runbook-warehouse-query-slow
      from_field: diagnosis
    - text: Compare the plan against the clustering/partition key.
      from_id: runbook-warehouse-query-slow
      from_field: diagnosis
    - text: Over-scan → fix the predicate or add/adjust the clustering key.
      from_id: runbook-warehouse-query-slow
      from_field: fix
    - text: Decide between an index, a rewrite, or a stats refresh.
      from_id: skill-sql-query-plan
      from_field: learning_objectives
  check_yourself:
    - You can point to the single most expensive node and quote its estimated vs actual rows.
    - The one recommended change states its expected effect and a way to measure it.
  when_to_use:
    - "A query that used to take seconds now takes minutes"
    - "Estimated rows and actual rows disagree by an order of magnitude"
  why: Reading the plan bottom-up turns an unreadable dump into one expensive node and one change worth making.
  gotchas:
    - ">10x off between estimated and actual rows means stale stats — refresh them before buying an index."
    - "Bytes scanned and queue time are different diseases — sizing up a scan-bound query buys nothing."
    - "Clustering on a low-selectivity key stops pruning entirely."
  production_notes:
    - "Alert on the partitions_scanned/partitions_total ratio."
    - "Review weekly query history for the top-cost queries."
  diagram: |
    query plan read
       |
       |- read bottom-up --> name the expensive node
       |
       |- rows vs actual rows --> >10x off --> stale stats --> refresh
       |
       |- scan cost vs compute --> over-scan --> fix predicate / recluster
       |
       |- one change --> index, rewrite, or stats refresh --> measure
  code:
    - title: Read the plan bottom-up, then one recommended change
      lang: text
      code: |
        Method
        1. Read bottom-up; the deepest node is the first data touched.
        2. Compare rows (estimate) to actual rows. >10x off means stale stats.
        3. Look for Seq Scan on a large table that should use an index.
        4. Look for Sort / Hash spilling to disk (disk usage in the plan).

        Output: one sentence per expensive node, then exactly one recommended
        change with the expected effect and a way to measure it.
      source_id: skill-sql-query-plan
    - title: Partitions scanned vs total in query history (Snowflake)
      lang: sql
      code: |
        SELECT query_id, partitions_scanned, partitions_total, bytes_scanned
        FROM table(information_schema.query_history_by_session())
        ORDER BY start_time DESC LIMIT 10;
      source_id: runbook-warehouse-query-slow
    - title: Pick the fix - over-scan vs queue time
      lang: text
      code: |
        Over-scan → fix the predicate or add/adjust the clustering key.
        Compute-bound with high queue time → add clusters, not size.
        Rebuild clustering on a low-selectivity key.
      source_id: runbook-warehouse-query-slow
  source_refs: [skill-sql-query-plan, runbook-warehouse-query-slow]
