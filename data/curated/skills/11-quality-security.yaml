- id: skill-schema-change-contract-review
  slug: schema-change-contract-review
  type: skill
  title: Schema Change Contract Review
  tagline: Classify a schema change as safe, risky, or breaking — before it ships.
  description: >-
    Diffs an old and new schema, classifies the change (compatible / risky /
    breaking) against consumers, and produces the migration and comms plan.
  category: cat-data-contracts
  subcategory: Governance
  difficulty: intermediate
  tags: [schema, contracts, compatibility, migration]
  technologies: [tech-avro, tech-dbt]
  learning_objectives:
