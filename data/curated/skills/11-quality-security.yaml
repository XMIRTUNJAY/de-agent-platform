    - Detect a breaking change hidden behind a "safe" rename
    - Write a deprecation plan with dates
  prerequisites: [skill-sql-review]
  supported_agents: [claude-code, codex, cursor, amp, gemini-cli]
  version: 0.2.0
  license: Apache-2.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/skills/schema-change-contract-review
  github_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/skills
  install_command: "npx de-agent-platform add schema-change-contract-review"
  verification: community
  last_verified: 2026-09-26
  files: [SKILL.md, references/compatibility-rules.md, examples/diff.md]
  security: { runs_code: false, network_access: false, credentials: false, filesystem_access: true, external_apis: false }
  compatibility: [claude-code, codex, cursor, amp, gemini-cli]
  relationships:
    related_to: [runbook-data-contract-broken, cat-data-contracts, hook-schema-change-check]
  body: |
    # Schema Change Contract Review

    ## Classification
    - **Compatible** — new nullable column, widened type that preserves values.
    - **Risky** — narrowing a type, adding a NOT NULL without a default, changing units.
    - **Breaking** — rename, remove, or semantic change to an existing column.

    ## The hidden breaking change
    A rename + a new column with the old name looks compatible to a schema differ
    but breaks every consumer that read the old semantics. Always diff *semantics*,
    not just names.

    ## Migration skeleton
    Add → dual-write → backfill → announce → migrate consumers → remove (dated).
- id: skill-data-contract-author
