  github_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/skills
  install_command: "npx de-agent-platform add data-contract-author"
  verification: community
  last_verified: 2026-09-13
  files: [SKILL.md, references/contract-template.md, examples/contract.yaml]
  security: { runs_code: false, network_access: false, credentials: false, filesystem_access: true, external_apis: false }
  compatibility: [claude-code, codex, cursor, amp, gemini-cli]
  relationships:
    related_to: [pattern-contracts-quality-gate, cat-data-contracts]
  body: |
    # Data Contract Author

    ## A contract has six parts
    1. Owner (a team, with an on-call).
    2. Schema (typed, versioned).
    3. Semantics (what each field *means*, units, nullability).
    4. SLA (freshness, completeness).
    5. Breaking-change policy (notice period, deprecation path).
    6. Enforcement (which CI test fails on violation).

    ## Rule
    A contract with no enforcement is documentation. Documentation is not a contract.
