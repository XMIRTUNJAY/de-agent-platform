  supported_agents: [claude-code, codex, cursor, amp, gemini-cli]
  version: 0.2.1
  license: Apache-2.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/skills/sql-query-plan-explainer
  install_command: "npx de-agent-platform add sql-query-plan-explainer"
  verification: community
  last_verified: 2026-09-22
  files: [SKILL.md, references/plan-nodes.md, examples/explain.txt]
  security: { runs_code: false, network_access: false, credentials: false, filesystem_access: true, external_apis: false }
  compatibility: [claude-code, codex, cursor, amp, gemini-cli]
  relationships:
    related_to: [skill-sql-review, runbook-warehouse-query-slow]
  body: |
    # SQL Query Plan Explainer

    ## Method
    1. Read bottom-up; the deepest node is the first data touched.
    2. Compare `rows` (estimate) to `actual rows`. >10x off means stale stats.
    3. Look for `Seq Scan` on a large table that should use an index.
    4. Look for `Sort` / `Hash` spilling to disk (`disk usage` in the plan).

    ## Output
    One sentence per expensive node, then exactly one recommended change with
    the expected effect and a way to measure it.


