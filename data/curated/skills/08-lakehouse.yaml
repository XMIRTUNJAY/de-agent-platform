  security: { runs_code: true, network_access: false, credentials: true, filesystem_access: false, external_apis: false }
  compatibility: [claude-code, codex, cursor, amp, gemini-cli]
  relationships:
    related_to: [runbook-small-files-explosion, tech-iceberg, tech-hudi]
  body: |
    # Iceberg Table Maintenance

    ## Diagnose from metadata
    ```sql
    SELECT count(*) files, avg(file_size_in_bytes)/1e6 avg_mb
    FROM db.tbl.files;
    ```
    avg_mb < 32 and a growing count → compact.

    ## Plan
    1. `rewrite_data_files` with a target size (128-256 MB).
    2. `rewrite_manifests` when the manifest list is huge.
    3. `expire_snapshots` older than the retention window — but keep at least one
       full snapshot for time travel.
    4. `remove_orphan_files` on a schedule, with a safety margin.

    ## Do not
    Run compaction during peak ingestion; it conflicts with concurrent writers.
- id: skill-delta-optimizer
  slug: delta-optimization-advisor
  type: skill
  title: Delta Optimization Advisor
  tagline: OPTIMIZE, Z-ORDER, or nothing — decide with data, not vibes.
  description: >-
    Reads Delta table history and file statistics to decide between OPTIMIZE,
    Z-ORDER, liquid clustering and partitioning changes.
  category: cat-lakehouse
  subcategory: Performance
  difficulty: intermediate
  tags: [delta-lake, optimize, z-order, liquid-clustering]
  technologies: [tech-delta, tech-databricks]
  learning_objectives:
    - Decide if a table needs OPTIMIZE from file stats
    - Choose Z-ORDER columns from query predicates
    - Know when liquid clustering beats partitioning
  prerequisites: []
  supported_agents: [claude-code, codex, cursor, amp, gemini-cli]
  version: 0.1.2
  license: Apache-2.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/skills/delta-optimization-advisor
  install_command: "npx de-agent-platform add delta-optimization-advisor"
  verification: community
  last_verified: 2026-09-14
  files: [SKILL.md, examples/optimize.sql, references/zorder-guide.md]
  security: { runs_code: true, network_access: false, credentials: true, filesystem_access: false, external_apis: false }
  compatibility: [claude-code, codex, cursor, amp, gemini-cli]
  relationships:
    related_to: [tech-delta, runbook-small-files-explosion, skill-iceberg-maintenance]
  body: |
    # Delta Optimization Advisor

    ## Decide
    - Files < 32 MB and many → `OPTIMIZE`.
    - Queries filter on 1-2 high-cardinality columns → `ZORDER BY` those columns.
    - High-cardinality, many predicates, frequent writes → liquid clustering.
    - Predicate on one low-cardinality column (date) → partition (or leave it; Delta
      handles pruning well already).

    ## Measure
    Compare `numFiles` and query `bytes scanned` before and after. If scanning
    didn't drop, the Z-ORDER was on the wrong columns.


