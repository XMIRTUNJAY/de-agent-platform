  body: |
    # Incident Postmortem Writer

    ## Structure
    1. **Impact** — who/what, in business terms, with a duration.
    2. **Timeline** — timestamped, factual, no blame.
    3. **Detection** — how we found out; if a human told us, that's a gap.
    4. **Contributing factors** — plural; incidents are rarely single-cause.
    5. **Action items** — each with an owner and a date, and a "done" definition.

    ## Anti-pattern
    "Be more careful" is not an action item. Change the system so a careful mistake
    is harmless.
- id: skill-spark-cost-regression-guard
  slug: spark-cost-regression-guard
  type: skill
  title: Spark Cost Regression Guard
  tagline: Detect the 4x cost jump in CI, before it reaches the invoice.
  description: >-
    Compares a job's shuffle/spill/scan metrics against a stored baseline and fails
    the change if cost-per-run regresses beyond a threshold, with the diff explained.
  category: cat-cost-engineering
  subcategory: Cost
  difficulty: advanced
  tags: [spark, cost, regression, ci, performance]
  technologies: [tech-spark, tech-databricks]
  learning_objectives:
