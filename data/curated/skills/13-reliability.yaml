    - Store and compare a baseline
    - Explain which stage caused a regression
  prerequisites: [skill-spark-skew-diagnosis]
  supported_agents: [claude-code, codex, cursor, amp, gemini-cli]
  version: 0.1.2
  license: Apache-2.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/de-agent/skills/tree/main/spark-cost-regression-guard
  github_url: https://github.com/de-agent/skills
  install_command: "amp skill add de-agent/spark-cost-regression-guard"
  verification: reviewed
  last_verified: 2026-09-14
  files: [SKILL.md, examples/compare_metrics.py, references/cost-metrics.md]
  security: { runs_code: true, network_access: false, credentials: false, filesystem_access: true, external_apis: false }
  compatibility: [claude-code, codex, cursor, amp, gemini-cli]
  relationships:
    related_to: [skill-cost-unit-economics, runbook-spark-job-suddenly-costs-4x, hook-spark-cost-check]
  body: |
    # Spark Cost Regression Guard

    ## Metrics worth baselining
    shuffle read/write bytes, spill (disk) bytes, task count, max task duration,
    input bytes. These predict cost far better than wall-clock time.

    ## Threshold
    Fail if any metric grows > 25% vs the stored median of the last 5 runs. A 4x
    regression is then caught at 1.25x, in CI, for free.

    ## Explain the diff
    Name the stage whose metric moved, and whether it was a join, an aggregation,
    or a partition count change.
