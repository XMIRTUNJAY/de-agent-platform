    - Compute a downstream impact set
    - Distinguish technical from business lineage
  prerequisites: [skill-sql-review]
  supported_agents: [claude-code, codex, cursor, amp, gemini-cli]
  version: 0.1.1
  license: Apache-2.0
  author: de-agent
  publisher: DE//AGENT Registry
  source_url: https://github.com/de-agent/skills/tree/main/lineage-explainer
  github_url: https://github.com/de-agent/skills
  install_command: "amp skill add de-agent/lineage-explainer"
  verification: reviewed
  last_verified: 2026-09-12
  files: [SKILL.md, examples/impact.md, references/lineage-stores.md]
  security: { runs_code: false, network_access: true, credentials: true, filesystem_access: false, external_apis: false }
  compatibility: [claude-code, codex, cursor, amp, gemini-cli]
  relationships:
    related_to: [cat-data-lineage, runbook-data-contract-broken]
  body: |
    # Lineage Explainer

    ## Two questions, two graphs
    - **Technical lineage** — which tables/jobs depend on this column.
    - **Business lineage** — which metrics/reports depend on it.

    A breaking change needs both, because a CFO does not read table names.

    ## Impact set
    Walk downstream from the changed node, stopping at published marts. Report
    owner, criticality, and the earliest SLA that will break.
