    related_to: [cat-agentic, doc-tooling, hook-pre-deployment-dq-check]
  body: |
    # MCP Tool Contract Auditor

    ## Classify every tool
    - **Read** — safe, still logs the data it can reach.
    - **Write** — can mutate state; needs a sandbox or a dry-run.
    - **Destructive** — delete/drop/truncate; require human confirmation.
    - **Spend** — provisions resources or runs billable queries.
    - **Exfiltrate** — can send data to an external network.

    ## Deliverable
    A table of tools by class, then a config that grants only the Read/Write tools
    the task needs. Never connect an unvetted server with broad credentials.
- id: skill-lineage-explainer
  slug: lineage-explainer
  type: skill
  title: Lineage Explainer
  tagline: Answer "what breaks if I change this column?" with evidence.
  description: >-
    Traces column-level lineage from an asset to its upstream sources and
    downstream consumers, and reports the impact set for a proposed change.
  category: cat-data-lineage
  subcategory: Observability
  difficulty: intermediate
  tags: [lineage, impact-analysis, openlineage, provenance]
  technologies: [tech-openlineage, tech-datahub]
  learning_objectives:
