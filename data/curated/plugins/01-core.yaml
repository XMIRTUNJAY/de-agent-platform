# Plugins — core engineering
- id: plugin-de-data-toolkit
  slug: de-data-toolkit
  type: plugin
  title: DE Data Toolkit
  description: >-
    The opinionated starter plugin: SQL/Spark review skills, the destructive-SQL
    guard, a secret scanner and the file/git MCP servers, wired for data engineers.
  category: cat-agentic
  difficulty: beginner
  tags: [plugin, starter, review, guardrails]
  runtime: agent-plugin
  capabilities: [code-review, guardrails, file-access]
  tools: [read_file, edit_file, search_files]
  commands: ["/review-sql", "/review-spark", "/guard-status"]
  hooks: [hook-destructive-sql-guard, hook-secret-scan-commit]
  skills: [skill-sql-review, skill-spark-data-quality-review]
  installation: "amp plugin add de-agent/de-data-toolkit"
  permissions: { filesystem: read-write, network: none, credentials: none }
  compatible_agents: [claude-code, codex, cursor, amp, gemini-cli]
  version: 0.4.0
  license: Apache-2.0
  author: de-agent
  source_url: https://github.com/de-agent/plugins/tree/main/de-data-toolkit
  github_url: https://github.com/de-agent/plugins
  verification: community
  last_verified: 2026-09-30
  security: { runs_code: true, network_access: false, credentials: false, filesystem_access: true, external_apis: false }
  relationships: { related_to: [cat-agentic], uses: [skill-sql-review] }
