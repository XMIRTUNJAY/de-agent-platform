- id: plugin-spark-lens
  slug: spark-lens
  type: plugin
  title: Spark Lens
  description: >-
    Parses Spark event logs into a task histogram, flags skew and shuffle
    amplification, and compares against a stored cost baseline.
  category: cat-spark
  difficulty: advanced
  tags: [plugin, spark, performance, cost]
  runtime: agent-plugin
  capabilities: [metrics-analysis, cost-guard]
  tools: [read_file]
  commands: ["/spark-analyze", "/spark-baseline", "/spark-explain-plan"]
  hooks: [hook-spark-cost-check]
  skills: [skill-spark-skew-diagnosis, skill-spark-cost-regression-guard]
  installation: "amp plugin add de-agent/spark-lens"
  permissions: { filesystem: read, network: none, credentials: none }
  compatible_agents: [claude-code, codex, cursor, amp, gemini-cli]
  version: 0.2.0
