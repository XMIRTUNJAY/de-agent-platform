# Plugins — ops, streaming, governance
- id: plugin-kafka-console
  slug: kafka-console
  type: plugin
  title: Kafka Console
  description: >-
    Topic inventory, per-partition lag triage, rebalance detection and a read-only
    message sampler with a PII redaction pass.
  category: cat-kafka
  difficulty: advanced
  tags: [plugin, kafka, lag, streaming]
  runtime: agent-plugin
  capabilities: [stream-debug, metrics-analysis]
  tools: [read_file]
  commands: ["/lag-triage", "/topic-info", "/sample-topic"]
  hooks: [hook-pii-leak-guard]
  skills: [skill-kafka-lag-triage, skill-kafka-topic-design]
  installation: "amp plugin add de-agent/kafka-console"
  permissions: { filesystem: none, network: kafka, credentials: kafka-sasl-read }
  compatible_agents: [claude-code, codex, cursor, amp, gemini-cli]
  version: 0.1.3
  license: Apache-2.0
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/plugins/kafka-console
  verification: community
  last_verified: 2026-09-21
  security: { runs_code: true, network_access: true, credentials: true, filesystem_access: false, external_apis: false }
  relationships: { related_to: [cat-kafka], uses: [skill-kafka-lag-triage] }
- id: plugin-lineage-graph
