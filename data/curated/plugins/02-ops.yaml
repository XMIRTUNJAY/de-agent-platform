  relationships: { related_to: [cat-data-lineage], uses: [skill-lineage-explainer] }
- id: plugin-cost-lens
  slug: cost-lens
  type: plugin
  title: Cost Lens
  description: >-
    Attributes warehouse/cluster spend to pipelines, computes unit economics, and
    alerts on cost-per-run regressions rather than on total spend.
  category: cat-cost-engineering
  difficulty: advanced
  tags: [plugin, cost, finops, attribution]
  runtime: agent-plugin
  capabilities: [cost-attribution, unit-economics]
  tools: [read_file]
  commands: ["/cost-by-pipeline", "/unit-cost", "/cost-guard"]
  hooks: [hook-spark-cost-check, hook-backfill-safety-check, hook-prod-write-confirm, hook-freshness-pre-merge]
  skills: [skill-cost-unit-economics, skill-spark-cost-regression-guard]
  installation: "amp plugin add de-agent/cost-lens"
  permissions: { filesystem: read, network: billing+catalog, credentials: billing-read }
  compatible_agents: [claude-code, codex, cursor, amp, gemini-cli]
  version: 0.1.5
  license: Apache-2.0
  author: de-agent
  source_url: https://github.com/XMIRTUNJAY/de-agent-platform/tree/main/data/curated/plugins/cost-lens
  verification: community
  last_verified: 2026-09-17
  security: { runs_code: true, network_access: true, credentials: true, filesystem_access: true, external_apis: true }
  relationships: { related_to: [cat-cost-engineering], uses: [skill-cost-unit-economics] }
- id: plugin-contract-kit
  slug: contract-kit
