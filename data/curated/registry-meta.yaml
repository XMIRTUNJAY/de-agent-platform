# Registry metadata: licenses, sources, authors/publishers, the verification
# model, curation states, and the source quality score rubric.
licenses:
  - { spdx: Apache-2.0, name: Apache License 2.0, osi_approved: true, allows_reproduce: true, allows_modify: true, note: "Redistribution permitted with attribution and the license text." }
  - { spdx: MIT, name: MIT License, osi_approved: true, allows_reproduce: true, allows_modify: true, note: "Permissive; keep the copyright notice." }
  - { spdx: BSD-3-Clause, name: BSD 3-Clause, osi_approved: true, allows_reproduce: true, allows_modify: true }
  - { spdx: CC-BY-4.0, name: Creative Commons Attribution 4.0, osi_approved: false, allows_reproduce: true, allows_modify: true, note: "Content license; attribution required." }
  - { spdx: PSF-2.0, name: Python Software Foundation License, osi_approved: true, allows_reproduce: true, allows_modify: true }
  - { spdx: PostgreSQL, name: PostgreSQL License, osi_approved: true, allows_reproduce: true, allows_modify: true }
  - { spdx: BUSL-1.1, name: Business Source License 1.1, osi_approved: false, allows_reproduce: false, allows_modify: false, note: "Source-available, not open source; restrict commercial use until the change date." }
  - { spdx: Proprietary, name: Proprietary / All rights reserved, osi_approved: false, allows_reproduce: false, allows_modify: false, note: "WE ONLY LINK AND SUMMARISE. No content is reproduced. See the ingestion policy." }

sources:
  - { id: src-apache, name: Apache Software Foundation, kind: foundation, url: "https://apache.org/", authority: 5, note: "Canonical for Spark, Kafka, Airflow, Iceberg, Parquet, Hudi, Flink." }
  - { id: src-mcp, name: Model Context Protocol, kind: standard-body, url: "https://modelcontextprotocol.io/", authority: 5, note: "Owner of the MCP spec and the official registry." }
  - { id: src-aws, name: Amazon Web Services, kind: vendor, url: "https://docs.aws.amazon.com/", authority: 5 }
  - { id: src-dbtlabs, name: dbt Labs, kind: vendor, url: "https://docs.getdbt.com/", authority: 4, note: "Docs are proprietary; dbt-core is Apache-2.0." }
  - { id: src-databricks, name: Databricks, kind: vendor, url: "https://docs.databricks.com/", authority: 5 }
  - { id: src-snowflake, name: Snowflake, kind: vendor, url: "https://docs.snowflake.com/", authority: 5 }
  - { id: src-debezium, name: Debezium Community, kind: community, url: "https://debezium.io/", authority: 5 }
  - { id: src-github, name: GitHub, kind: platform, url: "https://github.com/", authority: 3, note: "Hosting platform; a repo's authority derives from its owner, not the host." }
  - { id: src-oreilly, name: O'Reilly Media, kind: publisher, url: "https://www.oreilly.com/", authority: 5, note: "Books are proprietary — summarise and link only." }
  - { id: src-de-agent, name: DE//AGENT Registry, kind: first-party, url: "https://github.com/de-agent", authority: 4, note: "First-party reference implementation of this registry." }

authors:
