  - { id: au-apache, name: Apache Software Foundation, kind: organization, homepage: "https://apache.org/" }
  - { id: au-mcp, name: Model Context Protocol, kind: organization, homepage: "https://modelcontextprotocol.io/" }
  - { id: au-dbtlabs, name: dbt Labs, kind: organization, homepage: "https://www.getdbt.com/" }
  - { id: au-snowflake-labs, name: Snowflake Labs, kind: organization, homepage: "https://github.com/Snowflake-Labs" }
  - { id: au-awslabs, name: AWS Labs, kind: organization, homepage: "https://github.com/awslabs" }
  - { id: au-acryl, name: Acryl Data, kind: organization, homepage: "https://www.acryl.io/" }
  - { id: au-github, name: GitHub, kind: organization, homepage: "https://github.com/" }
  - { id: au-motherduck, name: MotherDuck, kind: organization, homepage: "https://motherduck.com/" }

# ---------------------------------------------------------------------------
# Verification model. Status is earned at each level; it is never assumed.
verification_model:
  levels:
    - id: community
      label: Community
      rank: 1
      means: "Found in an external source. Metadata captured, nothing checked."
      checks: [discovered]
    - id: reviewed
      label: Reviewed
      rank: 2
      means: "Source, documentation and license have been checked by a curator."
      checks: [source_checked, license_checked, docs_checked]
    - id: tested
      label: Tested
      rank: 3
      means: "Installation and the provided example have been run successfully."
      checks: [install_tested, example_tested]
    - id: verified
      label: Verified
      rank: 4
      means: "The artifact was executed and its behaviour matched the documented expectation."
      checks: [artifact_executed, behavior_validated]
  rules:
    - "A resource cannot skip a level."
    - "verification is time-bounded: `last_verified` records the date, and the UI warns past a staleness threshold."
    - "Listing is not endorsement: security posture is always displayed separately from verification."

# Curation states (internal workflow).
states:
  - { id: discovered, label: Discovered, description: "Found by the ingestion pipeline; metadata only." }
  - { id: pending_review, label: Pending review, description: "Queued for a curator." }
  - { id: license_checked, label: License checked, description: "License identified and its terms recorded." }
  - { id: reviewed, label: Reviewed, description: "Source and docs checked." }
  - { id: tested, label: Tested, description: "Install and example run." }
  - { id: verified, label: Verified, description: "Behaviour validated." }
  - { id: published, label: Published, description: "Live in the registry." }
  - { id: deprecated, label: Deprecated, description: "Superseded or unmaintained; kept for provenance." }

# Source quality score (0-5 per component; stars are NOT the metric).
scoring:
  scale: "0 = absent, 5 = exemplary. Components are averaged with equal weight; null components are excluded and reported."
  components:
    - { id: authority, label: Source authority, description: "How authoritative is the publisher (standards body > vendor > individual)?" }
    - { id: docs_quality, label: Documentation quality, description: "Completeness and accuracy of the docs." }
    - { id: repo_activity, label: Repository activity, description: "Commit recency and release cadence (not stars)." }
    - { id: license_clarity, label: License clarity, description: "Is a clear, machine-readable license present?" }
    - { id: installation, label: Installation quality, description: "Is installation reproducible and documented?" }
    - { id: tests, label: Tests, description: "Are there tests you can run to trust the artifact?" }
    - { id: examples, label: Examples, description: "Runnable, relevant examples." }
    - { id: security, label: Security, description: "Documented security posture and safe defaults." }
    - { id: maintenance, label: Maintenance, description: "Evidence of ongoing maintenance and issue responsiveness." }
    - { id: compatibility, label: Compatibility, description: "Stated compatibility with agents and versions." }
  guide:
    - { min: 4.5, label: Exemplary }
    - { min: 3.5, label: Strong }
    - { min: 2.5, label: Adequate }
    - { min: 1.5, label: Weak }
    - { min: 0.0, label: Unproven }
