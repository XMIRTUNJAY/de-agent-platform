  title: danplischke/apache-airflow-providers-lamindb
  description: >-
    Apache Airflow provider for LaminDB: track DAG runs as flows and tasks as
    steps, and trigger DAGs on LaminHub events.


    Install (from source README):

    ```bash

    pip install apache-airflow-providers-lamindb

    pip install "apache-airflow-providers-lamindb[k8s]"  # adds
    @task.lamindb_kubernetes

    ```


    Requires `apache-airflow>=3.3.0` and `apache-airflow-providers-standard`.
    Airflow 3.3.0 added the asset

    state store that the event triggers use to resume after restarts.


    Supports lamindb 2.8.1 and newer only, for LaminDB instances and for the
    lamindb that lineage tasks

    run. Older versions fail deliberately with an explicit error.


    Lineage tasks install `lamindb` in their own virtualenv or use the pod's
    image, so its version

    does not have to fit Airflow
