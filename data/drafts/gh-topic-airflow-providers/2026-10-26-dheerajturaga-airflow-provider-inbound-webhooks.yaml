  description: >-
    Inbound webhooks for Apache Airflow: verified deliveries from services
    become asset events that trigger Dags


    Install (from source README):

    On the machine running the Airflow API server, with Airflow 3.1.1 or later,
    install the plugin and

    create its table in Airflow's metadata database:


    ```bash

    pip install airflow-provider-inbound-webhooks "apache-airflow==$(airflow
    version)"

    airflow db migrate

    ```


    Pinning `apache-airflow` to the version you run keeps pip from changing it.
    On Airflow 3.1,

    `airflow db migrate` only creates the table once `external_db_managers`
    names the plugin; see

    [Compatibility](docs/compatibility.md). Dag files that import `WebhookTopic`
    also need the package

