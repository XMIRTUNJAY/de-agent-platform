  description: >-
    Alpha third-party Apache Airflow provider that runs tasks in ephemeral
    sandboxes (local, Daytona, E2B, Modal, islo) via SandboxOperator or
    SandboxExecutor.


    Install (from source README):

    ```bash

    pip install "airflow-provider-sandbox @
    git+https://github.com/zozo123/airflow-provider-sandbox"

    pip install "airflow-provider-sandbox[daytona] @
    git+https://github.com/zozo123/airflow-provider-sandbox"  # also [e2b],
    [modal], [islo]

    ```



    ```bash

    python examples/demo.py          # runs a task in a local subprocess
    "sandbox"

    SANDBOX_PROVIDER=daytona python examples/demo.py   # needs DAYTONA_API_KEY

    ```


    It drives the exact lifecycle the executor uses

    (`create → upload → run → poll → logs → destroy`) and prints each step.
