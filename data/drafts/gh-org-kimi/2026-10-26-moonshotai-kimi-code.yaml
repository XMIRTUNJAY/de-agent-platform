    Install (from source README):

    Install with the official script. No Node.js required.


    - **macOS or Linux**:


    ```sh

    curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash

    ```


    - **Windows (PowerShell)**:


    ```powershell

    irm https://code.kimi.com/kimi-code/install.ps1 | iex

    ```


    > On Windows, install [Git for Windows](https://gitforwindows.org/) before
    first launch because Kimi Code CLI uses the bundled Git Bash as its shell
    environment. If Git Bash is installed in a custom location, set
    `KIMI_SHELL_PATH` to the absolute path of `bash.exe`.


    Then, run it with a new shell session:


    ```sh

    kimi --version

    ```


