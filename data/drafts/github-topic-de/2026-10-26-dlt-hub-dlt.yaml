    data load tool (dlt) is an open source Python library that makes data
    loading easy 🛠️ 


    Install (from source README):

    dlt supports Python 3.10 through Python 3.14. Note that some optional extras
    are not yet available for Python 3.14, so support for this version is
    considered experimental.


    ```sh

    pip install dlt

    ```


    Add the extras you need for your sources and destinations, for example:


    ```sh

    pip install "dlt[duckdb]"        # local DuckDB destination

    pip install "dlt[bigquery]"      # or snowflake, postgres, redshift,
    databricks, athena, ...

    pip install "dlt[s3]"            # or gs, az for cloud filesystems

    pip install "dlt[sql_database]"  # read from any SQL database

    pip install "dlt[hub]"           # data
