  description: >-
    Claude Code plugin with four stages and hooks that refuse risky commands.


    Install (from source README):

    ```bash

    curl -fsSL https://raw.githubusercontent.com/blauwtje/exo/main/install.sh |
    bash

    ```


    That asks which harnesses and projects get exo, then installs it. The script
    keeps its copy in `~/.exo`.


    It needs git, Node 22 or newer, and `bash` on `PATH` for the hooks. On
    Windows, Git Bash runs them; support is best effort.


    <details>

    <summary>Claude Code plugin</summary>


    Inside Claude Code, run these, then restart it:


    ```text

    /plugin marketplace add blauwtje/exo

    /plugin install exo@blauwtje

    ```


    To check, run `/exo:configure` in a new session. If it lists exo's settings,
    exo is loaded.


    </det
