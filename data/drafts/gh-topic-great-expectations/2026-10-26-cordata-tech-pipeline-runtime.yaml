  title: cordata-tech/pipeline-runtime
  description: >-
    Runnable reference implementation of the descriptor-driven pipeline executor
    from the cordata.tech pipeline-half posts — DuckDB and Parquet standing in
    for Glue and Spark, so a clean clone runs with no cloud account.


    Install (from source README):

    Python **3.12+** (the code uses `match` and PEP 695 `type` aliases). No
    cloud

    account, no credentials, no clone:


    ```bash

    pip install 'cordata-pipeline-runtime[run]'


    mkdir demo && cd demo

    pipeline-runtime demo .          # seed the example, then run all three
    pipelines

    ```


    `demo` writes three things into the directory you give it and nowhere else:
    the

    local catalog (`catalog.duckdb`), the warehouse the `s3://…` locations land
    in,

    and `out/lineage.ndjson` holding every event the runs emitted. It refuses a

    directory holding files it did not write, so point it at an empty one.


    To run one pipel
