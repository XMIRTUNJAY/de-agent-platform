  description: >-
    The Trino datasource allows to query and visualize Trino data from within
    Grafana.


    Install (from source README):

    The plugin is published in the [Grafana plugin
    catalog](https://grafana.com/grafana/plugins/trino-datasource/).

    Install it in one of these ways:


    * In the Grafana UI, go to **Administration > Plugins and data > Plugins**,
    search for
      "Trino" and click **Install**.
    * With the Grafana CLI, then restart Grafana:

      ```bash
      grafana cli plugins install trino-datasource
      ```

      Older Grafana installations provide the same command as `grafana-cli`.
    * In Docker, let Grafana install it on startup:

      ```bash
      docker run -d -p 3000:3000 \
        -e "GF_PLUGINS_PREINSTALL=trino-datasource" \
        --name
