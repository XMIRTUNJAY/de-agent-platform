  description: >-
    A serious harness for Claude Code. Specs before code, gates on every commit,
    the Code Audit Team on every merge. Ships as a monorepo with a React
    frontend. Bring your backend.


    Install (from source README):

    ```bash

    npx create-gaia@latest my-app

    ```


    One command. GAIA handles the rest, then `/gaia-init` finishes the last-mile
    setup (below).


    > [!NOTE]

    > Start projects with `npx create-gaia@latest my-app` rather than cloning or
    forking. The CLI sets up your project for you, strips the GAIA branding and
    release tooling, etc. A clone leaves all of that in place and pointed at the
    wrong repo.


    **Requirements:** [Node.js](https://nodejs.org/) >= 22.22.0
    ([nvm](https://github.com/nvm-sh/nvm) recommended). macOS or Linux; on
    Windows, run inside
    [WSL2](https://learn.microsoft.com/en-us/windows/wsl/install
