  title: shijianjs/duckfn
  description: >-
    Write DuckDB extensions in plain Rust.


    Install (from source README):

    ```toml

    [dependencies]

    duckfn = "0.3.0"



    ```rust

    use duckfn::{duck_error, duck_scalar_function, duckfn_entrypoint,
    DuckOptionResult};


    /// ```sql

    /// SELECT double_it(21);    -- 42

    /// SELECT double_it(NULL);  -- NULL

    /// SELECT double_it(13);    -- error: unlucky input

    /// ```

    #[duck_scalar_function]

    pub fn double_it(v: Option<i64>) -> DuckOptionResult<i64> {
        if v == Some(13) {
            return Err(duck_error("unlucky input"));
        }
        Ok(v.map(|x| x * 2))
    }


    // Generate the extension entry point (name must be lowercase +
    underscores).

    duckfn_entrypoint!("my_ext");

    ```


