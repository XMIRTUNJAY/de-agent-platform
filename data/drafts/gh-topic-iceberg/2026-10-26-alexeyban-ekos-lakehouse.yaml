    Install (from source README):

    On Linux x86_64 with Docker:


    ```bash

    curl -fsSL
    https://raw.githubusercontent.com/alexeyban/ekos-lakehouse/main/install.sh |
    sh

    ```


    One command installs the program, starts the stack, creates a sample
    project, runs its pipeline

    once and opens the web console on its **Lakehouse** tab. For your own
    database add

    `-s -- --source host:5432/db --source-user reader` (password in
    `EKOS_LH_SOURCE_PASSWORD`).

    **[docs/install.md](docs/install.md)** says what it changes and how to
    remove it;

