    We have prepared a minimal docker-compose file to demonstrate how to use the
    Lakekeeper catalog with common query engines.


    ```sh

    git clone https://github.com/lakekeeper/lakekeeper.git

    cd lakekeeper/examples/minimal

    docker compose up

    ```


