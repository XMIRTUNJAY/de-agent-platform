    Install (from source README):
    ```sql
    INSTALL unity_catalog;
    INSTALL delta;
    LOAD delta;
    LOAD unity_catalog;

    CREATE SECRET (
        TYPE unity_catalog,
        TOKEN '⟨token⟩',
        ENDPOINT '⟨endpoint⟩',
        AWS_REGION '⟨region⟩'
    );
    ATTACH 'my_catalog' AS my_catalog (TYPE unity_catalog);
    SELECT * FROM my_catalog.my_schema.my_table;
    ```
