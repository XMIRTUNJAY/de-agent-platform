  description: >-
    Go bindings for DuckDB's C API


    Install (from source README):

    Simply import the module in your Go project:


    ```go

    import "github.com/duckdb/duckdb-go-bindings"

    ```


    The module selects pre-built static libraries for all supported platforms:


    - darwin-amd64

    - darwin-arm64

    - linux-amd64

    - linux-arm64

    - windows-amd64


    Platform detection and linking is handled automatically through cgo
    directives. `CGO_ENABLED=1` is required, and your system needs a C compiler.
