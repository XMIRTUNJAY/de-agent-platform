  title: echo-mem/echo-mem
  description: >-
    Shared memory for AI agents on your own Postgres. The server never calls an
    LLM to write.


    Install (from source README):

    **Requires:** Python 3.11+ and Docker (for the database).


    ```bash

    pipx install echo-mem

    echo-memory quickstart

    ```


    `quickstart` starts the database, applies the schema, and prints the `claude
    mcp add`

    line that registers it, filled in with the port it actually used. The
    Postgres image is

    published, so nothing compiles.


    Or use the hosted service and run no database at all:


    ```bash

    pipx install echo-mem

    echo-memory connect <key>          # a key from https://app.echo-mem.com

    ```


    Then once per machine, so an agent knows *when* to record and recall rather
    than only

    that the tools exist:


    ```b
