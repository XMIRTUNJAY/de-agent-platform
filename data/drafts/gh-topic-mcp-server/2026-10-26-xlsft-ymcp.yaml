    YouTrack MCP server: all built-in YouTrack MCP tools plus deletes, sprints,
    attachments, history and reports. Signs in with login and password;
    one-command install into Claude, Cursor, VS Code, Zed, Codex and more.


    Install (from source README):

    macOS / Linux:


    ```sh

    curl -fsSL https://raw.githubusercontent.com/xlsft/ymcp/main/install.sh | sh

    ```


    Windows (PowerShell):


    ```powershell

    irm https://raw.githubusercontent.com/xlsft/ymcp/main/install.ps1 | iex

    ```


    Or with a package manager, then run `ymcp setup`:


    ```sh

    brew install
    xlsft/tap/ymcp                                                  # macOS,
    Linux

    scoop bucket add xlsft https://github.com/xlsft/scoop-bucket; scoop install
    ymcp   # Windows

    winget install
    xlsft.ymcp                                                    # Windows,
    once Microsoft accepts it

    ```


    Package-managed copie
