    Policies that stop your coding agent from doing the thing you would have caught in review. The policy catalog for Chock: git-hook gates, command guards, and agent rules with replayed evals.

    Install (from source README):
    chock is on PyPI, but the release there (0.15.2, 30 Sep 2026) is older than the engine this page describes. Install the frozen engine from its commit (Python 3.11 or newer):

    ```bash
    pip install "chock @ git+https://github.com/open-coder-ai/chock@992711af4cf8d4fd9c4c861f10ef6e53374d75d7"
    ```


    The repository route, end to end. Policies are pinned to a catalog commit and checked against a hash, so what you review is what installs:

    ```bash
    pip install "chock @ git+https://github.com/open-coder-ai/chock@992711af4cf8d4fd9c4c861f10ef6e53374d75d7"

    git init -q demo && cd demo
    chock init .
    chock add
