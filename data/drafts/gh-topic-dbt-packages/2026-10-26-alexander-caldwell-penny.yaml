  title: alexander-caldwell/penny
  description: >-
    Model-level BigQuery cost tracking for dbt — per-model cost, trends,
    anomalies, and a post-run summary.


    Install (from source README):

    Three steps. Project and region are read from your dbt target, so there's
    nothing

    to configure for the common case.


    ```yaml

    dbt deps

    dbt build --select penny

    ```


    That's the whole setup. Everything below is optional — the console summary
    hook,

    pointing at a different project, and the tuning variables all have working

    defaults.


    Skipping step 2 works too. Penny still runs and tracks cost; it just
    attributes

    to the destination table name instead of the model name until labels are
    present.


    > **Don't use `models: +labels: {dbt_model_name: "{{ this.name }}"}`.** dbt
    renders

    > `dbt_project.yml` be
