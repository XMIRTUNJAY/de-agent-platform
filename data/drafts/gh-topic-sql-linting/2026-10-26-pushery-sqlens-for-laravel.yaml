  title: pushery/sqlens-for-laravel
  description: >-
    Database safety for Laravel on PostgreSQL and MySQL. SQLens lints the SQL
    your migrations actually emit for lock and downtime risk, audits live
    schemas, detects drift and security issues, classifies deploy risk, and
    provides deterministic CI-ready guards with explicit pass, fail, or
    undetermined results.


    Install (from source README):

    ```bash

    composer require pushery/sqlens-for-laravel

    ```


    PHP 8.4+, Laravel 12 or 13, PostgreSQL 18+ or MySQL 8.4+. The service
    provider registers

    itself through package discovery, and there is nothing to migrate: SQLens
    ships no

    tables and adds nothing to your schema.


    ```bash

    php artisan sqlens:doctor --probe             # what SQLens can see from
    here

    php artisan sqlens:lint --connection=pgsql    # the pending migrations,
    before they reach a database

    php artisan sqlens:audit --connection=pgsql   # the live schema of the
    connection you name

    ```


