  title: exasol-labs/lakehouse-engine-rs
  description: >-
    In-place query engine for Lakehouses (Iceberg and Delta Lake) for Exasol.
    Written in Rust 🦀


    Install (from source README):

    After you deploy the engine (see [Install](docs/install.md)), create a
    Virtual Schema. Then query

    the schema:


    ```sql

    CREATE VIRTUAL SCHEMA MY_LAKEHOUSE

    USING LHVS.LAKEHOUSE_ADAPTER WITH
      CATALOG_CONNECTION = 'LAKEHOUSE_CATALOG_CREDS'
      NAMESPACE          = 'default';

    SELECT id, name, score FROM MY_LAKEHOUSE.EVENTS WHERE score > 15.0 LIMIT 5;

    ```


