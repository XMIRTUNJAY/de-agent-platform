  description: >
    A real Chrome for your AI agents, on your own server. Sign in to a site once
    by hand; the agent uses that session, never your password, and asks you
    before it pays.


    Install (from source README):

    ```sh

    5dive plugin add 5dive-ai/5dive-browser

    ```


    **Use the qualified `<owner>/<repo>` name, not a bare `browser`.** A bare
    plugin name is resolved

    per marketplace, and a box that knows two marketplaces offering that name
    refuses the add (`exists

    in N marketplaces`) — most boxes in the fleet still carry the bundled
    `5dive` marketplace next to

    `5dive-plugins`, so the bare form is already ambiguous there.


    **A box that already has `browser@5dive-plugins` must remove or disable it
    first.** The CLI refuses

    two plugins claiming the same verb (`_plugin_verb_install_check`, rc=3) and
    the refusal is
