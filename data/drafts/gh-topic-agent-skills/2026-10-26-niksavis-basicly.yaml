  description: >-
    A harness that ships a development process to coding agents and enforces it.
    One YAML catalog projects instructions, skills, subagents and permissions to
    Claude, Codex and Copilot. Git hooks refuse bad work at commit time. A loop
    drives each unit of work to a merge in an isolated worktree, with phase
    derived from a tracked work graph.


    Install (from source README):

    basicly requires **Python 3.14+** — for the CLI and for the projected hook

    scripts that run inside your repo; older interpreters are not supported.

    The default markdown gate also needs Node and a local `markdownlint-cli2`
    package before

    install. If your repository already locks the package, run `npm ci`.
    Otherwise, get the

    repository owner's approval, then run `npm install --save-dev
    markdownlint-cli2` and commit

    the package files. Install and `--dry-run` refuse missing tools before
    writing files.

    They do not add dependencies automatically. Before the first commit, select
    Markdown

    inputs in yo
