  description: >-
    Skills for Claude Code, Codex CLI and pi: install individual plugins or
    workflow bundles; pi uses one package with skill filters. Upstream updates
    via Renovate.


    Install (from source README):

    In Claude Code, each skill is its own plugin **by default**; whole-plugin
    entries

    and bundles install several artifacts together. Install only what you want:


    ```

    /plugin install tdd@filippo-skills

    /plugin install grill-me@filippo-skills

    ```


    Review the plugin details, choose an installation scope, and confirm in the
    panel.

    If activation is pending, run `/reload-plugins` or start a new session.

    Then invoke them namespaced: `/tdd:tdd`, `/grill-me:grill-me`. Model-invoked

    skills (e.g. `grilling`) are triggered by Claude automatically when
    relevant.


    To refresh after upstream updates:


    ```

    /plugi
